kojarzenie: <strong>„werapamil = wapnia brak, serce zwalnia”<\/strong><\/div>", "t": "5-337-0", "v": 0, "star": true, "id": 337}, {"c": 5, "ctx": "Leki po ludzku › Leki na serce – rytm", "k": "Lek", "f": "adenozyna", "b": "<div class=\"kv\"><span>Co to jest i jak działa<\/span>działa jak „reset”: na kilka sekund całkowicie blokuje węzeł przedsionkowo-komorowy, przerywając krążący impuls w częstoskurczu nadkomorowym. Działa tylko ok. 10 s, dlatego bardzo szybki bolus i od razu przepłukanie.<\/div><div class=\"kv\"><span>Kiedy w karetce<\/span>pierwszy lek w <strong>miarowym częstoskurczu z wąskimi QRS<\/strong> po manewrach vagalnych<\/div><div class=\"kv\"><span>Uważaj / jak zapamiętać<\/span>pacjent czuje „zatrzymanie serca”, ucisk i zaczerwienienie: uprzedź go. Na monitorze chwilowa asystolia. Ostrożnie przy astmie<\/div>", "t": "5-337-0", "v": 0, "star": true, "id": 338}, {"c": 5, "ctx": "Leki po ludzku › Leki na serce – rytm", "k": "Lek", "f": "metoprolol (Betaloc)", "b": "<div class=\"kv\"><span>Co to jest i jak działa<\/span><strong>beta-bloker<\/strong>: blokuje receptory beta-1 w sercu, czyli „hamuje” działanie adrenaliny na serce. Serce bije wolniej i słabiej, spada ciśnienie.<\/div><div class=\"kv\"><span>Kiedy w karetce<\/span>zwolnienie szybkiego migotania przedsionków lub częstoskurczu u stabilnego pacjenta<\/div><div class=\"kv\"><span>Uważaj / jak zapamiętać<\/span>nie przy astmie (beta-blokery mogą wywołać skurcz oskrzeli), niskim ciśnieniu, bradykardii i ostrej niewydolności serca. Końcówka <strong>-olol = beta-bloker<\/strong><\/div>", "t": "5-337-0", "v": 0, "star": true, "id": 339}, {"c": 5, "ctx": "Leki po ludzku › Leki na serce – rytm", "k": "Lek", "f": "amiodaron (Cordarone)", "b": "<div class=\"kv\"><span>Co to jest i jak działa<\/span>lek przeciwarytmiczny „od wszystkiego”: stabilizuje błony komórek serca i wydłuża czas, zanim mogą ponownie się pobudzić. Dzięki temu gasi chaotyczne pobudzenia.<\/div><div class=\"kv\"><span>Kiedy w karetce<\/ zepica i zatorowość płucna, nowo rozpoznana cukrzyca z hiperglikemią, krwawienie z przewodu pokarmowego<\/div>", "t": "15-591-0", "v": 0, "star": true, "id": 596}, {"c": 15, "ctx": "Onkologiczne stany nagłe (pacjent w trakcie leczenia nowotworu)", "k": "Nowotwór", "f": "rak żołądka", "b": "<div class=\"kv\"><span>Typowe wezwanie<\/span>krwawienie z górnego odcinka przewodu pokarmowego (fusowate wymioty, smoliste stolce, wstrząs), perforacja (nagły „sztyletowy” ból brzucha, brzuch deskowaty), niedrożność odżołądkowa (uporczywe wymioty, odwodnienie), niedokrwistość<\/div>", "t": "15-591-0", "v": 0, "star": true, "id": 597}, {"c": 15, "ctx": "Układ krążenia – niewydolność serca i ból w klatce", "k": "Lista", "f": "⭐ Niewydolność serca – jak rozpoznać w domu pacjenta", "b": "<ul><li> <strong>Bendopnoe<\/strong> to duszność pojawiająca się do 30 s po pochyleniu (np. przy wiązaniu butów). <\/li><li> <strong>Najczęstsze przyczyny zaostrzenia<\/strong> (o nie pytasz w wywiadzie): OZW, przełom nadciśnieniowy, zaburzenia rytmu (np. szybkie migotanie przedsionków), infekcja, zatorowość płucna, odstawienie leków, nadmiar soli lub płynów, <strong>NLPZ<\/strong> (ketoprofen, ibuprofen). <\/li><li> <strong>Pacjenci z przewlekłą niewydolnością serca nie powinni dostawać NLPZ<\/strong>, bo zatrzymują sód i wodę i mogą wywołać zaostrzenie. Przy bólu wybieraj paracetamol albo opioid. <\/li><\/ul><ul><li> <strong>zastoju<\/strong> („mokry”): duszność, orthopnoe, trzeszczenia, obrzęki, poszerzone żyły szyjne, <\/li><li> <strong>hipoperfuzji<\/strong> („zimny”): zimne, spocone kończyny, skąpomocz, splątanie, zawroty głowy. Hipoperfuzja to nie to samo co hipotensja, ale jest złym znakiem rokowniczym. <\/li><li> Najczęściej pacjent jest „ciepły i mokry”. „Zimny i mokry” to wstrząs kardiogenny. <\/li><\/ul>", "t": "15-L-⭐ Niewydolność serca – jak rozpoznać w domu pacjenta", "v": 0, "star": true, "list": 1, "id": 598}, {"c": 15, "ctx": "Układ krążenia – niewydolność serca i ból w klatce", "k  <strong>Rytm zatokowy<\/strong>: po każdym P prawidłowy QRS, PQ i QT prawidłowe, R–R równe. <\/li><li> <strong>Arytmia zatokowa (oddechowa)<\/strong>: przy wdechu serce przyspiesza, przy wydechu zwalnia. To norma u dzieci, młodzieży i sportowców. <\/li><li> Przyspieszenie zatokowe: wysiłek, gorączka, nadczynność tarczycy, odruch na spadek ciśnienia. Zwolnienie zatokowe: m.in. wytrenowani sportowcy. <\/li><li> W zapisie ocenia się załamki (kierunek, amplituda, czas, kształt), odcinki (linia izoelektryczna między załamkami) i odstępy (załamek + odcinek). <\/li><li> EKG pokazuje fazy pobudzenia, arytmie, przerost serca, niedokrwienie i martwicę. <\/li><\/ul>", "t": "17-L-⭐ EKG – podstawy odczytu", "v": 0, "star": true, "list": 1, "id": 639}, {"c": 17, "ctx": "Układ krążenia › Oś elektryczna serca", "k": "Oś", "f": "Normogram", "b": "<div class=\"kv\"><span>Zakres<\/span>od −30° do +90°<\/div><div class=\"kv\"><span>Typowe przyczyny<\/span>norma<\/div>", "t": "17-641-0", "v": 0, "star": false, "id": 640}, {"c": 17, "ctx": "Układ krążenia › Oś elektryczna serca", "k": "Oś", "f": "Lewogram", "b": "<div class=\"kv\"><span>Zakres<\/span>od −30° do −90°<\/div><div class=\"kv\"><span>Typowe przyczyny<\/span>otyli, poziome serce, zawał, częstoskurcz komorowy<\/div>", "t": "17-641-0", "v": 0, "star": false, "id": 641}, {"c": 17, "ctx": "Układ krążenia › Oś elektryczna serca", "k": "Oś", "f": "Prawogram", "b": "<div class=\"kv\"><span>Zakres<\/span>od +90° do +180°<\/div><div class=\"kv\"><span>Typowe przyczyny<\/span>szczupli, długa klatka, przerost prawej komory<\/div>", "t": "17-641-0", "v": 0, "star": false, "id": 642}, {"c": 17, "ctx": "Układ krążenia › Rzut serca i co na niego wpływa", "k": "Parametr", "f": "Objętość wyrzutowa (SV)", "b": "<div class=\"kv\"><span>Norma<\/span>70–75 ml<\/div><div class=\"kv\"><span>Od czego zależy / kiedy spada<\/span>obciążenie wstępne, kurczliwość, obciążenie następcze<\/div>", "t": "17-644-0", "v": 0, "star": true, "id": 643}, {"c": 17, : 0, "star": true, "id": 648}, {"c": 17, "ctx": "Układ krążenia › Regulacja pracy serca", "k": "Układ", "f": "Przywspółczulny (zwalniający)", "b": "<div class=\"kv\"><span>Gdzie<\/span>rdzeń przedłużony, jądro grzbietowe nerwu błędnego (X)<\/div><div class=\"kv\"><span>Przekaźnik<\/span>acetylocholina<\/div><div class=\"kv\"><span>Efekt<\/span>↓ częstość<\/div>", "t": "17-649-0", "v": 0, "star": true, "id": 649}, {"c": 17, "ctx": "Układ krążenia", "k": "Lista", "f": "⭐ Regulacja pracy serca", "b": "<ul><li> <strong>Baroreceptory<\/strong> w łuku aorty i zatoce tętnicy szyjnej: wzrost RR → pobudzenie nerwu błędnego → serce zwalnia. Spadek RR → serce przyspiesza. <\/li><li> <strong>Jony<\/strong>: K⁺ hamuje pracę serca, Ca²⁺ ją przyspiesza. <\/li><li> <strong>Hormony przyspieszające<\/strong>: adrenalina, glukagon, tyroksyna. <\/li><li> Przy niskim RR nerki wydzielają reninę → angiotensyna silnie kurczy naczynia. <\/li><li> Ośrodek naczynioruchowy (rdzeń przedłużony): część presyjna zwęża naczynia (niedotlenienie, wzrost CO₂), część depresyjna rozszerza (pobudzenie baroreceptorów). Lokalnie rozszerzają histamina i bradykinina, zwęża noradrenalina. <\/li><\/ul>", "t": "17-L-⭐ Regulacja pracy serca", "v": 0, "star": true, "list": 1, "id": 650}, {"c": 17, "ctx": "Układ krążenia › Regulacja pracy serca", "k": "Działanie", "f": "Inotropowe", "b": "<div class=\"kv\"><span>Co zmienia<\/span>siłę skurczu<\/div><div class=\"kv\"><span>Przykład leku<\/span>dobutamina (+)<\/div>", "t": "17-652-0", "v": 0, "star": true, "id": 651}, {"c": 17, "ctx": "Układ krążenia › Regulacja pracy serca", "k": "Działanie", "f": "Chronotropowe", "b": "<div class=\"kv\"><span>Co zmienia<\/span>częstość<\/div><div class=\"kv\"><span>Przykład leku<\/span>atropina (+), beta-bloker (−)<\/div>", "t": "17-652-0", "v": 0, "star": true, "id": 652}, {"c": 17, "ctx": "Układ krążenia › Regulacja pracy serca", "k": "Działanie", "f": "Dromotropowe", "b": "<div class=\"kv\"><span>Co zmienia<\/span>przewodzenie< ry. <\/li><li> RR rośnie przy wysiłku i stresie, spada we śnie. Część osób ma podwyższone RR tylko w gabinecie („efekt białego fartucha”). <\/li><li> Skrót <strong>RR<\/strong> pochodzi od Riva-Rocciego (manometr, 1898 r.). Metodę osłuchową opracował Korotkow. <\/li><\/ul>", "t": "17-L-⭐ Ciśnienie tętnicze – normy", "v": 0, "star": true, "list": 1, "id": 660}, {"c": 17, "ctx": "Układ krążenia", "k": "Lista", "f": "⭐ Pomiar RR metodą osłuchową – krok po kroku", "b": "<ol><li> Pacjent siedzi co najmniej 3 minuty, ramię bez uciskającego ubrania, ręka oparta o stół. <\/li><li> Sprawdź, czy manometr pokazuje 0 mmHg. <\/li><li> Dobierz mankiet: szerokość poduszki ok. 40% obwodu ramienia (u dorosłego zwykle 12–14 cm). Za wąski <strong>zawyża<\/strong> wynik (otyły pacjent), za szeroki <strong>zaniża<\/strong>. Dzieci – węższy, otyłe osoby i udo – szerszy. <\/li><li> Załóż mankiet 2–3 cm nad zgięciem łokciowym, poduszką nad tętnicą ramienną. <\/li><li> Napompuj 20–30 mmHg powyżej spodziewanego skurczowego (powyżej zaniku tętna). <\/li><li> Przyłóż stetoskop w zgięciu łokciowym i spuszczaj powietrze nie szybciej niż 2 mmHg/s. <\/li><li> <strong>Pierwszy ton (faza I Korotkowa) = skurczowe. Zanik tonów (faza V) = rozkurczowe.<\/strong> Zapisuj z dokładnością do 5 mmHg. <\/li><li> Spuść całe powietrze, odczekaj 2 minuty i zmierz ponownie. <\/li><\/ol>", "t": "17-L-⭐ Pomiar RR metodą osłuchową – krok po kroku", "v": 0, "star": true, "list": 1, "id": 661}, {"c": 17, "ctx": "Układ krążenia", "k": "Lista", "f": "⭐ Tętno i nawrót kapilarny", "b": "<ul><li> <strong>Gdzie badać<\/strong>: szyjna (przy tchawicy), promieniowa, łokciowa, ramienna, pachowa, udowa (pod więzadłem pachwinowym), podkolanowa, grzbietowa stopy, piszczelowa tylna (za kostką przyśrodkową), skroniowa. <\/li><li> <strong>Normy<\/strong>: dorosły 60–100/min, dzieci 90–140/min. <\/li><li> <strong>Cechy tętna<\/strong>: częstość, miarowość, wypełnienie (zależy od SV), napięcie (twarde przy wysokim RR, miękkie przy niskim), chybkość. <\/li><li> Najczęstsza niemiarowość to oddechowa (przy wdechu szybsze). Jest prawidłowa, zwłaszcza u młodych. <\/li><li> Fala tętna biegnie 5–8 m/s, 10–16 razy szybciej niż sama krew. <\/li><\/ul>", "t": "17-L-⭐ Tętno i nawrót kapilarny", "v": 0, "star": true, "list": 1, "id": 662}, {"c": 17, "ctx": "Układ pokarmowy › Soki trawienne", "k": "Sok", "f": "Ślina", "b": "<div class=\"kv\"><span>Ilość / dobę<\/span>1–1,5 l<\/div><div class=\"kv\"><span>pH<\/span>ok. obojętne<\/div><div class=\"kv\"><span>Najważniejsze składniki<\/span>woda 99%, α-amylaza (skrobia), mucyna (ułatwia połykanie)<\/div><div class=\"kv\"><span>Co pobudza wydzielanie<\/span>odruch na pokarm w ustach i widok/zapach (odruch warunkowy)<\/div>", "t": "17-664-0", "v": 0, "star": true, "id": 663}, {"c": 17, "ctx": "Układ pokarmowy › Soki trawienne", "k": "Sok", "f": "Sok żołądkowy", "b": "<div class=\"kv\"><span>Ilość / dobę<\/span>ok. 3 l<\/div><div class=\"kv\"><span>pH<\/span>ok. 1<\/div><div class=\"kv\"><span>Najważniejsze składniki<\/span>HCl (komórki okładzinowe, przez receptory H2 dla histaminy), pepsynogen → pepsyna (białka), śluz ochronny<\/div><div class=\"kv\"><span>Co pobudza wydzielanie<\/span>nerw błędny, gastryna<\/div>", "t": "17-664-0", "v": 0, "star": true, "id": 664}, {"c": 17, "ctx": "Układ pokarmowy › Soki trawienne", "k": "Sok", "f": "Sok trzustkowy", "b": "<div class=\"kv\"><span>Ilość / dobę<\/span>ok. 2 l<\/div><div class=\"kv\"><span>pH<\/span>7,1–8,4<\/div><div class=\"kv\"><span>Najważniejsze składniki<\/span>wodorowęglany, trypsynogen, chymotrypsynogen, amylaza, lipaza<\/div><div class=\"kv\"><span>Co pobudza wydzielanie<\/span>cholecystokinina (enzymy), sekretyna (wodorowęglany)<\/div>", "t": "17-664-0", "v": 0, "star": true, "id": 665}, {"c": 17, "ctx": "Układ pokarmowy › Soki trawienne", "k": "Sok", "f": "Żółć", "b": "<div class=\"kv\"><span>Ilość / dobę<\/span>ok. 0,5 l<\/div><div class=\"kv\"><span>pH<\/span>8 → 5 w pęcherzyku<\/div><div class=\"kv\"> >Wartość<\/span>ok. 97% / ok. 75%<\/div>", "t": "17-678-0", "v": 0, "star": true, "id": 685}, {"c": 17, "ctx": "Układ oddechowy › Normy oddechowe", "k": "Parametr", "f": "Zawartość tlenu we krwi", "b": "<div class=\"kv\"><span>Wartość<\/span>ok. 20 ml O₂ w 100 ml krwi<\/div>", "t": "17-678-0", "v": 0, "star": true, "id": 686}, {"c": 17, "ctx": "Układ oddechowy", "k": "Lista", "f": "⭐ Płytki oddech i CO₂", "b": "<ul><li> Przy bardzo płytkim oddechu duża część powietrza zostaje w przestrzeni martwej. CO₂ we krwi rośnie (kwasica oddechowa), choć w powietrzu wydychanym może być go mało. <\/li><li> <strong>Usuwanie CO₂ zależy tylko od wentylacji minutowej<\/strong>, a nie od stężenia tlenu we wdychanym powietrzu. <\/li><li> Przestrzeń martwa fizjologiczna to pęcherzyki bez przepływu krwi. U chorych mocno się powiększa. <\/li><li> Retencja CO₂ zdarza się przy: skurczu oskrzeli (astma, zaostrzenie POChP, zapalenie oskrzelików, anafilaksja), urazie klatki, zaawansowanych chorobach płuc i osłabieniu ośrodka oddechowego (opioidy, leki nasenne i uspokajające). <\/li><li> Hiperwentylacja usuwa za dużo CO₂ i daje <strong>zasadowicę<\/strong>. Hipowentylacja zatrzymuje CO₂ i daje <strong>kwasicę<\/strong>. <\/li><\/ul>", "t": "17-L-⭐ Płytki oddech i CO₂", "v": 0, "star": true, "list": 1, "id": 687}, {"c": 17, "ctx": "Układ oddechowy", "k": "Lista", "f": "⭐ Transport tlenu i tlenoterapia", "b": "<ul><li> Krzywa dysocjacji Hb: przy PaO₂ ≥ 60–70 mmHg hemoglobina jest prawie całkowicie wysycona. Dalsze podnoszenie PaO₂ niewiele daje. <\/li><li> Poniżej ok. 60–70 mmHg saturacja gwałtownie spada. Przy 40 mmHg Hb jest wysycona w 75%, przy 27 mmHg w 50% (P50). <\/li><li> Praktycznie: <strong>SpO₂ ok. 90% odpowiada PaO₂ ok. 60 mmHg<\/strong> – to granica niewydolności oddechowej. <\/li><li> Przesunięcie krzywej w prawo (kwasica, wzrost CO₂, gorączka) ułatwia oddawanie tlenu tkankom. <\/li><li> <strong>Cel tlenoterapii: SpO₂ 94–98%.<\/strong> U pacjentów z POChP zagrożonych retencją CO₂ cel to 88–92%. <\/li><li> Nadmiar tlenu szkodzi: wolne rodniki, 100% O₂ obkurcza tętnice wieńcowe i mózgowe. <\/li><\/ul><ul><li> W osoczu rozpuszczone jest tylko ok. 0,3 ml O₂/dl. Ma to znaczenie, gdy hemoglobina nie może przenosić tlenu: ciężka anemia (Hb &lt; 5 g/dl), zatrucie tlenkiem węgla, methemoglobinemia. Wtedy wysoki przepływ tlenu kilkukrotnie zwiększa tlen rozpuszczony. <\/li><li> Hipoksemia: mało tlenu w powietrzu (pożar w zamkniętym pomieszczeniu), duża wysokość (zawartość O₂ w powietrzu nadal 21%, ale spada ciśnienie atmosferyczne). <\/li><li> CO₂ jest transportowany głównie jako wodorowęglany (ok. 88%), w mniejszym stopniu jako karbaminiany (ok. 6%) i rozpuszczony w osoczu. <\/li><\/ul>", "t": "17-L-⭐ Transport tlenu i tlenoterapia", "v": 0, "star": true, "list": 1, "id": 688}, {"c": 17, "ctx": "Układ oddechowy", "k": "Lista", "f": "⭐ Skurcz oskrzeli, odma, obturacja i restrykcja", "b": "<ul><li> <strong>Dwukrotne zwężenie oskrzela zwiększa opór 16 razy.<\/strong> Dlatego skurcz oskrzeli tak bardzo utrudnia oddychanie. <\/li><li> Leki doraźne: beta2-mimetyki (salbutamol) albo leki hamujące układ przywspółczulny (ipratropium – dopisane). W zatruciu środkami ochrony roślin (fosforoorganicznymi) podaje się <strong>atropinę<\/strong>. <\/li><li> <strong>Odma<\/strong>: powietrze w jamie opłucnej znosi ciśnienie ujemne i płuco się zapada. Otwarta – rana ściany klatki. Zamknięta – pęknięcie płuca. <strong>Prężna<\/strong> – powietrze wchodzi, ale nie wychodzi, bezpośrednie zagrożenie życia (odbarczenie – zob. sekcja 6). <\/li><li> <strong>Niedodma<\/strong>: zapadanie słabo wentylowanych pęcherzyków przy płytkim oddechu z bólu lub przy długim leżeniu. <\/li><\/ul>", "t": "17-L-⭐ Skurcz oskrzeli, odma, obturacja i restrykcja", "v": 0, "star": true, "list": 1, "id": 689}, {"c": 17, "ctx": "Układ oddechowy › Skurcz oskrzeli, odma, obturacja i restrykcja", "k": "Pojęcie", "f": "Co się dzieje", "b": "<div class=\"kv\"><span>Obturacja<\/span>zwężone drogi oddechowe, utrudniony przepływ<\/div><div class=\"kv\"><span>Restrykcja<\/span>płuco nie może się rozprężyć<\/div>", "t": "17-691-0", "v": 0, "star": true, "id": 690}, {"c": 17, "ctx": "Układ oddechowy › Skurcz oskrzeli, odma, obturacja i restrykcja", "k": "Pojęcie", "f": "Spirometria", "b": "<div class=\"kv\"><span>Obturacja<\/span>FEV1 ↓, <strong>FEV1/FVC &lt; 70%<\/strong> (młodzi &lt; 75%, starsi &lt; 65%)<\/div><div class=\"kv\"><span>Restrykcja<\/span>FVC ↓, FEV1/FVC prawidłowy<\/div>", "t": "17-691-0", "v": 0, "star": true, "id": 691}, {"c": 17, "ctx": "Układ oddechowy › Skurcz oskrzeli, odma, obturacja i restrykcja", "k": "Pojęcie", "f": "Pojemność płuc (TLC)", "b": "<div class=\"kv\"><span>Obturacja<\/span>prawidłowa lub zwiększona<\/div><div class=\"kv\"><span>Restrykcja<\/span>zmniejszona<\/div>", "t": "17-691-0", "v": 0, "star": true, "id": 692}, {"c": 17, "ctx": "Układ oddechowy › Skurcz oskrzeli, odma, obturacja i restrykcja", "k": "Pojęcie", "f": "Przykłady", "b": "<div class=\"kv\"><span>Obturacja<\/span>astma, POChP, rozedma, przewlekłe zapalenie oskrzeli<\/div><div class=\"kv\"><span>Restrykcja<\/span>otyłość, kifoskolioza, choroby nerwowo-mięśniowe, pylice, sarkoidoza<\/div>", "t": "17-691-0", "v": 0, "star": true, "id": 693}, {"c": 17, "ctx": "Układ oddechowy", "k": "Lista", "f": "⭐ Skurcz oskrzeli, odma, obturacja i restrykcja", "b": "<ul><li> Prawidłowa spirometria <strong>wyklucza POChP<\/strong>, ale <strong>nie wyklucza astmy<\/strong>. <\/li><li> Przeciwwskazania do spirometrii: tętniaki (mózgu, aorty), wzmożone ciśnienie śródczaszkowe, niekontrolowane nadciśnienie, świeży zawał. <\/li><li> Gruźlica to według WHO najczęstsza przyczyna zgonu z powodu jednego czynnika zakaźnego. <\/li><\/ul><ul><li> <strong>Próba Snidera (zapałka)<\/strong>: pacjent dmucha na zapałkę 15 cm od szeroko otwartych ust. Gasi na siedząco i leżąco = norma. Tylko na siedząco = umiarkowany spadek FEV1. Wcale = znaczny spadek FEV1. <\/li><li> <strong>Liczenie na jednym wdechu< \/span>M ma największą wartość rokowniczą – zawsze zapisuj najlepszą odpowiedź<\/div>", "t": "neuro", "v": 0, "star": true, "id": 969}, {"c": 18, "ctx": "Ocena świadomości", "k": "Ocena świadomości", "f": "GCS – interpretacja", "b": "<div class=\"kv\"><span>Punkty<\/span>3–15. 13–15 lekkie, 9–12 umiarkowane, ≤ 8 ciężkie zaburzenia świadomości<\/div><div class=\"kv\"><span>Co robisz<\/span>GCS ≤ 8 → zabezpiecz drogi oddechowe; spadek o ≥ 2 pkt to pogorszenie – szukaj przyczyny (wklinowanie, hipoglikemia, hipoksja)<\/div><div class=\"kv\"><span>Zapis<\/span>podawaj składowe, np. GCS 9 (E2 V3 M4)<\/div>", "t": "neuro", "v": 0, "star": true, "id": 970}, {"c": 18, "ctx": "Ocena świadomości", "k": "Ocena świadomości", "f": "GCS u dziecka < 2 lat – odpowiedź słowna", "b": "<div class=\"kv\"><span>Punkty<\/span>5 gaworzy, uśmiecha się, wodzi wzrokiem; 4 płacze, ale daje się uspokoić; 3 płacz lub krzyk na ból, nie daje się uspokoić; 2 jęczy, pojękuje na ból; 1 brak<\/div><div class=\"kv\"><span>Uwaga<\/span>oczy i ruch ocenia się podobnie jak u dorosłych (6 = ruchy spontaniczne celowe)<\/div>", "t": "neuro", "v": 0, "star": true, "id": 971}, {"c": 18, "ctx": "Ocena świadomości", "k": "Ocena świadomości", "f": "Bodziec bólowy do GCS", "b": "<div class=\"kv\"><span>Jak<\/span>obwodowy: ucisk łożyska paznokcia (do oceny E i ruchu); centralny: ucisk mięśnia czworobocznego lub nadoczodołowy (do oceny lokalizowania)<\/div><div class=\"kv\"><span>Uwaga<\/span>nie pocieraj mostka – zostawia siniaki<\/div>", "t": "neuro", "v": 0, "star": true, "id": 972}, {"c": 18, "ctx": "Ocena świadomości", "k": "Ocena świadomości", "f": "AEIOU-TIPS – przyczyny zaburzeń świadomości", "b": "<div class=\"kv\"><span>Co oznacza<\/span>A alkohol; E epilepsja, elektrolity, endokrynologia; I insulina (hipo-/hiperglikemia); O opioidy, przedawkowanie; U uremia; T trauma, temperatura; I infekcja; P psychiatria, porfiria; S stroke (udar), shock (wstrząs)<\/div><div class=\"kv\"><span>Zapamiętaj<\/span>u każde  zaciśnięcie zębów<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1003}, {"c": 18, "ctx": "Nerwy czaszkowe", "k": "Nerwy czaszkowe", "f": "VI – odwodzący", "b": "<div class=\"kv\"><span>Funkcja<\/span>odwodzenie oka (na zewnątrz)<\/div><div class=\"kv\"><span>Uszkodzenie<\/span>oko nie odchodzi na bok, podwójne widzenie; wczesny objaw wzrostu ciśnienia śródczaszkowego<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1004}, {"c": 18, "ctx": "Nerwy czaszkowe", "k": "Nerwy czaszkowe", "f": "VII – twarzowy", "b": "<div class=\"kv\"><span>Funkcja<\/span>mięśnie mimiczne, smak (przednie 2/3 języka), zamykanie powiek<\/div><div class=\"kv\"><span>Badanie<\/span>zmarszczenie czoła, zaciśnięcie powiek, uśmiech<\/div><div class=\"kv\"><span>Uwaga<\/span>udar (ośrodkowy): czoło oszczędzone, opada dolna część twarzy; porażenie Bella (obwodowe): cała połowa twarzy łącznie z czołem<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1005}, {"c": 18, "ctx": "Nerwy czaszkowe", "k": "Nerwy czaszkowe", "f": "VIII – przedsionkowo-ślimakowy", "b": "<div class=\"kv\"><span>Funkcja<\/span>słuch i równowaga<\/div><div class=\"kv\"><span>Uszkodzenie<\/span>zawroty głowy, oczopląs, niedosłuch, szumy<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1006}, {"c": 18, "ctx": "Nerwy czaszkowe", "k": "Nerwy czaszkowe", "f": "IX – językowo-gardłowy", "b": "<div class=\"kv\"><span>Funkcja<\/span>czucie gardła, smak tylnej 1/3 języka, odruch gardłowy (dośrodkowo)<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1007}, {"c": 18, "ctx": "Nerwy czaszkowe", "k": "Nerwy czaszkowe", "f": "X – błędny", "b": "<div class=\"kv\"><span>Funkcja<\/span>podniebienie, gardło, krtań (mowa, połykanie), przywspółczulne unerwienie serca i trzewi<\/div><div class=\"kv\"><span>Uszkodzenie<\/span>chrypka, zaburzenia połykania, podniebienie zbacza na zdrową stronę<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1008}, {"c": 18, "ctx": "Nerwy czaszkowe", "k": "Nerwy czaszkowe", "f": "XI – dodatkowy", "b": "<div class=\"kv\"><span>Funkcja<\/span>mięsień mostkowo-obojczykowo-sutkowy i czworoboczny<\/div><div class=\"kv\"><span>Badanie<\/span>unoszenie barków, obrót głowy przeciw oporowi<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1009}, {"c": 18, "ctx": "Nerwy czaszkowe", "k": "Nerwy czaszkowe", "f": "XII – podjęzykowy", "b": "<div class=\"kv\"><span>Funkcja<\/span>ruchy języka<\/div><div class=\"kv\"><span>Uszkodzenie<\/span>wysunięty język zbacza na stronę uszkodzenia<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1010}, {"c": 18, "ctx": "Nerwy czaszkowe", "k": "Nerwy czaszkowe", "f": "Jak zapamiętać nerwy czaszkowe", "b": "<div class=\"kv\"><span>Kolejność<\/span>I węchowy, II wzrokowy, III okoruchowy, IV bloczkowy, V trójdzielny, VI odwodzący, VII twarzowy, VIII przedsionkowo-ślimakowy, IX językowo-gardłowy, X błędny, XI dodatkowy, XII podjęzykowy<\/div><div class=\"kv\"><span>Ruchy oka<\/span>III, IV, VI – „LR6 SO4, reszta 3”: mięsień prosty boczny – VI, skośny górny – IV, pozostałe – III<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1011}, {"c": 18, "ctx": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Babińskiego", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>pocieranie bocznej krawędzi podeszwy od pięty do palców<\/div><div class=\"kv\"><span>Wynik dodatni<\/span>grzbietowe zgięcie palucha i wachlarzowate rozstawienie pozostałych palców<\/div><div class=\"kv\"><span>Znaczenie<\/span>uszkodzenie drogi piramidowej (neuron górny); u dzieci do ok. 1–2 r.ż. fizjologiczny<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1012}, {"c": 18, "ctx": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Oppenheima", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>silne przesunięcie palcami po przyśrodkowej krawędzi piszczeli w dół<\/div><div class=\"kv\"><span>Wynik dodatni<\/span>jak w objawie Babińskiego – zgięcie grzbietowe palucha<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1013}, {"c": 18, "ctx": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Gordona", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>ucisk mięśni łydki<\/div><div class=\"kv\"><span>Wynik dodatni<\/span>zgięcie grzbietowe palucha<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1014}, {"c": 18, "ctx": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Rossolimo", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>uderzenie w opuszki palców stopy od strony podeszwy<\/div><div class=\"kv\"><span>Wynik dodatni<\/span>zgięcie podeszwowe palców – uszkodzenie drogi piramidowej<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1015}, {"c": 18, "ctx": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Hoffmanna", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>pstryknięcie w paznokieć palca środkowego<\/div><div class=\"kv\"><span>Wynik dodatni<\/span>zgięcie kciuka i palca wskazującego – neuron górny (kończyna górna)<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1016}, {"c": 18, "ctx": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Klonus", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>gwałtowne zgięcie grzbietowe stopy (klonus stopy) lub przesunięcie rzepki w dół<\/div><div class=\"kv\"><span>Wynik dodatni<\/span>rytmiczne, powtarzające się skurcze – wzmożone odruchy przy uszkodzeniu neuronu górnego; także w zespole serotoninowym<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1017}, {"c": 18, "ctx": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Odruchy deliberacyjne (prymitywne)", "b": "<div class=\"kv\"><span>Przykłady<\/span>ssania, ryjkowy (wysunięcie ust po uderzeniu w wargę), chwytny dłoniowy, dłoniowo-bródkowy<\/div><div class=\"kv\"><span>Znaczenie<\/span>u dorosłego – uszkodzenie płatów czołowych, otępienie, rozlane uszkodzenie mózgu<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1018}, {"c": 18, "ctx": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Skala odruchów głębokich", "b": "<div class=\"kv\"><span>Punkty<\/span>0 brak; 1+ osłabiony; 2+ prawidłowy; 3+ żywy; 4+ wzmożony z klonusem<\/div><div class=\"kv\"><span>Zapamiętaj<\/span>ważniejsza od siły odruchu jest asymetria między stronami<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1019}, {"c": 18, "ctx": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Odruch źreniczny", "b": "<div class=\"kv\"><span>Jak<\/span>światło do oka – zwężenie źrenic<\/div><div class=\"kv\"><span>Nerwy<\/span>II (dośrodkowy), III (odśrodkowy); ośrodek w śródmózgowiu<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1020}, {"c": 18, "ctx": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Odruch rogówkowy", "b": "<div class=\"kv\"><span>Jak<\/span>dotknięcie rogówki (np. wacikiem) – mrugnięcie<\/div><div class=\"kv\"><span>Nerwy<\/span>V (dośrodkowy), VII (odśrodkowy); ośrodek w moście<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1021}, {"c": 18, "ctx": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Odruch oczno-głowowy („oczy lalki”)", "b": "<div class=\"kv\"><span>Jak<\/span>szybki obrót głowy (tylko gdy wykluczysz uraz kręgosłupa) – oczy przesuwają się w przeciwną stronę<\/div><div class=\"kv\"><span>Znaczenie<\/span>u nieprzytomnego obecny = pień mózgu działa; brak = uszkodzenie pnia<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1022}, {"c": 18, "ctx": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Odruch gardłowy i kaszlowy", "b": "<div class=\"kv\"><span>Jak<\/span>drażnienie tylnej ściany gardła / tchawicy (np. przy odsysaniu)<\/div><div class=\"kv\"><span>Nerwy<\/span>IX i X; ośrodek w rdzeniu przedłużonym<\/div><div class=\"kv\"><span>W praktyce<\/span>brak odruchu gardłowego = pacjent toleruje rurkę ustno-gardłową, zagrożenie aspiracją<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1023}, {"c": 18, "ctx": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Znaczenie odruchów pniowych", "b": "<div class=\"kv\"><span>Zapamiętaj<\/span>brak wszystkich odruchów pniowych i bezdech – jedno z kryteriów śmierci mózgu (orzeka komisja w szpitalu, nie zespół ZRM)<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1024}, {"c": 18, "ctx": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch Moro", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>nagłe opuszczenie główki lub głośny dźwięk<\/div><div class=\"kv\"><span>Reakcja<\/span>odrzucenie rąk na boki, rozprostowanie palców, potem objęcie i płacz<\/div><div class=\"kv\"><span>Zanika<\/span>ok. 4–6 miesiąca<\/div><div class=\"kv\"><span>Uwaga<\/span>asymetria → uraz splotu ramiennego lub złamanie obojczyka przy porodzie<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1025}, {"c": 18, "ctx": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch ssania i szukania", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>dotknięcie warg (ssanie) lub kącika ust/policzka (szukanie – zwrot główki)<\/div><div class=\"kv\"><span>Zanika<\/span>ok. 3–4 miesiąca (szukanie); ssanie przechodzi w świadome<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1026}, {"c": 18, "ctx": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch chwytny", "b": "<div class=\"kv\"><span>Dłoniowy<\/span>ucisk dłoni – zaciśnięcie palców; zanika ok. 3–6 miesiąca<\/div><div class=\"kv\"><span>Podeszwowy<\/span>ucisk podeszwy – zgięcie palców stopy; zanika ok. 9–12 miesiąca<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1027}, {"c": 18, "ctx": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch toniczno-szyjny asymetryczny (pozycja szermierza)", "b": "<div class=\"kv\"><span>Reakcja<\/span>obrót główki → wyprost kończyn po stronie twarzy, zgięcie po stronie potylicy<\/div><div class=\"kv\"><span>Zanika<\/span>ok. 6 miesiąca<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1028}, {"c": 18, "ctx": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch automatycznego chodu (krokowy)", "b": "<div class=\"kv\"><span>Jak wywołać<\/span>noworodek trzymany pionowo, stopy dotykają podłoża – „kroki”<\/div><div class=\"kv\"><span>Zanika<\/span>ok. 2 miesiąca<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1029}, {"c": 18, "ctx": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Znaczenie odruchów noworodkowych", "b": "<div class=\"kv\"><span>Zapamiętaj<\/span>nieprawidłowe są: brak odruchu, asymetria lub utrzymywanie się odruchu dłużej niż powinien (uszkodzenie OUN)<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1030}, {"c": 18, "ctx": "Badanie neurologiczne w karetce", "k": "Badanie neurologiczne w karetce", "f": "Szybkie badanie neurologiczne (schemat)", "b": "<div class=\"kv\"><span>Kolejność<\/span>1. AVPU/GCS; 2. źrenice (wielkość, reakcja); 3. glikemia; 4. objawy ogniskowe (BE-FAST, siła 4 kończyn, czucie); 5. objawy oponowe; 6. mowa, orientacja; 7. temperatura; 8. ślady urazu, zapach (alkohol, aceton)<\/div><div class=\"kv\"><span>Zapamiętaj<\/span>dokumentuj stan wyjściowy i powtarzaj badanie – liczy się zmiana w czasie<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1031}, {"c": 18, "ctx": "Badanie neurologiczne w karetce", "k": "Badanie neurologiczne w karetce", "f": "Wywiad neurologiczny", "b": "<div class=\"kv\"><span>Pytaj o<\/span>początek (nagły czy stopniowy), czas wystąpienia, drgawki, uraz, leki (przeciwkrzepliwe!), cukrzycę, padaczkę, alkohol i używki, ból głowy (najgorszy w życiu → SAH)<\/div>", "t": "neuro", "v": 0, "star": true, "id": 1032}, {"c": 19, "ctx": "System i organizacja", "k": "Co oznacza skrót", "f": "PRM", "b": "Państwowe Ratownictwo Medyczne – system z ustawy o PRM", "t": "skr", "v": 0, "star": false, "r": 1, "qf": "Jaki to skrót?", "id": 1033}, {"c": 19, "ctx": "System i organizacja", "k": "Co oznacza skrót", "f": "ZRM", "b": "zespół ratownictwa medycznego (S – specjalistyczny z lekarzem, P – podstawowy, bez lekarza)", "t": "skr", "v": 0, "star": false, "r": 1, "qf": "Jaki to skrót?", "id": 1034}, {"c": 19, "ctx": "System i organizacja", "k": "Co oznacza skrót", "f": "LZRM", "b": "lotniczy zespół ratownictwa medycznego (LPR)", "t": "skr", "v" a otwarta", "b": "<div class=\"kv\"><span>Rozpoznanie<\/span>rana klatki piersiowej „ssąca” powietrze, pienista krew<\/div><div class=\"kv\"><span>Postępowanie<\/span>opatrunek wentylowy (z zastawką), obserwacja w kierunku odmy prężnej<\/div>", "t": "tri", "v": 0, "star": true, "id": 1235}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "4. Wiotka klatka piersiowa", "b": "<div class=\"kv\"><span>Rozpoznanie<\/span>złamania ≥ 2 sąsiednich żeber w ≥ 2 miejscach, ruch paradoksalny fragmentu<\/div><div class=\"kv\"><span>Postępowanie<\/span>tlen, leczenie bólu, wsparcie wentylacji (CPAP/wentylacja dodatnim ciśnieniem); groźne jest stłuczenie płuca pod spodem<\/div>", "t": "tri", "v": 0, "star": true, "id": 1236}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "5. Masywny krwiak opłucnej", "b": "<div class=\"kv\"><span>Rozpoznanie<\/span>wstrząs + brak szmeru i stłumienie odgłosu opukowego (&gt; 1500 ml krwi w opłucnej)<\/div><div class=\"kv\"><span>Postępowanie<\/span>tlen, ograniczone płyny, kwas traneksamowy, szybki transport do torakochirurgii<\/div>", "t": "tri", "v": 0, "star": true, "id": 1237}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "6. Tamponada serca", "b": "<div class=\"kv\"><span>Rozpoznanie<\/span>triada Becka: hipotensja, poszerzone żyły szyjne, ciche tony serca; PEA<\/div><div class=\"kv\"><span>Postępowanie<\/span>szybki transport do kardiochirurgii, płyny dla utrzymania ciśnienia; perikardiocenteza<\/div>", "t": "tri", "v": 0, "star": true, "id": 1238}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "7. Urazowe pęknięcie aorty (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać<\/span>gwałtowne hamowanie (wypadek przy dużej prędkości, upadek z wysokości), ból między łopatkami, różnica ciśnień na kończynach<\/div><div class=\"kv\"><span>Postępowanie<\/span>kontrola ciśnienia (unikaj nadciśnienia), szybki transport<\/div>", "t": "tri", "v": 0, "star": true, "id": 1239}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "8. Uraz tchawicy lub oskrzela (ukryty)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać<\/span>odma podskórna, krwioplucie, odma nieustępująca po odbarczeniu<\/div><div class=\"kv\"><span>Postępowanie<\/span>zabezpieczenie dróg oddechowych, szybki transport<\/div>", "t": "tri", "v": 0, "star": true, "id": 1240}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "9. Stłuczenie serca (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać<\/span>uderzenie w mostek (kierownica), zaburzenia rytmu, zmiany w EKG<\/div><div class=\"kv\"><span>Postępowanie<\/span>monitorowanie EKG, leczenie arytmii<\/div>", "t": "tri", "v": 0, "star": true, "id": 1241}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "10. Pęknięcie przepony (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać<\/span>uraz brzucha/dołu klatki, częściej po lewej; perystaltyka słyszalna nad klatką<\/div><div class=\"kv\"><span>Postępowanie<\/span>tlen, transport; nie zakładaj zgłębnika na siłę<\/div>", "t": "tri", "v": 0, "star": true, "id": 1242}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "11. Pęknięcie przełyku (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać<\/span>uraz penetrujący, silny ból za mostkiem, odma śródpiersia, odma podskórna<\/div><div class=\"kv\"><span>Postępowanie<\/span>nic doustnie, transport<\/div>", "t": "tri", "v": 0, "star": true, "id": 1243}, {"c": 6, "ctx": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "12. Stłuczenie płuca (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać<\/span>silny uraz klatki, złamania żeber, narastająca hipoksja (szczyt po kilkunastu godzinach)<\/div><div class=\"kv\"><span>Postępowanie<\/span>tlen, ostrożnie z płynami, wsparcie wentylacji<\/div>", "t": "tri", "v": 0, "star": true, "id": 1244}, {"c": 6, "ctx": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "4H i 4T – odwracalne przyczyny NZK", "b": "<div class=\"kv\"><span>4H<\/span>hipoksja, hipowolemia, hipo-/hiperkaliemia i inne zaburzenia metaboliczne, hipotermia/hipertermia<\/div><div class=\"kv\"><span>4T<\/span>tamponada, odma prężna (tension), toksyny, zakrzepica (wieńcowa lub płucna – thrombosis)<\/div><div class=\"kv\"><span>Zapamiętaj<\/span>szukaj ich w każdym NZK, szczególnie w PEA i asystolii – leczysz przyczynę, nie tylko rytm<\/div>", "t": "tri", "v": 0, "star": true, "id": 1245}, {"c": 6, "ctx": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "DOPE – nagłe pogorszenie u zaintubowanego", "b": "<div class=\"kv\"><span>Co sprawdzasz<\/span>D – przemieszczenie rurki (Displacement); O – niedrożność (Obstruction: wydzielina, zagięcie); P – odma (Pneumothorax); E – sprzęt (Equipment: tlen, respirator, worek)<\/div><div class=\"kv\"><span>Co robisz<\/span>odłącz respirator, wentyluj workiem, sprawdź kapnografię i osłuchaj klatkę<\/div>", "t": "tri", "v": 0, "star": true, "id": 1246}, {"c": 6, "ctx": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "NEXUS – kiedy stabilizować kręgosłup szyjny", "b": "<div class=\"kv\"><span>Stabilizuj, jeśli jest choć jedno<\/span>tkliwość w linii środkowej karku, zaburzenia świadomości, intoksykacja (alkohol, leki), deficyt neurologiczny, bolesny uraz odwracający uwagę<\/div><div class=\"kv\"><span>Uwaga<\/span>starsi (&gt; 65 lat) i mechanizm wysokoenergetyczny – niski próg stabilizacji<\/div>", "t": "tri", "v": 0, "star": true, "id": 1247}, {"c": 6, "ctx": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "Skala Apgar (noworodek, 1. i 5. minuta)", "b": "<div class=\"kv\"><span>A – wygląd (kolor skóry)<\/span>0 sinica/bladość całego ciała · 1 sinica rąk i stóp · 2 różowy<\/div><div class=\"kv\"><span>P – tętno<\/span>0 brak · 1 &lt; 100/min · 2 &gt; 100/min<\/div><div class=\"kv\"><span>G – grymas (reakcja na bodźce)<\/span>0 brak · 1 grymas · 2 płacz, kichanie<\/div><div class=\"kv\"><span>A – napięcie mięśni<\/span>0 wiotki · 1 słabe zgięcie kończyn · 2 ruchy czynne<\/div><div class=\"kv\"><span>R – oddech<\/span>0 brak · 1 słaby, nieregularny · 2 dobry, głośny płacz<\/div><div class=\"kv\"><span>Wynik<\/span>8–10 dobry · 4–7 średni · 0–3 ciężki; resuscytacji nie opóźniasz do oceny Apgar<\/div>", "t": "tri", "v": 0, "star": true, "id": 1248}, {"c": 6, "ctx": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "Klasy wstrząsu krwotocznego (ATLS)", "b": "<div class=\"kv\"><span>I – utrata &lt; 15% (&lt; 750 ml)<\/span>HR &lt; 100, ciśnienie prawidłowe, pacjent lekko niespokojny<\/div><div class=\"kv\"><span>II – 15–30% (750–1500 ml)<\/span>HR 100–120, ciśnienie skurczowe prawidłowe, mała amplituda, niepokój<\/div><div class=\"kv\"><span>III – 30–40% (1500–2000 ml)<\/span>HR 120–140, spadek ciśnienia, splątanie, skąpomocz – potrzebna krew<\/div><div class=\"kv\"><span>IV – &gt; 40% (&gt; 2000 ml)<\/span>HR &gt; 140, bardzo niskie ciśnienie, letarg – bezpośrednie zagrożenie życia<\/div>", "t": "tri", "v": 0, "star": true, "id": 1249}, {"c": 6, "ctx": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "5 P – ostre niedokrwienie kończyny", "b": "<div class=\"kv\"><span>Objawy<\/span>Pain – ból · Pallor – bladość · Pulselessness – brak tętna · Paresthesia – zaburzenia czucia · Paralysis – porażenie (+ Poikilothermia – zimna kończyna)<\/div><div class=\"kv\"><span>Co oznacza<\/span>zator lub uraz tętnicy, zespół ciasnoty przedziałów – pilnie do chirurgii naczyniowej<\/div>", "t": "tri", "v": 0, "star": true, "id": 1250}, {"c": 6, "ctx": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "Rodzaje wstrząsu – 4 typy", "b": "<div class=\"kv\"><span>Hipowolemiczny<\/span>utrata krwi lub płynów – zapadnięte żyły szyjne, zimna skóra<\/div><div class=\"kv\"><span>Dystrybucyjny<\/span>sepsa, anafilaksja, wstrząs neurogenny – często ciepła skóra<\/div><div class=\"kv\"><span>Kardiogenny<\/span>zawał, arytmia – zastój w płucach, poszerzone żyły szyjne<\/div><div class=\"kv\"><span>Obturacyjny<\/span>odma prężna, tamponada, zatorowość płucna – poszerzone żyły szyjne, przyczyna mechaniczna do usunięcia<\/div>", "t": "tri", "v": 0, "star": true, "id": 1251}, {"c": 6, "ctx": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Co to jest eFAST", "b": "<div class=\"kv\"><span>Nazwa<\/span>extended Focused Assessment with Sonography for Trauma – szybkie przyłóżkowe USG u pacjenta urazowego<\/div><div class=\"kv\"><span>Czego szukasz<\/span>1) wolnego płynu (krwi) w jamie brzusznej, 2) płynu w osierdziu (tamponada), 3) krwi w opłucnej, 4) odmy opłucnowej<\/div><div class=\"kv\"><span>Zapamiętaj<\/span>krew i płyn w USG są CZARNE (bezechowe); badanie trwa 2–3 min i nie może opóźniać transportu<\/div>", "t": "tri", "v": 0, "star": true, "id": 1252}, {"c": 6, "ctx": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okno 1 – prawe podżebrze (zachyłek Morisona)", "b": "<div class=\"kv\"><span>Gdzie głowica<\/span>prawa linia pachowa środkowa/tylna, ok. VIII–XI przestrzeń międzyżebrowa<\/div><div class=\"kv\"><span>Co oglądasz<\/span>przestrzeń między wątrobą a prawą nerką<\/div><div class=\"kv\"><span>Zapamiętaj<\/span>najczulsze miejsce – krew w brzuchu zbiera się tu najwcześniej (pacjent na plecach); przesuń głowicę wyżej nad przeponę → krew w prawej opłucnej<\/div>", "t": "tri", "v": 0, "star": true, "id": 1253}, {"c": 6, "ctx": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okno 2 – lewe podżebrze (śledziona–nerka)", "b": "<div class=\"kv\"><span>Gdzie głowica<\/span>lewa linia pachowa tylna, wyżej i bardziej z tyłu niż po prawej („knuckles to the bed” – kłykcie przy łóżku)<\/div><div class=\"kv\"><span>Co oglądasz<\/span>przestrzeń między śledzioną a lewą nerką i pod przeponą<\/div><div class=\"kv\"><span>Zapamiętaj<\/span>nad przeponą sprawdź lewą opłucną<\/div>", "t": "tri", "v": 0, "star": true, "id": 1254}, {"c": 6, "ctx": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okno 3 – nad spojeniem łonowym (miednica)", "b": "<div class=\"kv\"><span>Gdzie głowica<\/span>tuż nad spojeniem łonowym, przekrój poprzeczny i podłużny<\/div><div class=\"kv\"><span>Co oglądasz<\/span>za pęcherzem moczowym: zagłębienie odbytniczo-maciczne (Douglasa) u kobiet, odbytniczo-pęcherzowe u mężczyzn<\/div><div class=\"kv\"><span>Zapamiętaj<\/span>najlepiej przy pełnym pęcherzu – nie cewnikuj przed badaniem<\/div>", "t": "tri", "v": 0, "star": true, "id": 1255}, {"c": 6, "ctx": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okno 4 – podmostkowe (serce)", "b": "<div class=\"kv\"><span>Gdzie głowica<\/span>pod wyrostkiem mieczykowatym, skierowana do lewego barku<\/div><div class=\"kv\"><span>Co oglądasz<\/span>osierdzie – czarny pasek płynu wokół serca<\/div><div class=\"kv\"><span>Znaczenie<\/span>płyn + wstrząs + poszerzone żyły szyjne = tamponada (triada Becka) – pilnie do kardiochirurgii; gdy okno podmostkowe niedostępne – okno przymostkowe<\/div>", "t": "tri", "v": 0, "star": true, "id": 1256}, {"c": 6, "ctx": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okna 5–6 – przód klatki piersiowej (odma)", "b": "<div class=\"kv\"><span>Gdzie głowica<\/span>obustronnie II–III przestrzeń międzyżebrowa w linii środkowo-obojczykowej (najwyższy punkt u leżącego)<\/div><div class=\"kv\"><span>Prawidłowo<\/span>„ślizganie płuca” (lung sliding) – opłucna przesuwa się z oddechem; w M-mode „brzeg morza” (seashore sign); linie B<\/div><div class=\"kv\"><span>Odma<\/span>brak ślizgania i brak linii B; w M-mode „kod kreskowy” (barcode/stratosphere sign); „punkt płucny” (lung point) potwierdza odmę<\/div>", "t": "tri", "v": 0, "star": true, "id": 1257}, {"c": 6, "ctx": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Interpretacja eFAST i decyzje", "b": "<div class=\"kv\"><span>Niestabilny + płyn w brzuchu<\/span>krwotok do jamy brzusznej → najszybciej na blok operacyjny / do centrum urazowego<\/div><div class=\"kv\"><span>Płyn w osierdziu + wstrząs<\/span>tamponada → kardiochirurgia<\/div><div class=\"kv\"><span>Brak ślizgania + wstrząs<\/span>odma prężna → odbarczenie<\/div><div class=\"kv\"><span>Ograniczenia<\/span>ujemny wynik NIE wyklucza krwawienia (przestrzeń zaotrzewnowa, miednica, mała ilość krwi – wykrywa zwykle od ok. 200 ml w brzuchu); zależy od doświadczenia badającego; powtarzaj badanie przy pogorszeniu<\/div>", "t": "tri", "v": 0, "star": true, "id": 1258}, {"c": 6, "ctx": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Sprzęt i ułożenie", "b": "<div class=\"kv\"><span>Głowica<\/span>convex (brzuszna, 2–5 MHz) do brzucha i serca; liniowa (wysokiej częstotliwości) lub convex do opłucnej<\/div><div class=\"kv\"><span>Ułożenie<\/span>pacjent na plecach; lekki Trendelenburg zwiększa czułość w zachyłku Morisona, anty-Trendelenburg – w miednicy<\/div><div class=\"kv\"><span>W karetce<\/span>POCUS/eFAST wykonują głównie zespoły S i LPR; wynik przekaż szpitalowi przy zgłoszeniu pacjenta<\/div>", "t": "tri", "v": 0, "star": true, "id": 1259}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Anizokoria", "b": "nierówne źrenice – jedna szersza od drugiej. U nieprzytomnego po urazie głowy szersza, niereagująca źrenica zwykle jest po stronie krwiaka (ucisk nerwu III) – objaw wklinowania. Małą anizokorię (&lt; 1 mm) z prawidłową reakcją ma ok. 20% zdrowych ludzi.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1260}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Źrenice szpilkowate", "b": "bardzo wąskie źrenice – typowe po opioidach, w zatruciu związkami fosforoorganicznymi, przy krwotoku do mostu.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1261}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Stridor", "b": "świszczący, „piejący” dźwięk przy WDECHU – zwężenie górnych dróg oddechowych (krtań, tchawica): obrzęk, krup, ciało obce. Stan pilny.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1262}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Świsty", "b": "gwiżdżący dźwięk przy WYDECHU – zwężenie oskrzeli (astma, POChP, anafilaksja).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1263}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Rzężenia", "b": "trzeszczące, bulgoczące dźwięki nad płucami – płyn w pęcherzykach (obrzęk płuc, zapalenie płuc).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1264}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Cicha klatka piersiowa", "b": "w ciężkiej astmie brak świstów i prawie brak szmeru – powietrze prawie nie przepływa. Objaw zagrożenia życia, nie poprawy.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1265}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Odgłos bębenkowy", "b": "przy opukiwaniu klatki dźwięk głośny i „pusty” jak bęben – powietrze w opłucnej (odma). Stłumienie = płyn lub krew.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1266}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Odma podskórna", "b": "powietrze pod skórą – przy dotyku trzeszczy jak śnieg. Po urazie klatki: złamane żebra, odma, uraz tchawicy/oskrzela.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1267}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Poszerzone żyły szyjne", "b": "nabrzmiałe żyły na szyi u siedzącego/półsiedzącego pacjenta – krew „nie może” wrócić do serca: odma prężna, tamponada, niewydolność prawej komory, zatorowość płucna.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1268}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Nawrót kapilarny", "b": "po uciśnięciu paznokcia lub mostka przez 5 s mierzysz, ile trwa powrót koloru. Norma &lt; 2 s; dłużej = słabe krążenie obwodowe (wstrząs, wychłodzenie).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1269}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Tętno paradoksalne", "b": "spadek ciśnienia skurczowego o &gt; 10 mmHg przy wdechu (tętno słabnie na wdechu) – tamponada, ciężka astma.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1270}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Ruch paradoksalny klatki", "b": "fragment klatki zapada się przy wdechu i uwypukla przy wydechu – wiotka klatka piersiowa (złamania żeber w kilku miejscach).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1271}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Sinica", "b": "niebieskie zabarwienie skóry i warg – za mało tlenu we krwi. Centralna (usta, język) = poważna hipoksja.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1272}, {"c": 6, "ctx": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Niepamięć wsteczna", "b": "pacjent nie pamięta zdarzenia lub chwil przed nim – objaw urazu mózgu (wstrząśnienie, krwiak).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1273}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Tamponada serca", "b": "krew lub płyn w worku osierdziowym uciska serce, które nie może się wypełnić – spada ciśnienie. Objawy: triada Becka (hipotensja, poszerzone żyły szyjne, ciche tony serca). Leczenie: odbarczenie osierdzia w szpitalu.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1274}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Odma prężna", "b": "powietrze wchodzi do opłucnej i nie może wyjść, ciśnienie rośnie, płuco się zapada, śródpiersie przesuwa się i zgina żyły – wstrząs. Leczenie: natychmiastowe odbarczenie igłą.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1275}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Wklinowanie", "b": "mózg (przez obrzęk lub krwiak) przemieszcza się i uciska pień mózgu. Objawy: spadek GCS, anizokoria, triada Cushinga. Stan bezpośredniego zagrożenia życia.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1276}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Krwiak śródczaszkowy", "b": "krew zbierająca się w czaszce po urazie (nadtwardówkowy, podtwardówkowy) – uciska mózg. Większe ryzyko u osób na lekach przeciwkrzepliwych i starszych.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1277}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Wstrząs", "b": "niewydolność krążenia – narządy dostają za mało krwi i tlenu. Rodzaje: hipowolemiczny (utrata krwi/płynów), dystrybucyjny (sepsa, anafilaksja), kardiogenny (serce), obturacyjny (odma, tamponada, zator).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1278}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Wstrząs obturacyjny", "b": "krążenie zablokowane mechanicznie: odma prężna, tamponada, zatorowość płucna. Płyny pomagają mało – trzeba usunąć przeszkodę.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1279}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Stan padaczkowy", "b": "drgawki trwające ≥ 5 min albo kolejne napady bez odzyskania przytomności. Leczysz od razu (midazolam).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1280}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Depresja oddechowa", "b": "za rzadki lub za płytki oddech (np. &lt; 8/min) – po opioidach, benzodiazepinach, w urazie głowy. Leczenie: wentylacja, odtrutka.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1281}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Atonia macicy", "b": "macica po porodzie się nie obkurcza (jest miękka) i krwawi – najczęstsza przyczyna krwotoku poporodowego. Masaż macicy, TXA, transport.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1282}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Reakcja dwufazowa", "b": "w anafilaksji objawy wracają po kilku godzinach od poprawy – dlatego pacjent zostaje na obserwacji w szpitalu.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1283}, {"c": 6, "ctx": "Słowniczek – Stany", "k": "Pojęcie", "f": "Zespół odstawienny", "b": "objawy po nagłym odstawieniu lub odwróceniu leku (np. po naloksonie u uzależnionego): pobudzenie, agresja, wymioty, poty.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1284}, {"c": 6, "ctx": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "NZK", "b": "nagłe zatrzymanie krążenia – brak tętna i oddechu. Rytmy: do defibrylacji (VF, pVT) i niedefibrylacyjne (asystolia, PEA).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1285}, {"c": 6, "ctx": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "VF – migotanie komór", "b": "chaotyczna aktywność elektryczna komór, serce nie pompuje krwi. Na monitorze nieregularna „zygzakowata” linia. Leczenie: defibrylacja.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1286}, {"c": 6, "ctx": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "VT / pVT – częstoskurcz komorowy", "b": "szybki rytm z szerokimi zespołami QRS. Z tętnem: stabilny (leki) lub niestabilny (kardiowersja). Bez tętna (pVT): jak VF – defibrylacja.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1287}, {"c": 6, "ctx": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "PEA – aktywność elektryczna bez tętna", "b": "na monitorze jest rytm (np. zatokowy), ale nie ma tętna – serce nie pompuje skutecznie. Szukaj przyczyn 4H i 4T (np. tamponada, odma, krwotok).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1288}, {"c": 6, "ctx": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "Asystolia", "b": "brak aktywności elektrycznej serca – płaska linia. Sprawdź elektrody i wzmocnienie; adrenalina jak najszybciej.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1289}, {"c": 6, "ctx": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "ROSC", "b": "powrót spontanicznego krążenia po resuscytacji – jest tętno i ciśnienie. Potem opieka poresuscytacyjna (ABCDE, EKG, SpO₂ 94–98%).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1290}, {"c": 6, "ctx": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "SVT – częstoskurcz nadkomorowy", "b": "szybki (często 180–220/min), miarowy rytm z wąskimi QRS, zwykle u młodych. Leczenie: manewr Valsalvy, adenozyna.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1291}, {"c": 6, "ctx": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "WPW (preekscytacja)", "b": "dodatkowa droga przewodzenia w sercu; w EKG krótkie PQ i fala delta. Przy migotaniu przedsionków z WPW nie podaje się adenozyny ani leków blokujących węzeł AV.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1292}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Defibrylacja", "b": "wyładowanie elektryczne NIEsynchronizowane – w NZK (VF, pVT). Natychmiast, bez sedacji.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1293}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Kardiowersja", "b": "wyładowanie elektryczne ZSYNCHRONIZOWANE z zespołem QRS – u pacjenta z tętnem, ale niestabilnego (częstoskurcz ze wstrząsem). Wymaga sedacji.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1294}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Manewr Valsalvy (zmodyfikowany)", "b": "pacjent mocno pręży (np. dmucha w strzykawkę 10 ml przez 15 s), potem od razu kładzie się z uniesionymi nogami. Pobudza nerw błędny i może przerwać SVT.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1295}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Odbarczenie odmy igłą", "b": "wkłucie grubej kaniuli (14G, 5–8 cm) w IV–V przestrzeni międzyżebrowej w linii pachowej przedniej/środkowej, żeby wypuścić powietrze z opłucnej.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1296}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Perikardiocenteza", "b": "nakłucie worka osierdziowego, żeby usunąć krew/płyn przy tamponadzie – w szpitalu (lekarz).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1297}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Hipotensja permisywna", "b": "w krwotoku (bez urazu głowy) nie podnosisz ciśnienia do normy – celujesz w SBP 80–90 mmHg, żeby nie rozpuścić skrzepu i nie rozcieńczyć krwi.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1298}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Miareczkowanie", "b": "podawanie leku małymi dawkami i ocena efektu po każdej (np. nalokson, morfina), aż do uzyskania celu – zamiast jednej dużej dawki.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1299}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Bolus / wlew", "b": "bolus – szybkie podanie dawki naraz; wlew – powolne podawanie przez pompę lub kroplówkę w określonym czasie.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1300}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Dostęp doszpikowy (i.o.)", "b": "igła wkłuta w kość (np. piszczel, ramię), gdy nie da się założyć wkłucia dożylnego. Podajesz te same leki i płyny co dożylnie.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1301}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "SGA", "b": "nadgłośniowe urządzenie do udrażniania dróg oddechowych (np. i-gel) – zakładane „na ślepo” do gardła, alternatywa dla intubacji.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1302}, {"c": 6, "ctx": "Słowniczek – Procedury", "k": "Pojęcie", "f": "EtCO₂ (kapnografia)", "b": "stężenie CO₂ w wydychanym powietrzu; norma 35–45 mmHg. Potwierdza położenie rurki, ocenia jakość RKO i powrót krążenia (nagły wzrost).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1303}, {"c": 6, "ctx": "Słowniczek – Leki i przekazanie", "k": "Pojęcie", "f": "NOAC / apiksaban", "b": "nowe doustne leki przeciwkrzepliwe (apiksaban, rywaroksaban, dabigatran). U pacjenta po urazie głowy = wysokie ryzyko krwawienia do mózgu.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1304}, {"c": 6, "ctx": "Słowniczek – Leki i przekazanie", "k": "Pojęcie", "f": "Pochodne sulfonylomocznika", "b": "doustne leki na cukrzycę (np. glimepiryd, gliklazyd) – mogą dawać długą, nawracającą hipoglikemię.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1305}, {"c": 6, "ctx": "Słowniczek – Leki i przekazanie", "k": "Pojęcie", "f": "TXA – kwas traneksamowy", "b": "lek hamujący rozpuszczanie skrzepu; w urazie 1 g i.v. do 3 h od zdarzenia.", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1306}, {"c": 6, "ctx": "Słowniczek – Leki i przekazanie", "k": "Pojęcie", "f": "ATMIST / SBAR", "b": "schematy przekazania pacjenta: ATMIST w urazie (wiek, czas, mechanizm, obrażenia, objawy, leczenie), SBAR w chorobie (sytuacja, tło, ocena, rekomendacja).", "t": "sl", "v": 0, "star": true, "r": 1, "qf": "Które pojęcie pasuje do opisu?", "id": 1307}, {"c": 6, "ctx": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Cullena", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać<\/span>sine zasinienie skóry WOKÓŁ PĘPKA<\/div><div class=\"kv\"><span>Co oznacza<\/span>krew w jamie brzusznej lub za otrzewną: ciężkie (krwotoczne) zapalenie trzustki, pęknięta ciąża pozamaciczna, uraz. Pojawia się po 24–48 h<\/div>", "t": "ob", "v": 0, "star": true, "id": 1308}, {"c": 6, "ctx": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Greya Turnera", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać<\/span>sine zasinienie BOKÓW brzucha / okolic lędźwiowych<\/div><div class=\"kv\"><span>Co oznacza<\/span>krwawienie zaotrzewnowe: ciężkie zapalenie trzustki, pęknięty tętniak aorty brzusznej, uraz nerki<\/div>", "t": "ob", "v": 0, "star": true, "id": 1309}, {"c": 6, "ctx": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw pasa bezpieczeństwa", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać<\/span>pręga/otarcie w miejscu pasa na brzuchu lub klatce po wypadku<\/div><div class=\"kv\"><span>Co oznacza<\/span>duża siła urazu – podejrze
