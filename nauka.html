20z\" fill=\"#ffb300\"/><path d=\"M350,450 Q370,540 392,630 M450,475 Q430,550 408,630\" stroke=\"#fbc02d\" stroke-width=\"4\" fill=\"none\"/><path d=\"M412,372 L412,420 L495,420\" fill=\"none\" stroke=\"#000\" stroke-width=\"2.5\" stroke-dasharray=\"4,3\"/><text x=\"383\" y=\"373\" font-size=\"11\" font-weight=\"700\" fill=\"#6d4c41\" text-anchor=\"end\">Th12<\/text><text x=\"383\" y=\"470\" font-size=\"11\" font-weight=\"700\" fill=\"#6d4c41\" text-anchor=\"end\">L4<\/text><text x=\"300\" y=\"442\" font-size=\"10\" fill=\"#6d4c41\" text-anchor=\"end\">12. żebro<\/text><\/g><polyline points=\"412,370 335,315\" fill=\"none\" stroke=\"#4a148c\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"412\" cy=\"370\" r=\"4.5\" fill=\"#4a148c\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"315\" r=\"2.5\" fill=\"#4a148c\"/><text x=\"20\" y=\"320\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#4a148c\">Śledziona<\/text><text x=\"20\" y=\"336\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">lewa strona, żebra 9–11<\/text><text x=\"20\" y=\"350\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">uraz lewego boku / dolnych żeber<\/text><polyline points=\"470,430 335,405\" fill=\"none\" stroke=\"#4e342e\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"470\" cy=\"430\" r=\"4.5\" fill=\"#4e342e\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"405\" r=\"2.5\" fill=\"#4e342e\"/><text x=\"20\" y=\"410\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#4e342e\">Nerka lewa<\/text><text x=\"20\" y=\"426\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">Th11–L2 (wyżej)<\/text><text x=\"20\" y=\"440\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">pod 11.–12. żebrem<\/text><polyline points=\"483,372 335,465\" fill=\"none\" stroke=\"#ff8f00\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"483\" cy=\"372\" r=\"4.5\" fill=\"#ff8f00\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"465\" r=\"2.5\" fill=\"#ff8f00\"/><text x=\"20\" y=\"470\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#ff8f00\">Nadnercza<\/text><text x=\"20\" y=\"486\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">„czapeczki” na nerkach<\/text><polyline points=\"515,520 335,525\" fill=\"none\" stroke=\"#f9a825\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"515\" cy=\"520\" r=\"4.5\" fill=\"#f9a825\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"525\" r=\"2.5\" fill=\"#f9a825\"/><text x=\"20\" y=\"530\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#f9a825\">Moczowody<\/text><text x=\"20\" y=\"546\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">do pęcherza; kamica –<\/text><text x=\"20\" y=\"560\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">ból promieniuje do pachwiny<\/text><polyline points=\"450,200 335,155\" fill=\"none\" stroke=\"#d81b60\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"450\" cy=\"200\" r=\"4.5\" fill=\"#d81b60\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"155\" r=\"2.5\" fill=\"#d81b60\"/><text x=\"20\" y=\"160\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#d81b60\">Płuca od tyłu<\/text><text x=\"20\" y=\"176\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">sięgają nisko – do ok. Th10<\/text><text x=\"20\" y=\"190\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">osłuchuj pod łopatkami<\/text><polyline points=\"690,380 865,315\" fill=\"none\" stroke=\"#5d2f1c\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"690\" cy=\"380\" r=\"4.5\" fill=\"#5d2f1c\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"315\" r=\"2.5\" fill=\"#5d2f1c\"/><text x=\"1180\" y=\"320\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#5d2f1c\">Wątroba<\/text><text x=\"1180\" y=\"336\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">prawa strona, dolne żebra<\/text><polyline points=\"630,460 865,455\" fill=\"none\" stroke=\"#4e342e\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"630\" cy=\"460\" r=\"4.5\" fill=\"#4e342e\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"455\" r=\"2.5\" fill=\"#4e342e\"/><text x=\"1180\" y=\"460\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#4e342e\">Nerka prawa<\/text><text x=\"1180\" y=\"476\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">Th12–L3 (niżej – wątroba)<\/text><polyline points=\"620,420 865,385\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"620\" cy=\"420\" r=\"4.5\" fill=\"#000\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"385\" r=\"2.5\" fill=\"#000\"/><text x=\"1180\" y=\"390\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#000\">Kąt żebrowo-kręgosłupowy<\/text><text x=\"1180\" y=\"406\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">12. żebro + kręgosłup<\/text><text x=\"1180\" y=\"420\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">tu objaw Goldflama (nerki)<\/text><text x=\"600\" y=\"685\" text-anchor=\"middle\" font-size=\"11\" fill=\"#777\">Uwaga: od tyłu strony się odwracają – lewa strona pacjenta jest po Twojej lewej.<\/text><\/svg>", "oq": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 650\" font-family=\"DejaVu Sans,Arial,sans-serif\"><rect width=\"900\" height=\"650\" fill=\"#fff\"/><text x=\"450\" y=\"28\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#222\">Kwadranty brzucha – co tam leży i co boli<\/text><text x=\"450\" y=\"50\" text-anchor=\"middle\" font-size=\"12\" fill=\"#666\">linie przez pępek: pionowa i pozioma · strony = strony PACJENTA<\/text><rect x=\"60\" y=\"70\" width=\"380\" height=\"260\" rx=\"14\" fill=\"#e3f2fd\" stroke=\"#1565c0\" stroke-width=\"2.5\"/><text x=\"250\" y=\"102\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"800\" fill=\"#1565c0\">PRAWY GÓRNY (PGK)<\/text><text x=\"80\" y=\"132\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">wątroba, pęcherzyk żółciowy<\/text><text x=\"80\" y=\"155\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">dwunastnica, głowa trzustki<\/text><text x=\"80\" y=\"178\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">prawa nerka, zgięcie wątrobowe okrężnicy<\/text><text x=\"80\" y=\"201\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\"><\/text><text x=\"80\" y=\"224\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">Ból: kamica / zapalenie pęcherzyka,<\/text><text x=\"80\" y=\"247\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">zapalenie wątroby, uraz wątroby,<\/text><text x=\"80\" y=\"270\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">wrzód dwunastnicy, kolka nerkowa<\/text><text x=\"80\" y=\"293\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">→ objaw Murphy’ego, Chełmońskiego<\/text><rect x=\"460\" y=\"70\" width=\"380\" height=\"260\" rx=\"14\" fill=\"#f3e5f5\" stroke=\"#6a1b9a\" stroke-width=\"2.5\"/><text x=\"650\" y=\"102\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"800\" fill=\"#6a1b9a\">LEWY GÓRNY (LGK)<\/text><text x=\"480\" y=\"132\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">żołądek, śledziona<\/text><text x=\"480\" y=\"155\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">trzon i ogon trzustki<\/text><text x=\"480\" y=\"178\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">lewa nerka, zgięcie śledzionowe<\/text><text x=\"480\" y=\"201\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\"><\/text><text x=\"480\" y=\"224\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">Ból: uraz / pęknięcie śledziony,<\/text><text x=\"480\" y=\"247\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">zapalenie trzustki, wrzód żołądka,<\/text><text x=\"480\" y=\"270\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">kolka nerkowa; zawał ściany dolnej!<\/text><text x=\"480\" y=\"293\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">→ objaw Kehra (lewy bark)<\/text><rect x=\"60\" y=\"345\" width=\"380\" height=\"260\" rx=\"14\" fill=\"#e8f5e9\" stroke=\"#2e7d32\" stroke-width=\"2.5\"/><text x=\"250\" y=\"377\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"800\" fill=\"#2e7d32\">PRAWY DOLNY (PDK)<\/text><text x=\"80\" y=\"407\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">kątnica, wyrostek robaczkowy<\/text><text x=\"80\" y=\"430\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">prawy jajnik i jajowód<\/text><text x=\"80\" y=\"453\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">prawy moczowód<\/text><text x=\"80\" y=\"476\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\"><\/text><text x=\"80\" y=\"499\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">Ból: zapalenie wyrostka,<\/text><text x=\"80\" y=\"522\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">ciąża pozamaciczna, skręt / torbiel<\/text><text x=\"80\" y=\"545\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">jajnika, kamica moczowodowa<\/text><text x=\"80\" y=\"568\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">→ McBurney, Blumberg, Rovsing<\/text><rect x=\"460\" y=\"345\" width=\"380\" height=\"260\" rx=\"14\" fill=\"#fff3e0\" stroke=\"#e65100\" stroke-width=\"2.5\"/><text x=\"650\" y=\"377\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"800\" fill=\"#e65100\">LEWY DOLNY (LDK)<\/text><text x=\"480\" y=\"407\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">esica, zstępnica<\/text><text x=\"480\" y=\"430\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">lewy jajnik i jajowód<\/text><text x=\"480\" y=\"453\" font-size=\"14.5\" font-weight=\"700\" fill=\"#222\">lewy moczowód<\/text><text x=\"480\" y=\"476\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\"><\/text><text x=\"480\" y=\"499\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">Ból: zapalenie uchyłków esicy,<\/text><text x=\"480\" y=\"522\" font-size=\"14.5\" font-weight=\"400\" fill=\"#444\">ciąża pozamaciczna, skręt jajn  let b=c.b; const re=new RegExp(c.f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); b=b.replace(re,'<span class="hl">___</span>');
 return {q:`<div class="ctx">${esc(c.ctx)}</div>${c.qf?esc(c.qf):c.r?`Który lek – <b>${esc(c.k.toLowerCase())}</b>:`:`Co pasuje do opisu? <span class="mut">(${esc(c.k)})</span>`}<div class="back">${b}</div>`,opts:shuffle([c,...dis].map(x=>({t:esc(x.f),ok:x===c}))),c};

 ()=>{const w=P([12,15,18,22,25,30,35]);const v=40+Math.min(Math.max(w-10,0),10)*2+Math.max(w-20,0);return {w:'4-2-1: 4 ml/kg/h za pierwsze 10 kg, 2 za kolejne 10, 1 za każdy kg powyżej 20',q:`Dziecko ${w} kg. Płyny podtrzymujące (ml/h)?`,a:v,u:'ml/h',s:[`pierwsze 10 kg: 40 ml/h`,`kolejne ${Math.min(w-10,10)} kg × 2 = ${Math.min(w-10,10)*2} ml/h`,w>20?`powyżej 20 kg: ${w-20} × 1 = ${w-20} ml/h`:'',`razem <b>${v} ml/h</b>`].filter(Boolean)}},
 // dorośli
 ()=>{const s=P([90,100,110,120,140]);const d=P([50,60,70,80]);const m=d+(s-d)/3;return {w:'MAP = DBP + (SBP − DBP) ÷ 3',q:`RR ${s}/${d} mmHg. Ile wynosi MAP?`,a:m,u:'mmHg',s:[`${s} − ${d} = ${s-d}`,`${s-d} ÷ 3 = ${fmt((s-d)/3)}`,`${d} + ${fmt((s-d)/3)} = <b>${fmt(m)} mmHg</b>`]}},

 ()=>{const kg=P([50,60,70,80,90]);return {w:'Vt = 6–8 ml × kg (licz dla 6 ml/kg)',q:`Pacjent ${kg} kg. Objętość oddechowa przy 6 ml/kg (ml)?`,a:6*kg,u:'ml',s:[`6 × ${kg} = <b>${6*kg} ml</b> (przy 8 ml/kg: ${8*kg} ml)`]}},

 ()=>{const parts=P([[['głowa',9],['przód tułowia',18]],[['obie kończyny górne',18],['przód tułowia',18]],[['jedna kończyna dolna',18],['krocze',1]],[['tył tułowia',18],['jedna kończyna górna',9]],[['głowa',9],['obie kończyny dolne',36]]]);const s=parts.reduce((x,p)=>x+p[1],0);return {w:'reguła dziewiątek: głowa 9 · kończyna górna 9 · przód 18 · tył 18 · kończyna dolna 18 · krocze 1',q:`Dorosły z oparzeniem II st.: ${parts.map(p=>p[0]).join(' + ')}. Ile % powierzchni ciała?`,a:s,u:'%',s:[...parts.map(p=>`${p[0]} = ${p[1]}%`),`razem <b>${s}%</b>`]}},

  h+=`<p class="mut">Zawsze sprawdzaj stężenie ampułki i ChPL przed podaniem.</p>`;app.innerHTML=h;bind0();return}
 h+=`<div class="row"><span class="chip">Wynik: ${cOk}/${cN}</span><label class="chip"><input type="checkbox" id="sw" ${cShowW?'checked':''}> pokaż wzór</label><button id="nc" style="flex:0 0 auto">↻ Nowe</button></div><div class="card"><div class="k">🧮 Zadanie</div><div style="font-size:18px;margin:8px 0">${cq.q}</div>
 ${cShowW||cAns!==null?`<div style="margin:8px 0;padding:8px 10px;border-radius:8px;background:var(--soft)"><span class="mut">📘 Wzór:</span> <b>${cq.w}</b></div>`:''}
 <div class="row"><input type="search" inputmode="decimal" id="ca" placeholder="wynik" style="flex:2" ${cAns!==null?'disabled':''}><span class="chip">${cq.u}</span><button id="ch2" class="on" style="flex:1" ${cAns!==null?'disabled':''}>Sprawdź</button></div>
 ${cAns!==null?`<div class="back">${cAns?`<div class="banner good">✅ <div>Dobrze!<small>Wynik: ${fmt(cq.a)} ${cq.u}</small></div></div>`:`<div class="banner badb">❌ <div>Źle<small>Prawidłowo: ${fmt(cq.a)} ${cq.u} – zobacz rozwiązanie</small></div></div>`}<div class="k">Rozwiązanie krok po kroku</div><ol>${cq.s.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="row"><button class="big on" id="nx2">Następne →</button></div>`:`<p class="mut">Zaokrąglij do 0,1. Zawsze sprawdzaj stężenie ampułki i ChPL.</p>`}</div>`;
 app.innerHTML=h;bind0();app.querySelector('#nc').onclick=newCalc;
 app.querySelector('#sw').onchange=e=>{cShowW=e.target.checked;renderCalc()};
 const go2=()=>{const v=parseFloat(app.querySelector('#ca').value.replace(',','.'));if(isNaN(v))return;cN++;cAns=Math.abs(v-cq.a)<=Math.max(0.051,Math.abs(cq.a)*0.02);if(cAns)cOk++;renderCalc()};
 const b=app.querySelector('#ch2');if(b&&cAns===null){b.onclick=go2;app.querySelector('#ca').onkeydown=e=>{if(e.key==='Enter')go2()}}

// ---------- TRIAGE
const TCOL={G:['🟢','ZIELONY','#2e7d32','#fff','może czekać, chodzi'],Y:['🟡','ŻÓŁTY','#fbc02d','#222','pilny, ale stabilny'],R:['🔴','CZERWONY','#d32f2f','#fff','natychmiast'],B:['⚫','CZARNY','#212121','#fff','zmarły / bez szans']};
function startLadder(hi){return `<div style="margin:4px 0 12px"><div style="display:flex;gap:3px">${['G','Y','R','B'].map(k=>`<div style="flex:${k=='B'?0.8:1};background:${TCOL[k][2]};color:${TCOL[k][3]};border-radius:8px;padding:8px 2px;text-align:center;font-weight:700;font-size:12px;line-height:1.25;${k=='B'?'margin-left:8px;':''}${hi==k?'outline:4px solid var(--ink);outline-offset:1px;':''}">${TCOL[k][1]}<br><span style="font-weight:500">${TCOL[k][4]}</span></div>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px"><span>najmniej pilny</span><span>pilność rośnie →</span><span>osobno: czarny</span></div></div>`}
const NAMES_A=['Mężczyzna ok. 40 lat','Kobieta ok. 30 lat','Starszy mężczyzna ok. 70 lat','Młoda kobieta ok. 20 lat','Mężczyzna ok. 55 lat','Kobieta ok. 65 lat','Nastolatek ok. 15 lat','Kierowca autobusu ok. 50 lat'];
const NAMES_C=['Dziewczynka ok. 4 lat','Chłopiec ok. 6 lat','Chłopiec ok. 2 lat','Dziewczynka ok. 7 lat','Chłopiec ok. 3 lat'];
const INJ=['krwawi z rany głowy','ma zdeformowane podudzie','skarży się na ból brzucha','ma otarcia na rękach','ma ranę uda, krwawienie opanowane','leży przy przewróconym pojeździe','ma ból klatki piersiowej po uderzeniu','jest w szoku, płacze','ma oparzenia przedramion'];
function triCase(){
 const child=Math.random()<0.3, nm=child?P(NAMES_C):P(NAMES_A), inj=P(INJ);
 const r=Math.random(); let f={walk:false,br:true,brAfter:null,rr:0,crt:1.5,radial:true,cmd:true,avpu:'A',pulse:true,rescue:null};
 if(r<0.18){f.walk=true;f.rr=child?R(20,30):R(14,22)}
 else if(r<0.32){f.br=false;f.brAfter=Math.random()<0.5;f.pulse=Math.random()<0.5;f.rescue=Math.random()<0.5}
 else if(r<0.48){f.rr=child?P([10,12,50,55,60]):R(31,40)}
 else if(r<0.62){f.rr=child?R(20,40):R(16,28);f.crt=R(3,5);f.radial=false}
 else if(r<0.74){f.rr=child?R(20,40):R(16,28);f.cmd=false;f.avpu=P(['U','P – nieadekwatnie (prężenia)'])}
 else{f.rr=child?R(20,40):R(14,28)}
 return {child,nm,inj,f,alg:child?'JumpSTART':'START'};
}
function triSolve(c){const f=c.f,s=[];
 if(f.walk){s.push('Chodzi samodzielnie → ZIELONY');return ['G',s]}
 if(!c.child){
  if(!f.br){s.push('Nie oddycha → udrożnij drogi oddechowe');if(f.brAfter){s.push('Po udrożnieniu oddycha → CZERWONY');return ['R',s]}s.push('Nadal nie oddycha → CZARNY');return ['B',s]}
  if(f.rr>30){s.push(`Oddech ${f.rr}/min, czyli > 30 → CZERWONY`);return ['R',s]}
  s.push(`Oddech ${f.rr}/min – w normie`);
  if(!f.radial||f.crt>2){s.push(`Nawrót kapilarny ${fmt(f.crt)} s / brak tętna na promieniowej → CZERWONY`);return ['R',s]}
  s.push('Krążenie: nawrót < 2 s, tętno na promieniowej obecne');
  if(!f.cmd){s.push('Nie spełnia prostych poleceń → CZERWONY');return ['R',s]}
  s.push('Spełnia polecenia → ŻÓŁTY (może czekać)');return ['Y',s];
 }
 if(!f.br){s.push('Nie oddycha → udrożnij drogi oddechowe');if(f.brAfter){s.push('Po udrożnieniu oddycha → CZERWONY');return ['R',s]}
  if(!f.pulse){s.push('Nie oddycha i brak tętna obwodowego → CZARNY');return ['B',s]}
  s.push('Ma tętno → 5 oddechów ratowniczych');if(f.rescue){s.push('Po 5 oddechach oddycha → CZERWONY');return ['R',s]}s.push('Nadal nie oddycha → CZARNY');return ['B',s]}
 if(f.rr<15||f.rr>45){s.push(`Oddech ${f.rr}/min, czyli < 15 lub > 45 → CZERWONY`);return ['R',s]}
 s.push(`Oddech ${f.rr}/min – w normie 15–45`);
 if(!f.radial){s.push('Brak wyczuwalnego tętna obwodowego → CZERWONY');return ['R',s]}
 s.push('Tętno obwodowe obecne');
 if(!f.cmd){s.push(`AVPU: ${f.avpu} → CZERWONY`);return ['R',s]}
 s.push('AVPU: A, V lub P adekwatnie → ŻÓŁTY');return ['Y',s];
}
function triFindings(c){const f=c.f,L=[];
 L.push(['🚶 Chodzi?',f.walk?'TAK – sam podszedł do punktu zbiórki':'NIE – leży, nie może iść']);
 if(f.walk)return L;
 if(!f.br){L.push(['🫁 Oddech','NIE oddycha']);L.push(['↪️ Po udrożnieniu dróg oddechowych',f.brAfter?'zaczyna oddychać':'nadal nie oddycha']);
  if(c.child&&!f.brAfter){L.push(['💓 Tętno obwodowe',f.pulse?'wyczuwalne':'brak']);if(f.pulse)L.push(['🌬️ Po 5 oddechach ratowniczych',f.rescue?'zaczyna oddychać':'nadal nie oddycha'])}
  return L}
 L.push(['🫁 Oddech',`${f.rr}/min`]);
 L.push(['💓 Krążenie',`nawrót kapilarny ${fmt(f.crt)} s, tętno na t. promieniowej ${f.radial?'obecne':'niewyczuwalne'}`]);
 L.push(['🧠 Świadomość',c.child?`AVPU: ${f.cmd?P(['A','V','P – adekwatnie (cofa rękę)']):f.avpu}`:(f.cmd?'spełnia proste polecenia („ściśnij moją rękę”)':'nie spełnia poleceń, mamrocze')]);
 return L;
}
let TR={kind:'start',mode:'nauka',n:10,list:[],i:0,ok:0,ans:null,rev:0};
function newTri(){TR.list=Array.from({length:TR.n},triCase);TR.i=0;TR.ok=0;TR.ans=null;TR.rev=0;renderTri()}
function algBox(){return `<details class="res"${TR.mode=='nauka'?' open':''}><summary><b>📘 Algorytm START (> 8 lat) i JumpSTART (1–8 lat)</b></summary><div style="font-size:14.5px;margin-top:6px"><b>START:</b> chodzi → 🟢 · nie oddycha → udrożnij: oddycha 🔴 / nie ⚫ · oddech > 30 → 🔴 · nawrót > 2 s lub brak tętna na promieniowej → 🔴 · nie spełnia poleceń → 🔴 · reszta 🟡<br><b>JumpSTART:</b> chodzi → 🟢 · nie oddycha → udrożnij: oddycha 🔴; nie → tętno? brak ⚫; jest → 5 oddechów: oddycha 🔴 / nie ⚫ · oddech < 15 lub > 45 → 🔴 · brak tętna obwodowego → 🔴 · AVPU: U lub P nieadekwatnie → 🔴 · reszta 🟡<br><i>W trakcie segregacji tylko: udrożnienie dróg oddechowych, zatamowanie masywnego krwotoku (opaska), ułożenie. Max ok. 30 s na osobę.</i></div></details>`}
function renderTri(){
 let h=triTop();
 if(TR.i>=TR.list.length){const pc=Math.round(100*TR.ok/TR.list.length);h+=`<div class="card"><div class="k">Koniec segregacji</div><div class="front">${TR.ok} / ${TR.list.length} (${pc}%)</div><p>${pc>=90?'Świetnie – segregujesz pewnie! 💪':pc>=70?'Dobrze, jeszcze trochę praktyki.':'Przejrzyj algorytm w trybie Nauka i spróbuj jeszcze raz.'}</p><button class="big on" id="tag">Nowe zdarzenie</button></div>`;app.innerHTML=h;bindTri();return}
 const c=TR.list[TR.i];const [col,steps]=triSolve(c);
 h+=`<div class="row"><span class="chip">Poszkodowany ${TR.i+1} z ${TR.list.length}</span><span class="chip" style="margin-left:auto">✅ ${TR.ok} dobrze</span></div><div class="pbar"><i style="width:${100*(TR.i+(TR.ans?1:0))/TR.list.length}%"></i></div>`;
 if(TR.mode=='nauka')h+=algBox();
 h+=`<div class="card">`;
 if(TR.ans){h+=TR.ans==col?`<div class="banner good">✅ <div>Dobrze – ${TCOL[col][0]} ${TCOL[col][1]}</div></div>`:`<div class="banner badb">❌ <div>Źle – to ${TCOL[col][0]} ${TCOL[col][1]}<small>Ty dałeś: ${TCOL[TR.ans][0]} ${TCOL[TR.ans][1]}</small></div></div>`}
 h+=(TR.mode=='nauka'||TR.ans?startLadder(TR.ans?col:0):'')+`<div class="k">🧍 ${esc(c.nm)} · algorytm ${c.alg}</div><div style="margin:6px 0 10px">${esc(c.inj[0].toUpperCase()+c.inj.slice(1))}.</div>`;
 const F=triFindings(c);
 if(TR.mode=='egz'&&!TR.ans){const shown=F.slice(0,TR.rev+1);h+=shown.map(x=>`<div class="kv"><span>${x[0]}</span>${x[1]}</div>`).join('');if(TR.rev<F.length-1)h+=`<button id="trev" style="width:100%;margin:6px 0">🔎 Zbadaj dalej (${F[TR.rev+1][0]})</button>`}
 else h+=F.map(x=>`<div class="kv"><span>${x[0]}</span>${x[1]}</div>`).join('');
 if(!TR.ans)h+=`<div class="k" style="margin-top:12px">Jaki kolor?</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">${['G','Y','R','B'].map(k=>`<button class="tc big" data-c="${k}" style="background:${TCOL[k][2]};color:${TCOL[k][3]};border:none;font-weight:700">${TCOL[k][1]}</button>`).join('')}</div>`;
 else h+=`<div class="back"><div class="k">Tok rozumowania (${c.alg})</div><ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol></div><div class="row"><button class="big on" id="tnx">${TR.i+1<TR.list.length?'Następny poszkodowany →':'Zobacz wynik →'}</button></div>`;
 h+=`</div>`;if(TR.mode=='egz')h+=algBox();
 app.innerHTML=h;bindTri();
 app.querySelectorAll('.tc').forEach(b=>b.onclick=()=>{TR.ans=b.dataset.c;if(TR.ans==col)TR.ok++;try{navigator.vibrate&&navigator.vibrate(TR.ans==col?30:[60,60,60])}catch(e){}renderTri();window.scrollTo({top:0,behavior:'smooth'})});
 const rv=app.querySelector('#trev');if(rv)rv.onclick=()=>{TR.rev++;renderTri()};

 let h=triTop();
 if(SR.i>=SR.list.length){const pc=Math.round(100*SR.ok/SR.list.length);h+=`<div class="card"><div class="k">Koniec dyżuru</div><div class="front">${SR.ok} / ${SR.list.length} (${pc}%)</div><button class="big on" id="sag">Nowy dyżur</button></div>`;app.innerHTML=h;bindTop();app.querySelector('#sag').onclick=newSor;return}
 const c=SR.list[SR.i];

 else h+=`<div class="back"><div class="k">Dlaczego</div>${esc(c[3])}<div class="mut" style="margin-top:6px">${SCOL[c[2]][0]} ${SCOL[c[2]][1]} = pierwszy kontakt z lekarzem ${SCOL[c[2]][2]}.</div></div><div class="row"><button class="big on" id="snx">${SR.i+1<SR.list.length?'Następny pacjent →':'Zobacz wynik →'}</button></div>`;

}

   if(CS.ans!==null)h+=CS.opts[CS.ans].ok?`<div class="banner good">✅ <div>Dobrze!</div></div>`:`<div class="banner badb">❌ <div>Źle<small>Prawidłowa odpowiedź jest na zielono.</small></div></div>`;
   if(q[4])h+=`<div style="margin:4px 0 10px;padding:10px;border-radius:10px;border-left:5px solid ${CS.q?'#f57c00':'#1976d2'};background:var(--card);box-shadow:0 0 0 1px var(--line)"><div class="k" style="color:${CS.q?'#f57c00':'#1976d2'}">${CS.q?'⏱ Etap '+(CS.q+1)+' – zmiana stanu':'Etap 1 – badanie'}</div>${esc(q[4])}</div>`;h+=`<div class="k">Pytanie ${CS.q+1} z ${nq}</div><div style="font-size:17px;margin:6px 0">${esc(q[0])}</div><div class="opts">${CS.opts.map((o,i)=>`<button data-i="${i}" class="${CS.ans!==null?(o.ok?'ok':(CS.ans==i?'bad':'fade')):''}" ${CS.ans!==null?'disabled':''}>${esc(o.t)}</button>`).join('')}</div>`;
   if(CS.ans!==null)h+=`<div class="back"><div class="k">Wyjaśnienie</div>${esc(q[3])}${q[5]?`<div class="k" style="margin-top:8px">Co robisz po kolei</div><ol>${q[5].map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}${q[6]?`<div class="kv" style="margin-top:6px"><span>Przekazanie pacjenta</span>${esc(q[6])}</div>`:''}</div><div class="row"><button class="big on" id="cq">Dalej →</button></div>`;
  } else if(c.o&&CS.q==c.q.length){task=c.o;h+=`<div class="k">Pytanie ${CS.q+1} z ${nq} – ułóż po kolei</div>`+ordHtml(task)}
  else{h+=`<div class="banner good">🏁 <div>Przypadek zakończony</div></div><div class="row"><button class="big on" id="cnx2">Następny przypadek →</button></div>`}
  h+=`</div>`;
 } else {const o=ORDERS[CS.i%ORDERS.length];task=o;h+=`<div class="row"><span class="chip">Zadanie ${CS.i%ORDERS.length+1} z ${ORDERS.length}</span><button id="cnext" style="flex:0 0 auto;margin-left:auto">Następne →</button></div><div class="card"><div class="front" style="font-size:20px">${esc(o[0])}</div>`+ordHtml(o)+`</div>`}
 app.innerHTML=h;
 app.querySelectorAll('.cf').forEach(b=>b.onclick=()=>{CS.f=b.dataset.f;newCases();window.scrollTo(0,0)});
 app.querySelectorAll('.cm').forEach(b=>b.onclick=()=>{CS.mode=b.dataset.m;CS.i=0;CS.q=0;CS.ans=null;CS.opts=null;CS.ord=[];CS.ordDone=false;renderCases()});
 const nxt=()=>{CS.i++;CS.q=0;CS.ans=null;CS.opts=null;CS.ord=[];CS.ordDone=false;renderCases();window.scrollTo(0,0)};
 const cn=app.querySelector('#cnext');if(cn)cn.onclick=nxt;const c2=app.querySelector('#cnx2');if(c2)c2.onclick=nxt;
 app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{CS.ans=+b.dataset.i;CS.total++;const ok=CS.opts[CS.ans].ok;if(ok)CS.score++;try{navigator.vibrate&&navigator.vibrate(ok?30:[60,60,60])}catch(e){}renderCases()});
 const cq=app.querySelector('#cq');if(cq)cq.onclick=()=>{CS.q++;CS.ans=null;CS.opts=null;renderCases()};
 if(task)bindOrd(task,()=>{if(CS.mode=='case'){CS.q++;CS.ord=[];CS.ordDone=false;renderCases()}else nxt()});
}
let ORDSH=null;
function ordHtml(o){
 if(!CS.ord.length&&!CS.ordDone)ORDSH=shuffle(o[1].map((t,i)=>i));
 const left=ORDSH.filter(i=>!CS.ord.includes(i));
 let h=`<div style="font-size:15px;margin:4px 0 8px">${esc(o[0])}. Dotykaj kroków w kolejności, w jakiej je wykonasz.</div>`;
 h+=`<ol style="padding-left:22px">${CS.ord.map((i,n)=>`<li style="margin:6px 0;padding:8px;border-radius:8px;${CS.ordDone?(i===n?'background:#e3f4e4;color:#1b5e20':'background:#fdecea;color:#b71c1c'):'background:var(--soft)'}">${esc(o[1][i])}${CS.ordDone&&i!==n?` <small>(powinno być: ${esc(o[1][n])})</small>`:''}</li>`).join('')}</ol>`;
 if(!CS.ordDone){h+=`<div class="opts">${left.map(i=>`<button class="ob" data-i="${i}">${esc(o[1][i])}</button>`).join('')}</div>`;if(CS.ord.length)h+=`<button id="oundo" style="margin-top:4px">↩ Cofnij ostatni</button>`}
 else{const ok=CS.ord.every((i,n)=>i===n);h=(ok?`<div class="banner good">✅ <div>Dobra kolejność!</div></div>`:`<div class="banner badb">❌ <div>Kolejność nie całkiem dobra<small>Na czerwono kroki w złym miejscu.</small></div></div>`)+h+`<div class="back"><div class="k">Prawidłowa kolejność</div><ol>${o[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p>${esc(o[2])}</p></div><div class="row"><button class="big on" id="onext">Dalej →</button></div>`}
 return h;
}
function bindOrd(o,next){
 app.querySelectorAll('.ob').forEach(b=>b.onclick=()=>{CS.ord.push(+b.dataset.i);if(CS.ord.length===o[1].length){CS.ordDone=true;CS.total++;const ok=CS.ord.every((i,n)=>i===n);if(ok)CS.score++;try{navigator.vibrate&&navigator.vibrate(ok?30:[60,60,60])}catch(e){}}renderCases()});
 const u=app.querySelector('#oundo');if(u)u.onclick=()=>{CS.ord.pop();renderCases()};
 const n=app.querySelector('#onext');if(n)n.onclick=next;
}

// ---------- ATLAS
function renderAtlas(){
 const T=(rows,head)=>rows.map(r=>`<div class="atr"><div class="att">${r[0]}</div>${r.slice(1).map((c,i)=>`<div class="kv"><span>${head[i+1]}</span>${c}</div>`).join('')}</div>`).join('');
 app.innerHTML=`<p class="help">Kolorowe schematy z podpisami. Pod każdym – co musisz wiedzieć w karetce. Dotknij obrazka, żeby go powiększyć.</p>
 <div class="res"><div class="k">🦴 Kręgosłup</div><div class="zoom">${ATLAS.spine}</div>
 ${T([['<b style="color:#1976d2">Szyjny</b>','7 (C1–C7)','otwory w wyrostkach poprzecznych (tętnica kręgowa), rozdwojony wyrostek kolczysty; C1 atlas (brak trzonu), C2 obrotowy z zębem, C7 wystający – wyczuwasz u podstawy karku','uraz C1–C2 i C5–C7; C3–C5 = nerw przeponowy (uraz powyżej C3 – bezdech)'],
 ['<b style="color:#2e7d32">Piersiowy</b>','12 (Th1–Th12)','dołki żebrowe – łączą się z żebrami; długie wyrostki kolczyste skierowane w dół; mało ruchomy','przejście Th12–L1 – częste złamania; uraz powyżej Th6 – wstrząs neurogenny'],
 ['<b style="color:#f57c00">Lędźwiowy</b>','5 (L1–L5)','największe, masywne trzony; najbardziej obciążony; rdzeń kończy się na L1–L2 (dalej ogon koński)','punkcja lędźwiowa L3–L4 / L4–L5 (linia grzebieni biodrowych = L4)'],
 ['<b style="color:#8e24aa">Kość krzyżowa</b>','5 zrośniętych','tworzy tylną ścianę miednicy','złamanie miednicy – krwotok, pas miednicy'],
 ['<b style="color:#6d4c41">Kość guziczna</b>','3–5 zrośniętych','„ogonek”','ból po upadku na pośladki']],['Odcinek','Kręgi','Jak rozpoznać','W praktyce'])}
 <p class="mut">Krzywizny: lordoza szyjna i lędźwiowa (wygięcie do przodu), kifoza piersiowa i krzyżowa (do tyłu). Razem 33–34 kręgi.</p></div>
 <div class="res"><div class="k">🔎 Budowa kręgu</div><div class="zoom">${ATLAS.vert}</div>
 ${T([['<b style="color:#1976d2">Trzon</b>','przednia, gruba część – dźwiga ciężar ciała; między trzonami krążki międzykręgowe'],['<b style="color:#2e7d32">Łuk</b>','z tyłu trzonu, razem z nim tworzy otwór kręgowy'],['<b>Otwór kręgowy</b>','kanał, w którym biegnie rdzeń kręgowy – przy złamaniu łuku/trzonu grozi uszkodzenie rdzenia'],['<b style="color:#f57c00">Wyrostki poprzeczne</b>','na boki – przyczepy mięśni i więzadeł; w piersiowym łączą się z żebrami'],['<b style="color:#8e24aa">Wyrostek kolczysty</b>','do tyłu – to „guzki” wyczuwalne na plecach; bolesność przy ucisku w linii środkowej = podejrzenie urazu kręgosłupa'],['<b style="color:#00838f">Wyrostki stawowe</b>','łączą sąsiednie kręgi w stawy – umożliwiają ruch']],['Część','Co to jest / po co'])}</div>
 <div class="res"><div class="k">💪 Mięśnie – przód</div><div class="zoom">${ATLAS.mf}</div></div>
 <div class="res"><div class="k">💪 Mięśnie – tył</div><div class="zoom">${ATLAS.mb}</div>
 ${T([['<b>Wstrzyknięcia domięśniowe (i.m.)</b>','naramienny (do 2 ml, 2–3 palce pod wyrostkiem barkowym); boczny obszerny uda – środkowa 1/3 bocznej strony uda (adrenalina, midazolam, do 5 ml); pośladkowy – tylko górny zewnętrzny kwadrant (unikasz nerwu kulszowego)'],['<b>Dodatkowe mięśnie oddechowe</b>','mostkowo-obojczykowo-sutkowe, pochyłe, piersiowe – widoczna praca przy duszności (astma, POChP); u dzieci wciąganie międzyżebrzy'],['<b>Przepona</b>','główny mięsień wdechowy, unerwiony z C3–C5 (nerw przeponowy)'],['<b>Bodziec bólowy do GCS</b>','ucisk mięśnia czworobocznego (centralny) lub łożyska paznokcia (obwodowy)'],['<b>Odruchy ścięgniste</b>','dwugłowy ramienia C5–C6, trójgłowy C7, kolanowy (czworogłowy) L2–L4, skokowy (Achillesa) S1'],['<b>Zespół ciasnoty przedziałów</b>','najczęściej podudzie po złamaniu – ból nieproporcjonalny do urazu, ból przy biernym ruchu palcami, twarda łydka']],['Temat','W praktyce ratownika'])}</div>
 <div class="res"><div class="k">🫁 Gdzie co jest – przód</div><p class="mut">Strony liczysz po stronie <b>pacjenta</b> – z przodu jego prawa jest po Twojej lewej.</p><div class="zoom">${ATLAS.of}</div>
 ${T(ATLAS.org.t[0].rows,ATLAS.org.t[0].head)}</div>
 <div class="res"><div class="k">🔙 Gdzie co jest – tył</div><div class="zoom">${ATLAS.ob}</div><p class="mut">Od tyłu strony się odwracają. Nerki: Th12–L3, prawa niżej. Kąt żebrowo-kręgosłupowy = objaw Goldflama.</p></div>
 <div class="res"><div class="k">➕ Kwadranty brzucha</div><div class="zoom">${ATLAS.oq}</div>
 ${T(ATLAS.org.t[1].rows,ATLAS.org.t[1].head)}<p class="mut">${ATLAS.org.p[0]}</p></div>
 <div class="res"><div class="k">⚡ Ból odniesiony i zasada urazowa</div>
 ${T(ATLAS.org.t[2].rows,ATLAS.org.t[2].head)}<p class="mut">${ATLAS.org.p[1]}</p></div>
 <div class="res"><div class="k">💉 Dostęp doszpikowy – kończyna dolna</div><div class="zoom">${ATLAS.iol}</div>
 ${T([['<b style="color:#d32f2f">1. Proksymalna piszczel</b>','dorośli','2 cm przyśrodkowo od guzowatości piszczeli (ok. 3 cm pod rzepką), płaska powierzchnia przyśrodkowa'],['<b style="color:#1976d2">2. Proksymalna piszczel</b>','dzieci','1–2 cm poniżej i przyśrodkowo od guzowatości (niemowlę ok. 1 palec pod rzepką) – omijasz chrząstkę wzrostową'],['<b style="color:#2e7d32">3. Dystalna piszczel</b>','dorośli i dzieci','dorośli ~3 cm, dzieci 1–2 cm nad kostką przyśrodkową, środek kości'],['<b style="color:#8e24aa">4. Dystalna kość udowa</b>','niemowlęta, małe dzieci','~1 cm nad górnym brzegiem rzepki, 1–2 cm przyśrodkowo, noga wyprostowana']],['Miejsce','Kto','Jak znaleźć'])}</div>
 <div class="res"><div class="k">💉 Dostęp doszpikowy – kość ramienna</div><div class="zoom">${ATLAS.ioa}</div>
 ${T([['<b>Ułożenie</b>','dłoń na pępku, łokieć przy tułowiu (ramię w rotacji wewnętrznej)'],['<b>Punkt</b>','guzek większy kości ramiennej, ~1–2 cm nad szyjką chirurgiczną'],['<b>Kąt</b>','45°, w stronę przeciwległego biodra'],['<b>Igła</b>','zawsze 45 mm (żółta); najszybszy przepływ'],['<b>Po założeniu</b>','unieruchom rękę wzdłuż tułowia']],['','Kość ramienna – dorośli'])}</div>
 <div class="res"><div class="k">🪡 Igły EZ-IO i procedura</div>
 ${T([['<b style="color:#e91e63">15 mm – różowa</b>','3–39 kg'],['<b style="color:#1976d2">25 mm – niebieska</b>','≥ 3 kg – większość dorosłych (piszczel)'],['<b style="color:#f9a825">45 mm – żółta</b>','≥ 40 kg, gruba tkanka, zawsze ramię']],['Igła','Dla kogo'])}
 <p class="mut">Po oparciu igły o kość musi być widoczna min. <b>1 czarna kreska</b> (5 mm) – inaczej igła za krótka.</p>
 ${T([['1','Miejsce, przeciwwskazania, dezynfekcja'],['2','Stabilizuj kończynę (ręka nie pod miejscem wkłucia)'],['3','Prostopadle do kości (ramię 45°), wiertarka bez docisku → utrata oporu'],['4','Usuń mandryn, przedłużacz wypełniony NaCl'],['5','Przytomny: <b>lidokaina 2%</b> 40 mg (2 ml) przez 2 min, odczekaj 60 s; dzieci 0,5 mg/kg'],['6','<b>Płukanie</b> szybko: dorośli 10 ml, dzieci 5 ml NaCl'],['7','Leki i płyny jak i.v., te same dawki; płyny pod ciśnieniem 300 mmHg'],['8','Zabezpiecz, opisz godzinę – max 24 h']],['Krok','Co robisz'])}
 ${T([['<b style="color:#2e7d32">Dobrze założona</b>','stoi stabilnie, płukanie bez oporu, brak obrzęku, czasem aspirujesz szpik'],['<b style="color:#d32f2f">Przeciwwskazania</b>','złamanie tej kości, i.o. w tę kość w ost. 24–48 h, proteza/operacja w okolicy, zakażenie skóry, brak punktów orientacyjnych'],['<b style="color:#f57c00">Powikłania</b>','wynaczynienie → zespół ciasnoty przedziałów, przemieszczenie igły, zapalenie kości, u dzieci uszkodzenie chrząstki wzrostowej'],['<b>ERC 2025</b>','dorośli: najpierw i.v., gdy się nie da – i.o.; dzieci: i.o. wcześnie, gdy żyła nie wychodzi w ~1 min']],['',''])}</div>`;
 app.querySelectorAll('.zoom').forEach(z=>z.onclick=()=>z.classList.toggle('big'));

// ---------- SZUKAJ
let qs='';
function renderSz(){
 app.innerHTML=`<p class="help">Wpisz słowo – przeszukam wszystkie notatki, leki, skróty i wzory.</p><div class="row"><input type="search" id="q" placeholder="Szukaj: np. adrenalina, START, GCS, tachykardia…" value="${esc(qs)}"></div><div id="rs"></div>`;
 const inp=app.querySelector('#q');inp.oninput=()=>{qs=inp.value;list()};inp.focus();list();
 function list(){const t=qs.trim().toLowerCase();const rs=app.querySelector('#rs');if(t.length<2){rs.innerHTML='<p class="mut">Wpisz co najmniej 2 litery. Przeszukuję wszystkie notatki ('+D.cards.length+' kart).</p>';return}
  const r=D.cards.filter(c=>(c.f+' '+strip(c.b)+' '+c.ctx).toLowerCase().includes(t)).slice(0,60);
  rs.innerHTML=r.length?r.map(c=>`<div class="res"><div class="ctx">${c.c}. ${esc(CH[c.c])} · ${esc(c.ctx)}</div><b>${c.star?'⭐ ':''}${esc(c.f)}</b><div style="margin-top:6px">${c.b}</div></div>`).join(''):'<p class="mut">Nic nie znaleziono.</p>'}
}
// ---------- POSTĘP
function renderPost(){
 const all=D.cards.length,kn=D.cards.filter(c=>S[c.id]===2).length,bd=D.cards.filter(c=>S[c.id]===1).length;
 let h=`<p class="help">Ile już umiesz w każdym rozdziale. Stąd też uruchomisz fiszki albo quiz z jednego rozdziału.</p><div class="stats"><div><b>${kn}</b><span class="mut">umiem</span></div><div><b>${bd}</b><span class="mut">do powtórki</span></div><div><b>${all-kn-bd}</b><span class="mut">nowe</span></div></div>`;
 D.chapters.forEach(ch=>{const cs=D.cards.filter(c=>c.c==ch.id);if(!cs.length)return;const k=cs.filter(c=>S[c.id]===2).length;
  h+=`<div class="res"><div class="row" style="margin:0"><b style="flex:3">${ch.id}. ${esc(ch.name)}</b><span class="chip">${k}/${cs.length}</span></div><div class="bar"><i style="width:${100*k/cs.length}%"></i></div><div class="row"><button data-c="${ch.id}" class="go">Fiszki</button><button data-c="${ch.id}" class="goq">Quiz</button></div></div>`});
 h+=`<p class="mut">Postęp zapisuje się w tej przeglądarce na tym urządzeniu.</p><button id="rst">Wyzeruj postęp</button><div id="cf"></div>`;
 app.innerHTML=h;
 app.querySelectorAll('.go').forEach(b=>b.onclick=()=>{filt.ch=b.dataset.c;go('fis')});
 app.querySelectorAll('.goq').forEach(b=>b.onclick=()=>{filt.ch=b.dataset.c;go('quiz')});
 app.querySelector('#rst').onclick=()=>{app.querySelector('#cf').innerHTML='<div class="row"><span class="mut">Na pewno?</span><button class="bad" id="y">Tak, zeruj</button></div>';app.querySelector('#y').onclick=()=>{S={};save();renderPost()}};
}
function go(v){if(v==='quiz'){location.href='egzamin.html#szybki';return}view=v;try{history.replaceState(null,'','#'+v)}catch(e){}document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({fis:newDeck,quiz:newQuiz,tri:triStart,case:newCases,atlas:renderAtlas,leki:renderLeki,licz:newCalc,szukaj:renderSz,post:renderPost})[v]();window.scrollTo(0,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
const V=['fis','quiz','tri','case','atlas','leki','licz','szukaj','post'];go(V.includes(location.hash.slice(1))?location.hash.slice(1):'fis');window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V.includes(h)&&h!==view)go(h)});
</script></body></html>
