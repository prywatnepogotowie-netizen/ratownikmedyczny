const BIG=[{"t": "⭐ Wypadek motocyklowy → odma prężna → częstoskurcz komorowy", "g": "Uraz + kardiologia", "s": "Wezwanie: motocyklista uderzył w barierę, przytomny, „ciężko oddycha”. Wieczór, droga krajowa. Policja zabezpiecza drogę. Mężczyzna ok. 30 lat leży na poboczu w kasku, jęczy, trzyma się za klatkę piersiową. Pierwsze wrażenie: reaguje, oddycha szybko, blady i spocony – pacjent niestabilny.", "q": [["Co robisz najpierw?", ["Odbarczenie odmy prężnej igłą po lewej", "Intubacja", "Bolus 1000 ml krystaloidu", "Kołnierz i deska, potem ocena"], 0, "Brak szmeru + bębenek + wstrząs + poszerzone żyły szyjne = odma prężna. Odbarczasz od razu – to leczenie przyczyny wstrząsu (obturacyjnego).", "Bez masywnego krwotoku zewnętrznego. A: mówi pojedynczymi słowami, drogi drożne. B: oddech 34/min, SpO₂ 86%, lewa strona klatki się nie unosi, brak szmeru po lewej, bębenek przy opukiwaniu, odma podskórna. C: HR 128, RR 82/50, żyły szyjne poszerzone.", ["Stabilizacja głowy ręcznie, zdjęcie kasku we dwóch", "Tlen 15 l/min przez maskę z rezerwuarem", "Odbarczenie igłą (kaniula 14G, min. 5–8 cm) w IV–V przestrzeni międzyżebrowej, linia pachowa przednia/środkowa, po lewej", "Ponowna ocena B i C"], null], ["Rozpoznanie i postępowanie?", ["Częstoskurcz komorowy niestabilny – kardiowersja elektryczna (S/lekarz) w sedacji", "Adenozyna 6 mg", "Metoprolol 5 mg", "Obserwacja – to ból"], 0, "Częstoskurcz z szerokimi QRS + objawy wstrząsu = niestabilny → kardiowersja zsynchronizowana (do 3 prób), potem amiodaron 300 mg. U urazowego myśl o stłuczeniu serca.", "Po odbarczeniu syk powietrza, SpO₂ rośnie do 93%, RR 100/60. W karetce: na monitorze nagle szybki rytm z szerokimi zespołami QRS 190/min. Pacjent przytomny, ale RR spada do 78/45, mówi, że „ciemno mu przed oczami”.", ["Defibrylator w trybie SYNCH, elektrody założone", "Sedacja i analgezja (S/lekarz): midazolam 1–2 mg i.v. (ok. 0,03 mg/kg) lub ketamina 0,5 mg/kg i.v.; na ból fentanyl 50 µg i.v.", "Kardiowersja zsynchronizowana – do 3 wyładowań (VT: zaczynasz od 120–150 J dwufazowo, potem zwiększasz)", "Po skutecznej kardiowersji: amiodaron 300 mg i.v. we wlewie 10–20 min (rozcieńczony w 5% glukozie)", "EKG 12-odprowadzeniowe, wezwanie zespołu S jeśli jesteś P"], null], ["Co teraz?", ["Częstoskurcz komorowy bez tętna – defibrylacja (nie synchronizowana) i RKO", "Kardiowersja zsynchronizowana", "Adrenalina i dalej obserwacja", "Atropina 0,5 mg"], 0, "Brak tętna = NZK w rytmie do defibrylacji (pVT). Wyłącz SYNCH, defibrylacja, RKO 2 min. Po 3. wyładowaniu adrenalina 1 mg + amiodaron 300 mg. Szukaj 4H4T – u tego pacjenta: odma (sprawdź po drugiej stronie / ponownie po lewej), krwotok, tamponada.", "W trakcie przygotowania pacjent traci przytomność, nie oddycha, brak tętna. Na monitorze ten sam szybki rytm z szerokimi QRS.", ["RKO, defibrylacja (wyłączony SYNCH)", "Ocena odmy ponownie – ewentualnie powtórne odbarczenie", "Po 3. wyładowaniu adrenalina 1 mg i amiodaron 300 mg", "4H4T: hipowolemia (krystaloid 250–500 ml bolus, TXA 1 g i.v.), odma, tamponada (USG jeśli jest)", "Po ROSC: transport do centrum urazowego z możliwością kardiologii"], "ATMIST: M 30 l., 21:40, uderzenie motocyklem w barierę ~70 km/h, odma prężna lewostronna odbarczona igłą, VT niestabilny → NZK pVT, ROSC po 2 wyładowaniach, amiodaron 300 mg, TXA 1 g; obecnie SBP 95, SpO₂ 94%."]]}, {"t": "⭐ Dźgnięcie nożem w klatkę piersiową → tamponada", "g": "Uraz", "s": "Wezwanie: bójka przed klubem, „mężczyzna dźgnięty nożem”. Policja w drodze. Czekasz na potwierdzenie od policji, że napastnik zatrzymany (bezpieczeństwo własne). Mężczyzna ok. 25 lat siedzi pod ścianą, rana kłuta 2 cm przy lewym brzegu mostka, IV międzyżebrze. Blady, niespokojny.", "q": [["Co podejrzewasz?", ["Tamponada serca (triada Becka)", "Odma prężna", "Wstrząs krwotoczny z rany", "Atak paniki"], 0, "Hipotensja + poszerzone żyły szyjne + ciche tony = triada Becka. Szmer obustronnie obecny – to nie odma.", "A drożne, mówi. B: oddech 26/min, SpO₂ 95%, szmer pęcherzykowy obustronnie, opukiwanie prawidłowe. C: HR 130, RR 80/55, żyły szyjne wyraźnie poszerzone, tony serca ciche. Rana nie krwawi mocno.", ["Tlen, 2 dostępy dożylne", "Opatrunek na ranę (bez uszczelniania na siłę, obserwuj B)", "TXA 1 g i.v.", "Płyny małymi bolusami (250 ml krystaloidu) tylko do utrzymania ciśnienia (SBP 80–90)", "Natychmiastowy transport do ośrodka z kardiochirurgią/torakochirurgią, zgłoszenie z drogi"], null], ["Jaki to stan i co najważniejsze?", ["PEA w urazie – przyczyną tamponada; RKO, adrenalina, natychmiastowe odbarczenie osierdzia w szpitalu, jedziesz dalej", "Asystolia – kończysz resuscytację", "VF – defibrylacja", "Bradykardia – atropina"], 0, "Aktywność elektryczna bez tętna. W urazowym NZK najważniejsze jest leczenie przyczyny (tamponada, odma, krwotok, hipoksja) – uciskanie klatki ma mniejsze znaczenie. Uprzedź szpital: resuscytacyjna torakotomia/perikardiocenteza.", "W karetce pacjent traci przytomność. Brak tętna na tętnicy szyjnej, na monitorze rytm zatokowy 120/min.", ["RKO, wentylacja tlenem", "Obustronne odbarczenie klatki (wyklucz odmę)", "Adrenalina 1 mg i.v./i.o. co 3–5 min, krystaloid 250–500 ml, TXA 1 g i.v. (jeśli jeszcze nie podany)", "Wiadomość do szpitala: urazowe NZK, podejrzenie tamponady – zespół kardiochirurgiczny na przyjęciu"], "ATMIST: M 25 l., 01:15, rana kłuta przymostkowa lewa IV międzyżebrze, triada Becka, PEA od 01:32, RKO w toku, TXA 1 g."]]}, {"t": "⭐ Dźgnięcie nożem w udo → masywny krwotok", "g": "Uraz", "s": "Wezwanie: mężczyzna zraniony nożem w nogę przy rozładunku, „dużo krwi”. Hala magazynowa, bezpiecznie. Mężczyzna 40 lat leży w kałuży krwi, krew pulsuje z rany na przyśrodkowej stronie uda. Blady, spocony, splątany.", "q": [["Co robisz w pierwszych sekundach (cABCDE)?", ["Opaska uciskowa wysoko na udzie, mocno, zapisz godzinę", "Ocena drożności dróg oddechowych", "Dostęp dożylny i 2 l płynów", "Tlen przez maskę"], 0, "Masywny krwotok zewnętrzny zabija w minutach – „c” przed ABC. Opaska wysoko i ciasno, aż krwawienie ustanie.", "Pierwsze wrażenie: masywny krwotok tętniczy. HR 140, nawrót kapilarny 4 s, nie wyczuwasz tętna na promieniowej.", ["Opaska uciskowa 5–8 cm nad raną (lub wysoko w pachwinie), dokręcić do zatrzymania krwawienia", "Gdy nie działa – druga opaska powyżej", "Godzina założenia na opasce i w karcie", "Potem A, B, C"], null], ["Leki i płyny?", ["TXA 1 g i.v., krystaloid małymi bolusami do SBP 80–90, ochrona przed zimnem, fentanyl na ból", "2 l krystaloidu szybko do normalnego ciśnienia", "Heparyna", "Nic – szpital"], 0, "Wstrząs krwotoczny klasy III–IV: TXA jak najwcześniej (do 3 h), hipotensja permisywna, ogrzewanie (śmiertelna triada). Ból – fentanyl ostrożnie przy hipotensji.", "Krwawienie zatrzymane. SBP 75, HR 135, pacjent zimny. Dostęp: jedno wkłucie 18G.", ["TXA 1 g i.v. w 10 min", "Krystaloid podgrzany, bolusy 250 ml, cel SBP 80–90", "Koc termiczny, ogrzana karetka", "Fentanyl 0,5–1 µg/kg miareczkowany", "Transport do centrum urazowego, zgłoszenie: potrzebna krew"], "ATMIST: M 40 l., 14:05, rana kłuta uda, krwotok tętniczy, opaska od 14:12, TXA 1 g 14:20, SBP 85 po 500 ml."]]}, {"t": "⭐ Ból w klatce → STEMI → migotanie komór w karetce", "g": "Kardiologia", "s": "Wezwanie: mężczyzna 62 lata, od godziny ból w klatce, spocony. Mieszkanie, bezpiecznie. Pacjent siedzi, blady, spocony, trzyma rękę na mostku.", "q": [["Pierwsze leki?", ["ASA 300 mg do rozgryzienia, nitrogliceryna 0,4 mg s.l., heparyna wg protokołu, zgłoszenie do PCI", "Tlen 15 l/min i furosemid", "Metoprolol 5 mg i amiodaron", "Tylko transport do SOR"], 0, "STEMI: ASA od razu; nitrogliceryna przy SBP > 90 i bez zawału prawej komory; heparyna i P2Y12 wg protokołu ośrodka PCI. Tlen nie – SpO₂ 95%.", "A, B: oddech 20/min, SpO₂ 95%. C: HR 96, RR 150/90. EKG: uniesienie ST w V1–V5. Brak uczuleń, nie bierze leków na erekcję.", ["EKG w 10 min i teletransmisja do ośrodka PCI", "ASA 150–300 mg do rozgryzienia", "Nitrogliceryna 0,4 mg s.l. (SBP > 90)", "Heparyna 70–100 j.m./kg i.v. (ok. 5000 j.m.) i P2Y12 wg protokołu ośrodka PCI (tikagrelor 180 mg lub klopidogrel 600 mg), dostęp dożylny", "Elektrody defibrylacyjne założone na czas transportu"], null], ["Co robisz?", ["Natychmiastowa defibrylacja, potem RKO 2 min", "Najpierw 2 min RKO, potem rytm", "Adrenalina 1 mg od razu", "Atropina"], 0, "Obserwowane VF przy założonych elektrodach – defibrylacja natychmiast (możesz do 3 wyładowań pod rząd). Każda sekunda zwłoki zmniejsza szansę.", "W drodze pacjent nagle traci przytomność, drgawki przez kilka sekund, brak oddechu. Monitor: migotanie komór.", ["Zatrzymanie karetki, defibrylacja (pierwsze wyładowanie ≥ 150 J dwufazowo)", "RKO 2 min, ocena rytmu", "Po 3. wyładowaniu adrenalina 1 mg + amiodaron 300 mg"], null], ["Postępowanie po ROSC?", ["Zabezpieczenie dróg oddechowych, tlen do SpO₂ 94–98%, cel SBP > 100, EKG, dalej do PCI", "Wieziesz do najbliższego SOR bez EKG", "Hiperwentylacja 30/min", "Nalokson"], 0, "Po ROSC: ABCDE, wentylacja normalna (EtCO₂ 35–45), SpO₂ 94–98% (bez hiperoksji), unikaj hipotensji, EKG – STEMI → pracownia hemodynamiki.", "Po 2. wyładowaniu wraca rytm zatokowy, tętno 90, pacjent oddycha, GCS 7. RR 85/50, SpO₂ 90%.", ["Drogi oddechowe (SGA/intubacja – S)", "Wentylacja 10/min, EtCO₂ 35–45", "Krystaloid 250–500 ml bolus; gdy SBP < 90 mimo płynów – noradrenalina we wlewie 0,05–0,5 µg/kg/min (S)", "EKG 12-odprowadzeniowe, zgłoszenie do PCI: STEMI po NZK"], "SBAR: M 62 l., STEMI przednia ściana, ból od 9:10, ASA 300 mg, heparyna 5000 j.m., VF 9:52 – 2 defibrylacje, ROSC 9:55, GCS 7, SBP 95 po płynach."]]}, {"t": "⭐ Anafilaksja w restauracji → nawrót objawów", "g": "Alergia", "s": "Wezwanie: kobieta 28 lat, po jedzeniu „puchnie i się dusi”. Restauracja. Kobieta siedzi, obrzęk warg, pokrzywka, świsty, chrypka. Ma przy sobie autostrzykawkę – nie użyła.", "q": [["Pierwszy lek?", ["Adrenalina 0,5 mg i.m. w udo", "Klemastyna 2 mg i.v.", "Hydrokortyzon 200 mg", "Salbutamol jako jedyny lek"], 0, "Anafilaksja z zajęciem A, B i C – adrenalina i.m. natychmiast (może być jej autostrzykawka). Pozycja: z dusznością siedząca, z hipotensją leżąca z uniesionymi nogami.", "A: chrypka, obrzęk warg. B: oddech 28, świsty, SpO₂ 90%. C: HR 130, RR 85/50.", ["Adrenalina 0,5 mg i.m. w przednio-boczną część uda", "Tlen wysoki przepływ", "Dostęp dożylny, krystaloid 500–1000 ml", "Salbutamol 5 mg w nebulizacji przy skurczu oskrzeli"], null], ["Co robisz?", ["Powtarzasz adrenalinę 0,5 mg i.m., płyny; przy braku efektu po 2 dawkach – wlew adrenaliny (S)", "Czekasz na działanie sterydu", "Podajesz drugi lek przeciwhistaminowy", "Odstawiasz tlen"], 0, "Adrenalinę i.m. powtarza się co 5 min. Oporna anafilaksja (po 2 dawkach i.m.) – wlew adrenaliny i.v. (S/lekarz). Pacjentka zostaje w szpitalu na obserwacji (reakcja dwufazowa).", "Po 5 minutach poprawa: RR 100/65, świsty mniejsze. Po 15 minutach w karetce znów narasta chrypka i świsty, RR 85/50.", ["Adrenalina 0,5 mg i.m. ponownie", "Kolejny bolus krystaloidu 500 ml", "Hydrokortyzon 200 mg i klemastyna 2 mg jako leki dodatkowe", "Zgłoszenie do szpitala, obserwacja min. 6–12 h"], "SBAR: K 28 l., anafilaksja po orzechach 19:30, adrenalina 0,5 mg i.m. 19:42 i 20:01, 1000 ml krystaloidu, salbutamol 5 mg; obecnie RR 105/70, SpO₂ 96%."]]}, {"t": "⭐ Nieprzytomny cukrzyk → hipoglikemia → odmowa transportu", "g": "Metaboliczne", "s": "Wezwanie: żona znalazła męża 70 lat „nie do dobudzenia”. Dom. Mężczyzna w łóżku, spocony, chrapie. Żona: cukrzyca, „bierze tabletki i od tygodnia insulinę na noc”.", "q": [["Co podajesz?", ["Glukoza 20% i.v. 0,2 g/kg (ok. 70 ml przy 70 kg)", "Glukoza doustnie", "Nalokson", "Glukagon jako pierwszy, mimo założonego wkłucia"], 0, "Nieprzytomny – nic doustnie. Glukoza dożylnie do dużej żyły, kontrola glikemii po 10–15 min.", "A: chrapanie – udrożniasz. B: 16/min, SpO₂ 95%. C: HR 100, RR 140/80. D: GCS 7, źrenice równe, glikemia 28 mg/dl.", ["Pozycja boczna / udrożnienie", "Dostęp dożylny, glukoza 20% 1 ml/kg", "Kontrola glikemii po 10–15 min, ewentualnie powtórzenie"], null], ["Co jest najważniejsze?", ["Ryzyko nawrotu hipoglikemii przez wiele godzin – namawiasz na transport, a przy odmowie dokumentujesz świadomą odmowę", "Nic – glikemia w normie, odjeżdżasz", "Podajesz insulinę", "Podajesz drugą dawkę glukozy profilaktycznie"], 0, "Pochodne sulfonylomocznika i insulina długodziałająca powodują przedłużoną, nawracającą hipoglikemię. Zalecany transport. Odmowa: pacjent musi być w pełni świadomy, poinformowany o ryzyku; podpis, świadek, instrukcje dla rodziny.", "Po glukozie wybudza się, glikemia 140 mg/dl. Je kanapkę. Mówi: „Nigdzie nie jadę, nic mi nie jest”. Bierze glimepiryd (pochodna sulfonylomocznika) i insulinę długodziałającą.", ["Wyjaśnij ryzyko nawrotu", "Świadoma odmowa na piśmie (KMCR), świadek", "Instrukcje dla żony: kontrola glikemii co 1–2 h, w razie objawów – 112"], "SBAR: M 70 l., hipoglikemia 28 mg/dl, GCS 7 → po glukozie 20% 70 ml GCS 15, glikemia 140; leczony glimepirydem i insuliną – ryzyko nawrotu."]]}, {"t": "⭐ Dziecko z gorączką → drgawki → stan padaczkowy", "g": "Pediatria", "s": "Wezwanie: chłopiec 3 lata, „drgawki, nie oddycha normalnie”. Dom, matka w panice. Chłopiec na podłodze, uogólnione drgawki, sinawy wokół ust. Matka: gorączka od rana, drgawki trwają „chyba 5 minut”.", "q": [["Lek i dawka?", ["Midazolam 5 mg i.m. (lub 0,3 mg/kg podpoliczkowo ≈ 4,5 mg)", "Midazolam 10 mg i.m.", "Diazepam 0,5 mg i.v.", "Paracetamol czopek i czekasz"], 0, "Drgawki ≥ 5 min = leczysz. 13–40 kg: midazolam 5 mg i.m.; alternatywa diazepam doodbytniczo 5 mg (10–15 kg). Tlen, glikemia.", "Masa ok. 15 kg. Drgawki trwają dalej. SpO₂ 88%. Brak wkłucia.", ["Tlen przez maskę, udrożnienie", "Midazolam 5 mg i.m.", "Glikemia", "Czas drgawek – zapisz"], null], ["Co teraz?", ["Druga dawka benzodiazepiny (midazolam 0,15 mg/kg i.v. ≈ 2 mg) i pilny transport", "Kończysz leczenie", "Trzecia, czwarta dawka benzodiazepiny w domu", "Ketoprofen"], 0, "Po 2 dawkach benzodiazepin bez efektu – stan padaczkowy oporny, leki 2. rzutu (lewetyracetam, walproinian) w szpitalu. Pilny transport, uprzedź szpital. Uważaj na depresję oddechu – worek pod ręką.", "Po 5 minutach drgawki nadal trwają. Udało się założyć wkłucie. Glikemia 95 mg/dl.", ["Druga dawka midazolamu: 0,15 mg/kg i.v. (ok. 2 mg u dziecka 15 kg)", "Monitorowanie oddechu, worek samorozprężalny", "Transport do szpitala pediatrycznego, zgłoszenie", "Po ustąpieniu: paracetamol 15 mg/kg (225 mg) na gorączkę"], "SBAR: chłopiec 3 l., 15 kg, gorączka 39,8°C, drgawki od 10:20, midazolam 5 mg i.m. 10:31, 2 mg i.v. 10:37, ustąpiły 10:40, SpO₂ 95% na tlenie."]]}, {"t": "⭐ Upadek starszej osoby na lekach przeciwkrzepliwych → krwiak śródczaszkowy", "g": "Uraz + neurologia", "s": "Wezwanie: kobieta 82 lata przewróciła się w łazience, uderzyła głową, „trochę zamroczona”. Mieszkanie. Pacjentka siedzi, przytomna, guz na czole. Leki: apiksaban (na migotanie przedsionków).", "q": [["Twoja decyzja?", ["Transport do szpitala na TK głowy – uraz głowy u osoby na lekach przeciwkrzepliwych", "Zostaje w domu, bo GCS 15", "Podajesz ASA", "Lód i obserwacja przez rodzinę"], 0, "Leki przeciwkrzepliwe + uraz głowy + niepamięć = wysokie ryzyko krwawienia śródczaszkowego mimo GCS 15. Transport na TK.", "GCS 15, źrenice równe, RR 160/90, HR 88 niemiarowe. Nie pamięta upadku. Chce zostać w domu.", ["Stabilizacja kręgosłupa szyjnego wg NEXUS (wiek, niepamięć)", "Glikemia, EKG", "Zabierz listę leków i godzinę ostatniej dawki", "Transport na TK"], null], ["Co się dzieje?", ["Narastający krwiak z wklinowaniem (anizokoria, triada Cushinga)", "Hipoglikemia", "Udar niedokrwienny – tromboliza", "Zespół abstynencyjny"], 0, "Spadek GCS o ≥ 2 pkt, anizokoria i triada Cushinga (nadciśnienie, bradykardia, nieregularny oddech) = wklinowanie. Szybki transport do neurochirurgii, zgłoszenie, unikaj hipoksji i hipotensji.", "W karetce po 20 minutach: senna, mówi niewyraźnie, GCS 11, prawa źrenica szersza i leniwa, RR 190/100, HR 52, oddech nieregularny.", ["Tlen, SpO₂ > 94%, przygotowanie do zabezpieczenia dróg oddechowych", "Uniesienie tułowia 30°, głowa w osi", "Glikemia", "Zmiana kierunku na szpital z neurochirurgią, zgłoszenie z drogi; informacja o apiksabanie (odwrócenie działania w szpitalu)"], "ATMIST: K 82 l., upadek 15:10, uraz czoła, apiksaban, GCS 15 → 11 o 15:58, anizokoria P > L, RR 190/100, HR 52."]]}, {"t": "⭐ Przedawkowanie opioidów → nalokson → nawrót", "g": "Toksykologia", "s": "Wezwanie: mężczyzna nieprzytomny w toalecie dworca. Ochrona wpuszcza zespół. Na podłodze strzykawka – uwaga na igły. Mężczyzna ok. 30 lat, sinica, oddech rzadki.", "q": [["Kolejność działań?", ["Wentylacja workiem z tlenem, potem nalokson miareczkowany", "Nalokson 2 mg i.v. przed wentylacją", "Intubacja od razu", "Pozycja boczna i czekanie"], 0, "Najpierw tlen i wentylacja (hipoksja zabija). Potem nalokson 0,04–0,4 mg i.v. co 2–3 min aż do wydolnego oddechu (lub 0,4 mg i.m./donosowo).", "Oddech 4/min, SpO₂ 75%, źrenice szpilkowate, HR 60, GCS 3.", ["Udrożnienie, rurka ustno-gardłowa, worek z tlenem 10/min", "Nalokson 0,04–0,1 mg i.v. co 2 min (lub 0,4 mg i.m./i.n.)", "Glikemia, EtCO₂"], null], ["Co się stało i co robisz?", ["Nalokson przestał działać (działa 30–90 min) – znów wentylacja i kolejna dawka naloksonu", "Uczulenie na nalokson", "Hipoglikemia po naloksonie", "Normalny sen – nie budzisz"], 0, "Wiele opioidów (np. metadon, fentanyl) działa dłużej niż nalokson. Dlatego pacjent po naloksonie powinien być obserwowany w szpitalu.", "Oddech wraca do 14/min, pacjent się budzi, jest pobudzony, wymiotuje, chce wyjść. 40 minut później w karetce znów oddech 6/min, senny.", ["Wentylacja workiem", "Ponowne miareczkowanie naloksonu: 0,04–0,1 mg i.v. co 2 min do wydolnego oddechu", "Transport z monitorowaniem; rozważ wlew naloksonu – na godzinę 2/3 dawki, która wybudziła pacjenta (S)"], "SBAR: M ok. 30 l., zatrucie opioidami, nalokson łącznie 0,6 mg i.v., nawrót depresji oddechu po 40 min, obecnie oddech 14/min, SpO₂ 96%."]]}, {"t": "⭐ Astma u nastolatki → cicha klatka → zatrzymanie oddechu", "g": "Oddech", "s": "Wezwanie: dziewczyna 16 lat, astma, „nie może złapać powietrza”. Szkoła. Siedzi pochylona, mówi pojedynczymi słowami, wyczerpana. Inhalator „nie pomaga”.", "q": [["Leczenie?", ["Salbutamol 5 mg + ipratropium 0,5 mg w nebulizacji z tlenem, hydrokortyzon 100–200 mg", "Midazolam na uspokojenie", "Furosemid", "Tylko tlen"], 0, "Ciężka astma: nebulizacja ciągła/powtarzana co 20 min, steryd, przy braku poprawy MgSO₄ 2 g w 20 min.", "Oddech 32/min, SpO₂ 89%, HR 135, świsty na wydechu.", ["Pozycja siedząca, tlen do SpO₂ 94–98%", "Salbutamol 5 mg + ipratropium 0,5 mg neb.", "Hydrokortyzon 100–200 mg i.v.", "MgSO₄ 2 g i.v. w 20 min"], null], ["Co oznacza „cicha klatka” i co robisz?", ["Prawie brak przepływu powietrza – stan przed zatrzymaniem oddechu; adrenalina, wentylacja workiem wolno z długim wydechem, wezwanie S/intubacja", "Poprawa – świsty ustąpiły", "Odma – odbarczasz od razu obustronnie", "Hiperwentylacja – uspokajasz"], 0, "Brak świstów przy wyczerpaniu = zagrożenie życia. Wsparcie oddechu workiem (mała częstość, długi wydech), adrenalina i.m. 0,5 mg rozważ, intubacja przez doświadczonego (S). Przy pogorszeniu po wentylacji – myśl o odmie.", "Mimo leczenia: senna, osłuchowo prawie cisza nad płucami, SpO₂ 82%, HR 60.", ["Wentylacja workiem 8–10/min z długim wydechem", "Adrenalina 0,5 mg i.m. (ciężka astma zagrażająca życiu)", "Wezwanie zespołu S / LPR", "Przygotowanie do NZK"], "SBAR: K 16 l., ciężka astma, salbutamol 3 × 5 mg, ipratropium, hydrokortyzon 200 mg, MgSO₄ 2 g, cicha klatka, SpO₂ 82%, wentylacja workiem."]]}, {"t": "⭐ Kołatanie serca → SVT → adenozyna", "g": "Kardiologia", "s": "Wezwanie: kobieta 35 lat, „serce wali jak szalone” od pół godziny. Biuro. Przytomna, niespokojna, bez duszności.", "q": [["Pierwszy krok?", ["Zmodyfikowany manewr Valsalvy", "Kardiowersja", "Amiodaron 300 mg", "Metoprolol 5 mg"], 0, "Stabilny częstoskurcz z wąskimi QRS → manewry wagalne. Zmodyfikowany Valsalva: parcie 15 s (np. w strzykawkę 10 ml), potem natychmiast leżenie z uniesionymi nogami.", "HR 210 miarowo, RR 110/70, bez bólu w klatce. EKG: wąskie QRS, nie widać załamków P.", ["Nagrywaj EKG", "Zmodyfikowany manewr Valsalvy", "Dostęp dożylny w dużej żyle (zgięcie łokciowe)"], null], ["Lek i technika podania?", ["Adenozyna 6 mg szybki bolus + natychmiast 20 ml NaCl, przy braku efektu 12 mg, potem 18 mg", "Adenozyna 6 mg we wlewie 10 min", "Werapamil 20 mg", "Digoksyna"], 0, "Adenozyna działa kilka sekund – musi dotrzeć do serca szybko. Uprzedź pacjentkę o nieprzyjemnym uczuciu „zatrzymania serca”. Rejestruj EKG.", "Manewr nieskuteczny.", ["Uprzedzenie pacjentki", "Adenozyna 6 mg + 20 ml NaCl szybko", "Przy braku efektu 12 mg, potem 18 mg", "Po konwersji EKG 12-odprowadzeniowe (szukaj fali delta – WPW)"], "SBAR: K 35 l., SVT 210/min, nieskuteczny Valsalva, adenozyna 6 mg bez efektu, 12 mg – konwersja do rytmu zatokowego 78/min."]]}, {"t": "⭐ Poród w domu → noworodek nie oddycha → krwotok poporodowy", "g": "Położnictwo", "s": "Wezwanie: kobieta 30 lat, „rodzi w domu, widać główkę”. Mieszkanie. Poród postępuje szybko, rodzi się chłopiec w 39. tygodniu.", "q": [["Co robisz?", ["Osuszenie, ogrzanie, udrożnienie, 5 oddechów rozprężających, ponowna ocena tętna", "Natychmiast uciskanie klatki 3:1", "Adrenalina 10 µg/kg", "Odsysanie głęboko przez 30 s"], 0, "U noworodka najważniejsza jest wentylacja. Tętno 60–100 i brak oddechu → 5 oddechów rozprężających (2–3 s), potem wentylacja 30/min. Uciśnięcia dopiero przy HR < 60 mimo skutecznej wentylacji.", "Noworodek wiotki, nie oddycha, sinawy, tętno (osłuchowo) ok. 80/min.", ["Osusz, okryj (czapeczka), ciepło", "Głowa w pozycji neutralnej", "5 oddechów rozprężających, potem wentylacja 30/min powietrzem", "Ocena tętna co 30 s; HR < 60 mimo dobrej wentylacji → uciśnięcia 3:1, a gdy nadal < 60 – adrenalina 20 µg/kg i.v./i.o. (10–30 µg/kg)"], null], ["Postępowanie u matki?", ["Masaż macicy, TXA 1 g i.v., płyny, przystawienie dziecka do piersi, szybki transport", "Czekasz, krwawienie samo ustanie", "Tamponada pochwy gazą na siłę", "Heparyna"], 0, "Najczęstsza przyczyna krwotoku poporodowego to atonia macicy – masaż przez powłoki, karmienie piersią (oksytocyna własna), TXA 1 g, płyny i szybki transport na położnictwo.", "Noworodek zaczyna płakać, tętno 130. U matki po urodzeniu łożyska duże krwawienie, macica miękka, RR 90/55, HR 120.", ["Masaż macicy przez powłoki", "TXA 1 g i.v.", "Dwa dostępy, krystaloid 500–1000 ml", "Zachowaj łożysko do oceny", "Transport, zgłoszenie do oddziału położniczego"], "SBAR: poród w domu 6:10, noworodek – 5 oddechów i 60 s wentylacji, Apgar 5 min: 8; matka – krwotok z atonii, TXA 1 g, 1000 ml krystaloidu, RR 100/60."]]}, {"t": "⭐ Niemowlę z biegunką → wstrząs hipowolemiczny → hipoglikemia", "g": "Pediatria", "s": "Wezwanie: dziewczynka 8 miesięcy, „od 2 dni biegunka i wymioty, jest śpiąca”. Mieszkanie, matka sama z dzieckiem. Niemowlę leży apatyczne na kanapie, nie płacze przy rozbieraniu. Pierwsze wrażenie (trójkąt oceny pediatrycznej): wygląd nieprawidłowy, skóra blada i marmurkowa – dziecko w stanie zagrożenia.", "q": [["Jaki to stan i co robisz?", ["Wstrząs hipowolemiczny – dostęp (i.o. jeśli żyła nie wychodzi w ok. 1 min), bolus 10 ml/kg krystaloidu = 80 ml, ponowna ocena", "Nawadnianie doustne i obserwacja", "Bolus 40 ml/kg naraz", "Transport bez dostępu – płyny w szpitalu"], 0, "Tachykardia, CRT > 2 s, zimne kończyny i zaburzona świadomość = wstrząs. ERC 2025: bolusy po 10 ml/kg zbilansowanego krystaloidu, po każdym ponowna ocena; u dziecka we wstrząsie dostęp doszpikowy wcześnie.", "Masa ok. 8 kg (0,5 × 8 mies. + 4). A drożne. B: oddech 50/min, bez wysiłku, SpO₂ 97%. C: HR 185, CRT 5 s, zimne kończyny, ciemiączko zapadnięte, sucha śluzówka, brak mokrej pieluchy od 10 h. D: reaguje tylko na ból.", ["Tlen, monitor, ułożenie na plecach", "Dostęp: żyła albo od razu i.o. (proksymalna piszczel, igła 15 mm)", "Bolus 80 ml krystaloidu (10 ml/kg) w 5–10 min, potem ocena HR, CRT, świadomości", "Zmierz glikemię – zawsze u dziecka z zaburzeniami świadomości"], null], ["Co dalej?", ["Glukoza 10% 2 ml/kg = 16 ml i.v./i.o. i drugi bolus 80 ml krystaloidu", "Glukoza 40% 20 ml", "Tylko kolejne płyny, cukier wyrówna się sam", "Glukagon 1 mg i.m."], 0, "Hipoglikemia u dziecka: 0,2 g/kg = 2 ml/kg glukozy 10%. Stężonej glukozy (20–40%) nie podajesz małym dzieciom – drażni żyły i daje skoki. Wstrząs nadal trwa → kolejny bolus 10 ml/kg z oceną (zwykle do 40 ml/kg w 1. godzinie, uważaj na rzężenia i powiększoną wątrobę).", "Glikemia 38 mg/dl. Po pierwszym bolusie HR 170, CRT 4 s, dziecko nadal senne.", ["Glukoza 10% 16 ml (2 ml/kg) i.v./i.o., kontrola glikemii po 10–15 min", "Drugi bolus 80 ml krystaloidu, ocena po bolusie", "Osłuchaj płuca, sprawdź wątrobę (przeciążenie płynami)", "Ochrona przed wychłodzeniem – kocyk, czapeczka"], null], ["Dokąd i jak transportujesz?", ["Pilnie do SOR pediatrycznego, z matką, ciągłe monitorowanie i ocena co 5 min", "Zostawiasz w domu z zaleceniem picia", "Transport do POZ", "Do najbliższego SOR dla dorosłych bez zgłoszenia"], 0, "Dziecko po wstrząsie i hipoglikemii wymaga dalszego leczenia (elektrolity, gazometria, nawadnianie) – SOR pediatryczny, z wcześniejszym powiadomieniem.", "Po drugim bolusie HR 150, CRT 3 s, dziecko otwiera oczy i płacze. Glikemia 92 mg/dl.", ["Transport do SOR pediatrycznego, powiadomienie", "Monitorowanie HR, SpO₂, CRT, glikemii", "Zapisz czasy i objętości płynów", "Matka w karetce – spokój dziecka"], "SBAR: dziewczynka 8 mies., ok. 8 kg, 2 doby biegunki i wymiotów, wstrząs hipowolemiczny + hipoglikemia 38 mg/dl; i.o. piszczel prawa, 2 × 80 ml krystaloidu, glukoza 10% 16 ml; obecnie HR 150, CRT 3 s, glikemia 92, przytomna."]]}, {"t": "⭐ Dziecko zakrztusiło się → traci przytomność → NZK", "g": "Pediatria", "s": "Wezwanie: chłopiec 2 lata, „zakrztusił się winogronem, nie może oddychać”. Przyjeżdżasz po 6 min. Ojciec trzyma dziecko, uderza je w plecy. Dziecko sine, bez głosu, słabe ruchy klatki.", "q": [["Co robisz?", ["5 uderzeń w okolicę międzyłopatkową, potem 5 uciśnięć nadbrzusza; na przemian", "Zachęcasz do kaszlu i obserwujesz", "Palcem na ślepo wyciągasz ciało obce", "Od razu RKO"], 0, "Kaszel nieskuteczny u przytomnego dziecka > 1 r.ż. → 5 uderzeń w plecy, potem 5 uciśnięć nadbrzusza (u niemowlęcia zamiast nadbrzusza – uciśnięcia klatki). Nigdy nie wyciągasz palcem na ślepo – możesz wepchnąć głębiej.", "Dziecko przytomne, ale kaszel nieskuteczny (bezgłośny), narastająca sinica.", ["Dziecko pochylone do przodu, 5 uderzeń w plecy", "5 uciśnięć nadbrzusza (rękoczyn Heimlicha)", "Powtarzaj, sprawdzając czy ciało obce wypadło", "Przygotuj ssak, laryngoskop i kleszczyki Magilla"], null], ["Następny krok?", ["Na płasko, otwórz usta – usuń ciało obce tylko jeśli je widać, 5 oddechów ratowniczych, potem RKO 15:2", "Kontynuujesz uderzenia w plecy", "Czekasz na powrót oddechu", "Kleszczyki na ślepo"], 0, "Nieprzytomne dziecko z niedrożnością = RKO. Uciśnięcia klatki działają też jak rękoczyn wypychający ciało obce. Przy każdym otwarciu dróg oddechowych zaglądasz do ust. Ratownik medyczny z laryngoskopem może pod kontrolą wzroku usunąć ciało obce kleszczykami Magilla.", "Dziecko wiotczeje, traci przytomność, nie oddycha.", ["Laryngoskop + kleszczyki Magilla pod kontrolą wzroku", "5 oddechów ratowniczych (workiem z tlenem)", "Brak oznak życia → RKO 15:2", "Po każdej serii uciśnięć zajrzyj do ust"], null], ["Leki i dawki?", ["Adrenalina 10 µg/kg = 120 µg i.v./i.o. (1,2 ml roztworu 100 µg/ml) jak najszybciej, co 3–5 min, RKO 15:2", "Atropina 0,5 mg", "Adrenalina 1 mg", "Amiodaron 5 mg/kg"], 0, "Rytm niedefibrylacyjny u dziecka → adrenalina 10 µg/kg (maks. 1 mg) jak najszybciej i co 3–5 min. Przyczyna to niedotlenienie – kluczowa jest skuteczna wentylacja tlenem. Masa: 2 × 2 + 8 = 12 kg.", "Pod laryngoskopem widzisz winogrono w gardle – usuwasz je. Wentylacja skuteczna, ale brak tętna, monitor: bradykardia 40/min z szerokimi QRS → po chwili asystolia. Masa ok. 12 kg.", ["RKO 15:2, tlen 100%", "Dostęp i.o., adrenalina 120 µg (1,2 ml 100 µg/ml)", "Rozważ przyrząd nadgłośniowy / intubację (S)", "Po ROSC: SpO₂ 94–98%, EtCO₂ 35–45 mmHg, glikemia, transport do szpitala pediatrycznego"], "SBAR: chłopiec 2 l., ok. 12 kg, zadławienie winogronem ok. 17:05, utrata przytomności, ciało obce usunięte kleszczykami Magilla 17:14, NZK asystolia, adrenalina 120 µg × 2, ROSC 17:21; wentylowany workiem, SpO₂ 96%."]]}, {"t": "⭐ Anafilaksja u przedszkolaka → stridor → wstrząs → druga dawka", "g": "Pediatria + alergia", "s": "Wezwanie: dziewczynka 4 lata na urodzinach koleżanki, „zjadła ciastko z orzechami, puchnie i kaszle”. Sala zabaw. Dziewczynka siedzi u matki na kolanach, chrypka, kaszel, pokrzywka na całym ciele, obrzęk warg.", "q": [["Pierwszy lek, dawka i droga?", ["Adrenalina i.m. 0,15 mg (0,15 ml roztworu 1 mg/ml) w przednio-boczną część uda", "Klemastyna i.v.", "Hydrokortyzon jako pierwszy", "Adrenalina 0,15 mg i.v. w bolusie"], 0, "Anafilaksja = adrenalina i.m. od razu. Dzieci < 6 lat: 0,15 mg (ERC/EAACI), 6–12 lat 0,3 mg, > 12 lat 0,5 mg. Leki przeciwhistaminowe i steroidy nie ratują życia i nie mogą opóźnić adrenaliny.", "Masa ok. 16 kg (2 × 4 + 8). Głośny stridor wdechowy, oddech 40/min, SpO₂ 91%, HR 160, RR 80/45, CRT 3 s.", ["Adrenalina 0,15 mg i.m. w udo, zanotuj godzinę", "Tlen 15 l/min przez maskę z rezerwuarem", "Pozycja: siedząca (duszność), z mamą – nie kładź na siłę", "Dostęp i.v./i.o."], null], ["Co teraz?", ["Druga dawka adrenaliny 0,15 mg i.m., bolus 10 ml/kg = 160 ml krystaloidu, adrenalina w nebulizacji na stridor", "Czekasz 15 min na efekt", "Steryd i antyhistaminik zamiast adrenaliny", "Intubacja natychmiast przez ratownika bez S"], 0, "Brak poprawy po 5 min → powtórz adrenalinę i.m. Wstrząs → bolus 10 ml/kg z oceną. Stridor: dodatkowo adrenalina w nebulizacji (0,5 ml/kg roztworu 1 mg/ml, maks. 5 ml). Po 2 dawkach bez efektu – anafilaksja oporna, wezwij S/LPR (wlew adrenaliny).", "Po 5 min stridor nadal głośny, RR 70/40, dziecko bledsze i senne.", ["Adrenalina 0,15 mg i.m. – druga dawka", "Krystaloid 160 ml (10 ml/kg) i ocena", "Nebulizacja adrenaliny 5 ml (1 mg/ml) z tlenem", "Wezwij S / LPR, przygotuj sprzęt do trudnych dróg oddechowych"], null], ["Co odpowiadasz?", ["Transport obowiązkowy – możliwa reakcja dwufazowa; obserwacja w szpitalu", "Mogą zostać, objawy minęły", "Wystarczy tabletka przeciwhistaminowa", "Kontrola u alergologa za tydzień"], 0, "Po anafilaksji, szczególnie gdy potrzebne były 2 dawki adrenaliny, obserwacja w szpitalu (ryzyko nawrotu). Przy wypisie: dwa autostrzykawki z adrenaliną i skierowanie do alergologa.", "Po kilku minutach stridor cichnie, RR 92/55, HR 135, dziewczynka płacze. Matka pyta, czy mogą wrócić do domu, „bo już dobrze”.", ["Transport do SOR pediatrycznego", "Monitorowanie, ponowna ocena co 5 min", "Antyhistaminik / steryd dopiero teraz (wg lekarza, nie zamiast adrenaliny)", "Opakowanie ciastka zabierz – ważne dla alergologa"], "SBAR: dziewczynka 4 l., 16 kg, anafilaksja po orzechach 15:30, stridor + wstrząs; adrenalina 0,15 mg i.m. 15:42 i 15:48, adrenalina neb. 5 mg, krystaloid 160 ml; obecnie RR 92/55, bez stridoru."]]}, {"t": "⭐ Nastolatek: wymioty i ból brzucha → kwasica ketonowa → obrzęk mózgu", "g": "Pediatria + metaboliczne", "s": "Wezwanie: chłopiec 14 lat, „wymiotuje od rana, boli go brzuch, dziwnie oddycha”. Dom. Chłopiec szczupły, leży w łóżku, senny. Matka: od kilku tygodni dużo pije, często sika, schudł.", "q": [["Rozpoznanie i płyny?", ["Kwasica ketonowa (pierwsza manifestacja cukrzycy typu 1) – NaCl 0,9% 10 ml/kg = 500 ml w ciągu 30–60 min", "Bolus 20 ml/kg szybko i powtarzać", "Insulina i.v. w karetce", "Glukoza 10%"], 0, "Wielomocz, wielopragnienie, chudnięcie + oddech Kussmaula + aceton = cukrzycowa kwasica ketonowa. Płyny ostrożnie: zbyt szybkie nawadnianie u dzieci zwiększa ryzyko obrzęku mózgu. Bolus 10 ml/kg szybko tylko przy wstrząsie. Insuliny nie podajesz przedszpitalnie (ryzyko hipokaliemii, nagłego spadku osmolalności).", "Masa ok. 50 kg. Oddech głęboki, szybki (Kussmaula), zapach acetonu z ust. HR 125, RR 105/65, CRT 3 s, sucha śluzówka. GCS 14. Glikemia „HI” (> 600 mg/dl).", ["Tlen do SpO₂ 94–98%, monitor EKG (potas – wysokie lub szpiczaste T)", "Dostęp i.v., NaCl 0,9% 500 ml w 30–60 min", "GCS i źrenice co 15 min", "Nic doustnie"], null], ["Co się dzieje?", ["Obrzęk mózgu w kwasicy ketonowej – zwolnij płyny, uniesienie głowy 30°, powiadom szpital (leczenie: mannitol lub hipertoniczny NaCl wg lekarza)", "Hipoglikemia", "Sen po wysiłku", "Zwiększasz tempo płynów"], 0, "Ból głowy, spadek GCS, bradykardia i wzrost ciśnienia (odruch Cushinga) u dziecka z kwasicą = obrzęk mózgu – najgroźniejsze powikłanie. Ogranicz płyny, głowa w osi uniesiona 30°, tlen; leczenie: mannitol 0,5–1 g/kg lub 3% NaCl 2,5–5 ml/kg (zlecenie lekarza).", "W trakcie transportu chłopiec skarży się na silny ból głowy, robi się coraz bardziej senny (GCS 11), HR spada do 60, RR rośnie do 150/90.", ["Zwolnij wlew do minimum", "Głowa w osi, uniesiona o 30°", "Wezwij S / skontaktuj się z lekarzem – leki osmotyczne", "Zabezpiecz drogi oddechowe przy GCS ≤ 8"], "SBAR: chłopiec 14 l., 50 kg, prawdopodobny debiut cukrzycy typu 1, kwasica ketonowa (glikemia > 600, oddech Kussmaula), NaCl 0,9% 500 ml; w transporcie objawy obrzęku mózgu – GCS 11, HR 60, RR 150/90."]]}, {"t": "⭐ Dziecko potrącone przez samochód → krwotok wewnętrzny → narastający uraz głowy", "g": "Pediatria + uraz", "s": "Wezwanie: chłopiec 7 lat potrącony na przejściu, „leży, płacze”. Ulica, policja zabezpiecza ruch. Samochód z wgnieceniem na masce (ok. 40 km/h). Chłopiec leży, płacze, trzyma się za lewy bok.", "q": [["Co podejrzewasz?", ["Uraz śledziony z krwawieniem (objaw Kehra), początek wstrząsu", "Złamanie obojczyka", "Stłuczenie brzucha bez znaczenia", "Atak paniki"], 0, "Uraz lewego podżebrza + ból lewego barku (objaw Kehra) + tachykardia i wydłużony CRT = krwawienie ze śledziony. U dzieci ciśnienie długo się trzyma – spadek RR to późny objaw.", "Masa ok. 28 kg (3 × 7 + 7). A drożne. B: 30/min, SpO₂ 95%. C: HR 145, RR 92/60, CRT 3 s, otarcia i zasinienie lewego podżebrza, brzuch bolesny po lewej. Boli go lewy bark. D: GCS 15, krwiak na potylicy.", ["Stabilizacja kręgosłupa szyjnego (ręcznie / kołnierz), ochrona przed wychłodzeniem", "Tlen, 2 dostępy (i.o. jeśli trudno)", "TXA 15 mg/kg = 420 mg i.v. w 10 min (maks. 1 g)", "Ból: fentanyl donosowo 1,5 µg/kg ≈ 40 µg"], null], ["Płyny?", ["Bolus 10 ml/kg = 280 ml (najlepiej krew; w ZRM krystaloid) i ponowna ocena, cel: ciśnienie dolnej granicy normy", "2 litry krystaloidu", "Bez płynów – hipotensja permisywna jak u dorosłego bez limitu", "Koloidy"], 0, "Dziecko we wstrząsie krwotocznym: bolusy 10 ml/kg z ponowną oceną, celem jest perfuzja (świadomość, CRT, tętno), nie pełna norma. Dolna granica SBP u dziecka: 70 + 2 × wiek = 84 mmHg.", "W karetce: RR 78/45, HR 165, CRT 4 s.", ["Krystaloid 280 ml, ocena po bolusie", "Pilny transport do centrum urazowego dla dzieci, zgłoszenie", "Ocena co 5 min"], null], ["Co to oznacza i co robisz?", ["Krwiak śródczaszkowy z wgłobieniem (GCS ok. 6, anizokoria, Cushing) – zabezpiecz drogi oddechowe (S/LPR), normowentylacja EtCO₂ 35–40, unieś głowę w osi 30°", "Hipoglikemia – glukoza", "Drgawki – midazolam", "Zatrzymujesz płyny i czekasz"], 0, "Spadek GCS, anizokoria i triada Cushinga (bradykardia, nadciśnienie, zaburzenia oddechu) = wgłobienie. Ochrona mózgu: tlen, unikaj hipotensji i hipoksji, normowentylacja; krótkotrwała hiperwentylacja (EtCO₂ 30–35) tylko przy objawach wgłobienia. Ośrodek z neurochirurgią dziecięcą.", "Po 10 min chłopiec przestaje odpowiadać na pytania, otwiera oczy tylko na ból, wyprostne ruchy kończyn, lewa źrenica szersza i wolno reaguje, HR 70, RR 140/85.", ["Wezwij S / LPR – intubacja", "Głowa w osi uniesiona o 30° (jeśli nie ma wstrząsu)", "EtCO₂ 35–40 mmHg (przy wgłobieniu krótko 30–35)", "Glikemia, temperatura, zmiana celu transportu na neurochirurgię dziecięcą"], "ATMIST: chłopiec 7 l., ~28 kg, 16:20, potrącenie przez samochód ok. 40 km/h; podejrzenie urazu śledziony i krwiaka śródczaszkowego; HR 70, RR 140/85, GCS 6 (E2V2M2), lewa źrenica szersza; TXA 420 mg, krystaloid 280 ml, fentanyl 40 µg i.n."]]}, {"t": "⭐ Niemowlę z infekcją → bezdechy → bradykardia → NZK", "g": "Pediatria", "s": "Wezwanie: chłopiec 2 miesiące, „przestaje oddychać, robi się siny”. Dom. Matka: od 3 dni katar i kaszel, od wczoraj słabo je. Niemowlę na rękach ojca, szare, wiotkie.", "q": [["Co robisz?", ["Pozycja neutralna (wałek pod barki), odessanie nosa, wentylacja workiem z tlenem", "Tylko tlen biernie przez maskę", "Uciskanie klatki", "Salbutamol w nebulizacji jako pierwsze"], 0, "Bezdechy u małego niemowlęcia z infekcją (zapalenie oskrzelików, krztusiec) prowadzą do hipoksji. Niewydolny oddech = wspomagaj workiem. U niemowlęcia głowa w pozycji neutralnej, a nos odsysasz – niemowlę oddycha głównie nosem.", "Masa ok. 5 kg. Oddech nieregularny z przerwami 15–20 s, SpO₂ 78%. HR 90, CRT 4 s. Przy osłuchiwaniu trzeszczenia i świsty obustronnie.", ["Odessanie nosa", "Głowa neutralnie, wałek pod barki", "Wentylacja workiem 25–30/min z tlenem", "Monitor EKG i SpO₂"], null], ["Co teraz?", ["Uciskanie klatki 15:2 techniką dwóch kciuków obejmujących klatkę – bradykardia < 60 z cechami złej perfuzji mimo wentylacji", "Atropina i czekanie", "Kontynuujesz tylko wentylację", "Defibrylacja 4 J/kg"], 0, "U dziecka tętno < 60/min z objawami złej perfuzji mimo skutecznej wentylacji traktujesz jak NZK. Niemowlę: dwa kciuki, 1/3 głębokości klatki (ok. 4 cm), 100–120/min, 15:2.", "Mimo wentylacji tętno spada do 50/min, dziecko bez reakcji, skóra szara, CRT 6 s.", ["RKO 15:2, dwa kciuki", "Tlen 100%", "Dostęp i.o. (piszczel, igła 15 mm)", "Adrenalina 10 µg/kg = 50 µg = 0,5 ml roztworu 100 µg/ml, co 3–5 min"], null], ["Postępowanie po ROSC?", ["Dalsza wentylacja, SpO₂ 94–98%, glikemia, ochrona przed wychłodzeniem, transport do szpitala z OIT dziecięcym", "Wyłączasz tlen", "Kończysz wentylację, bo jest tętno", "Bolus 40 ml/kg"], 0, "Po ROSC unikaj hipoksji i hiperoksji (SpO₂ 94–98%), normowentylacja, kontrola glikemii i temperatury. Niemowlęta szybko się wychładzają.", "Po adrenalinie i 2 min RKO tętno 140/min, SpO₂ 92% przy wentylacji.", ["Wentylacja workiem lub przyrząd nadgłośniowy (S)", "Glikemia", "Kocyk, czapeczka", "Transport do OIT dziecięcego, powiadomienie"], "SBAR: chłopiec 2 mies., 5 kg, infekcja dróg oddechowych, bezdechy → bradykardia 50 → RKO 15:2, adrenalina 50 µg i.o., ROSC po 4 min; wentylowany, SpO₂ 95%, HR 140."]]}, {"t": "⭐ Oparzenie wrzątkiem u dziecka → ból → wstrząs oparzeniowy", "g": "Pediatria + uraz", "s": "Wezwanie: dziewczynka 3 lata, „ściągnęła na siebie czajnik z wrzątkiem”. Kuchnia. Matka polewa dziecko zimną wodą pod prysznicem już 15 min. Dziewczynka krzyczy, drży z zimna.", "q": [["Jaki odsetek powierzchni i co z chłodzeniem?", ["Ok. 13–15% (przód tułowia u dziecka ~18%, część ramienia); chłodzenie zakończ – ryzyko hipotermii, okryj", "1% – chłodzić dalej lodem", "50%", "Nie da się ocenić"], 0, "U dzieci reguła dziewiątek jest zmodyfikowana (głowa większa – 18%). Pomaga reguła dłoni: dłoń z palcami dziecka = ok. 1% jego powierzchni. Chłodzenie letnią wodą ok. 20 min, nie lodem; przy temperaturze < 36°C przerwij i ogrzewaj.", "Masa ok. 14 kg. Oparzenia: przód klatki i brzucha, prawe ramię i przedramię – pęcherze, skóra różowa i biała. Twarz i drogi oddechowe bez zmian. HR 160, SpO₂ 98%. Temp. 35,6°C.", ["Przerwij chłodzenie, okryj suchym kocem / folią", "Opatrunek: folia spożywcza na rany (nie owijaj ciasno) lub hydrożelowy", "Dostęp i.v./i.o. poza oparzeniem", "Oceń drogi oddechowe – twarz, chrypka, osmalenia"], null], ["Leczenie bólu?", ["Fentanyl donosowo 1,5 µg/kg ≈ 20 µg (lub morfina 0,1 mg/kg i.v.); ketamina 1 mg/kg i.v. wg lekarza/S", "Paracetamol czopek i nic więcej", "Diazepam", "Bez leków – nie maskujemy objawów"], 0, "Oparzenie to jeden z najsilniej bolesnych urazów. Donosowy fentanyl działa szybko i nie wymaga wkłucia (atomizer MAD, max 1 ml na nozdrze).", "Dziewczynka bardzo cierpi, nie da się jej zbadać.", ["Fentanyl 20 µg i.n.", "Ocena bólu skalą dla dzieci (np. FLACC)", "Spokój, mama przy dziecku"], null], ["Płyny?", ["Oparzenie > 10% u dziecka → wlew krystaloidu ok. 125 ml/h (dziecko ≤ 5 lat), ocena perfuzji", "Bez płynów", "2 litry w bolusie", "Glukoza 5%"], 0, "W transporcie: dzieci ≤ 5 lat ok. 125 ml/h, 6–13 lat 250 ml/h (ATLS). Formuła Parkland (dzieci 3 ml × kg × %TBSA na dobę, połowa w 8 h od urazu) – liczy się w szpitalu. Pamiętaj o glukozie u małych dzieci.", "Transport 50 min do ośrodka leczenia oparzeń. HR 165, CRT 3 s.", ["Krystaloid ok. 125 ml/h", "Glikemia", "Ochrona przed wychłodzeniem", "Oceń mechanizm – czy pasuje do historii (przemoc wobec dziecka: oparzenia „skarpetkowe”, równe brzegi)"], "SBAR: dziewczynka 3 l., 14 kg, oparzenie wrzątkiem ok. 14% (przód tułowia, prawe ramię), II stopień, drogi oddechowe bez zmian; chłodzona 15 min, temp. 35,6°C; fentanyl 20 µg i.n., krystaloid 125 ml/h."]]}, {"t": "⭐ „Grypa” całej rodziny → zatrucie tlenkiem węgla → ciężarna i dziecko", "g": "Toksykologia + kilku pacjentów", "s": "Wezwanie: kobieta 29 lat, w 30. tygodniu ciąży, „ból głowy i wymioty, dziecko też wymiotuje”. Zima, stara kamienica. W mieszkaniu ciepło, łazienka z piecykiem gazowym. Ojciec ospały, kobieta blada, chłopiec 5 lat śpi na kanapie, trudno go dobudzić.", "q": [["Co najpierw?", ["Bezpieczeństwo: wyjście wszystkich na zewnątrz / przewietrzenie, wezwanie straży, czujnik CO – podejrzenie zatrucia tlenkiem węgla", "Badanie ABCDE w mieszkaniu", "Tlen tylko u najciężej chorego", "Uspokajasz – to grypa żołądkowa"], 0, "Kilka osób z jednego mieszkania z bólem głowy i wymiotami zimą = tlenek węgla, dopóki nie wykluczysz. Najpierw bezpieczeństwo zespołu (zasada 1), potem pacjenci. Pulsoksymetr pokazuje fałszywie wysoką saturację (karboksyhemoglobina).", "Kobieta: ból głowy, nudności, HR 110, SpO₂ 99%. Chłopiec: GCS 12, wymioty, SpO₂ 99%. Ojciec: zawroty głowy, chwiejny chód.", ["Wyprowadź wszystkich, wyłącz piecyk, otwórz okna", "Wezwij straż pożarną (pomiar CO) i drugi zespół", "Nie ufaj SpO₂ – CO-oksymetr (SpCO), jeśli jest", "Segregacja: chłopiec (zaburzenia świadomości) i ciężarna – najpilniejsi"], null], ["Leczenie?", ["Tlen 100% przez maskę z rezerwuarem 15 l/min u wszystkich, monitor EKG; chłopca i ciężarną zgłoś do ośrodka z komorą hiperbaryczną", "Tlen 2 l/min przez wąsy", "Tlen tylko gdy SpO₂ < 94%", "Nalokson"], 0, "Tlen 100% skraca półtrwanie karboksyhemoglobiny z ok. 4–5 h do ok. 1 h. Wskazania do tlenoterapii hiperbarycznej m.in.: utrata przytomności / zaburzenia neurologiczne, ciąża, objawy niedokrwienia serca, wysoka COHb. Płód jest szczególnie wrażliwy.", "Dysponujesz jedną karetką do czasu przyjazdu drugiej. SpCO: chłopiec 25%, kobieta 18%, ojciec 15%.", ["Tlen 15 l/min maska z rezerwuarem – wszyscy", "EKG (niedokrwienie), glikemia u chłopca", "Ciężarna na lewym boku", "Kontakt z ośrodkiem leczenia hiperbarycznego / toksykologią"], null], ["Lek i dawka?", ["Midazolam 5 mg i.m. (13–40 kg) lub 0,2 mg/kg ≈ 3,5 mg i.n.; kontynuuj tlen 100%", "Diazepam 20 mg i.v.", "Fenytoina", "Brak leczenia, drgawki same ustąpią"], 0, "Drgawki ≥ 5 min → benzodiazepina. Przyczyną jest niedotlenienie mózgu przez CO – tlen 100% dalej, glikemia.", "Chłopiec w karetce ma uogólnione drgawki trwające 5 min. Masa ok. 18 kg.", ["Midazolam 5 mg i.m.", "Glikemia", "Ochrona dróg oddechowych, ssak", "Pilny transport, powiadomienie"], "SBAR: 3 pacjentów z jednego mieszkania, zatrucie CO (piecyk gazowy); chłopiec 5 l. SpCO 25%, GCS 12, drgawki – midazolam 5 mg i.m.; kobieta 29 l., 30 tydz. ciąży, SpCO 18%; wszyscy tlen 100% od 19:10."]]}, {"t": "⭐ Dziecko wpadło do stawu → NZK w hipotermii", "g": "Pediatria + środowiskowe", "s": "Wezwanie: chłopiec ok. 6 lat wpadł pod lód na stawie, „wyciągnęli go, nie oddycha”. Staw w parku, styczeń. Świadkowie wyciągnęli dziecko po ok. 10 min. Leży na brzegu, mokre, sine.", "q": [["Jak zaczynasz resuscytację?", ["5 oddechów ratowniczych, potem RKO 15:2 – w utonięciu przyczyną jest niedotlenienie", "Najpierw usuwanie wody z płuc (ułożenie głową w dół)", "Od razu defibrylacja", "Uciskanie bez wentylacji"], 0, "Utonięcie = NZK z hipoksji. Zaczynasz od 5 oddechów ratowniczych (tlen jak najszybciej), potem 15:2 u dziecka. Nie próbujesz „wylewać wody” – opóźnia RKO i grozi aspiracją.", "Masa ok. 22 kg. Brak oddechu, brak oznak życia.", ["Przenieś w osłonięte miejsce, zdejmij mokre ubranie, folia/koce", "5 oddechów ratowniczych z tlenem, RKO 15:2", "Monitor / AED", "Termometr głęboki (przełykowy lub nadbagnetowy) – oceń hipotermię"], null], ["Defibrylacja i leki w głębokiej hipotermii?", ["Do 3 defibrylacji 4 J/kg (ok. 90 J); jeśli < 30°C nie podawaj leków; RKO i ogrzewanie, transport do ośrodka ECLS (krążenie pozaustrojowe)", "Defibrylacja bez limitu co 2 min", "Adrenalina co 3 min jak w normotermii", "Kończysz – dziecko było 10 min pod wodą"], 0, "Hipotermia < 30°C: maksymalnie 3 próby defibrylacji, leki wstrzymane do > 30°C; 30–35°C: odstępy między dawkami adrenaliny podwojone. Zimna woda chroni mózg – dzieci przeżywały długie NZK w hipotermii. Nie kończysz resuscytacji przed ogrzaniem (jeśli brak innych oczywistych przeciwwskazań).", "Temperatura głęboka 27°C. Monitor: VF.", ["Defibrylacja 4 J/kg (3 próby)", "RKO ciągła – rozważ urządzenie mechaniczne (jeśli dostosowane do dziecka)", "Ogrzewanie bierne, ciepłe płyny i.o.", "Zgłoszenie do ośrodka z ECMO / ECLS, LPR"], "SBAR: chłopiec ~6 l., 22 kg, utonięcie pod lodem (ok. 10 min pod wodą) 14:05, NZK, VF, temp. 27°C; 3 defibrylacje 90 J bez efektu, RKO ciągła od 14:20, leki wstrzymane; transport do ośrodka ECLS."]]}, {"t": "⭐ Gorączka i wysypka u dziecka → wstrząs septyczny (meningokoki)", "g": "Pediatria + sepsa", "s": "Wezwanie: dziewczynka 4 lata, „gorączka od rana, teraz nie chce wstać, ma kropki na nogach”. Dom. Dziewczynka leży na łóżku, apatyczna, skóra marmurkowa, na udach i brzuchu drobne fioletowe wybroczyny.", "q": [["Rozpoznanie i co najważniejsze?", ["Podejrzenie sepsy meningokokowej z wstrząsem – tlen, dostęp (i.o.), bolus 10 ml/kg = 160 ml krystaloidu, pilny transport z wyprzedzeniem", "Wysypka alergiczna – antyhistaminik", "Zbijasz gorączkę i obserwujesz w domu", "Ospa wietrzna"], 0, "Gorączka + wysypka niebledniejąca + objawy wstrząsu = sepsa meningokokowa (stan bezpośredniego zagrożenia życia, może się pogorszyć w godzinach). Antybiotyk jak najszybciej – w szpitalu, a jeśli zespół ma ceftriakson w wyposażeniu i zlecenie lekarza: 100 mg/kg i.v. (maks. 4 g), bez opóźniania transportu.", "Masa ok. 16 kg. Temp. 39,8°C, HR 175, CRT 5 s, zimne dłonie i stopy, RR 85/50, oddech 40/min, SpO₂ 95%. Wybroczyny nie bledną pod naciśniętą szklanką.", ["Maska chirurgiczna dla zespołu (zakażenie kropelkowe)", "Tlen, monitor", "Dostęp i.o., bolus 160 ml (10 ml/kg), ocena po bolusie", "Glikemia, temperatura"], null], ["Co teraz?", ["Wstrząs oporny na płyny – kolejny bolus z oceną (do 40–60 ml/kg), wezwij S / lekarza: lek wazoaktywny (adrenalina/noradrenalina we wlewie)", "Kończysz płyny, wystarczy", "Furosemid", "Paracetamol i.v. jako leczenie wstrząsu"], 0, "Po 40–60 ml/kg bez poprawy dziecko potrzebuje leków wazoaktywnych (zlecenie lekarza, wlew przez pompę). Obserwuj przeciążenie płynami (rzężenia, powiększona wątroba). Uprzedź szpital – zespół OIT dziecięcego na przyjęciu.", "Po 2 bolusach (320 ml) HR 170, CRT 5 s, RR 70/40, dziewczynka coraz bardziej senna.", ["Trzeci bolus 160 ml z oceną", "S / LPR – wlew leku wazoaktywnego", "Powiadomienie szpitala", "Po akcji: zgłoś ekspozycję – profilaktyka antybiotykowa dla osób z bliskim kontaktem z wydzieliną"], "SBAR: dziewczynka 4 l., 16 kg, gorączka 39,8°C, wybroczyny niebledniejące, wstrząs septyczny; i.o., krystaloid 3 × 160 ml, HR 170, RR 70/40, CRT 5 s, GCS 12; podejrzenie meningokoków – zespół w maskach."]]}, {"t": "⭐ Ciężarna: ból głowy → rzucawka → zatrucie magnezem", "g": "Położnictwo + neurologia", "s": "Wezwanie: kobieta 32 lata, 34. tydzień ciąży, „bardzo boli ją głowa i widzi mroczki”. Mieszkanie. Pacjentka siedzi, obrzęki twarzy i nóg, niespokojna.", "q": [["Rozpoznanie i lek?", ["Rzucawka – siarczan magnezu 4 g i.v. w 15–20 min (np. 20% 20 ml), ułożenie na lewym boku, tlen", "Diazepam jako pierwszy wybór, dawka jak w padaczce", "Nifedypina p.o. w trakcie drgawek", "Tylko obserwacja – drgawki minęły"], 0, "Nadciśnienie w ciąży + ból głowy, mroczki, ból w nadbrzuszu (ciężki stan przedrzucawkowy) + drgawki = rzucawka. Lek z wyboru: MgSO₄ 4 g i.v. powoli, potem wlew 1–2 g/h. Benzodiazepinę dajesz tylko, gdy magnezu nie ma albo drgawki się powtarzają mimo magnezu.", "RR 172/112, HR 98, ból w nadbrzuszu po prawej, mroczki. Glikemia 96. W trakcie badania – uogólnione drgawki toniczno-kloniczne.", ["Ochrona przed urazem, lewy bok (ucisk macicy na żyłę główną dolną)", "Tlen 15 l/min, ssak", "MgSO₄ 4 g i.v. w 15–20 min", "Powiadom szpital z oddziałem perinatologii III stopnia"], null], ["Ciśnienie – co robisz?", ["Obniżasz ostrożnie (lekarz: urapidyl lub labetalol i.v.) do ok. < 160/110 – nie gwałtownie, bo spadnie przepływ łożyskowy", "Nic – ciśnienie nie ma znaczenia", "Nitrogliceryna s.l. 3 dawki szybko", "Furosemid 40 mg"], 0, "Ciśnienie ≥ 160/110 w ciąży leczysz (ryzyko udaru krwotocznego), ale łagodnie, bo zbyt duży spadek zagraża dziecku. Leki i dawki ustala lekarz / zespół S.", "Drgawki ustały. RR nadal 175/115.", ["Monitorowanie RR co 5 min", "Kontakt z lekarzem – lek hipotensyjny", "Wlew MgSO₄ 1 g/h, jeśli zlecony", "KTG nie masz – osłuchaj tętno płodu, jeśli możesz"], null], ["Co się stało i jakie odtrutki?", ["Zatrucie magnezem – zatrzymaj wlew, glukonian wapnia 10% 10 ml (1 g) i.v. w 10 min, wspomaganie oddechu", "Podajesz drugie 4 g magnezu", "Nalokson", "Flumazenil"], 0, "Objawy przedawkowania magnezu: zanik odruchów kolanowych (pierwszy objaw), depresja oddechu, senność, w końcu NZK. Dlatego przy wlewie sprawdzasz odruchy i oddech. Odtrutka: wapń i.v.", "Po 40 min wlewu magnezu: oddech 9/min, pacjentka senna, brak odruchu z mięśnia czworogłowego (kolanowego).", ["Zatrzymaj wlew MgSO₄", "Glukonian wapnia 10% 10 ml i.v. w 10 min", "Wentylacja workiem, jeśli trzeba", "Pilny transport"], "SBAR: K 32 l., 34 tydz. ciąży, rzucawka 11:20, MgSO₄ 4 g i.v., potem wlew; RR 175/115; objawy zatrucia magnezem – wlew zatrzymany, glukonian wapnia 1 g i.v. 12:05; obecnie oddech 14/min, ułożona na lewym boku."]]}, {"t": "⭐ Gorączka u seniorki → urosepsa → szybkie migotanie przedsionków → wstrząs", "g": "Sepsa + kardiologia", "s": "Wezwanie: kobieta 78 lat, „od wczoraj gorączka, dziś jest splątana”. Mieszkanie z córką. Pacjentka w łóżku, splątana, cewnik moczowy założony 3 tygodnie temu, mętny mocz w worku.", "q": [["Co jest głównym problemem?", ["Wstrząs septyczny (urosepsa); szybkie AF jest wtórne – leczysz przyczynę: tlen, płyny 500 ml bolus z oceną, szybki transport", "Pierwotna arytmia – kardiowersja", "Amiodaron i.v. od razu", "Odwodnienie – płyny doustne"], 0, "qSOFA: oddech ≥ 22, splątanie, SBP ≤ 100 = 3 pkt → wysokie ryzyko sepsy. Szybkie AF w sepsie zwykle zwalnia po leczeniu przyczyny (płyny, gorączka, antybiotyk). Kardiowersja/leki antyarytmiczne nie są pierwszym krokiem.", "Oddech 26/min, SpO₂ 93%, HR 148 niemiarowo, RR 86/50, temp. 39,1°C, CRT 4 s, GCS 13 (nowe splątanie). EKG: migotanie przedsionków z szybką czynnością komór (wcześniej nieznane).", ["Tlen do SpO₂ 94–98%", "2 dostępy, krystaloid zbilansowany 500 ml bolus, potem ocena (płuca!)", "Glikemia, mleczan jeśli możesz", "Powiadom SOR: „podejrzenie sepsy”, antybiotyk w ciągu 1 h od rozpoznania"], null], ["Co teraz?", ["Przestań przetaczać płyny (przeciążenie), wezwij S / lekarza – noradrenalina we wlewie, cel MAP ≥ 65 mmHg", "Kolejny litr krystaloidu", "Furosemid 40 mg i.v.", "Metoprolol na zwolnienie AF"], 0, "Wstrząs oporny na płyny z objawami przeciążenia → lek wazopresyjny (noradrenalina, zlecenie lekarza). Beta-bloker przy hipotensji pogłębi wstrząs.", "Po 1000 ml płynów RR 80/45, HR 140, w płucach pojawiają się trzeszczenia u podstaw.", ["Zatrzymaj płyny", "Pozycja z uniesionym tułowiem (duszność)", "S / lekarz – noradrenalina przez pompę", "MAP = (SBP + 2 × DBP) ÷ 3 – liczysz i notujesz"], "SBAR: K 78 l., urosepsa (cewnik 3 tyg.), wstrząs septyczny, nowe AF 140–150/min; krystaloid 1000 ml, trzeszczenia u podstaw, RR 80/45 (MAP 57), GCS 13; wymaga wazopresora."]]}, {"t": "⭐ Nagły niedowład → kod udarowy → wymioty i spadek świadomości", "g": "Neurologia", "s": "Wezwanie: mężczyzna 66 lat, „nagle przestał mówić i ma bezwładną prawą rękę”. Dom. Żona: był zdrowy 40 minut temu przy śniadaniu. Pacjent siedzi w fotelu, prawy kącik ust opadnięty.", "q": [["Co sprawdzasz najpierw i co jest ważne dla szpitala?", ["Glikemię (wyklucz hipoglikemię), godzinę ostatniego „zdrowia”, leki przeciwkrzepliwe – i kod udarowy", "Obniżasz ciśnienie do 140/90", "Aspiryna 300 mg", "Czekasz, aż objawy miną"], 0, "Hipoglikemia potrafi udawać udar – glikemia zawsze. Godzina ostatniego widzenia w zdrowiu decyduje o leczeniu (tromboliza do 4,5 h, trombektomia nawet do 24 h). Apiksaban ogranicza trombolizę, ale nie trombektomię. Zwrot gałek w stronę ogniska + afazja + niedowład = podejrzenie zamknięcia dużego naczynia → ośrodek trombektomii. Aspiryny nie podajesz (może to być krwotok).", "FAST: opadnięty prawy kącik ust, prawa ręka opada, mowa niezrozumiała (afazja). Gałki oczne zwrócone w lewo. RR 198/104, HR 88 niemiarowo, SpO₂ 96%. Leczy się na nadciśnienie, bierze apiksaban.", ["Glikemia (wynik 118)", "Godzina ostatniego widzenia w zdrowiu – zapisz dokładnie", "Lista leków (apiksaban – godzina ostatniej dawki)", "Kod udarowy – powiadom ośrodek z trombektomią; ciśnienia nie obniżasz, chyba że > 220/120"], null], ["Postępowanie?", ["Ułożenie na boku (pozycja bezpieczna), odessanie, tlen, monitorowanie GCS – rozważ krwotok śródmózgowy", "Podajesz płyny szybko", "Leki przeciwwymiotne i dalej na plecach", "Intubacja przez ratownika bez S w ruchu"], 0, "Wymioty i spadek świadomości u pacjenta na lekach przeciwkrzepliwych sugerują krwotok lub obrzęk mózgu. Ochrona dróg oddechowych przed zachłyśnięciem (pozycja boczna, ssak). GCS ≤ 8 → zabezpieczenie dróg oddechowych (S/LPR). Przekaż do szpitala zmianę stanu.", "W transporcie pacjent wymiotuje, charczy, GCS spada do 9.", ["Pozycja boczna, ssak", "Tlen do SpO₂ 94–98%", "GCS i źrenice co 5 min", "Powiadom szpital o pogorszeniu"], "ATMIST/SBAR: M 66 l., ostatnio zdrowy 7:40, afazja + prawostronny niedowład + zwrot gałek w lewo, RR 198/104, AF, apiksaban (ostatnia dawka wieczorem), glikemia 118; w transporcie wymioty, GCS 9."]]}];

" fill=\"#6d4c41\" transform=\"rotate(-90 226 110)\">kość udowa<\/text>\n<!-- patella -->\n<ellipse cx=\"232\" cy=\"225\" rx=\"30\" ry=\"26\" fill=\"#d7ccc8\" stroke=\"#8d6e63\" stroke-width=\"2\"/><text x=\"232\" y=\"230\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5d4037\">rzepka<\/text>\n<!-- tibia -->\n<path d=\"M185,255 Q232,245 285,255 L270,290 Q262,300 258,330 L250,560 Q252,585 272,600 L196,600 Q212,585 214,560 L206,330 Q202,300 194,290 Z\" fill=\"#e8dcc8\" stroke=\"#a1887f\" stroke-width=\"2\"/>\n<!-- fibula -->\n<path d=\"M292,280 L304,280 L298,590 L288,590 Z\" fill=\"#efe6d6\" stroke=\"#bcaaa4\" stroke-width=\"1.5\"/><text x=\"318\" y=\"440\" font-size=\"11\" fill=\"#8d6e63\">strzałkowa<\/text>\n<!-- tuberosity -->\n<ellipse cx=\"236\" cy=\"300\" rx=\"14\" ry=\"9\" fill=\"#bcaaa4\"/><text x=\"152\" y=\"304\" font-size=\"11\" fill=\"#5d4037\" text-anchor=\"end\">guzowatość piszczeli<\/text><line x1=\"156\" y1=\"300\" x2=\"222\" y2=\"300\" stroke=\"#8d6e63\"/>\n<text x=\"232\" y=\"450\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6d4c41\" transform=\"rotate(-90 232 450)\">kość piszczelowa<\/text>\n<!-- medial malleolus -->\n<ellipse cx=\"200\" cy=\"590\" rx=\"16\" ry=\"12\" fill=\"#bcaaa4\"/><text x=\"150\" y=\"616\" font-size=\"11\" fill=\"#5d4037\" text-anchor=\"middle\">kostka przyśrodkowa<\/text>\n<!-- sites -->\n<circle cx=\"214\" cy=\"335\" r=\"11\" fill=\"#d32f2f\"/><text x=\"214\" y=\"339\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\" font-weight=\"700\">1<\/text>\n<circle cx=\"222\" cy=\"318\" r=\"9\" fill=\"#1976d2\"/><text x=\"222\" y=\"322\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\" font-weight=\"700\">2<\/text>\n<circle cx=\"214\" cy=\"545\" r=\"11\" fill=\"#2e7d32\"/><text x=\"214\" y=\"549\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\" font-weight=\"700\">3<\/text>\n<circle cx=\"214\" cy=\"190\" r=\"10\" fill=\"#8e24aa\"/><text x=\"214\" y=\"194\" text-anchor=\"middle\" font-size=\"10\" fill=\"#fff\" font-weight=\"700\">4<\/text>\n<!-- labels right -->\n<g font-size=\"12.5\">\n<rect x=\"350\" y=\"150\" width=\"6\" height=\"50\" fill=\"#8e24aa\"/><text x=\"362\" y=\"164\" font-weight=\"700\" fill=\"#8e24aa\">4. Dystalna kość udowa<\/text><text x=\"362\" y=\"180\" fill=\"#333\" font-size=\"11\">tylko niemowlęta i małe dzieci:<\/text><text x=\"362\" y=\"195\" fill=\"#333\" font-size=\"11\">ok. 1 cm nad rzepką, 1–2 cm przyśrodkowo<\/text>\n<rect x=\"350\" y=\"250\" width=\"6\" height=\"66\" fill=\"#d32f2f\"/><text x=\"362\" y=\"264\" font-weight=\"700\" fill=\"#d32f2f\">1. Proksymalna piszczel – DOROŚLI<\/text><text x=\"362\" y=\"280\" fill=\"#333\" font-size=\"11\">2 cm przyśrodkowo od guzowatości piszczeli<\/text><text x=\"362\" y=\"295\" fill=\"#333\" font-size=\"11\">(ok. 3 cm poniżej rzepki),<\/text><text x=\"362\" y=\"310\" fill=\"#333\" font-size=\"11\">na płaskiej powierzchni przyśrodkowej<\/text>\n<rect x=\"350\" y=\"335\" width=\"6\" height=\"52\" fill=\"#1976d2\"/><text x=\"362\" y=\"349\" font-weight=\"700\" fill=\"#1976d2\">2. Proksymalna piszczel – DZIECI<\/text><text x=\"362\" y=\"365\" fill=\"#333\" font-size=\"11\">1–2 cm poniżej i przyśrodkowo od guzowatości<\/text><text x=\"362\" y=\"380\" fill=\"#333\" font-size=\"11\">(niemowlę: ok. 1 palec pod rzepką); omiń chrząstkę wzrostu<\/text>\n<rect x=\"350\" y=\"510\" width=\"6\" height=\"52\" fill=\"#2e7d32\"/><text x=\"362\" y=\"524\" font-weight=\"700\" fill=\"#2e7d32\">3. Dystalna piszczel<\/text><text x=\"362\" y=\"540\" fill=\"#333\" font-size=\"11\">dorośli ok. 3 cm, dzieci 1–2 cm<\/text><text x=\"362\" y=\"555\" fill=\"#333\" font-size=\"11\">powyżej kostki przyśrodkowej<\/text>\n<\/g>\n<line x1=\"225\" y1=\"335\" x2=\"350\" y2=\"285\" stroke=\"#d32f2f\" stroke-dasharray=\"4,3\"/><line x1=\"231\" y1=\"318\" x2=\"350\" y2=\"360\" stroke=\"#1976d2\" stroke-dasharray=\"4,3\"/><line x1=\"225\" y1=\"545\" x2=\"350\" y2=\"535\" stroke=\"#2e7d32\" stroke-dasharray=\"4,3\"/><line x1=\"224\" y1=\"190\" x2=\"350\" y2=\"175\" stroke=\"#8e24aa\" stroke-dasharray=\"4,3\"/>\n<text x=\"20\" y=\"634\" font-size=\"11\" fill=\"#888\">Schemat uproszczony. Przyśrodkowo = od strony drugiej nogi (tu po lewej stronie rysunku).<\/text>\n<\/svg>", "ioa": "<svg viewBox=\"0 0 600 460\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"DejaVu Sans,Arial,sans-serif\">\n<rect width=\"600\" height=\"460\" fill=\"#fff\"/>\n<text x=\"300\" y=\"26\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#222\">Dostęp doszpikowy – kość ramienna (dorośli)<\/text>\n<!-- clavicle/acromion -->\n<path d=\"M60,90 Q140,70 215,95\" stroke=\"#a1887f\" stroke-width=\"12\" fill=\"none\" stroke-linecap=\"round\"/><text x=\"70\" y=\"70\" font-size=\"11\" fill=\"#6d4c41\">obojczyk<\/text>\n<path d=\"M215,95 L255,100\" stroke=\"#8d6e63\" stroke-width=\"14\" stroke-linecap=\"round\"/><text x=\"262\" y=\"92\" font-size=\"11\" fill=\"#5d4037\">wyrostek barkowy<\/text>\n<!-- humerus head -->\n<circle cx=\"225\" cy=\"140\" r=\"38\" fill=\"#e8dcc8\" stroke=\"#a1887f\" stroke-width=\"2\"/>\n<path d=\"M205,165 L245,165 L238,420 L212,420 Z\" fill=\"#e8dcc8\" stroke=\"#a1887f\" stroke-width=\"2\"/>\n<text x=\"226\" y=\"320\" text-anchor=\"middle\" font-size=\"13\" fill=\"#6d4c41\" transform=\"rotate(-90 226 320)\">kość ramienna<\/text>\n<!-- greater tubercle -->\n<ellipse cx=\"252\" cy=\"140\" rx=\"13\" ry=\"18\" fill=\"#bcaaa4\"/>\n<line x1=\"198\" y1=\"185\" x2=\"252\" y2=\"185\" stroke=\"#795548\" stroke-dasharray=\"3,2\"/><text x=\"120\" y=\"205\" font-size=\"11\" fill=\"#5d4037\">szyjka chirurgiczna<\/text>\n<circle cx=\"252\" cy=\"140\" r=\"11\" fill=\"#d32f2f\"/><text x=\"252\" y=\"144\" text-anchor=\"middle\" font-size=\"11\" fill=\"#fff\" font-weight=\"700\">✚<\/text>\n<line x1=\"263\" y1=\"140\" x2=\"330\" y2=\"150\" stroke=\"#d32f2f\" stroke-dasharray=\"4,3\"/>\n<g font-size=\"12.5\"><rect x=\"330\" y=\"120\" width=\"6\" height=\"128\" fill=\"#d32f2f\"/>\n<text x=\"342\" y=\"134\" font-weight=\"700\" fill=\"#d32f2f\">Proksymalna kość ramienna<\/text>\n<text x=\"342\" y=\"152\" font-size=\"11\" fill=\"#333\">• ręka pacjenta na brzuchu (dłoń na pępku),<\/text>\n<text x=\"342\" y=\"167\" font-size=\"11\" fill=\"#333\">  łokieć przy tułowiu – bark lekko do przodu<\/text>\n<text x=\"342\" y=\"182\" font-size=\"11\" fill=\"#333\">• wymacaj guzek większy – najbardziej<\/text>\n<text x=\"342\" y=\"197\" font-size=\"11\" fill=\"#333\">  wystający punkt z przodu i z boku barku<\/text>\n<text x=\"342\" y=\"212\" font-size=\"11\" fill=\"#333\">• wkłucie w guzek, ok. 1–2 cm nad szyjką<\/text>\n<text x=\"342\" y=\"227\" font-size=\"11\" fill=\"#333\">• igła pod kątem 45°, w kierunku do tyłu<\/text>\n<text x=\"342\" y=\"242\" font-size=\"11\" fill=\"#333\">  i w stronę przeciwnego biodra; igła 45 mm<\/text><\/g>\n<g font-size=\"12\"><rect x=\"330\" y=\"275\" width=\"6\" height=\"96\" fill=\"#1976d2\"/>\n<text x=\"342\" y=\"289\" font-weight=\"700\" fill=\"#1976d2\">Dlaczego ramię?<\/text>\n<text x=\"342\" y=\"307\" font-size=\"11\" fill=\"#333\">• najszybszy przepływ i dojście leków do serca<\/text>\n<text x=\"342\" y=\"322\" font-size=\"11\" fill=\"#333\">• mniej bolesne płukanie niż w piszczeli<\/text>\n<text x=\"342\" y=\"337\" font-size=\"11\" fill=\"#333\">• trudniej utrzymać igłę przy ruchu ręki –<\/text>\n<text x=\"342\" y=\"352\" font-size=\"11\" fill=\"#333\">  unieruchom ramię wzdłuż tułowia<\/text><\/g>\n<text x=\"20\" y=\"450\" font-size=\"11\" fill=\"#888\">Schemat uproszczony – przedni widok prawego barku.<\/text>\n<\/svg>", "of": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 760\" font-family=\"DejaVu Sans,Arial,sans-serif\"><rect width=\"1200\" height=\"760\" fill=\"#fff\"/><g transform=\"translate(150,0)\"><text x=\"450\" y=\"28\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#222\">Narządy – widok z przodu (pacjent leży przodem do Ciebie)<\/text><text x=\"25\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" font-wei "1.5\"/><circle cx=\"335\" cy=\"115\" r=\"2.5\" fill=\"#d81b60\"/><text x=\"20\" y=\"120\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#d81b60\">Płuco prawe<\/text><text x=\"20\" y=\"136\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">3 płaty; szczyt nad obojczykiem<\/text><text x=\"20\" y=\"150\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">dół ok. 6. żebra z przodu<\/text><polyline points=\"410,320 335,235\" fill=\"none\" stroke=\"#5d2f1c\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"410\" cy=\"320\" r=\"4.5\" fill=\"#5d2f1c\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"235\" r=\"2.5\" fill=\"#5d2f1c\"/><text x=\"20\" y=\"240\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#5d2f1c\">Wątroba<\/text><text x=\"20\" y=\"256\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">prawe podżebrze, pod przeponą<\/text><text x=\"20\" y=\"270\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">5. żebro → łuk żebrowy<\/text><text x=\"20\" y=\"284\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">najczęściej krwawi przy urazie<\/text><polyline points=\"450,388 335,325\" fill=\"none\" stroke=\"#1b5e20\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"450\" cy=\"388\" r=\"4.5\" fill=\"#1b5e20\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"325\" r=\"2.5\" fill=\"#1b5e20\"/><text x=\"20\" y=\"330\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#1b5e20\">Pęcherzyk żółciowy<\/text><text x=\"20\" y=\"346\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">przecięcie łuku żebrowego<\/text><text x=\"20\" y=\"360\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">z linią środkowo-obojczykową<\/text><text x=\"20\" y=\"374\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">→ objaw Murphy’ego<\/text><polyline points=\"468,465 335,415\" fill=\"none\" stroke=\"#5d4037\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"468\" cy=\"465\" r=\"4.5\" fill=\"#5d4037\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"415\" r=\"2.5\" fill=\"#5d4037\"/><text x=\"20\" y=\"420\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#5d4037\">Nerka prawa (za otrzewną)<\/text><text x=\"20\" y=\"436\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">niżej niż lewa (wątroba)<\/text><text x=\"20\" y=\"450\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">Th12–L3, z tyłu<\/text><polyline points=\"432,500 335,470\" fill=\"none\" stroke=\"#ef6c00\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"432\" cy=\"500\" r=\"4.5\" fill=\"#ef6c00\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"470\" r=\"2.5\" fill=\"#ef6c00\"/><text x=\"20\" y=\"475\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#ef6c00\">Jelito grube – wstępnica<\/text><text x=\"20\" y=\"491\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">prawy bok brzucha<\/text><polyline points=\"446,542 335,515\" fill=\"none\" stroke=\"#000\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"446\" cy=\"542\" r=\"4.5\" fill=\"#000\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"515\" r=\"2.5\" fill=\"#000\"/><text x=\"20\" y=\"520\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#000\">Punkt McBurneya<\/text><text x=\"20\" y=\"536\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">1/3 linii kolec biodrowy → pępek<\/text><text x=\"20\" y=\"550\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">wyrostek robaczkowy (PDK)<\/text><polyline points=\"530,660 335,635\" fill=\"none\" stroke=\"#f9a825\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"530\" cy=\"660\" r=\"4.5\" fill=\"#f9a825\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"335\" cy=\"635\" r=\"2.5\" fill=\"#f9a825\"/><text x=\"20\" y=\"640\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"#f9a825\">Pęcherz moczowy<\/text><text x=\"20\" y=\"656\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">za spojeniem łonowym<\/text><text x=\"20\" y=\"670\" text-anchor=\"start\" font-size=\"11.5\" fill=\"#444\">pełny – wyczuwalny nad spojeniem<\/text><polyline points=\"670,170 865,115\" fill=\"none\" stroke=\"#d81b60\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"670\" cy=\"170\" r=\"4.5\" fill=\"#d81b60\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"115\" r=\"2.5\" fill=\"#d81b60\"/><text x=\"1180\" y=\"120\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#d81b60\">Płuco lewe<\/text><text x=\"1180\" y=\"136\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">2 płaty + wcięcie sercowe<\/text><polyline points=\"565,240 865,170\" fill=\"none\" stroke=\"#b71c1c\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"565\" cy=\"240\" r=\"4.5\" fill=\"#b71c1c\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"170\" r=\"2.5\" fill=\"#b71c1c\"/><text x=\"1180\" y=\"175\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#b71c1c\">Serce<\/text><text x=\"1180\" y=\"191\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">za mostkiem, 2/3 na lewo<\/text><text x=\"1180\" y=\"205\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">koniuszek: 5. międzyżebrze<\/text><text x=\"1180\" y=\"219\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">lewa linia środkowo-obojczykowa<\/text><polyline points=\"650,340 865,250\" fill=\"none\" stroke=\"#ad1457\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"650\" cy=\"340\" r=\"4.5\" fill=\"#ad1457\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"250\" r=\"2.5\" fill=\"#ad1457\"/><text x=\"1180\" y=\"255\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#ad1457\">Żołądek<\/text><text x=\"1180\" y=\"271\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">lewe podżebrze + nadbrzusze<\/text><polyline points=\"710,330 865,295\" fill=\"none\" stroke=\"#4a148c\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"710\" cy=\"330\" r=\"4.5\" fill=\"#4a148c\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"295\" r=\"2.5\" fill=\"#4a148c\"/><text x=\"1180\" y=\"300\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#4a148c\">Śledziona<\/text><text x=\"1180\" y=\"316\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">lewe podżebrze, z boku i z tyłu<\/text><text x=\"1180\" y=\"330\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">żebra 9–11, linia pachowa środk.<\/text><text x=\"1180\" y=\"344\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">uraz → ból lewego barku (Kehra)<\/text><polyline points=\"620,402 865,365\" fill=\"none\" stroke=\"#f57f17\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"620\" cy=\"402\" r=\"4.5\" fill=\"#f57f17\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"365\" r=\"2.5\" fill=\"#f57f17\"/><text x=\"1180\" y=\"370\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#f57f17\">Trzustka (za żołądkiem)<\/text><text x=\"1180\" y=\"386\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">na wysokości L1–L2, poprzecznie<\/text><text x=\"1180\" y=\"400\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">ból opasujący, promieniuje do pleców<\/text><polyline points=\"635,450 865,425\" fill=\"none\" stroke=\"#5d4037\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"635\" cy=\"450\" r=\"4.5\" fill=\"#5d4037\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"425\" r=\"2.5\" fill=\"#5d4037\"/><text x=\"1180\" y=\"430\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#5d4037\">Nerka lewa (za otrzewną)<\/text><text x=\"1180\" y=\"446\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">Th11–L2, wyżej niż prawa<\/text><polyline points=\"670,520 865,475\" fill=\"none\" stroke=\"#ef6c00\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"670\" cy=\"520\" r=\"4.5\" fill=\"#ef6c00\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"475\" r=\"2.5\" fill=\"#ef6c00\"/><text x=\"1180\" y=\"480\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#ef6c00\">Jelito grube – zstępnica<\/text><text x=\"1180\" y=\"496\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">lewy bok → esica w LDK<\/text><polyline points=\"555,470 865,525\" fill=\"none\" stroke=\"#c62828\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"555\" cy=\"470\" r=\"4.5\" fill=\"#c62828\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"525\" r=\"2.5\" fill=\"#c62828\"/><text x=\"1180\" y=\"530\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#c62828\">Aorta brzuszna<\/text><text x=\"1180\" y=\"546\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">lekko na lewo od linii środkowej<\/text><text x=\"1180\" y=\"560\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">rozwidlenie na wys. pępka (L4)<\/text><text x=\"1180\" y=\"574\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">pulsujący guz = tętniak<\/text><polyline points=\"590,535 865,635\" fill=\"none\" stroke=\"#c2185b\" stroke-width=\"1.3\" opacity=\".8\"/><circle cx=\"590\" cy=\"535\" r=\"4.5\" fill=\"#c2185b\" stroke=\"#fff\" stroke-width=\"1.5\"/><circle cx=\"865\" cy=\"635\" r=\"2.5\" fill=\"#c2185b\"/><text x=\"1180\" y=\"640\" text-anchor=\"end\" font-size=\"15\" font-weight=\"700\" fill=\"#c2185b\">Jelito cienkie<\/text><text x=\"1180\" y=\"656\" text-anchor=\"end\" font-size=\"11.5\" fill=\"#444\">środek brzucha, wokół pępka<\/text><text x=\"600\" y=\"745\" text-anchor=\"middle\" font-size=\"11\" fill=\"#777\">Schemat uproszczony. Linia przerywana = narząd leży głębiej / za otrzewną (zaotrzewnowo).<\/text><\/svg>", "ob": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 700\" font-family=\"DejaVu Sans,Arial,sans-serif\"><rect width=\"1200\" height=\"700\" fill=\"#fff\"/><g transform=\"translate(150,0)\"><text x=\"450\" y=\"28\" text-anchor=\"middle\" font-size=\"19\" font-weight=\"700\" fill=\"#222\">Narządy – widok z tyłu (patrzysz na plecy pacjenta)<\/text><text x=\"25\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#777\">LEWA strona pacjenta<\/text><text x=\"875\" y=\"60\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"700\" fill=\"#777\">PRAWA strona pacjenta<\/text><path d=\"M330,70 Q300,90 250,100 Q215,110 210,160 L215,380 Q205,470 220,520 Q235,600 300,650 L500,650 Q565,600 580,520 Q595,470 585,380 L590,160 Q585,110 550,100 Q500,90 470,70 Z\" fill=\"#fbe9dc\" stroke=\"#c9a28a\" stroke-width=\"2\"/><rect x=\"388\" y=\"95\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"119\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"143\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"167\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"191\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"215\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"239\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"263\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"287\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"311\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"335\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"359\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"383\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"407\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\" stroke=\"#a1887f\"/><rect x=\"388\" y=\"431\" width=\"24\" height=\"18\" rx=\"4\" fill=\"#e0d3c3\"
