/* Layout: one-column study surface — deck chips, progress strip, a single tall card, answer buttons pinned under the thumb */
:root {

html, body { height: 100%; }
body {

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {

  font: 600 0.9rem var(--body); padding: 7px 14px; border-radius: 999px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip .n { opacity: 0.7; font-variant-numeric: tabular-nums; margin-left: 4px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tool { background: none; border: 1px solid var(--line); color: var(--fg); font: 600 0.85rem var(--body); padding: 6px 12px; border-radius: 8px; cursor: pointer; }

.card {

  padding: 20px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; min-width: 0;

}
.card:focus-visible, .chip:focus-visible, .tool:focus-visible, .ans button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.cat { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); display: flex; justify-content: space-between; }
.cat .pos { color: var(--muted); font-variant-numeric: tabular-nums; }
.q { font-family: var(--display); font-weight: 600; font-size: 1.3rem; line-height: 1.3; text-wrap: balance; }
.a { border-top: 1px dashed var(--line); padding-top: 12px; font-size: 1.02rem; overflow-wrap: anywhere; }
.a b { color: var(--dose); }
.a .note { font-size: 0.82rem; color: var(--muted); margin-top: 10px; }
.hint { margin-top: auto; text-align: center; font-size: 0.85rem; color: var(--muted); }
.ans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans button { font: 700 1rem var(--body); padding: 14px; border-radius: 12px; cursor: pointer; border: 2px solid; background: var(--surface); }
.ans .no { border-color: var(--bad); color: var(--bad); }
.ans .yes { border-color: var(--good); color: var(--good); }
.ans .reveal { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.empty strong { display: block; font-family: var(--display); font-size: 1.2rem; color: var(--fg); margin-bottom: 6px; }

<script>
const CARDS = [{"d": "Leki", "q": "Kwas acetylosalicylowy (ASA) – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki<br><b>Wskazania:<\/b> OZW<br><b>Dawka:<\/b> 150–300 mg p.o., do rozgryzienia<br><b>Uwaga:<\/b> Uczulenie na ASA, czynne krwawienie z przewodu pokarmowego.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Adenozyna – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Częstoskurcz nadkomorowy z wąskimi QRS (stabilny, po nieskutecznych manewrach wagalnych)<br><b>Dawka:<\/b> 6 mg i.v. <b>szybki bolus<\/b> + przepłukanie 20 ml NaCl; przy braku efektu kolejna, wyższa dawka wg algorytmu ERC<br><b>Uwaga:<\/b> Astma (ostrożnie), blok AV II/III st., zespół chorego węzła. Uprzedź pacjenta o uczuciu „zatrzymania serca”.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Amiodaron – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> NZK w VF/pVT; tachyarytmie<br><b>Dawka:<\/b> NZK: <b>300 mg<\/b> i.v. po 3. defibrylacji, <b>150 mg<\/b> po 5.<br>Tachyarytmia u stabilnego: 300 mg i.v. we wlewie 10–20 min<br><b>Uwaga:<\/b> W tachyarytmii: bradykardia, blok AV, hipotensja.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Atropina – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Bradykardia z objawami niestabilności; zatrucie fosforoorganiczne<br><b>Dawka:<\/b> Bradykardia: <b>0,5 mg<\/b> i.v., powtarzać co 3–5 min do max <b>3 mg<\/b><br><b>Uwaga:<\/b> W zatruciu fosforoorganicznym dawki znacznie wyższe, miareczkowane do efektu.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Monoazotan izosorbidu – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki<br><b>Wskazania:<\/b> Ból wieńcowy (alternatywa dla nitrogliceryny)<br><b>Dawka:<\/b> Wg ChPL<br><b>Uwaga:<\/b> Jak nitraty: SBP &lt; 90 mmHg, inhibitory PDE-5, zawał prawej komory.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Budezonid – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> zawiesina do nebulizacji<br><b>Wskazania:<\/b> Krup / podgłośniowe zapalenie krtani, skurcz oskrzeli<br><b>Dawka:<\/b> Nebulizacja wg ChPL (u dzieci z krupem typowo 2 mg)<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Kaptopryl – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki<br><b>Wskazania:<\/b> Pilne stany nadciśnieniowe<br><b>Dawka:<\/b> 12,5–25 mg p.o./s.l.<br><b>Uwaga:<\/b> Ciąża, obrzęk naczynioruchowy w wywiadzie.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Klemastyna – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Reakcje alergiczne, leczenie wspomagające w anafilaksji<br><b>Dawka:<\/b> 2 mg i.v./i.m.<br><b>Uwaga:<\/b> Nie zastępuje adrenaliny w anafilaksji.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Klonazepam – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Drgawki, stan padaczkowy<br><b>Dawka:<\/b> 1 mg i.v. powoli<br><b>Uwaga:<\/b> Depresja oddechowa – monitoruj oddech.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Klopidogrel – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki<br><b>Wskazania:<\/b> OZW – <b>tylko po teletransmisji EKG i konsultacji z lekarzem<\/b><br><b>Dawka:<\/b> Dawka nasycająca wg zlecenia (typowo 600 mg p.o.)<br><b>Uwaga:<\/b> Warunek teletransmisji wynika wprost z rozporządzenia.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Deksametazon – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Obrzęk krtani, krup, astma, obrzęk mózgu (nowotworowy), alergia<br><b>Dawka:<\/b> Wg ChPL i wskazania<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Diazepam – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki, roztwór do wstrzykiwań, <b>wlewka doodbytnicza<\/b><br><b>Wskazania:<\/b> Drgawki, pobudzenie, lęk<br><b>Dawka:<\/b> Drgawki u dorosłego: 10 mg i.v. powoli (można powtórzyć); u dzieci wlewka doodbytnicza 5–10 mg zależnie od masy<br><b>Uwaga:<\/b> Depresja oddechowa, miastenia.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Drotaweryna – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Kolka nerkowa, żółciowa, skurcze mięśni gładkich<br><b>Dawka:<\/b> 40–80 mg i.v./i.m.<br><b>Uwaga:<\/b> Hipotensja.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Adrenalina – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> NZK, anafilaksja, bradykardia oporna na atropinę<br><b>Dawka:<\/b> NZK: <b>1 mg<\/b> i.v./i.o. co 3–5 min (asystolia/PEA – jak najszybciej; VF/pVT – po 3. defibrylacji)<br>Anafilaksja: <b>0,5 mg i.m.<\/b> w udo (0,5 ml roztworu 1 mg/ml), powtórzyć po 5 min<br><b>Uwaga:<\/b> W anafilaksji droga i.m. jest pierwszego wyboru.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Fentanyl – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Silny ból (uraz, OZW)<br><b>Dawka:<\/b> ok. 1 µg/kg i.v. (typowo 0,05–0,1 mg), miareczkować<br><b>Uwaga:<\/b> Depresja oddechowa, sztywność klatki przy szybkim podaniu. Odtrutka: nalokson.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Flumazenil – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Odwrócenie działania benzodiazepin<br><b>Dawka:<\/b> 0,2 mg i.v., powtarzać co 1 min do max ok. 1 mg<br><b>Uwaga:<\/b> Ryzyko drgawek u osób przewlekle przyjmujących benzodiazepiny i w zatruciach mieszanych.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Furosemid – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Obrzęk płuc, ostra niewydolność serca z przewodnieniem<br><b>Dawka:<\/b> 20–40 mg i.v.<br><b>Uwaga:<\/b> Hipowolemia, hipotensja.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Nitrogliceryna – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki, aerozol podjęzykowy<br><b>Wskazania:<\/b> Ból wieńcowy, obrzęk płuc z nadciśnieniem<br><b>Dawka:<\/b> 0,4 mg s.l. (1 dawka aerozolu), można powtarzać co 5 min<br><b>Uwaga:<\/b> <b>SBP &lt; 90 mmHg<\/b>, inhibitory PDE-5 (sildenafil 24 h, tadalafil 48 h), zawał prawej komory.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Glukagon – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Hipoglikemia bez dostępu dożylnego<br><b>Dawka:<\/b> 1 mg i.m./s.c.<br><b>Uwaga:<\/b> Mało skuteczny u alkoholików i przy wyczerpanym glikogenie.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Glukoza 5% – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wlewu dożylnego<br><b>Wskazania:<\/b> Płyn nośnik, rozcieńczanie leków<br><b>Dawka:<\/b> —<br><b>Uwaga:<\/b> Nie stosować jako płynu w resuscytacji płynowej i w urazach głowy.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Glukoza 20% – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Hipoglikemia<br><b>Dawka:<\/b> Typowo 50–100 ml (10–20 g) i.v., kontrola glikemii<br><b>Uwaga:<\/b> Podawać do dużej żyły – roztwór drażniący.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Heparyna niefrakcjonowana – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> OZW (STEMI)<br><b>Dawka:<\/b> 70–100 j./kg i.v. (w praktyce często 5000 j.)<br><b>Uwaga:<\/b> Czynne krwawienie, podejrzenie rozwarstwienia aorty.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Hydrokortyzon – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Anafilaksja (wspomagająco), astma, niewydolność nadnerczy<br><b>Dawka:<\/b> Typowo 100–200 mg i.v.<br><b>Uwaga:<\/b> Działa z opóźnieniem – nie zastępuje adrenaliny.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Hydroksyzyna – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki, roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Lęk, pobudzenie, świąd<br><b>Dawka:<\/b> Wg ChPL<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Ibuprofen – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki<br><b>Wskazania:<\/b> Ból, gorączka<br><b>Dawka:<\/b> 200–400 mg p.o.<br><b>Uwaga:<\/b> Choroba wrzodowa, ciąża III trymestr, niewydolność nerek.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Ketoprofen – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki, roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Ból (np. kolka nerkowa, ból kostno-stawowy)<br><b>Dawka:<\/b> 100 mg i.v. we wlewie (rozcieńczony)<br><b>Uwaga:<\/b> Jak NLPZ: krwawienie, choroba wrzodowa, niewydolność nerek.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Lidokaina – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań, żel<br><b>Wskazania:<\/b> NZK w VF/pVT (alternatywa dla amiodaronu), znieczulenie miejscowe, ułatwienie zakładania cewnika/sondy (żel)<br><b>Dawka:<\/b> NZK: 1–1,5 mg/kg (ok. 100 mg) i.v., potem 50 mg<br><b>Uwaga:<\/b> Nie łączyć z amiodaronem w NZK.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Siarczan magnezu – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Torsade de pointes, ciężka astma, rzucawka, hipomagnezemia<br><b>Dawka:<\/b> Torsade/astma: <b>2 g<\/b> i.v. (w astmie we wlewie ok. 20 min)<br>Rzucawka: dawka nasycająca 4 g i.v.<br><b>Uwaga:<\/b> Monitoruj oddech i odruchy (hipermagnezemia).<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Mannitol 15% – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wlewu dożylnego<br><b>Wskazania:<\/b> Obrzęk mózgu ze wzrostem ciśnienia śródczaszkowego<br><b>Dawka:<\/b> Wg ChPL/zlecenia<br><b>Uwaga:<\/b> Hipowolemia, niewydolność serca.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Metamizol – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Ból, gorączka, kolka<br><b>Dawka:<\/b> 1 g i.v. powoli lub we wlewie<br><b>Uwaga:<\/b> Ryzyko agranulocytozy i hipotensji przy szybkim podaniu.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Metoklopramid – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Nudności i wymioty<br><b>Dawka:<\/b> 10 mg i.v. powoli<br><b>Uwaga:<\/b> Niedrożność jelit, padaczka, objawy pozapiramidowe.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Metoprolol – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Tachyarytmie (np. AF z szybką akcją komór), OZW z tachykardią i nadciśnieniem<br><b>Dawka:<\/b> 5 mg i.v. powoli, można powtórzyć do 15 mg<br><b>Uwaga:<\/b> Bradykardia, hipotensja, ostra niewydolność serca, astma.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Midazolam – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Drgawki, sedacja, pobudzenie<br><b>Dawka:<\/b> Drgawki bez dostępu i.v.: 10 mg i.m. (> 40 kg); i.v. miareczkować<br><b>Uwaga:<\/b> Depresja oddechowa – przygotuj sprzęt do wentylacji.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Morfina – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Silny ból, obrzęk płuc (ostrożnie)<br><b>Dawka:<\/b> 2–4 mg i.v., miareczkować do efektu<br><b>Uwaga:<\/b> Depresja oddechowa, hipotensja. Odtrutka: nalokson.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Nalokson – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Zatrucie opioidami z depresją oddechową<br><b>Dawka:<\/b> 0,4 mg i.v./i.m./i.n.; i.v. można miareczkować małymi dawkami<br><b>Uwaga:<\/b> Działa krócej niż wiele opioidów – ryzyko nawrotu, obserwacja.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "NaCl 0,9% – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wlewu dożylnego<br><b>Wskazania:<\/b> Resuscytacja płynowa, nośnik leków<br><b>Dawka:<\/b> Bolusy wg stanu pacjenta<br><b>Uwaga:<\/b> Duże objętości – ryzyko kwasicy hiperchloremicznej.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Wodorowęglan sodu 8,4% – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Hiperkaliemia, zatrucie trójpierścieniowymi lekami przeciwdepresyjnymi, ciężka kwasica<br><b>Dawka:<\/b> Typowo 50 mmol (50 ml) i.v.<br><b>Uwaga:<\/b> Nie podawać tą samą linią co adrenalinę/wapń bez przepłukania.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Noradrenalina – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Wstrząs (np. septyczny, kardiogenny) z hipotensją po nawodnieniu<br><b>Dawka:<\/b> Wlew ciągły, miareczkowanie do docelowego MAP (zwykle ≥ 65 mmHg)<br><b>Uwaga:<\/b> Najlepiej przez pompę strzykawkową i pewny dostęp. Dodana nowelizacją z 2024 r.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Papaweryna – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Skurcze mięśni gładkich (kolki)<br><b>Dawka:<\/b> Wg ChPL<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Paracetamol – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> czopki, tabletki, roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Ból, gorączka<br><b>Dawka:<\/b> Dorosły > 50 kg: 1 g i.v. we wlewie ok. 15 min<br><b>Uwaga:<\/b> Niewydolność wątroby. Max dobowa dawka wg masy.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Płyn wieloelektrolitowy (PWE) – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wlewu dożylnego<br><b>Wskazania:<\/b> Resuscytacja płynowa, odwodnienie<br><b>Dawka:<\/b> Bolusy wg stanu pacjenta<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Płyny koloidowe (HES, żelatyna) – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wlewu dożylnego<br><b>Wskazania:<\/b> Uzupełnianie objętości<br><b>Dawka:<\/b> Wg zlecenia/procedury<br><b>Uwaga:<\/b> Nie wymagają oznaczenia grupy krwi ani próby krzyżowej – stąd na liście.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Prasugrel – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki<br><b>Wskazania:<\/b> OZW – <b>tylko po teletransmisji EKG i konsultacji z lekarzem<\/b><br><b>Dawka:<\/b> Dawka nasycająca wg zlecenia (typowo 60 mg)<br><b>Uwaga:<\/b> Przebyty udar/TIA. Dodany nowelizacją z 2024 r.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Salbutamol – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań, roztwór do nebulizacji<br><b>Wskazania:<\/b> Skurcz oskrzeli (astma, POChP), hiperkaliemia<br><b>Dawka:<\/b> Nebulizacja 2,5–5 mg, można powtarzać<br><b>Uwaga:<\/b> Tachykardia, hipokaliemia.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Płyn Ringera / zbilansowany roztwór elektrolitowy – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wlewu dożylnego<br><b>Wskazania:<\/b> Resuscytacja płynowa<br><b>Dawka:<\/b> Bolusy wg stanu pacjenta<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Tietylperazyna – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> czopki, roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Nudności, wymioty, zawroty głowy<br><b>Dawka:<\/b> 6,5 mg (czopek lub i.m.)<br><b>Uwaga:<\/b> Objawy pozapiramidowe.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Tikagrelor – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> tabletki<br><b>Wskazania:<\/b> OZW – <b>tylko po teletransmisji EKG i konsultacji z lekarzem<\/b><br><b>Dawka:<\/b> Dawka nasycająca wg zlecenia (typowo 180 mg)<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Tlen medyczny – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> gaz<br><b>Wskazania:<\/b> Hipoksemia, NZK, zatrucie CO<br><b>Dawka:<\/b> Cel SpO₂ <b>94–98%<\/b>; u chorych z ryzykiem hiperkapnii (np. POChP) <b>88–92%<\/b><br><b>Uwaga:<\/b> W NZK i zatruciu CO – maksymalne stężenie.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Kwas traneksamowy – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Krwotok urazowy, krwawienia<br><b>Dawka:<\/b> W urazie: <b>1 g i.v. w 10 min<\/b>, najlepiej do 3 h od urazu<br><b>Uwaga:<\/b> Dodany nowelizacją z 2024 r.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Urapidyl – postać, wskazania, dawka?", "a": "<b>Postać:<\/b> roztwór do wstrzykiwań<br><b>Wskazania:<\/b> Pilne stany nadciśnieniowe<br><b>Dawka:<\/b> 12,5–25 mg i.v. powoli, można powtarzać<br><b>Uwaga:<\/b> Obniżać ciśnienie stopniowo.<div class=\"note\">Dawki orientacyjne dla dorosłych – weryfikuj z ChPL, wytycznymi ERC 2025 i procedurami swojej jednostki.<\/div>"}, {"d": "Leki", "q": "Które leki przeciwpłytkowe P2Y12 ratownik może podać samodzielnie i pod jakim warunkiem?", "a": "Klopidogrel, prasugrel, tikagrelor – <b>wyłącznie po teletransmisji EKG i konsultacji z lekarzem oceniającym zapis<\/b>."}, {"d": "Leki", "q": "Ile pozycji ma lista leków, które ratownik podaje samodzielnie, i gdzie jest określona?", "a": "Ok. 50 pozycji – rozporządzenie MZ z 22.06.2023 r. (tekst jednolity Dz.U. 2025 poz. 576), załącznik nr 1, pkt 31."}, {"d": "Leki", "q": "Jakie leki dodała nowelizacja rozporządzenia z marca 2024 r.?", "a": "Noradrenalinę, prasugrel i kwas traneksamowy."}, {"d": "Leki", "q": "Jakie leki z zasobów własnych chorego ratownik może podać w stanie nagłym?", "a": "Koncentraty czynników krzepnięcia oraz desmopresynę (np. u chorego na hemofilię)."}, {"d": "Leki", "q": "Czy ratownik może podać lek spoza listy z załącznika nr 1?", "a": "Tak, ale <b>tylko na zlecenie lekarza<\/b> (załącznik nr 2 – podawanie produktów leczniczych)."}, {"d": "Leki", "q": "Wymień opioidy z listy leków ratownika.", "a": "Fentanyl i morfina. Odtrutka: nalokson."}, {"d": "Leki", "q": "Wymień benzodiazepiny z listy leków ratownika.", "a": "Diazepam, klonazepam, midazolam. Odtrutka: flumazenil."}, {"d": "Leki", "q": "Które leki z listy mają postać doodbytniczą?", "a": "Diazepam (wlewka doodbytnicza), paracetamol (czopki), tietylperazyna (czopki)."}, {"d": "Czynności ratownika", "q": "Czy ratownik może samodzielnie wykonać intubację dotchawiczą?", "a": "Samodzielnie <b>tylko w NZK<\/b>. Intubacja z użyciem środków zwiotczających – <b>na zlecenie lekarza<\/b>."}, {"d": "Czynności ratownika", "q": "Jakie przyrządowe metody udrażniania dróg oddechowych ratownik stosuje samodzielnie?", "a": "Rurka ustno-gardłowa, nosowo-gardłowa, przyrządy nadgłośniowe, <b>konikopunkcja<\/b>."}, {"d": "Czynności ratownika", "q": "Kiedy ratownik może samodzielnie wykonać kardiowersję i stymulację przezskórną?", "a": "U pacjentów <b>niestabilnych hemodynamicznie<\/b>: kardiowersja w tachyarytmiach, stymulacja w bradyarytmiach."}, {"d": "Czynności ratownika", "q": "Jakie dostępy naczyniowe ratownik zakłada samodzielnie?", "a": "Kaniulacja żył obwodowych i <b>żyły szyjnej zewnętrznej<\/b> oraz dostęp doszpikowy gotowym zestawem."}, {"d": "Czynności ratownika", "q": "Czy ratownik może samodzielnie odbarczyć odmę prężną?", "a": "Tak – drogą nakłucia jamy opłucnowej."}, {"d": "Czynności ratownika", "q": "Pod jakim warunkiem ratownik może samodzielnie wykonywać USG?", "a": "Według protokołów ratunkowych, po ukończeniu kursu USG w ratownictwie medycznym certyfikowanego przez CMKP."}, {"d": "Czynności ratownika", "q": "Które czynności ratownik wykonuje w ramach MCR tylko na zlecenie lekarza?", "a": "Intubacja ze zwiotczeniem, cewnikowanie pęcherza, sonda żołądkowa i płukanie żołądka (po zabezpieczeniu dróg oddechowych), asystowanie przy innych czynnościach, podawanie leków spoza listy."}, {"d": "Czynności ratownika", "q": "Czy ratownik może samodzielnie cewnikować pęcherz?", "a": "W ramach <b>świadczeń innych niż MCR<\/b> (np. na oddziale) – tak, samodzielnie. W ramach MCR – na zlecenie lekarza."}, {"d": "Czynności ratownika", "q": "Czy ratownik może samodzielnie pobierać krew do badań?", "a": "Tak – krew żylną i włośniczkową, w ramach świadczeń innych niż MCR (załącznik nr 3)."}, {"d": "Czynności ratownika", "q": "Jakie testy diagnostyczne ratownik wykonuje samodzielnie poza EKG?", "a": "Oznaczanie parametrów krytycznych dostępnym sprzętem, pomiar temperatury głębokiej, wymaz z górnych dróg oddechowych i testy antygenowe na wirusy."}, {"d": "Algorytmy", "q": "RKO dorosłego – częstość, głębokość i stosunek uciśnięć do oddechów?", "a": "100–120/min, głębokość 5–6 cm, <b>30:2<\/b>. Minimalizuj przerwy w uciśnięciach.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Rytmy do defibrylacji i niedefibrylacyjne w NZK?", "a": "Do defibrylacji: <b>VF, pVT<\/b> (VT bez tętna).<br>Niedefibrylacyjne: <b>asystolia, PEA<\/b>.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Kiedy podać adrenalinę w NZK?", "a": "Rytm niedefibrylacyjny: <b>jak najszybciej<\/b> po uzyskaniu dostępu.<br>Rytm defibrylacyjny: <b>po 3. defibrylacji<\/b>.<br>Potem 1 mg co 3–5 min.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Amiodaron w NZK – kiedy i ile?", "a": "<b>300 mg<\/b> po 3. defibrylacji, <b>150 mg<\/b> po 5. Alternatywa: lidokaina 100 mg, potem 50 mg.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Odwracalne przyczyny NZK – 4H?", "a": "<b>Hipoksja, Hipowolemia, Hipo-/hiperkaliemia i inne zaburzenia metaboliczne, Hipotermia<\/b> (i hipertermia).<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Odwracalne przyczyny NZK – 4T?", "a": "<b>Tamponada<\/b> serca, <b>Toksyny<\/b> (zatrucia), odma prężna (<b>Tension pneumothorax<\/b>), <b>Trombembolia<\/b> (zatorowość płucna lub zakrzepica wieńcowa).<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Co ile minut ocena rytmu w ALS?", "a": "Co <b>2 minuty<\/b> – z jak najkrótszą przerwą w uciśnięciach.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Cele po ROSC – saturacja i wentylacja?", "a": "SpO₂ <b>94–98%<\/b>, normokapnia, unikanie hipotensji (cel MAP zwykle ≥ 65 mmHg), 12-odprowadzeniowe EKG.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Anafilaksja – lek pierwszego rzutu i dawka u dorosłego?", "a": "<b>Adrenalina 0,5 mg i.m.<\/b> w przednio-boczną część uda, powtórzyć po 5 min w razie braku poprawy. Tlen, płyny, ułożenie.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Bradykardia z objawami niestabilności – postępowanie?", "a": "Atropina <b>0,5 mg<\/b> i.v., powtarzać do max <b>3 mg<\/b>. Przy braku efektu: stymulacja przezskórna lub adrenalina we wlewie.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Tachyarytmia z objawami niestabilności – postępowanie?", "a": "<b>Zsynchronizowana kardiowersja<\/b> (do 3 prób). Przy braku efektu: amiodaron 300 mg i.v. w 10–20 min i ponowna kardiowersja.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Objawy niestabilności w zaburzeniach rytmu?", "a": "<b>Wstrząs<\/b>, <b>omdlenie<\/b>, <b>niedokrwienie mięśnia sercowego<\/b>, <b>ciężka niewydolność serca<\/b>.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "RKO u dziecka (ratownicy medyczni) – stosunek i początek?", "a": "<b>5 oddechów ratowniczych<\/b> na początku, potem <b>15:2<\/b>.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Defibrylacja u dziecka – energia?", "a": "<b>4 J/kg<\/b>.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Adrenalina i amiodaron w NZK u dziecka – dawki?", "a": "Adrenalina <b>10 µg/kg<\/b> (0,01 mg/kg, max 1 mg).<br>Amiodaron <b>5 mg/kg<\/b> (max 300 mg) po 3. i 5. defibrylacji.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Głębokość uciśnięć u dziecka?", "a": "Co najmniej <b>1/3 wymiaru przednio-tylnego<\/b> klatki piersiowej.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Hipoglikemia – próg i postępowanie u przytomnego i nieprzytomnego?", "a": "Glikemia &lt; 70 mg/dl z objawami.<br>Przytomny, połyka: glukoza doustnie.<br>Nieprzytomny: <b>glukoza 20% i.v.<\/b>, bez dostępu – <b>glukagon 1 mg i.m.<\/b><div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Stan padaczkowy – leki pierwszego rzutu dostępne dla ratownika?", "a": "Benzodiazepiny: midazolam (i.m./i.v.), diazepam (i.v. lub doodbytniczo), klonazepam i.v.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Zatrucie opioidami – triada objawów i lek?", "a": "Śpiączka, <b>szpilkowate źrenice<\/b>, depresja oddechowa. Wentylacja + <b>nalokson<\/b>.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Ból wieńcowy – przeciwwskazania do nitrogliceryny?", "a": "SBP &lt; 90 mmHg, inhibitory PDE-5 w ostatnich 24–48 h, zawał prawej komory, ciężka bradykardia/tachykardia.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Krwotok urazowy – kwas traneksamowy?", "a": "<b>1 g i.v. w 10 min<\/b>, najlepiej w ciągu 3 h od urazu.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Algorytmy", "q": "Docelowa SpO₂ w POChP z ryzykiem hiperkapnii?", "a": "<b>88–92%<\/b>.<div class=\"note\">Wg wytycznych ERC – sprawdź szczegóły w aktualnych wytycznych ERC 2025.<\/div>"}, {"d": "Ustawa o zawodzie", "q": "Kto przyznaje prawo wykonywania zawodu ratownika medycznego?", "a": "Krajowa Rada Ratowników Medycznych (art. 22)."}, {"d": "Ustawa o zawodzie", "q": "W jakim terminie Krajowa Rada przyznaje PWZ?", "a": "Niezwłocznie, nie później niż <b>3 miesiące<\/b> od otrzymania kompletu dokumentów (art. 24)."}, {"d": "Ustawa o zawodzie", "q": "Ile trwa okres edukacyjny ratownika?", "a": "<b>5 lat<\/b>; zaczyna się 1 stycznia roku po uzyskaniu uprawnień (art. 81)."}, {"d": "Ustawa o zawodzie", "q": "Ile dni urlopu szkoleniowego przysługuje ratownikowi?", "a": "Do <b>6 dni roboczych<\/b> rocznie, płatnego (art. 78)."}, {"d": "Ustawa o zawodzie", "q": "Kiedy ratownik musi odbyć przeszkolenie przed powrotem do zawodu i ile ono trwa?", "a": "Gdy nie wykonywał zawodu > 5 lat w ciągu ostatnich 6 lat. Przeszkolenie trwa <b>6 miesięcy<\/b> w ZRM lub SOR (art. 39–40)."}, {"d": "Ustawa o zawodzie", "q": "W jakich formach ratownik może wykonywać zawód?", "a": "Umowa o pracę, stosunek służbowy, umowa cywilnoprawna, wolontariat (art. 38)."}, {"d": "Ustawa o zawodzie", "q": "Jaką ochronę prawną ma ratownik podczas czynności zawodowych?", "a": "Ochronę przewidzianą dla <b>funkcjonariuszy publicznych<\/b> (art. 37)."}, {"d": "Ustawa o zawodzie", "q": "Kiedy ratownik może odstąpić od czynności ratunkowych?", "a": "Gdy nie spowoduje to niebezpieczeństwa utraty życia, ciężkiego uszkodzenia ciała lub rozstroju zdrowia. Musi uzasadnić to w dokumentacji (art. 56)."}, {"d": "Ustawa o zawodzie", "q": "Kiedy ratownik traci PWZ?", "a": "Ubezwłasnowolnienie, cofnięcie zgody MZ, <b>prawomocne skazanie za umyślne przestępstwo publicznoskargowe lub skarbowe<\/b>, pozbawienie PWZ przez sąd ratowników (art. 31)."}, {"d": "Ustawa o zawodzie", "q": "Wymień organy samorządu ratowników medycznych.", "a": "Krajowy Zjazd, Krajowa Rada, Komisja Rewizyjna, Sąd Dyscyplinarny, Wyższy Sąd Dyscyplinarny, Rzecznik Dyscyplinarny (art. 119)."}, {"d": "Ustawa o zawodzie", "q": "Ile trwa kadencja organów samorządu?", "a": "<b>4 lata<\/b>; tę samą funkcję max 2 kadencje z rzędu (art. 120)."}, {"d": "Ustawa o zawodzie", "q": "Kiedy jest Dzień Ratownika Medycznego?", "a": "<b>8 września<\/b> (art. 1 ust. 2)."}, {"d": "Ustawa o zawodzie", "q": "W jakim dokumencie ratownik dokumentuje świadczenia poza podmiotami leczniczymi?", "a": "W <b>karcie indywidualnej ratownika medycznego<\/b> (art. 53)."}];
const DECKS = ["Wszystkie", "Leki", "Czynności ratownika", "Algorytmy", "Ustawa o zawodzie"];
const LABEL = {"Wszystkie":"Wszystkie","Leki":"Leki","Czynności ratownika":"Czynności","Algorytmy":"Algorytmy","Ustawa o zawodzie":"Ustawa"};
CARDS.forEach((c, i) => c.id = i);

let known = {};
try { known = JSON.parse(localStorage.getItem("ratownik-known") || "{}") || {}; } catch (e) { known = {}; }
function save() { try { localStorage.setItem("ratownik-known", JSON.stringify(known)); } catch (e) {} }

let deck = "Wszystkie", onlyBad = false, order = [], idx = 0, shown = false;

function pool() {
  return CARDS.filter(c => (deck === "Wszystkie" || c.d === deck) && (!onlyBad || known[c.id] !== true));
}
function build(shuffle) {
  order = pool().map(c => c.id);
  if (shuffle) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  idx = 0; shown = false; render();
}
const COL={"Wszystkie":"#0b1f3a","Leki":"#e63946","Algorytmy":"#7b2cbf","Ustawa o zawodzie":"#457b9d","Czynności ratownika":"#2a9d8f"},ICO={"Leki":"💊","Algorytmy":"🔁","Ustawa o zawodzie":"⚖️","Czynności ratownika":"🩺"};
function chips() {
  const el = document.getElementById("chips"); el.innerHTML = "";
  DECKS.forEach(d => {
    const n = d === "Wszystkie" ? CARDS.length : CARDS.filter(c => c.d === d).length;
    const b = document.createElement("button");
    b.className = "chip"; b.style.setProperty("--k",COL[d]||"#0b1f3a"); b.type = "button"; b.setAttribute("aria-pressed", d === deck);
    b.innerHTML = LABEL[d] + '<span class="n">' + n + '</span>';
    b.onclick = () => { deck = d; chips(); build(false); };
    el.appendChild(b);
  });
}
function render() {
  const card = document.getElementById("card"), ans = document.getElementById("ans");
  const inDeck = CARDS.filter(c => deck === "Wszystkie" || c.d === deck);
  const knownN = inDeck.filter(c => known[c.id] === true).length;
  document.getElementById("stat").textContent = "Opanowane: " + knownN + " / " + inDeck.length;
  document.getElementById("barFill").style.width = (inDeck.length ? knownN / inDeck.length * 100 : 0) + "%";
  if (!order.length || idx >= order.length) {
    card.innerHTML = '<div class="empty"><strong>' + (order.length ? "Koniec talii" : "Wszystko opanowane") + '</strong>' +
      (order.length ? "Przejrzałeś " + order.length + " kart. Przetasuj, aby zacząć od nowa, albo włącz „Tylko do powtórki”." : "W tym dziale nie ma kart do powtórki. Wyłącz filtr lub wyzeruj postęp.") + '</div>';
    ans.innerHTML = '<button class="reveal" type="button" id="again">Zacznij od nowa</button>';
    document.getElementById("again").onclick = () => build(true);
    return;
  }
  const c = CARDS[order[idx]];
  const tag = known[c.id] === true ? " · opanowana" : known[c.id] === false ? " · do powtórki" : "";
  document.documentElement.style.setProperty("--k",COL[c.d]||"#e63946");card.innerHTML = '<div class="cat"><span><span class="ic">' + (ICO[c.d]||"") + '</span>' + LABEL[c.d] + tag + '</span><span class="pos">' + (idx + 1) + ' / ' + order.length + '</span></div>' +
    '<div class="q">' + c.q + '</div>' +
    (shown ? '<div class="a">' + c.a + '</div>' : '<div class="hint">Dotknij karty, aby zobaczyć odpowiedź</div>');
  ans.innerHTML = shown
    ? '<button class="no" type="button" id="no">Nie wiem</button><button class="yes" type="button" id="yes">Wiem</button>'
    : '<button class="reveal" type="button" id="rev">Pokaż odpowiedź</button>';
  if (shown) {
    document.getElementById("no").onclick = () => mark(false);
    document.getElementById("yes").onclick = () => mark(true);
  } else document.getElementById("rev").onclick = flip;
}
function flip() { if (idx < order.length) { shown = !shown; render(); } }
function mark(v) { known[order[idx]] = v; save(); idx++; shown = false; render(); window.scrollTo(0, 0); }

document.getElementById("card").onclick = flip;
document.getElementById("card").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
document.addEventListener("keydown", e => {
  if (!shown) return;
  if (e.key === "ArrowLeft" || e.key === "1") mark(false);
  if (e.key === "ArrowRight" || e.key === "2") mark(true);
});
document.getElementById("shuffle").onclick = () => build(true);
document.getElementById("onlyBad").onclick = e => { onlyBad = !onlyBad; e.currentTarget.setAttribute("aria-pressed", onlyBad); build(false); };
const resetBtn = document.getElementById("reset");
let armed = false;
resetBtn.onclick = () => {
  if (!armed) { armed = true; resetBtn.textContent = "Na pewno? Dotknij ponownie"; setTimeout(() => { armed = false; resetBtn.textContent = "Wyzeruj postęp"; }, 3000); return; }
  known = {}; save(); armed = false; resetBtn.textContent = "Wyzeruj postęp"; build(false);
};
chips(); build(true);
</script>
