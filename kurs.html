<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kursy leków krok po kroku – ratownik medyczny | ratownikmedyczny.online</title>
<meta name="description" content="Interaktywne mini-kursy leków dla ratownika medycznego: ekran po ekranie, z animacjami, czytaniem na głos i quizem na końcu.">
<style>
:root{--navy:#0b1f3a;--red:#e63946;--ink:#14213d;--mute:#5b6b82;--bg:#f4f7fb;--line:#dfe6ef;--k:#e63946}
*{box-sizing:border-box;min-width:0}html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
a{color:inherit}
/* ---------- lista kursów */
.top{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.top a{color:#fff;text-decoration:none;font-weight:700}.top b{color:#ff6b74}.top .bk{font-size:13px;font-weight:600;background:rgba(255,255,255,.14);padding:6px 11px;border-radius:999px}
.hero{color:#fff;background:linear-gradient(115deg,rgba(11,31,58,.95),rgba(230,57,70,.75)),url(img/szuflada-leki.jpg) center/cover;padding:30px 16px}
.hero h1{margin:0 auto 6px;max-width:980px;font-size:clamp(26px,5vw,40px);line-height:1.1}.hero h1 span{color:#ffd166}.hero p{margin:0 auto;max-width:980px;opacity:.93}
.list{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kc{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:#fff;border-radius:16px;padding:14px;border:2px solid var(--c);box-shadow:0 4px 12px rgba(11,31,58,.06);position:relative}
.kc i{font-style:normal;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--c)}
.kc b{font-size:16px;line-height:1.2}.kc small{color:var(--mute);font-size:12.5px;line-height:1.3}.kc .lk{position:absolute;top:10px;right:10px;font-size:15px}
.kc.new::after{content:"NOWY";position:absolute;top:10px;right:10px;background:#ffd166;color:#0b1f3a;font:800 10px system-ui;padding:3px 6px;border-radius:6px}
/* ---------- odtwarzacz */
#play{display:none;position:fixed;inset:0;flex-direction:column;background:var(--bg)}
body.playing #play{display:flex}body.playing #idx{display:none}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line)}
.bar .x{width:38px;height:38px;border-radius:50%;border:0;background:#eef2f7;font-size:18px;cursor:pointer;flex:0 0 auto;text-decoration:none;display:grid;place-items:center}
.bar .nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.bar .say{border:0;background:#eef2f7;border-radius:999px;padding:8px 12px;font:600 13px system-ui;cursor:pointer;flex:0 0 auto}.bar .say.on{background:var(--k);color:#fff}
.prog{display:flex;gap:3px;padding:8px 12px 0;background:#fff}.prog i{flex:1;height:5px;border-radius:3px;background:#e3e8ef;transition:background .3s}.prog i.d{background:var(--k)}
.stage{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
.sl{max-width:720px;margin:0 auto;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.sl.back{animation-name:inb}@keyframes inb{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.hd{border-radius:20px;padding:18px 18px 16px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#0b1f3a));position:relative;overflow:hidden;box-shadow:0 8px 22px color-mix(in srgb,var(--c) 30%,transparent)}
.hd::after{content:attr(data-e);position:absolute;right:-6px;bottom:-18px;font-size:92px;opacity:.22;transform:rotate(-12deg)}
.hd small{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:12px;opacity:.9}.hd h2{margin:4px 0 0;font-size:24px;line-height:1.2;max-width:88%}
.its{display:grid;gap:10px;margin-top:14px}
.it{background:#fff;border-radius:14px;padding:12px 14px;border-left:6px solid var(--c);box-shadow:0 2px 8px rgba(11,31,58,.05);animation:pop .4s ease both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.it.txt{border-left:0;background:none;box-shadow:none;padding:2px 4px;font-size:17px;font-weight:600}
.it.tip{background:#fff7e6;border-left-color:#e9a400}
.it.rv{cursor:pointer}.it.rv .t{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800;color:var(--c);font-size:16px}
.it.rv .t::after{content:"＋";font-size:20px;width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c) 14%,#fff);display:grid;place-items:center;flex:0 0 auto;transition:transform .25s}
.it.rv.open .t::after{content:"−"}.it .b{display:none;margin-top:6px;font-size:16px}.it.rv.open .b{display:block;animation:pop .3s ease}
.it.flat .t{font-weight:800;color:var(--c);font-size:16px}.it.flat .b{display:block;margin-top:4px}
.hint{color:var(--mute);font-size:13px;margin:10px 2px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.hint button{border:0;background:none;color:var(--k);font:700 13px system-ui;cursor:pointer;padding:0}
.nav{display:flex;gap:10px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.nav button{flex:1;font:800 17px system-ui;padding:14px;border-radius:14px;border:2px solid var(--k);cursor:pointer;background:#fff;color:var(--k)}
.nav .nx{background:var(--k);color:#fff;flex:2}.nav button:disabled{opacity:.35}
/* start */
.st{border-radius:24px;overflow:hidden;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--k) 92%,transparent),rgba(11,31,58,.92)),url(img/szuflada-leki.jpg) center/cover;padding:26px 20px;text-align:center}
.st .em{font-size:74px;line-height:1;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.st h2{font-size:32px;margin:10px 0 4px}.st p{margin:0 0 14px;opacity:.95;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chips span{background:rgba(255,255,255,.18);padding:6px 11px;border-radius:999px;font-size:13.5px;font-weight:700}
.toc2{background:#fff;border-radius:16px;padding:10px 14px;margin-top:14px}.toc2 ol{margin:6px 0;padding-left:22px}.toc2 li{margin:3px 0;cursor:pointer}
/* quiz */
.qq{background:#fff;border-radius:16px;padding:16px;margin-top:14px;font-size:18px;font-weight:700}
.op{display:block;width:100%;text-align:left;font:600 16px system-ui;padding:14px;margin:9px 0;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);animation:pop .35s ease both}
.op.ok{background:#2b9348;border-color:#2b9348;color:#fff}.op.bad{background:#e63946;border-color:#e63946;color:#fff;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ex{background:#eef7ee;border-radius:12px;padding:10px 12px;font-size:15px;margin-top:6px}.ex.no{background:#fdecea}
.end{text-align:center;background:#fff;border-radius:22px;padding:24px 18px;margin-top:8px}
.ring{width:150px;height:150px;margin:6px auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--k) calc(var(--p)*1%),#e3e8ef 0);}
.ring b{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px}
.end a,.end button{display:block;margin:10px 0;padding:14px;border-radius:14px;font:800 16px system-ui;text-decoration:none;border:2px solid var(--k);color:var(--k);background:#fff;cursor:pointer;width:100%}
.end .p1{background:var(--k);color:#fff}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.conf i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* monitor adenozyna */
.mon{background:#07140f;border-radius:18px;padding:12px;margin-top:14px;box-shadow:inset 0 0 0 3px #1d3b2f}
.mon svg{width:100%;height:auto;display:block;background:#07140f;border-radius:8px}.mon .g1{stroke:#0f2a1f;stroke-width:.5}.mon .g5{stroke:#164031;stroke-width:1}
.mon .tr{fill:none;stroke:#39ff88;stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 3px #39ff88)}
.mon .hr{display:flex;justify-content:space-between;color:#39ff88;font:800 15px ui-monospace,monospace;margin-bottom:6px}.mon .hr b{font-size:26px}
.mon .msg{color:#cfe;font-size:15px;min-height:46px;margin-top:8px}
.mon button{width:100%;margin-top:8px;padding:14px;border-radius:12px;border:0;background:#e63946;color:#fff;font:800 17px system-ui;cursor:pointer}
.lock{text-align:center;background:#fff;border-radius:20px;padding:24px;margin-top:14px}.lock a{display:inline-block;margin-top:10px;background:var(--red);color:#fff;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:800}
</style></head>
<body>
<div id="idx">
<div class="top"><a href="/">🚑 ratownik<b>medyczny</b>.online</a><a class="bk" href="materialy.html#karty-lekow">Karty leków</a></div>
<header class="hero"><h1>🎓 Kursy leków <span>krok po kroku</span></h1><p>Każdy lek jako krótka lekcja: ekran po ekranie, dotykasz kafelki, słuchasz czytania na głos, a na końcu sprawdzasz się w quizie.</p></header>
<div class="list" id="list"></div>
</div>

<div id="play">
<div class="bar"><a class="x" id="close" href="kurs.html" aria-label="Zamknij kurs">✕</a><div class="nm" id="nm"></div><button class="say" id="say" type="button">🔊 Czytaj</button></div>
<div class="prog" id="prog"></div>
<div class="stage" id="stage"></div>
<div class="nav"><button id="prev" type="button">← Wstecz</button><button class="nx" id="next" type="button">Dalej →</button></div>
</div>

<script src="leki-data.js"></script>
<script src="pro.js"></script>
<script>
const SC=['#457b9d','#8e5bd6','#2a9d8f','#e63946','#d62828','#f4a261','#1d4e89','#6a994e','#c1121f','#0096c7','#b5179e'];
const ICO={Charakter:'🧬',Mechan:'⚙️',Farmakokin:'⏱️',Wskaz:'🎯',Dawk:'💉',Techn:'🩺',Przygot:'🧪',Działania:'⚠️',Niepoż:'⚠️',Przeciw:'⛔',Interak:'🔗',Kompet:'⚖️',Podsum:'⭐',Zatru:'☠️',Dzieci:'🧒',Ciąż:'🤰',Monitor:'📈',Odtrut:'🛟',Postać:'💊'};
function ico(l){for(const k in ICO)if(l.indexOf(k)>=0)return ICO[k];return '📌'}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function fmt(x){return esc(x).replace(/^§([^§]+)§/,'<b>$1:</b> ')}
const P=new URLSearchParams(location.search), ID=P.get('lek');
function locked(id){return FREE.indexOf(id)<0 && !(window.RM&&RM.isPro&&RM.isPro())}

/* ---------- lista */
if(!ID||!LEKI[ID]){
  document.getElementById('list').innerHTML=ORDER.filter(k=>LEKI[k]).map(k=>{const d=LEKI[k];return '<a class="kc'+(k==='adenozyna'?' new':'')+'" style="--c:'+d.k+'" href="kurs.html?lek='+k+'"><i>'+d.e+'</i><b>'+esc(d.n)+'</b><small>'+esc(d.t)+'</small>'+(locked(k)&&k!=='adenozyna'?'<span class="lk">🔒</span>':'')+'</a>'}).join('');
} else start(ID);

function start(id){
  const d=LEKI[id];document.body.classList.add('playing');document.documentElement.style.setProperty('--k',d.k);
  document.title='Kurs: '+d.n+' – ratownik medyczny';document.getElementById('nm').textContent=d.e+' '+d.n;
  const S=[];S.push({t:'start'});
  if(locked(id)){S.push({t:'lock'})}else{
    d.s.forEach((s,i)=>{S.push({t:'sec',s,i});if(id==='adenozyna'&&i===2)S.push({t:'mon'})});
    (LQ[id]||[]).forEach(q=>S.push({t:'q',q}));
  }
  S.push({t:'end'});
  let cur=0,score=0,answered=0,dir=1;const st=document.getElementById('stage');
  document.getElementById('prog').innerHTML=S.map(()=>'<i></i>').join('');
  function nextId(){const i=ORDER.indexOf(id);return ORDER[(i+1)%ORDER.length]}
  function render(){
    speechSynthesis&&speechSynthesis.cancel();sayBtn.classList.remove('on');
    const s=S[cur];let h='';
    document.querySelectorAll('#prog i').forEach((e,i)=>e.classList.toggle('d',i<=cur));
    if(s.t==='start'){
      const nq=(LQ[id]||[]).length;
      h='<div class="st"><div class="em">'+d.e+'</div><h2>'+esc(d.n)+'</h2><p>'+esc(d.t)+'</p><div class="chips"><span>📚 '+d.s.length+' lekcji</span><span>❓ '+nq+' pytań</span><span>⏱️ ok. '+Math.max(3,Math.round(d.s.length*.8+nq*.4))+' min</span></div></div>'+
      '<div class="toc2"><b>W tym kursie:</b><ol>'+d.s.map((x,i)=>'<li data-go="'+(1+i+(id==='adenozyna'&&i>2?1:0))+'">'+ico(x.h[0])+' '+esc(x.h[0].replace(/^\d\d · /,''))+'</li>').join('')+'</ol></div>';
    } else if(s.t==='sec'){
      const lab=(s.s.h[0]||'').replace(/^\d\d · /,''),sum=/Podsum/.test(lab),c=sum?'#2b9348':SC[s.i%SC.length];
      let n=0;const items=s.s.c.map((it,j)=>{const last=j===s.s.c.length-1,delay='style="animation-delay:'+(j*90)+'ms"';
        if(it.length===1){const m=it[0].match(/^§([^§]+)§(.*)$/);if(m){n++;return '<div class="it rv" '+delay+'><div class="t">'+esc(m[1])+'</div><div class="b">'+esc(m[2])+'</div></div>'}
          if(last&&it[0].length>40)return '<div class="it tip" '+delay+'>⚠️ '+esc(it[0])+'</div>';return '<div class="it txt" '+delay+'>'+esc(it[0])+'</div>'}
        n++;const t=it[0].replace(/^§([^§]+)§(.*)$/,'$1 · $2');return '<div class="it rv" '+delay+'><div class="t">'+esc(t)+'</div><div class="b">'+it.slice(1).map(fmt).join('<br>')+'</div></div>'}).join('');
      h='<div class="hd" style="--c:'+c+'" data-e="'+ico(lab)+'"><small>'+ico(lab)+' '+esc(lab)+'</small><h2>'+esc(s.s.h[1]||'')+'</h2></div><div class="its" style="--c:'+c+'">'+items+'</div>'+
        (n?'<div class="hint"><span>👆 Dotknij kafelek, aby go odsłonić</span><button type="button" id="all">Pokaż wszystko</button></div>':'');
    } else if(s.t==='mon'){
      h='<div class="hd" style="--c:#0b1f3a" data-e="📈"><small>📈 Zobacz na monitorze</small><h2>Co się dzieje po bolusie adenozyny?</h2></div>'+
      '<div class="mon"><div class="hr"><span>II · 25 mm/s</span><span>HR <b id="hr">180</b></span></div>'+ADENO+'<div class="msg" id="msg">Częstoskurcz nadkomorowy 180/min, wąskie QRS. Pacjent stabilny, manewr Valsalvy nie pomógł.</div><button type="button" id="bolus">💉 Podaj 6 mg szybkim bolusem + 20 ml NaCl</button></div>';
    } else if(s.t==='q'){
      const q=s.q,k=S.slice(0,cur).filter(x=>x.t==='q').length+1,N=S.filter(x=>x.t==='q').length;
      h='<div class="hd" style="--c:#0b1f3a" data-e="❓"><small>❓ Quiz · pytanie '+k+' z '+N+'</small><h2>Sprawdź, co zapamiętałeś</h2></div><div class="qq">'+esc(q.q)+'</div>'+
        q.o.map((o,j)=>'<button class="op" type="button" data-j="'+j+'" style="animation-delay:'+(j*70)+'ms">'+esc(o)+'</button>').join('')+'<div id="ex"></div>';
    } else if(s.t==='lock'){
      h='<div class="lock"><div style="font-size:54px">🔒</div><h2>Kurs w pakiecie Pro</h2><p>12 pierwszych leków jest za darmo. Pełny dostęp do wszystkich kursów, kart i egzaminów: 99 zł za rok.</p><a href="cennik.html">Zobacz pakiet Pro</a></div>';
    } else {
      const N=S.filter(x=>x.t==='q').length,p=N?Math.round(score/N*100):100,nx=nextId();
      h='<div class="end"><div style="font-size:46px">'+(p>=80?'🏆':p>=50?'👍':'📖')+'</div><h2>'+(p>=80?'Świetnie!':p>=50?'Dobrze, jeszcze trochę!':'Warto powtórzyć')+'</h2>'+(N?'<div class="ring" style="--p:'+p+'"><b>'+score+'/'+N+'</b></div>':'')+
        '<a class="p1" href="kurs.html?lek='+nx+'">Następny kurs: '+LEKI[nx].e+' '+esc(LEKI[nx].n)+' →</a><button type="button" id="again">🔁 Powtórz ten kurs</button><a href="materialy.html#lek-'+id+'">📇 Karta leku na jednej stronie</a>'+(d.pdf?'<a href="biblioteka.html#leki">📚 Wersja PDF w bibliotece</a>':'')+'<a href="kurs.html">🎓 Wszystkie kursy</a></div>';
      if(p>=80&&N)conf();
    }
    st.innerHTML='<div class="sl'+(dir<0?' back':'')+'">'+h+'</div>';st.scrollTop=0;
    document.getElementById('prev').disabled=cur===0;
    const nb=document.getElementById('next');nb.textContent=cur===0?'Zaczynamy →':cur===S.length-1?'Zakończ':'Dalej →';
    st.querySelectorAll('.it.rv').forEach(e=>e.onclick=()=>e.classList.toggle('open'));
    const al=document.getElementById('all');if(al)al.onclick=()=>st.querySelectorAll('.it.rv').forEach(e=>e.classList.add('open'));
    st.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(+e.dataset.go));
    const ag=document.getElementById('again');if(ag)ag.onclick=()=>{score=0;S.forEach(x=>x.done=0);go(0)};
    if(s.t==='q'){if(s.done)showAns(s,s.pick);st.querySelectorAll('.op').forEach(b=>b.onclick=()=>{if(s.done)return;s.done=1;s.pick=+b.dataset.j;if(s.pick===s.q.a)score++;showAns(s,s.pick)})}
    if(s.t==='mon')monitor();
  }
  function showAns(s,j){st.querySelectorAll('.op').forEach(b=>{const k=+b.dataset.j;b.disabled=true;if(k===s.q.a)b.classList.add('ok');else if(k===j)b.classList.add('bad')});
    document.getElementById('ex').innerHTML='<div class="ex'+(j===s.q.a?'':' no')+'">'+(j===s.q.a?'✅ Dobrze! ':'❌ Nie tym razem. ')+esc(s.q.e||'')+'</div>'}
  function go(i){if(i<0||i>=S.length)return;dir=i>=cur?1:-1;cur=i;render()}
  document.getElementById('next').onclick=()=>cur===S.length-1?location.href='kurs.html':go(cur+1);
  document.getElementById('prev').onclick=()=>go(cur-1);
  addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  let x0=null,y0=null;st.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  st.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(cur+(dx<0?1:-1));x0=null},{passive:true});
  const sayBtn=document.getElementById('say');
  sayBtn.onclick=()=>{if(!window.speechSynthesis)return;if(speechSynthesis.speaking){speechSynthesis.cancel();sayBtn.classList.remove('on');return}
    st.querySelectorAll('.it.rv').forEach(e=>e.classList.add('open'));
    const u=new SpeechSynthesisUtterance(st.innerText.replace(/[＋−👆]/g,'').replace(/Pokaż wszystko/,''));u.lang='pl-PL';u.rate=1;const v=speechSynthesis.getVoices().find(v=>/^pl/i.test(v.lang));if(v)u.voice=v;
    u.onend=()=>sayBtn.classList.remove('on');sayBtn.classList.add('on');speechSynthesis.speak(u)};
  render();
}
function conf(){const c=document.createElement('div');c.className='conf';const col=['#e63946','#ffd166','#2b9348','#457b9d','#8e5bd6'];for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=col[i%5];e.style.animationDelay=Math.random()*.8+'s';c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}
/* animacja monitora (adenozyna) */
function monitor(){
  const pl=document.querySelector('.mon polyline'),L=pl.getTotalLength(),W=+document.querySelector('.mon svg').viewBox.baseVal.width;
  const hr=document.getElementById('hr'),msg=document.getElementById('msg'),btn=document.getElementById('bolus');
  const svtLen=lenAt(pl,W*2/6);pl.style.strokeDasharray=L;pl.style.strokeDashoffset=L-svtLen;
  btn.onclick=()=>{btn.disabled=true;btn.textContent='⏳ Lek płynie do serca…';const t0=performance.now(),dur=6000;
    (function f(t){const p=Math.min(1,(t-t0)/dur);const sec=2+p*4;pl.style.strokeDashoffset=L-lenAt(pl,W*sec/6);
      if(sec<2.3){hr.textContent='180'}else if(sec<3.9){hr.textContent='---';msg.textContent='⏸️ Kilka sekund pauzy (przejściowy blok AV). Pacjent czuje ucisk w klatce, gorąco, lęk – to oczekiwany efekt, nie NZK.'}
      else{hr.textContent='72';msg.textContent='✅ Powrót rytmu zatokowego 72/min. Zapisz wydruk EKG, godzinę i dawkę w dokumentacji.'}
      if(p<1)requestAnimationFrame(f);else{btn.disabled=false;btn.textContent='🔁 Zobacz jeszcze raz';btn.onclick=()=>{msg.textContent='Częstoskurcz nadkomorowy 180/min, wąskie QRS.';hr.textContent='180';monitor();document.getElementById('bolus').click()}}})(t0)};
}
function lenAt(pl,x){const pts=pl.points;let l=0;for(let i=1;i<pts.numberOfItems;i++){const a=pts.getItem(i-1),b=pts.getItem(i);if(b.x>x)break;l+=Math.hypot(b.x-a.x,b.y-a.y)}return l}
</script>
