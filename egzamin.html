szczaniu z uciskiem brzucha)</div><div class=\"kv\"><span>Co oznacza</span> zapalenie wyrostka położonego zakątniczo (przy mięśniu lędźwiowym)</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Murphy’ego", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> uciskasz prawe podżebrze i każesz głęboko wziąć wdech – pacjent przerywa wdech z bólu</div><div class=\"kv\"><span>Co oznacza</span> ostre zapalenie pęcherzyka żółciowego</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Chełmońskiego", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> ból przy uderzeniu pięścią przez dłoń w prawy łuk żebrowy</div><div class=\"kv\"><span>Co oznacza</span> choroby pęcherzyka żółciowego i wątroby (zapalenie pęcherzyka, kamica)</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Goldflama", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> ból przy uderzeniu pięścią przez dłoń w okolicę lędźwiową (nerki)</div><div class=\"kv\"><span>Co oznacza</span> kolka nerkowa, odmiedniczkowe zapalenie nerek; po urazie – uszkodzenie nerki</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Kehra", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> ból promieniujący do LEWEGO barku, szczególnie na leżąco</div><div class=\"kv\"><span>Co oznacza</span> krew pod przeponą – pęknięta śledziona (także „dwuetapowe” pęknięcie dni po urazie), pęknięta ciąża pozamaciczna</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Tętniący opór w brzuchu", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> wyczuwalny tętniący guz w nadbrzuszu/okolicy pępka</div><div class=\"kv\"><span>Co oznacza</span> tętniak aorty brzusznej; z bólem i wstrząsem = pęknięcie → natychmiast do chirurgii naczyniowej</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Głowa", "k": "Objaw", "f": "Objaw Battle’a", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> zasinienie ZA UCHEM, nad wyrostkiem sutkowatym</div><div class=\"kv\"><span>Co oznacza</span> złamanie podstawy czaszki (dół środkowy); pojawia się po 24–48 h, więc wczesny brak nie wyklucza</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Głowa", "k": "Objaw", "f": "Krwiak okularowy („oczy szopa”)", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> zasinienie wokół obu oczu bez urazu oczu</div><div class=\"kv\"><span>Co oznacza</span> złamanie przedniego dołu podstawy czaszki; NIE zakładaj rurki nosowo-gardłowej ani zgłębnika przez nos</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Głowa", "k": "Objaw", "f": "Płynotok (objaw obwódki / halo)", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> wyciek z nosa lub ucha; na gazie krew w środku i jasna obwódka dookoła</div><div class=\"kv\"><span>Co oznacza</span> wyciek płynu mózgowo-rdzeniowego – złamanie podstawy czaszki; nie tamponuj ucha, przyłóż luźny jałowy opatrunek</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Klatka i serce", "k": "Objaw", "f": "Objaw Levine’a", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> pacjent kładzie zaciśniętą pięść na mostku, opisując ból</div><div class=\"kv\"><span>Co oznacza</span> typowy ból wieńcowy (dławica, zawał) – EKG w 10 min</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Klatka i serce", "k": "Objaw", "f": "Objaw Kussmaula (żylny)", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> żyły szyjne wypełniają się BARDZIEJ przy wdechu (normalnie zapadają się)</div><div class=\"kv\"><span>Co oznacza</span> tamponada, zaciskające zapalenie osierdzia, zawał prawej komory; nie mylić z oddechem Kussmaula</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Klatka i serce", "k": "Objaw", "f": "Tętno paradoksalne", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> słabsze tętno i spadek ciśnienia skurczowego &gt; 10 mmHg przy wdechu</div><div class=\"kv\"><span>Co oznacza</span> tamponada serca, ciężka astma</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Oddech", "k": "Objaw", "f": "Oddech Kussmaula", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> głęboki, szybki, regularny oddech („głód powietrza”), często zapach acetonu</div><div class=\"kv\"><span>Co oznacza</span> kwasica metaboliczna: cukrzycowa kwasica ketonowa, zatrucie metanolem, niewydolność nerek</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Oddech", "k": "Objaw", "f": "Oddech Cheyne’a-Stokesa", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> oddechy coraz głębsze, potem coraz płytsze, przerwa (bezdech) i od nowa</div><div class=\"kv\"><span>Co oznacza</span> uszkodzenie mózgu (udar, wzrost ciśnienia śródczaszkowego), ciężka niewydolność serca, u umierających</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Oddech", "k": "Objaw", "f": "Oddech Biota", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> nieregularne oddechy o różnej głębokości z bezdechami, bez rytmu</div><div class=\"kv\"><span>Co oznacza</span> uszkodzenie pnia mózgu (rdzeń przedłużony) – zły prognostycznie</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Oddech", "k": "Objaw", "f": "Oddech agonalny (gasping)", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> pojedyncze, rzadkie, „łapiące” wdechy u nieprzytomnego</div><div class=\"kv\"><span>Co oznacza</span> objaw NZK – traktuj jak brak oddechu i zaczynaj RKO</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Metaboliczne", "k": "Objaw", "f": "Objaw Chwostka", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> opukanie nerwu twarzowego przed uchem wywołuje drganie kącika ust</div><div class=\"kv\"><span>Co oznacza</span> hipokalcemia (tężyczka), np. po hiperwentylacji, po operacji tarczycy</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Metaboliczne", "k": "Objaw", "f": "Objaw Trousseau", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> mankiet ciśnieniomierza napompowany powyżej skurczowego przez ok. 3 min → skurcz dłoni („ręka położnika”)</div><div class=\"kv\"><span>Co oznacza</span> hipokalcemia (tężyczka)</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Metaboliczne", "k": "Objaw", "f": "Zapach z ust", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> aceton (owocowy) / alkohol / gorzkie migdały / czosnek</div><div class=\"kv\"><span>Co oznacza</span> kwasica ketonowa / alkohol (ale zawsze szukaj innej przyczyny!) / cyjanki (wyczuwa tylko część ludzi) / związki fosforoorganiczne</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Kończyny i skóra", "k": "Objaw", "f": "Skrócona i zrotowana na zewnątrz noga", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> noga krótsza, stopa „wywrócona” na zewnątrz, ból biodra po upadku</div><div class=\"kv\"><span>Co oznacza</span> złamanie szyjki kości udowej (często u starszych po upadku)</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Kończyny i skóra", "k": "Objaw", "f": "Objaw Homansa", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> ból łydki przy grzbietowym zgięciu stopy</div><div class=\"kv\"><span>Co oznacza</span> może wskazywać na zakrzepicę żył głębokich – mała wiarygodność; ważniejsze: obrzęk jednej łydki, ocieplenie, zaczerwienienie</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Kończyny i skóra", "k": "Objaw", "f": "Wybroczyny niebladnące (test szklanki)", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> przyciśnięta szklanka – plamki nie bledną</div><div class=\"kv\"><span>Co oznacza</span> sepsa meningokokowa (zwłaszcza z gorączką) – pilnie, stan zagrożenia życia</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Kończyny i skóra", "k": "Objaw", "f": "Marmurkowatość skóry", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> sinofioletowe „marmurkowe” plamy, zwykle na kolanach i udach</div><div class=\"kv\"><span>Co oznacza</span> zła perfuzja – wstrząs (np. septyczny); im większy zasięg, tym gorzej</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Kończyny i skóra", "k": "Objaw", "f": "Żółtaczka", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> żółte białka oczu i skóra</div><div class=\"kv\"><span>Co oznacza</span> choroby wątroby i dróg żółciowych, hemoliza; z gorączką i bólem prawego podżebrza – triada Charcota</div>"}], "sc": [{"t": "Wypadek motocyklowy → odma prężna → częstoskurcz komorowy", "g": "Uraz + kardiologia", "ctx": "Bez masywnego krwotoku zewnętrznego. A: mówi pojedynczymi słowami, drogi drożne. B: oddech 34/min, SpO₂ 86%, lewa strona klatki się nie unosi, brak szmeru po lewej, bębenek przy opukiwaniu, odma podskórna. C: HR 128, RR 82/50, żyły szyjne poszerzone.", "q": "Co robisz najpierw?", "o": ["Odbarczenie odmy prężnej igłą po lewej", "Intubacja", "Bolus 1000 ml krystaloidu", "Kołnierz i deska, potem ocena"], "a": 0, "e": "Brak szmeru + bębenek + wstrząs + poszerzone żyły szyjne = odma prężna. Odbarczasz od razu – to leczenie przyczyny wstrząsu (obturacyjnego)."}, {"t": "Wypadek motocyklowy → odma prężna → częstoskurcz komorowy", "g": "Uraz + kardiologia", "ctx": "Po odbarczeniu syk powietrza, SpO₂ rośnie do 93%, RR 100/60. W karetce: na monitorze nagle szybki rytm z szerokimi zespołami QRS 190/min. Pacjent przytomny, ale RR spada do 78/45, mówi, że „ciemno mu przed oczami”.", "q": "Rozpoznanie i postępowanie?", "o": ["Częstoskurcz komorowy niestabilny – kardiowersja elektryczna (S/lekarz) w sedacji", "Adenozyna 6 mg", "Metoprolol 5 mg", "Obserwacja – to ból"], "a": 0, "e": "Częstoskurcz z szerokimi QRS + objawy wstrząsu = niestabilny → kardiowersja zsynchronizowana (do 3 prób), potem amiodaron 300 mg. U urazowego myśl o stłuczeniu serca."}, {"t": "Wypadek motocyklowy → odma prężna → częstoskurcz komorowy", "g": "Uraz + kardiologia", "ctx": "W trakcie przygotowania pacjent traci przytomność, nie oddycha, brak tętna. Na monitorze ten sam szybki rytm z szerokimi QRS.", "q": "Co teraz?", "o": ["Częstoskurcz komorowy bez tętna – defibrylacja (nie synchronizowana) i RKO", "Kardiowersja zsynchronizowana", "Adrenalina i dalej obserwacja", "Atropina 0,5 mg"], "a": 0, "e": "Brak tętna = NZK w rytmie do defibrylacji (pVT). Wyłącz SYNCH, defibrylacja, RKO 2 min. Po 3. wyładowaniu adrenalina 1 mg + amiodaron 300 mg. Szukaj 4H4T – u tego pacjenta: odma (sprawdź po drugiej stronie / ponownie po lewej), krwotok, tamponada."}, {"t": "Dźgnięcie nożem w klatkę piersiową → tamponada", "g": "Uraz", "ctx": "A drożne, mówi. B: oddech 26/min, SpO₂ 95%, szmer pęcherzykowy obustronnie, opukiwanie prawidłowe. C: HR 130, RR 80/55, żyły szyjne wyraźnie poszerzone, tony serca ciche. Rana nie krwawi mocno.", "q": "Co podejrzewasz?", "o": ["Tamponada serca (triada Becka)", "Odma prężna", "Wstrząs krwotoczny z rany", "Atak paniki"], "a": 0, "e": "Hipotensja + poszerzone żyły szyjne + ciche tony = triada Becka. Szmer obustronnie obecny – to nie odma."}, {"t": "Dźgnięcie nożem w klatkę piersiową → tamponada", "g": "Uraz", "ctx": "W karetce pacjent traci przytomność. Brak tętna na tętnicy szyjnej, na monitorze rytm zatokowy 120/min.", "q": "Jaki to stan i co najważniejsze?", "o": ["PEA w urazie – przyczyną tamponada; RKO, adrenalina, natychmiastowe odbarczenie osierdzia w szpitalu, jedziesz dalej", "Asystolia – kończysz resuscytację", "VF – defibrylacja", "Bradykardia – atropina"], "a": 0, "e": "Aktywność elektryczna bez tętna. W urazowym NZK najważniejsze jest leczenie przyczyny (tamponada, odma, krwotok, hipoksja) – uciskanie klatki ma mniejsze znaczenie. Uprzedź szpital: resuscytacyjna torakotomia/perikardiocenteza."}, {"t": "Dźgnięcie nożem w udo → masywny krwotok", "g": "Uraz", "ctx": "Pierwsze wrażenie: masywny krwotok tętniczy. HR 140, nawrót kapilarny 4 s, nie wyczuwasz tętna na promieniowej.", "q": "Co robisz w pierwszych sekundach (cABCDE)?", "o": ["Opaska uciskowa wysoko na udzie, mocno, zapisz godzinę", "Ocena drożności dróg oddechowych", "Dostęp dożylny i 2 l płynów", "Tlen przez maskę"], "a": 0, "e": "Masywny krwotok zewnętrzny zabija w minutach – „c” przed ABC. Opaska wysoko i ciasno, aż krwawienie ustanie."}, {"t": "Dźgnięcie nożem w udo → masywny krwotok", "g": "Uraz", "ctx": "Krwawienie zatrzymane. SBP 75, HR 135, pacjent zimny. Dostęp: jedno wkłucie 18G.", "q": "Leki i płyny?", "o": ["TXA 1 g i.v., krystaloid małymi bolusami do SBP 80–90, ochrona przed zimnem, fentanyl na ból", "2 l krystaloidu szybko do normalnego ciśnienia", "Heparyna", "Nic – szpital"], "a": 0, "e": "Wstrząs krwotoczny klasy III–IV: TXA jak najwcześniej (do 3 h), hipotensja permisywna, ogrzewanie (śmiertelna triada). Ból – fentanyl ostrożnie przy hipotensji."}, {"t": "Ból w klatce → STEMI → migotanie komór w karetce", "g": "Kardiologia", "ctx": "A, B: oddech 20/min, SpO₂ 95%. C: HR 96, RR 150/90. EKG: uniesienie ST w V1–V5. Brak uczuleń, nie bierze leków na erekcję.", "q": "Pierwsze leki?", "o": ["ASA 300 mg do rozgryzienia, nitrogliceryna 0,4 mg s.l., heparyna wg protokołu, zgłoszenie do PCI", "Tlen 15 l/min i furosemid", "Metoprolol 5 mg i amiodaron", "Tylko transport do SOR"], "a": 0, "e": "STEMI: ASA od razu; nitrogliceryna przy SBP > 90 i bez zawału prawej komory; heparyna i P2Y12 wg protokołu ośrodka PCI. Tlen nie – SpO₂ 95%."}, {"t": "Ból w klatce → STEMI → migotanie komór w karetce", "g": "Kardiologia", "ctx": "W drodze pacjent nagle traci przytomność, drgawki przez kilka sekund, brak oddechu. Monitor: migotanie komór.", "q": "Co robisz?", "o": ["Natychmiastowa defibrylacja, potem RKO 2 min", "Najpierw 2 min RKO, potem rytm", "Adrenalina 1 mg od razu", "Atropina"], "a": 0, "e": "Obserwowane VF przy założonych elektrodach – defibrylacja natychmiast (możesz do 3 wyładowań pod rząd). Każda sekunda zwłoki zmniejsza szansę."}, {"t": "Ból w klatce → STEMI → migotanie komór w karetce", "g": "Kardiologia", "ctx": "Po 2. wyładowaniu wraca rytm zatokowy, tętno 90, pacjent oddycha, GCS 7. RR 85/50, SpO₂ 90%.", "q": "Postępowanie po ROSC?", "o": ["Zabezpieczenie dróg oddechowych, tlen do SpO₂ 94–98%, cel SBP > 100, EKG, dalej do PCI", "Wieziesz do najbliższego SOR bez EKG", "Hiperwentylacja 30/min", "Nalokson"], "a": 0, "e": "Po ROSC: ABCDE, wentylacja normalna (EtCO₂ 35–45), SpO₂ 94–98% (bez hiperoksji), unikaj hipotensji, EKG – STEMI → pracownia hemodynamiki."}, {"t": "Anafilaksja w restauracji → nawrót objawów", "g": "Alergia", "ctx": "A: chrypka, obrzęk warg. B: oddech 28, świsty, SpO₂ 90%. C: HR 130, RR 85/50.", "q": "Pierwszy lek?", "o": ["Adrenalina 0,5 mg i.m. w udo", "Klemastyna 2 mg i.v.", "Hydrokortyzon 200 mg", "Salbutamol jako jedyny lek"], "a": 0, "e": "Anafilaksja z zajęciem A, B i C – adrenalina i.m. natychmiast (może być jej autostrzykawka). Pozycja: z dusznością siedząca, z hipotensją leżąca z uniesionymi nogami."}, {"t": "Anafilaksja w restauracji → nawrót objawów", "g": "Alergia", "ctx": "Po 5 minutach poprawa: RR 100/65, świsty mniejsze. Po 15 minutach w karetce znów narasta chrypka i świsty, RR 85/50.", "q": "Co robisz?", "o": ["Powtarzasz adrenalinę 0,5 mg i.m., płyny; przy braku efektu po 2 dawkach – wlew adrenaliny (S)", "Czekasz na działanie sterydu", "Podajesz drugi lek przeciwhistaminowy", "Odstawiasz tlen"], "a": 0, "e": "Adrenalinę i.m. powtarza się co 5 min. Oporna anafilaksja (po 2 dawkach i.m.) – wlew adrenaliny i.v. (S/lekarz). Pacjentka zostaje w szpitalu na obserwacji (reakcja dwufazowa)."}, {"t": "Nieprzytomny cukrzyk → hipoglikemia → odmowa transportu", "g": "Metaboliczne", "ctx": "A: chrapanie – udrożniasz. B: 16/min, SpO₂ 95%. C: HR 100, RR 140/80. D: GCS 7, źrenice równe, glikemia 28 mg/dl.", "q": "Co podajesz?", "o": ["Glukoza 20% i.v. 0,2 g/kg (ok. 70 ml przy 70 kg)", "Glukoza doustnie", "Nalokson", "Glukagon jako pierwszy, mimo założonego wkłucia"], "a": 0, "e": "Nieprzytomny – nic doustnie. Glukoza dożylnie do dużej żyły, kontrola glikemii po 10–15 min."}, {"t": "Nieprzytomny cukrzyk → hipoglikemia → odmowa transportu", "g": "Metaboliczne", "ctx": "Po glukozie wybudza się, glikemia 140 mg/dl. Je kanapkę. Mówi: „Nigdzie nie jadę, nic mi nie jest”. Bierze glimepiryd (pochodna sulfonylomocznika) i insulinę długodziałającą.", "q": "Co jest najważniejsze?", "o": ["Ryzyko nawrotu hipoglikemii przez wiele godzin – namawiasz na transport, a przy odmowie dokumentujesz świadomą odmowę", "Nic – glikemia w normie, odjeżdżasz", "Podajesz insulinę", "Podajesz drugą dawkę glukozy profilaktycznie"], "a": 0, "e": "Pochodne sulfonylomocznika i insulina długodziałająca powodują przedłużoną, nawracającą hipoglikemię. Zalecany transport. Odmowa: pacjent musi być w pełni świadomy, poinformowany o ryzyku; podpis, świadek, instrukcje dla rodziny."}, {"t": "Dziecko z gorączką → drgawki → stan padaczkowy", "g": "Pediatria", "ctx": "Masa ok. 15 kg. Drgawki trwają dalej. SpO₂ 88%. Brak wkłucia.", "q": "Lek i dawka?", "o": ["Midazolam 5 mg i.m. (lub 0,3 mg/kg podpoliczkowo ≈ 4,5 mg)", "Midazolam 10 mg i.m.", "Diazepam 0,5 mg i.v.", "Paracetamol czopek i czekasz"], "a": 0, "e": "Drgawki ≥ 5 min = leczysz. 13–40 kg: midazolam 5 mg i.m.; alternatywa diazepam doodbytniczo 5 mg (10–15 kg). Tlen, glikemia."}, {"t": "Dziecko z gorączką → drgawki → stan padaczkowy", "g": "Pediatria", "ctx": "Po 5 minutach drgawki nadal trwają. Udało się założyć wkłucie. Glikemia 95 mg/dl.", "q": "Co teraz?", "o": ["Druga dawka benzodiazepiny (midazolam 0,15 mg/kg i.v. ≈ 2 mg) i pilny transport", "Kończysz leczenie", "Trzecia, czwarta dawka benzodiazepiny w domu", "Ketoprofen"], "a": 0, "e": "Po 2 dawkach benzodiazepin bez efektu – stan padaczkowy oporny, leki 2. rzutu (lewetyracetam, walproinian) w szpitalu. Pilny transport, uprzedź szpital. Uważaj na depresję oddechu – worek pod ręką."}, {"t": "Upadek starszej osoby na lekach przeciwkrzepliwych → krwiak śródczaszkowy", "g": "Uraz + neurologia", "ctx": "GCS 15, źrenice równe, RR 160/90, HR 88 niemiarowe. Nie pamięta upadku. Chce zostać w domu.", "q": "Twoja decyzja?", "o": ["Transport do szpitala na TK głowy – uraz głowy u osoby na lekach przeciwkrzepliwych", "Zostaje w domu, bo GCS 15", "Podajesz ASA", "Lód i obserwacja przez rodzinę"], "a": 0, "e": "Leki przeciwkrzepliwe + uraz głowy + niepamięć = wysokie ryzyko krwawienia śródczaszkowego mimo GCS 15. Transport na TK."}, {"t": "Upadek starszej osoby na lekach przeciwkrzepliwych → krwiak śródczaszkowy", "g": "Uraz + neurologia", "ctx": "W karetce po 20 minutach: senna, mówi niewyraźnie, GCS 11, prawa źrenica szersza i leniwa, RR 190/100, HR 52, oddech nieregularny.", "q": "Co się dzieje?", "o": ["Narastający krwiak z wklinowaniem (anizokoria, triada Cushinga)", "Hipoglikemia", "Udar niedokrwienny – tromboliza", "Zespół abstynencyjny"], "a": 0, "e": "Spadek GCS o ≥ 2 pkt, anizokoria i triada Cushinga (nadciśnienie, bradykardia, nieregularny oddech) = wklinowanie. Szybki transport do neurochirurgii, zgłoszenie, unikaj hipoksji i hipotensji."}, {"t": "Przedawkowanie opioidów → nalokson → nawrót", "g": "Toksykologia", "ctx": "Oddech 4/min, SpO₂ 75%, źrenice szpilkowate, HR 60, GCS 3.", "q": "Kolejność działań?", "o": ["Wentylacja workiem z tlenem, potem nalokson miareczkowany", "Nalokson 2 mg i.v. przed wentylacją", "Intubacja od razu", "Pozycja boczna i czekanie"], "a": 0, "e": "Najpierw tlen i wentylacja (hipoksja zabija). Potem nalokson 0,04–0,4 mg i.v. co 2–3 min aż do wydolnego oddechu (lub 0,4 mg i.m./donosowo)."}, {"t": "Przedawkowanie opioidów → nalokson → nawrót", "g": "Toksykologia", "ctx": "Oddech wraca do 14/min, pacjent się budzi, jest pobudzony, wymiotuje, chce wyjść. 40 minut później w karetce znów oddech 6/min, senny.", "q": "Co się stało i co robisz?", "o": ["Nalokson przestał działać (działa 30–90 min) – znów wentylacja i kolejna dawka naloksonu", "Uczulenie na nalokson", "Hipoglikemia po naloksonie", "Normalny sen – nie budzisz"], "a": 0, "e": "Wiele opioidów (np. metadon, fentanyl) działa dłużej niż nalokson. Dlatego pacjent po naloksonie powinien być obserwowany w szpitalu."}, {"t": "Astma u nastolatki → cicha klatka → zatrzymanie oddechu", "g": "Oddech", "ctx": "Oddech 32/min, SpO₂ 89%, HR 135, świsty na wydechu.", "q": "Leczenie?", "o": ["Salbutamol 5 mg + ipratropium 0,5 mg w nebulizacji z tlenem, hydrokortyzon 100–200 mg", "Midazolam na uspokojenie", "Furosemid", "Tylko tlen"], "a": 0, "e": "Ciężka astma: nebulizacja ciągła/powtarzana co 20 min, steryd, przy braku poprawy MgSO₄ 2 g w 20 min."}, {"t": "Astma u nastolatki → cicha klatka → zatrzymanie oddechu", "g": "Oddech", "ctx": "Mimo leczenia: senna, osłuchowo prawie cisza nad płucami, SpO₂ 82%, HR 60.", "q": "Co oznacza „cicha klatka” i co robisz?", "o": ["Prawie brak przepływu powietrza – stan przed zatrzymaniem oddechu; adrenalina, wentylacja workiem wolno z długim wydechem, wezwanie S/intubacja", "Poprawa – świsty ustąpiły", "Odma – odbarczasz od razu obustronnie", "Hiperwentylacja – uspokajasz"], "a": 0, "e": "Brak świstów przy wyczerpaniu = zagrożenie życia. Wsparcie oddechu workiem (mała częstość, długi wydech), adrenalina i.m. 0,5 mg rozważ, intubacja przez doświadczonego (S). Przy pogorszeniu po wentylacji – myśl o odmie."}, {"t": "Kołatanie serca → SVT → adenozyna", "g": "Kardiologia", "ctx": "HR 210 miarowo, RR 110/70, bez bólu w klatce. EKG: wąskie QRS, nie widać załamków P.", "q": "Pierwszy krok?", "o": ["Zmodyfikowany manewr Valsalvy", "Kardiowersja", "Amiodaron 300 mg", "Metoprolol 5 mg"], "a": 0, "e": "Stabilny częstoskurcz z wąskimi QRS → manewry wagalne. Zmodyfikowany Valsalva: parcie 15 s (np. w strzykawkę 10 ml), potem natychmiast leżenie z uniesionymi nogami."}, {"t": "Kołatanie serca → SVT → adenozyna", "g": "Kardiologia", "ctx": "Manewr nieskuteczny.", "q": "Lek i technika podania?", "o": ["Adenozyna 6 mg szybki bolus + natychmiast 20 ml NaCl, przy braku efektu 12 mg, potem 18 mg", "Adenozyna 6 mg we wlewie 10 min", "Werapamil 20 mg", "Digoksyna"], "a": 0, "e": "Adenozyna działa kilka sekund – musi dotrzeć do serca szybko. Uprzedź pacjentkę o nieprzyjemnym uczuciu „zatrzymania serca”. Rejestruj EKG."}, {"t": "Poród w domu → noworodek nie oddycha → krwotok poporodowy", "g": "Położnictwo", "ctx": "Noworodek wiotki, nie oddycha, sinawy, tętno (osłuchowo) ok. 80/min.", "q": "Co robisz?", "o": ["Osuszenie, ogrzanie, udrożnienie, 5 oddechów rozprężających, ponowna ocena tętna", "Natychmiast uciskanie klatki 3:1", "Adrenalina 10 µg/kg", "Odsysanie głęboko przez 30 s"], "a": 0, "e": "U noworodka najważniejsza jest wentylacja. Tętno 60–100 i brak oddechu → 5 oddechów rozprężających (2–3 s), potem wentylacja 30/min. Uciśnięcia dopiero przy HR < 60 mimo skutecznej wentylacji."}, {"t": "Poród w domu → noworodek nie oddycha → krwotok poporodowy", "g": "Położnictwo", "ctx": "Noworodek zaczyna płakać, tętno 130. U matki po urodzeniu łożyska duże krwawienie, macica miękka, RR 90/55, HR 120.", "q": "Postępowanie u matki?", "o": ["Masaż macicy, TXA 1 g i.v., płyny, przystawienie dziecka do piersi, szybki transport", "Czekasz, krwawienie samo ustanie", "Tamponada pochwy gazą na siłę", "Heparyna"], "a": 0, "e": "Najczęstsza przyczyna krwotoku poporodowego to atonia macicy – masaż przez powłoki, karmienie piersią (oksytocyna własna), TXA 1 g, płyny i szybki transport na położnictwo."}, {"t": "Niemowlę z biegunką → wstrząs hipowolemiczny → hipoglikemia", "g": "Pediatria", "ctx": "Masa ok. 8 kg (0,5 × 8 mies. + 4). A drożne. B: oddech 50/min, bez wysiłku, SpO₂ 97%. C: HR 185, CRT 5 s, zimne kończyny, ciemiączko zapadnięte, sucha śluzówka, brak mokrej pieluchy od 10 h. D: reaguje tylko na ból.", "q": "Jaki to stan i co robisz?", "o": ["Wstrząs hipowolemiczny – dostęp (i.o. jeśli żyła nie wychodzi w ok. 1 min), bolus 10 ml/kg krystaloidu = 80 ml, ponowna ocena", "Nawadnianie doustne i obserwacja", "Bolus 40 ml/kg naraz", "Transport bez dostępu – płyny w szpitalu"], "a": 0, "e": "Tachykardia, CRT > 2 s, zimne kończyny i zaburzona świadomość = wstrząs. ERC 2025: bolusy po 10 ml/kg zbilansowanego krystaloidu, po każdym ponowna ocena; u dziecka we wstrząsie dostęp doszpikowy wcześnie."}, {"t": "Niemowlę z biegunką → wstrząs hipowolemiczny → hipoglikemia", "g": "Pediatria", "ctx": "Glikemia 38 mg/dl. Po pierwszym bolusie HR 170, CRT 4 s, dziecko nadal senne.", "q": "Co dalej?", "o": ["Glukoza 10% 2 ml/kg = 16 ml i.v./i.o. i drugi bolus 80 ml krystaloidu", "Glukoza 40% 20 ml", "Tylko kolejne płyny, cukier wyrówna się sam", "Glukagon 1 mg i.m."], "a": 0, "e": "Hipoglikemia u dziecka: 0,2 g/kg = 2 ml/kg glukozy 10%. Stężonej glukozy (20–40%) nie podajesz małym dzieciom – drażni żyły i daje skoki. Wstrząs nadal trwa → kolejny bolus 10 ml/kg z oceną (zwykle do 40 ml/kg w 1. godzinie, uważaj na rzężenia i powiększoną wątrobę)."}, {"t": "Niemowlę z biegunką → wstrząs hipowolemiczny → hipoglikemia", "g": "Pediatria", "ctx": "Po drugim bolusie HR 150, CRT 3 s, dziecko otwiera oczy i płacze. Glikemia 92 mg/dl.", "q": "Dokąd i jak transportujesz?", "o": ["Pilnie do SOR pediatrycznego, z matką, ciągłe monitorowanie i ocena co 5 min", "Zostawiasz w domu z zaleceniem picia", "Transport do POZ", "Do najbliższego SOR dla dorosłych bez zgłoszenia"], "a": 0, "e": "Dziecko po wstrząsie i hipoglikemii wymaga dalszego leczenia (elektrolity, gazometria, nawadnianie) – SOR pediatryczny, z wcześniejszym powiadomieniem."}, {"t": "Dziecko zakrztusiło się → traci przytomność → NZK", "g": "Pediatria", "ctx": "Dziecko przytomne, ale kaszel nieskuteczny (bezgłośny), narastająca sinica.", "q": "Co robisz?", "o": ["5 uderzeń w okolicę międzyłopatkową, potem 5 uciśnięć nadbrzusza; na przemian", "Zachęcasz do kaszlu i obserwujesz", "Palcem na ślepo wyciągasz ciało obce", "Od razu RKO"], "a": 0, "e": "Kaszel nieskuteczny u przytomnego dziecka > 1 r.ż. → 5 uderzeń w plecy, potem 5 uciśnięć nadbrzusza (u niemowlęcia zamiast nadbrzusza – uciśnięcia klatki). Nigdy nie wyciągasz palcem na ślepo – możesz wepchnąć głębiej."}, {"t": "Dziecko zakrztusiło się → traci przytomność → NZK", "g": "Pediatria", "ctx": "Dziecko wiotczeje, traci przytomność, nie oddycha.", "q": "Następny krok?", "o": ["Na płasko, otwórz usta – usuń ciało obce tylko jeśli je widać, 5 oddechów ratowniczych, potem RKO 15:2", "Kontynuujesz uderzenia w plecy", "Czekasz na powrót oddechu", "Kleszczyki na ślepo"], "a": 0, "e": "Nieprzytomne dziecko z niedrożnością = RKO. Uciśnięcia klatki działają też jak rękoczyn wypychający ciało obce. Przy każdym otwarciu dróg oddechowych zaglądasz do ust. Ratownik medyczny z laryngoskopem może pod kontrolą wzroku usunąć ciało obce kleszczykami Magilla."}, {"t": "Dziecko zakrztusiło się → traci przytomność → NZK", "g": "Pediatria", "ctx": "Pod laryngoskopem widzisz winogrono w gardle – usuwasz je. Wentylacja skuteczna, ale brak tętna, monitor: bradykardia 40/min z szerokimi QRS → po chwili asystolia. Masa ok. 12 kg.", "q": "Leki i dawki?", "o": ["Adrenalina 10 µg/kg = 120 µg i.v./i.o. (1,2 ml roztworu 100 µg/ml) jak najszybciej, co 3–5 min, RKO 15:2", "Atropina 0,5 mg", "Adrenalina 1 mg", "Amiodaron 5 mg/kg"], "a": 0, "e": "Rytm niedefibrylacyjny u dziecka → adrenalina 10 µg/kg (maks. 1 mg) jak najszybciej i co 3–5 min. Przyczyna to niedotlenienie – kluczowa jest skuteczna wentylacja tlenem. Masa: 2 × 2 + 8 = 12 kg."}, {"t": "Anafilaksja u przedszkolaka → stridor → wstrząs → druga dawka", "g": "Pediatria + alergia", "ctx": "Masa ok. 16 kg (2 × 4 + 8). Głośny stridor wdechowy, oddech 40/min, SpO₂ 91%, HR 160, RR 80/45, CRT 3 s.", "q": "Pierwszy lek, dawka i droga?", "o": ["Adrenalina i.m. 0,15 mg (0,15 ml roztworu 1 mg/ml) w przednio-boczną część uda", "Klemastyna i.v.", "Hydrokortyzon jako pierwszy", "Adrenalina 0,15 mg i.v. w bolusie"], "a": 0, "e": "Anafilaksja = adrenalina i.m. od razu. Dzieci < 6 lat: 0,15 mg (ERC/EAACI), 6–12 lat 0,3 mg, > 12 lat 0,5 mg. Leki przeciwhistaminowe i steroidy nie ratują życia i nie mogą opóźnić adrenaliny."}, {"t": "Anafilaksja u przedszkolaka → stridor → wstrząs → druga dawka", "g": "Pediatria + alergia", "ctx": "Po 5 min stridor nadal głośny, RR 70/40, dziecko bledsze i senne.", "q": "Co teraz?", "o": ["Druga dawka adrenaliny 0,15 mg i.m., bolus 10 ml/kg = 160 ml krystaloidu, adrenalina w nebulizacji na stridor", "Czekasz 15 min na efekt", "Steryd i antyhistaminik zamiast adrenaliny", "Intubacja natychmiast przez ratownika bez S"], "a": 0, "e": "Brak poprawy po 5 min → powtórz adrenalinę i.m. Wstrząs → bolus 10 ml/kg z oceną. Stridor: dodatkowo adrenalina w nebulizacji (0,5 ml/kg roztworu 1 mg/ml, maks. 5 ml). Po 2 dawkach bez efektu – anafilaksja oporna, wezwij S/LPR (wlew adrenaliny)."}, {"t": "Anafilaksja u przedszkolaka → stridor → wstrząs → druga dawka", "g": "Pediatria + alergia", "ctx": "Po kilku minutach stridor cichnie, RR 92/55, HR 135, dziewczynka płacze. Matka pyta, czy mogą wrócić do domu, „bo już dobrze”.", "q": "Co odpowiadasz?", "o": ["Transport obowiązkowy – możliwa reakcja dwufazowa; obserwacja w szpitalu", "Mogą zostać, objawy minęły", "Wystarczy tabletka przeciwhistaminowa", "Kontrola u alergologa za tydzień"], "a": 0, "e": "Po anafilaksji, szczególnie gdy potrzebne były 2 dawki adrenaliny, obserwacja w szpitalu (ryzyko nawrotu). Przy wypisie: dwa autostrzykawki z adrenaliną i skierowanie do alergologa."}, {"t": "Nastolatek: wymioty i ból brzucha → kwasica ketonowa → obrzęk mózgu", "g": "Pediatria + metaboliczne", "ctx": "Masa ok. 50 kg. Oddech głęboki, szybki (Kussmaula), zapach acetonu z ust. HR 125, RR 105/65, CRT 3 s, sucha śluzówka. GCS 14. Glikemia „HI” (> 600 mg/dl).", "q": "Rozpoznanie i płyny?", "o": ["Kwasica ketonowa (pierwsza manifestacja cukrzycy typu 1) – NaCl 0,9% 10 ml/kg = 500 ml w ciągu 30–60 min", "Bolus 20 ml/kg szybko i powtarzać", "Insulina i.v. w karetce", "Glukoza 10%"], "a": 0, "e": "Wielomocz, wielopragnienie, chudnięcie + oddech Kussmaula + aceton = cukrzycowa kwasica ketonowa. Płyny ostrożnie: zbyt szybkie nawadnianie u dzieci zwiększa ryzyko obrzęku mózgu. Bolus 10 ml/kg szybko tylko przy wstrząsie. Insuliny nie podajesz przedszpitalnie (ryzyko hipokaliemii, nagłego spadku osmolalności)."}, {"t": "Nastolatek: wymioty i ból brzucha → kwasica ketonowa → obrzęk mózgu", "g": "Pediatria + metaboliczne", "ctx": "W trakcie transportu chłopiec skarży się na silny ból głowy, robi się coraz bardziej senny (GCS 11), HR spada do 60, RR rośnie do 150/90.", "q": "Co się dzieje?", "o": ["Obrzęk mózgu w kwasicy ketonowej – zwolnij płyny, uniesienie głowy 30°, powiadom szpital (leczenie: mannitol lub hipertoniczny NaCl wg lekarza)", "Hipoglikemia", "Sen po wysiłku", "Zwiększasz tempo płynów"], "a": 0, "e": "Ból głowy, spadek GCS, bradykardia i wzrost ciśnienia (odruch Cushinga) u dziecka z kwasicą = obrzęk mózgu – najgroźniejsze powikłanie. Ogranicz płyny, głowa w osi uniesiona 30°, tlen; leczenie: mannitol 0,5–1 g/kg lub 3% NaCl 2,5–5 ml/kg (zlecenie lekarza)."}, {"t": "Dziecko potrącone przez samochód → krwotok wewnętrzny → narastający uraz głowy", "g": "Pediatria + uraz", "ctx": "Masa ok. 28 kg (3 × 7 + 7). A drożne. B: 30/min, SpO₂ 95%. C: HR 145, RR 92/60, CRT 3 s, otarcia i zasinienie lewego podżebrza, brzuch bolesny po lewej. Boli go lewy bark. D: GCS 15, krwiak na potylicy.", "q": "Co podejrzewasz?", "o": ["Uraz śledziony z krwawieniem (objaw Kehra), początek wstrząsu", "Złamanie obojczyka", "Stłuczenie brzucha bez znaczenia", "Atak paniki"], "a": 0, "e": "Uraz lewego podżebrza + ból lewego barku (objaw Kehra) + tachykardia i wydłużony CRT = krwawienie ze śledziony. U dzieci ciśnienie długo się trzyma – spadek RR to późny objaw."}, {"t": "Dziecko potrącone przez samochód → krwotok wewnętrzny → narastający uraz głowy", "g": "Pediatria + uraz", "ctx": "W karetce: RR 78/45, HR 165, CRT 4 s.", "q": "Płyny?", "o": ["Bolus 10 ml/kg = 280 ml (najlepiej krew; w ZRM krystaloid) i ponowna ocena, cel: ciśnienie dolnej granicy normy", "2 litry krystaloidu", "Bez płynów – hipotensja permisywna jak u dorosłego bez limitu", "Koloidy"], "a": 0, "e": "Dziecko we wstrząsie krwotocznym: bolusy 10 ml/kg z ponowną oceną, celem jest perfuzja (świadomość, CRT, tętno), nie pełna norma. Dolna granica SBP u dziecka: 70 + 2 × wiek = 84 mmHg."}, {"t": "Dziecko potrącone przez samochód → krwotok wewnętrzny → narastający uraz głowy", "g": "Pediatria + uraz", "ctx": "Po 10 min chłopiec przestaje odpowiadać na pytania, otwiera oczy tylko na ból, wyprostne ruchy kończyn, lewa źrenica szersza i wolno reaguje, HR 70, RR 140/85.", "q": "Co to oznacza i co robisz?", "o": ["Krwiak śródczaszkowy z wgłobieniem (GCS ok. 6, anizokoria, Cushing) – zabezpiecz drogi oddechowe (S/LPR), normowentylacja EtCO₂ 35–40, unieś głowę w osi 30°", "Hipoglikemia – glukoza", "Drgawki – midazolam", "Zatrzymujesz płyny i czekasz"], "a": 0, "e": "Spadek GCS, anizokoria i triada Cushinga (bradykardia, nadciśnienie, zaburzenia oddechu) = wgłobienie. Ochrona mózgu: tlen, unikaj hipotensji i hipoksji, normowentylacja; krótkotrwała hiperwentylacja (EtCO₂ 30–35) tylko przy objawach wgłobienia. Ośrodek z neurochirurgią dziecięcą."}, {"t": "Niemowlę z infekcją → bezdechy → bradykardia → NZK", "g": "Pediatria", "ctx": "Masa ok. 5 kg. Oddech nieregularny z przerwami 15–20 s, SpO₂ 78%. HR 90, CRT 4 s. Przy osłuchiwaniu trzeszczenia i świsty obustronnie.", "q": "Co robisz?", "o": ["Pozycja neutralna (wałek pod barki), odessanie nosa, wentylacja workiem z tlenem", "Tylko tlen biernie przez maskę", "Uciskanie klatki", "Salbutamol w nebulizacji jako pierwsze"], "a": 0, "e": "Bezdechy u małego niemowlęcia z infekcją (zapalenie oskrzelików, krztusiec) prowadzą do hipoksji. Niewydolny oddech = wspomagaj workiem. U niemowlęcia głowa w pozycji neutralnej, a nos odsysasz – niemowlę oddycha głównie nosem."}, {"t": "Niemowlę z infekcją → bezdechy → bradykardia → NZK", "g": "Pediatria", "ctx": "Mimo wentylacji tętno spada do 50/min, dziecko bez reakcji, skóra szara, CRT 6 s.", "q": "Co teraz?", "o": ["Uciskanie klatki 15:2 techniką dwóch kciuków obejmujących klatkę – bradykardia < 60 z cechami złej perfuzji mimo wentylacji", "Atropina i czekanie", "Kontynuujesz tylko wentylację", "Defibrylacja 4 J/kg"], "a": 0, "e": "U dziecka tętno < 60/min z objawami złej perfuzji mimo skutecznej wentylacji traktujesz jak NZK. Niemowlę: dwa kciuki, 1/3 głębokości klatki (ok. 4 cm), 100–120/min, 15:2."}, {"t": "Niemowlę z infekcją → bezdechy → bradykardia → NZK", "g": "Pediatria", "ctx": "Po adrenalinie i 2 min RKO tętno 140/min, SpO₂ 92% przy wentylacji.", "q": "Postępowanie po ROSC?", "o": ["Dalsza wentylacja, SpO₂ 94–98%, glikemia, ochrona przed wychłodzeniem, transport do szpitala z OIT dziecięcym", "Wyłączasz tlen", "Kończysz wentylację, bo jest tętno", "Bolus 40 ml/kg"], "a": 0, "e": "Po ROSC unikaj hipoksji i hiperoksji (SpO₂ 94–98%), normowentylacja, kontrola glikemii i temperatury. Niemowlęta szybko się wychładzają."}, {"t": "Oparzenie wrzątkiem u dziecka → ból → wstrząs oparzeniowy", "g": "Pediatria + uraz", "ctx": "Masa ok. 14 kg. Oparzenia: przód klatki i brzucha, prawe ramię i przedramię – pęcherze, skóra różowa i biała. Twarz i drogi oddechowe bez zmian. HR 160, SpO₂ 98%. Temp. 35,6°C.", "q": "Jaki odsetek powierzchni i co z chłodzeniem?", "o": ["Ok. 13–15% (przód tułowia u dziecka ~18%, część ramienia); chłodzenie zakończ – ryzyko hipotermii, okryj", "1% – chłodzić dalej lodem", "50%", "Nie da się ocenić"], "a": 0, "e": "U dzieci reguła dziewiątek jest zmodyfikowana (głowa większa – 18%). Pomaga reguła dłoni: dłoń z palcami dziecka = ok. 1% jego powierzchni. Chłodzenie letnią wodą ok. 20 min, nie lodem; przy temperaturze < 36°C przerwij i ogrzewaj."}, {"t": "Oparzenie wrzątkiem u dziecka → ból → wstrząs oparzeniowy", "g": "Pediatria + uraz", "ctx": "Dziewczynka bardzo cierpi, nie da się jej zbadać.", "q": "Leczenie bólu?", "o": ["Fentanyl donosowo 1,5 µg/kg ≈ 20 µg (lub morfina 0,1 mg/kg i.v.); ketamina 1 mg/kg i.v. wg lekarza/S", "Paracetamol czopek i nic więcej", "Diazepam", "Bez leków – nie maskujemy objawów"], "a": 0, "e": "Oparzenie to jeden z najsilniej bolesnych urazów. Donosowy fentanyl działa szybko i nie wymaga wkłucia (atomizer MAD, max 1 ml na nozdrze)."}, {"t": "Oparzenie wrzątkiem u dziecka → ból → wstrząs oparzeniowy", "g": "Pediatria + uraz", "ctx": "Transport 50 min do ośrodka leczenia oparzeń. HR 165, CRT 3 s.", "q": "Płyny?", "o": ["Oparzenie > 10% u dziecka → wlew krystaloidu ok. 125 ml/h (dziecko ≤ 5 lat), ocena perfuzji", "Bez płynów", "2 litry w bolusie", "Glukoza 5%"], "a": 0, "e": "W transporcie: dzieci ≤ 5 lat ok. 125 ml/h, 6–13 lat 250 ml/h (ATLS). Formuła Parkland (dzieci 3 ml × kg × %TBSA na dobę, połowa w 8 h od urazu) – liczy się w szpitalu. Pamiętaj o glukozie u małych dzieci."}, {"t": "„Grypa” całej rodziny → zatrucie tlenkiem węgla → ciężarna i dziecko", "g": "Toksykologia + kilku pacjentów", "ctx": "Kobieta: ból głowy, nudności, HR 110, SpO₂ 99%. Chłopiec: GCS 12, wymioty, SpO₂ 99%. Ojciec: zawroty głowy, chwiejny chód.", "q": "Co najpierw?", "o": ["Bezpieczeństwo: wyjście wszystkich na zewnątrz / przewietrzenie, wezwanie straży, czujnik CO – podejrzenie zatrucia tlenkiem węgla", "Badanie ABCDE w mieszkaniu", "Tlen tylko u najciężej chorego", "Uspokajasz – to grypa żołądkowa"], "a": 0, "e": "Kilka osób z jednego mieszkania z bólem głowy i wymiotami zimą = tlenek węgla, dopóki nie wykluczysz. Najpierw bezpieczeństwo zespołu (zasada 1), potem pacjenci. Pulsoksymetr pokazuje fałszywie wysoką saturację (karboksyhemoglobina)."}, {"t": "„Grypa” całej rodziny → zatrucie tlenkiem węgla → ciężarna i dziecko", "g": "Toksykologia + kilku pacjentów", "ctx": "Dysponujesz jedną karetką do czasu przyjazdu drugiej. SpCO: chłopiec 25%, kobieta 18%, ojciec 15%.", "q": "Leczenie?", "o": ["Tlen 100% przez maskę z rezerwuarem 15 l/min u wszystkich, monitor EKG; chłopca i ciężarną zgłoś do ośrodka z komorą hiperbaryczną", "Tlen 2 l/min przez wąsy", "Tlen tylko gdy SpO₂ < 94%", "Nalokson"], "a": 0, "e": "Tlen 100% skraca półtrwanie karboksyhemoglobiny z ok. 4–5 h do ok. 1 h. Wskazania do tlenoterapii hiperbarycznej m.in.: utrata przytomności / zaburzenia neurologiczne, ciąża, objawy niedokrwienia serca, wysoka COHb. Płód jest szczególnie wrażliwy."}, {"t": "„Grypa” całej rodziny → zatrucie tlenkiem węgla → ciężarna i dziecko", "g": "Toksykologia + kilku pacjentów", "ctx": "Chłopiec w karetce ma uogólnione drgawki trwające 5 min. Masa ok. 18 kg.", "q": "Lek i dawka?", "o": ["Midazolam 5 mg i.m. (13–40 kg) lub 0,2 mg/kg ≈ 3,5 mg i.n.; kontynuuj tlen 100%", "Diazepam 20 mg i.v.", "Fenytoina", "Brak leczenia, drgawki same ustąpią"], "a": 0, "e": "Drgawki ≥ 5 min → benzodiazepina. Przyczyną jest niedotlenienie mózgu przez CO – tlen 100% dalej, glikemia."}, {"t": "Dziecko wpadło do stawu → NZK w hipotermii", "g": "Pediatria + środowiskowe", "ctx": "Masa ok. 22 kg. Brak oddechu, brak oznak życia.", "q": "Jak zaczynasz resuscytację?", "o": ["5 oddechów ratowniczych, potem RKO 15:2 – w utonięciu przyczyną jest niedotlenienie", "Najpierw usuwanie wody z płuc (ułożenie głową w dół)", "Od razu defibrylacja", "Uciskanie bez wentylacji"], "a": 0, "e": "Utonięcie = NZK z hipoksji. Zaczynasz od 5 oddechów ratowniczych (tlen jak najszybciej), potem 15:2 u dziecka. Nie próbujesz „wylewać wody” – opóźnia RKO i grozi aspiracją."}, {"t": "Dziecko wpadło do stawu → NZK w hipotermii", "g": "Pediatria + środowiskowe", "ctx": "Temperatura głęboka 27°C. Monitor: VF.", "q": "Defibrylacja i leki w głębokiej hipotermii?", "o": ["Do 3 defibrylacji 4 J/kg (ok. 90 J); jeśli < 30°C nie podawaj leków; RKO i ogrzewanie, transport do ośrodka ECLS (krążenie pozaustrojowe)", "Defibrylacja bez limitu co 2 min", "Adrenalina co 3 min jak w normotermii", "Kończysz – dziecko było 10 min pod wodą"], "a": 0, "e": "Hipotermia < 30°C: maksymalnie 3 próby defibrylacji, leki wstrzymane do > 30°C; 30–35°C: odstępy między dawkami adrenaliny podwojone. Zimna woda chroni mózg – dzieci przeżywały długie NZK w hipotermii. Nie kończysz resuscytacji przed ogrzaniem (jeśli brak innych oczywistych przeciwwskazań)."}, {"t": "Gorączka i wysypka u dziecka → wstrząs septyczny (meningokoki)", "g": "Pediatria + sepsa", "ctx": "Masa ok. 16 kg. Temp. 39,8°C, HR 175, CRT 5 s, zimne dłonie i stopy, RR 85/50, oddech 40/min, SpO₂ 95%. Wybroczyny nie bledną pod naciśniętą szklanką.", "q": "Rozpoznanie i co najważniejsze?", "o": ["Podejrzenie sepsy meningokokowej z wstrząsem – tlen, dostęp (i.o.), bolus 10 ml/kg = 160 ml krystaloidu, pilny transport z wyprzedzeniem", "Wysypka alergiczna – antyhistaminik", "Zbijasz gorączkę i obserwujesz w domu", "Ospa wietrzna"], "a": 0, "e": "Gorączka + wysypka niebledniejąca + objawy wstrząsu = sepsa meningokokowa (stan bezpośredniego zagrożenia życia, może się pogorszyć w godzinach). Antybiotyk jak najszybciej – w szpitalu, a jeśli zespół ma ceftriakson w wyposażeniu i zlecenie lekarza: 100 mg/kg i.v. (maks. 4 g), bez opóźniania transportu."}, {"t": "Gorączka i wysypka u dziecka → wstrząs septyczny (meningokoki)", "g": "Pediatria + sepsa", "ctx": "Po 2 bolusach (320 ml) HR 170, CRT 5 s, RR 70/40, dziewczynka coraz bardziej senna.", "q": "Co teraz?", "o": ["Wstrząs oporny na płyny – kolejny bolus z oceną (do 40–60 ml/kg), wezwij S / lekarza: lek wazoaktywny (adrenalina/noradrenalina we wlewie)", "Kończysz płyny, wystarczy", "Furosemid", "Paracetamol i.v. jako leczenie wstrząsu"], "a": 0, "e": "Po 40–60 ml/kg bez poprawy dziecko potrzebuje leków wazoaktywnych (zlecenie lekarza, wlew przez pompę). Obserwuj przeciążenie płynami (rzężenia, powiększona wątroba). Uprzedź szpital – zespół OIT dziecięcego na przyjęciu."}, {"t": "Ciężarna: ból głowy → rzucawka → zatrucie magnezem", "g": "Położnictwo + neurologia", "ctx": "RR 172/112, HR 98, ból w nadbrzuszu po prawej, mroczki. Glikemia 96. W trakcie badania – uogólnione drgawki toniczno-kloniczne.", "q": "Rozpoznanie i lek?", "o": ["Rzucawka – siarczan magnezu 4 g i.v. w 15–20 min (np. 20% 20 ml), ułożenie na lewym boku, tlen", "Diazepam jako pierwszy wybór, dawka jak w padaczce", "Nifedypina p.o. w trakcie drgawek", "Tylko obserwacja – drgawki minęły"], "a": 0, "e": "Nadciśnienie w ciąży + ból głowy, mroczki, ból w nadbrzuszu (ciężki stan przedrzucawkowy) + drgawki = rzucawka. Lek z wyboru: MgSO₄ 4 g i.v. powoli, potem wlew 1–2 g/h. Benzodiazepinę dajesz tylko, gdy magnezu nie ma albo drgawki się powtarzają mimo magnezu."}, {"t": "Ciężarna: ból głowy → rzucawka → zatrucie magnezem", "g": "Położnictwo + neurologia", "ctx": "Drgawki ustały. RR nadal 175/115.", "q": "Ciśnienie – co robisz?", "o": ["Obniżasz ostrożnie (lekarz: urapidyl lub labetalol i.v.) do ok. < 160/110 – nie gwałtownie, bo spadnie przepływ łożyskowy", "Nic – ciśnienie nie ma znaczenia", "Nitrogliceryna s.l. 3 dawki szybko", "Furosemid 40 mg"], "a": 0, "e": "Ciśnienie ≥ 160/110 w ciąży leczysz (ryzyko udaru krwotocznego), ale łagodnie, bo zbyt duży spadek zagraża dziecku. Leki i dawki ustala lekarz / zespół S."}, {"t": "Ciężarna: ból głowy → rzucawka → zatrucie magnezem", "g": "Położnictwo + neurologia", "ctx": "Po 40 min wlewu magnezu: oddech 9/min, pacjentka senna, brak odruchu z mięśnia czworogłowego (kolanowego).", "q": "Co się stało i jakie odtrutki?", "o": ["Zatrucie magnezem – zatrzymaj wlew, glukonian wapnia 10% 10 ml (1 g) i.v. w 10 min, wspomaganie oddechu", "Podajesz drugie 4 g magnezu", "Nalokson", "Flumazenil"], "a": 0, "e": "Objawy przedawkowania magnezu: zanik odruchów kolanowych (pierwszy objaw), depresja oddechu, senność, w końcu NZK. Dlatego przy wlewie sprawdzasz odruchy i oddech. Odtrutka: wapń i.v."}, {"t": "Gorączka u seniorki → urosepsa → szybkie migotanie przedsionków → wstrząs", "g": "Sepsa + kardiologia", "ctx": "Oddech 26/min, SpO₂ 93%, HR 148 niemiarowo, RR 86/50, temp. 39,1°C, CRT 4 s, GCS 13 (nowe splątanie). EKG: migotanie przedsionków z szybką czynnością komór (wcześniej nieznane).", "q": "Co jest głównym problemem?", "o": ["Wstrząs septyczny (urosepsa); szybkie AF jest wtórne – leczysz przyczynę: tlen, płyny 500 ml bolus z oceną, szybki transport", "Pierwotna arytmia – kardiowersja", "Amiodaron i.v. od razu", "Odwodnienie – płyny doustne"], "a": 0, "e": "qSOFA: oddech ≥ 22, splątanie, SBP ≤ 100 = 3 pkt → wysokie ryzyko sepsy. Szybkie AF w sepsie zwykle zwalnia po leczeniu przyczyny (płyny, gorączka, antybiotyk). Kardiowersja/leki antyarytmiczne nie są pierwszym krokiem."}, {"t": "Gorączka u seniorki → urosepsa → szybkie migotanie przedsionków → wstrząs", "g": "Sepsa + kardiologia", "ctx": "Po 1000 ml płynów RR 80/45, HR 140, w płucach pojawiają się trzeszczenia u podstaw.", "q": "Co teraz?", "o": ["Przestań przetaczać płyny (przeciążenie), wezwij S / lekarza – noradrenalina we wlewie, cel MAP ≥ 65 mmHg", "Kolejny litr krystaloidu", "Furosemid 40 mg i.v.", "Metoprolol na zwolnienie AF"], "a": 0, "e": "Wstrząs oporny na płyny z objawami przeciążenia → lek wazopresyjny (noradrenalina, zlecenie lekarza). Beta-bloker przy hipotensji pogłębi wstrząs."}, {"t": "Nagły niedowład → kod udarowy → wymioty i spadek świadomości", "g": "Neurologia", "ctx": "FAST: opadnięty prawy kącik ust, prawa ręka opada, mowa niezrozumiała (afazja). Gałki oczne zwrócone w lewo. RR 198/104, HR 88 niemiarowo, SpO₂ 96%. Leczy się na nadciśnienie, bierze apiksaban.", "q": "Co sprawdzasz najpierw i co jest ważne dla szpitala?", "o": ["Glikemię (wyklucz hipoglikemię), godzinę ostatniego „zdrowia”, leki przeciwkrzepliwe – i kod udarowy", "Obniżasz ciśnienie do 140/90", "Aspiryna 300 mg", "Czekasz, aż objawy miną"], "a": 0, "e": "Hipoglikemia potrafi udawać udar – glikemia zawsze. Godzina ostatniego widzenia w zdrowiu decyduje o leczeniu (tromboliza do 4,5 h, trombektomia nawet do 24 h). Apiksaban ogranicza trombolizę, ale nie trombektomię. Zwrot gałek w stronę ogniska + afazja + niedowład = podejrzenie zamknięcia dużego naczynia → ośrodek trombektomii. Aspiryny nie podajesz (może to być krwotok)."}, {"t": "Nagły niedowład → kod udarowy → wymioty i spadek świadomości", "g": "Neurologia", "ctx": "W transporcie pacjent wymiotuje, charczy, GCS spada do 9.", "q": "Postępowanie?", "o": ["Ułożenie na boku (pozycja bezpieczna), odessanie, tlen, monitorowanie GCS – rozważ krwotok śródmózgowy", "Podajesz płyny szybko", "Leki przeciwwymiotne i dalej na plecach", "Intubacja przez ratownika bez S w ruchu"], "a": 0, "e": "Wymioty i spadek świadomości u pacjenta na lekach przeciwkrzepliwych sugerują krwotok lub obrzęk mózgu. Ochrona dróg oddechowych przed zachłyśnięciem (pozycja boczna, ssak). GCS ≤ 8 → zabezpieczenie dróg oddechowych (S/LPR). Przekaż do szpitala zmianę stanu."}], "mcq": [{"s": "Zawroty głowy", "q": "72-latek z migotaniem przedsionków od 2 godzin ma ciągłe wirowanie, wymiotuje i nie jest w stanie sam usiąść. Nie ma niedowładu ani zaburzeń mowy. Co najpierw podejrzewasz?", "o": ["Udar tylnego krążenia (móżdżek)", "Łagodne napadowe położeniowe zawroty głowy (BPPV)", "Chorobę Ménière'a", "Hipotensję ortostatyczną"], "a": 0, "e": "Ostry zespół przedsionkowy + czynniki ryzyka naczyniowego + niemożność samodzielnego siedzenia = udar tylnego krążenia do wykluczenia. Brak niedowładu nie wyklucza udaru móżdżku.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "Kobieta ma 15–20-sekundowe napady wirowania przy obracaniu się w łóżku. Między napadami czuje się dobrze, badanie neurologiczne prawidłowe. Najbardziej prawdopodobne rozpoznanie?", "o": ["BPPV", "Zapalenie nerwu przedsionkowego", "Udar pnia mózgu", "Migrena przedsionkowa"], "a": 0, "e": "Krótkie (sekundy) napady wywoływane zmianą położenia głowy, bez objawów ogniskowych, to typowy epizodyczny zespół przedsionkowy wyzwalany, czyli BPPV.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "Który manewr jest leczeniem przyczynowym BPPV kanału półkolistego tylnego?", "o": ["Manewr Epleya", "Próba Dix-Hallpike'a", "Test impulsowy głowy", "Próba Valsalvy"], "a": 0, "e": "Dix-Hallpike służy do rozpoznania, a manewr Epleya przesuwa otokonia z kanału tylnego z powrotem do przedsionka, czyli leczy.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "Jaki oczopląs najbardziej sugeruje ośrodkową (np. udarową) przyczynę zawrotów?", "o": ["Zmieniający kierunek zależnie od kierunku spojrzenia", "Poziomo-obrotowy o stałym kierunku", "Pojawiający się tylko po próbie Dix-Hallpike'a, ustępujący po kilkunastu sekundach", "Brak oczopląsu zawsze wyklucza udar"], "a": 0, "e": "Oczopląs zmieniający kierunek, czysto pionowy lub czysto torsyjny sugeruje patologię ośrodkową. Oczopląs o stałym kierunku pasuje do uszkodzenia obwodowego. Brak oczopląsu nie wyklucza udaru.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "Co oznacza skrót HINTS?", "o": ["Head Impulse, Nystagmus, Test of Skew", "Hearing, Imbalance, Nausea, Tinnitus, Syncope", "Hypotension, Ischemia, Neurology, Trauma, Stroke", "Head, Inner ear, Neck, Temperature, Sugar"], "a": 0, "e": "HINTS to trzy badania okoruchowe: test impulsowy głowy, ocena oczopląsu i test skośnego ustawienia gałek. Stosuje się je u właściwie wybranych pacjentów z ostrym zespołem przedsionkowym i po przeszkoleniu.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "Dlaczego niski wynik w skali NIHSS nie wystarcza, by wykluczyć udar u pacjenta z zawrotami głowy?", "o": ["NIHSS słabo ocenia ataksję, chód i objawy tylnego krążenia", "NIHSS ocenia tylko świadomość", "NIHSS stosuje się wyłącznie u dzieci", "Niski NIHSS zawsze oznacza krwawienie"], "a": 0, "e": "Skala NIHSS skupia się na niedowładach, mowie i polu widzenia. Pacjent z udarem móżdżku może mieć niski wynik, a ciężką ataksję i niemożność chodzenia.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "42-latka po gwałtownym ruchu szyi na siłowni ma nagły ból potylicy i karku, a po pół godzinie zawroty i chwiejność. Co podejrzewasz?", "o": ["Rozwarstwienie tętnicy kręgowej", "Napięciowy ból głowy", "BPPV", "Hipoglikemię"], "a": 0, "e": "Nowy ból szyi/potylicy + objawy tylnego krążenia po urazie lub gwałtownym ruchu szyi = rozwarstwienie tętnicy kręgowej, także u młodych bez czynników ryzyka.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "Hipotensję ortostatyczną rozpoznajesz, gdy w ciągu 3 minut po pionizacji ciśnienie spada o co najmniej:", "o": ["20 mmHg skurczowe lub 10 mmHg rozkurczowe", "10 mmHg skurczowe lub 5 mmHg rozkurczowe", "40 mmHg skurczowe", "5 mmHg skurczowe i 5 mmHg rozkurczowe"], "a": 0, "e": "Kryterium: spadek skurczowego o ≥20 mmHg lub rozkurczowego o ≥10 mmHg w ciągu 3 minut. Pionizację wykonuj tylko u stabilnego pacjenta i asekuruj go przed upadkiem.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "Nagłe ostre zawroty głowy z NOWYM jednostronnym niedosłuchem. Co trzeba wykluczyć?", "o": ["Niedokrwienie w obszarze tętnicy AICA", "Zatkanie ucha woskowiną", "Napięciowy ból głowy", "Zatrucie pokarmowe"], "a": 0, "e": "Nagły niedosłuch z ostrym zespołem przedsionkowym może być objawem udaru w obszarze AICA. Nie zakładaj automatycznie łagodnej choroby ucha (HINTS Plus).", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Zawroty głowy", "q": "Pacjent z ciężką ataksją tułowia i zawrotami. Czego NIE robisz?", "o": ["Nie zmuszasz go do chodzenia, żeby sprawdzić chód", "Nie mierzysz glikemii", "Nie ustalasz czasu początku objawów", "Nie robisz EKG"], "a": 0, "e": "Niemożność samodzielnego siedzenia/stania to objaw alarmowy sam w sobie. Zmuszanie do chodu grozi upadkiem. Glikemia, czas początku objawów i EKG należą do standardu.", "g": "mr", "sec": "Medycyna ratunkowa: zawroty głowy"}, {"s": "Ból głowy", "q": "Ból głowy, który osiąga maksymalne nasilenie w czasie krótszym niż minuta, to:", "o": ["Ból piorunujący – do pilnego wykluczenia SAH", "Typowy napięciowy ból głowy", "Typowa migrena bez aury", "Klasterowy ból głowy"], "a": 0, "e": "Ból piorunujący (thunderclap) jest objawem alarmowym niezależnie od wyniku badania neurologicznego. Najpierw trzeba wykluczyć krwawienie podpajęczynówkowe.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "48-latka miała nagły, najsilniejszy w życiu ból głowy podczas wysiłku, wymiotuje, badanie neurologiczne bez odchyleń. Jak oceniasz sytuację?", "o": ["Prawidłowe badanie nie wyklucza SAH – pilny transport do szpitala z TK", "Prawidłowe badanie wyklucza krwawienie – leczysz migrenę w domu", "To napięciowy ból głowy", "Wystarczy podać lek przeciwbólowy i obserwować"], "a": 0, "e": "W SAH badanie neurologiczne może być początkowo prawidłowe. Nagły ból w trakcie wysiłku z wymiotami wymaga pilnej TK głowy bez kontrastu.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "Lek pierwszego wyboru w napadzie klasterowego bólu głowy to:", "o": ["100% tlen z dużym przepływem przez maskę z rezerwuarem", "Morfina i.v.", "Paracetamol doustnie", "Diazepam i.v."], "a": 0, "e": "Tlenoterapia 100% z dużym przepływem przerywa napad klasterowy. Zwykłe doustne leki przeciwbólowe często nie działają, a opioidy nie są leczeniem z wyboru.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "Który zestaw objawów pasuje do klasterowego bólu głowy?", "o": ["Jednostronny ból oczodołu, łzawienie i zaczerwienienie oka po tej samej stronie, pobudzenie ruchowe", "Obustronny ucisk jak obręcz, bez nudności", "Pulsujący ból 4–72 h z nudnościami, chory leży w ciemnym pokoju", "Ból karku z gorączką i wysypką"], "a": 0, "e": "Klasterowy ból to bardzo silny, jednostronny ból oczodołu z objawami autonomicznymi po tej samej stronie. Pacjent jest niespokojny, chodzi, nie może znaleźć pozycji.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "24-latek z gorączką 39,5°C, bólem głowy, światłowstrętem i narastającą sennością, HR 120, RR 105/65. Sztywności karku brak. Co robisz?", "o": ["Podejrzewasz zapalenie opon/sepsę – brak sztywności karku go nie wyklucza, pilny transport", "Brak sztywności karku wyklucza zapalenie opon", "Podajesz leki przeciwgorączkowe i zostawiasz w domu", "Rozpoznajesz migrenę"], "a": 0, "e": "Klasyczna triada nie zawsze występuje. Gorączka, zaburzenia świadomości i tachykardia z niskim ciśnieniem wskazują na zakażenie OUN z sepsą. Leczenia nie wolno opóźniać.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "Kobieta 8 dni po porodzie: ból głowy od 2 dni, mroczki, RR 175/110 mmHg, w trakcie badania drgawki. Rozpoznanie i lek?", "o": ["Rzucawka poporodowa – siarczan magnezu", "Migrena – sumatryptan", "Padaczka – tylko obserwacja", "Hipoglikemia – glukagon"], "a": 0, "e": "Rzucawka może wystąpić do kilku tygodni po porodzie. Lekiem z wyboru w drgawkach rzucawkowych jest siarczan magnezu (diazepam nie jest pierwszym wyborem). Do tego pilny transport.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "Kilka osób z jednego mieszkania ma ból głowy, nudności i osłabienie, objawy słabną na dworze. Co podejrzewasz w pierwszej kolejności?", "o": ["Zatrucie tlenkiem węgla", "Epidemię migreny", "Napięciowy ból głowy", "Zatrucie pokarmowe bez związku z pomieszczeniem"], "a": 0, "e": "Podobne objawy u kilku osób w jednym pomieszczeniu to klasyczny sygnał zatrucia CO. Najpierw bezpieczeństwo własne i ewakuacja, potem tlen 100%. Pulsoksymetr może zawyżać SpO₂.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "Nowy ból skroni u 70-latki, ból żuchwy przy żuciu i przemijające zaburzenia widzenia. Co podejrzewasz?", "o": ["Olbrzymiokomórkowe zapalenie tętnic – ryzyko utraty wzroku", "Klasterowy ból głowy", "Napięciowy ból głowy", "Zapalenie zatok"], "a": 0, "e": "Olbrzymiokomórkowe zapalenie tętnic występuje po 50. roku życia. Bez pilnego leczenia grozi nieodwracalną utratą wzroku.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "Która cecha NIE jest czerwoną flagą bólu głowy (SNNOOP10)?", "o": ["Taki sam ból jak zwykle u osoby z rozpoznaną migreną", "Nowy ból głowy u osoby po 50. roku życia", "Ból nasilający się przy kaszlu lub parciu", "Ból głowy w ciąży lub połogu"], "a": 0, "e": "Czerwone flagi to m.in. gorączka, nowotwór, objawy neurologiczne, nagły początek, nowy ból u starszych, zmiana charakteru, zależność od pozycji, kaszel/Valsalva, obrzęk tarczy n. II, ciąża, immunosupresja i uraz. Typowy, znany napad migreny flagą nie jest.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Ból głowy", "q": "Pacjent z bólem głowy i RR 185/105 mmHg, bez objawów uszkodzenia narządowego. Jak postępujesz z ciśnieniem?", "o": ["Nie obniżasz go gwałtownie tylko z powodu bólu głowy", "Podajesz leki, aby szybko zbić ciśnienie poniżej 120/80", "Podajesz nitroglicerynę podjęzykowo co 5 minut", "Ignorujesz pomiar"], "a": 0, "e": "Umiarkowane nadciśnienie zwykle nie jest samo przyczyną silnego bólu głowy. Gwałtowne obniżanie ciśnienia bez wskazań (np. uszkodzenia narządowego) może zaszkodzić, zwłaszcza w udarze.", "g": "mr", "sec": "Medycyna ratunkowa: ból głowy"}, {"s": "Wymioty", "q": "Noworodek wymiotuje zieloną treścią (żółcią). Co to oznacza?", "o": ["Podejrzenie niedrożności przewodu pokarmowego – pilna ocena chirurgiczna", "Typowe ulewanie po karmieniu", "Kolkę niemowlęcą", "Ząbkowanie"], "a": 0, "e": "Zielone wymioty żółciowe u noworodka lub niemowlęcia to czerwona flaga niedrożności (np. skrętu jelit). Wymaga pilnej diagnostyki.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "Niemowlę w 4. tygodniu życia ma chlustające wymioty bez żółci po każdym karmieniu i jest głodne. Co podejrzewasz?", "o": ["Przerostowe zwężenie odźwiernika", "Wgłobienie", "Zapalenie wyrostka robaczkowego", "Kwasicę ketonową"], "a": 0, "e": "Chlustające wymioty bez domieszki żółci w pierwszych tygodniach życia to typowy obraz przerostowego zwężenia odźwiernika.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "Dziecko 1,5 roku ma napady płaczu z podkurczaniem nóżek i wymioty, między napadami jest apatyczne. Co podejrzewasz?", "o": ["Wgłobienie jelita", "Przerostowe zwężenie odźwiernika", "Migrenę", "Zatrucie CO"], "a": 0, "e": "Napadowy ból (podkurczanie nóg), wymioty i apatia między napadami u małego dziecka sugerują wgłobienie. Później może pojawić się stolec jak galaretka malinowa.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "Przy podejrzeniu mechanicznej niedrożności jelit nie podajesz metoklopramidu, ponieważ:", "o": ["Pobudza perystaltykę, co przy przeszkodzie mechanicznej może zaszkodzić", "Działa zbyt słabo", "Wywołuje hipoglikemię", "Jest przeciwwskazany u wszystkich dorosłych"], "a": 0, "e": "Metoklopramid działa prokinetycznie. Przy przeszkodzie mechanicznej, perforacji lub krwawieniu z przewodu pokarmowego pobudzanie motoryki jest niebezpieczne. Uważaj też na objawy pozapiramidowe.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "q": "Jakie działanie niepożądane ondansetronu musisz brać pod uwagę?", "o": ["Wydłużenie odstępu QT", "Ostra dystonia jako najczęstszy objaw", "Hipoglikemia", "Depresja oddechowa"], "a": 0, "e": "Ondansetron (antagonista 5-HT₃) może wydłużać QT, szczególnie przy zaburzeniach elektrolitowych i lekach wydłużających QT. Dystonia jest typowa dla metoklopramidu.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "38-latek wymiotuje od kilkunastu godzin, ma silne pragnienie, wielomocz, głęboki szybki oddech, glikemia 390 mg/dl. Co podejrzewasz?", "o": ["Cukrzycową kwasicę ketonową", "Zatrucie pokarmowe", "Zapalenie wyrostka", "Migrenę"], "a": 0, "e": "Hiperglikemia, odwodnienie i oddech Kussmaula to obraz DKA. Pamiętaj też o kwasicy euglikemicznej u osób na inhibitorach SGLT2 (flozynach).", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "74-latek po operacji brzucha: wymioty od 12 h, wzdęcie, zatrzymanie gazów i stolca. Ból był kolkowy, teraz jest stały, HR 112. Co niepokoi najbardziej?", "o": ["Niedrożność z zadzierzgnięciem i niedokrwieniem jelita", "Zwykła niestrawność", "Kolka żółciowa", "Nerwica żołądka"], "a": 0, "e": "Zmiana bólu z kolkowego na stały, tachykardia i spadek ciśnienia sugerują niedokrwienie jelita przy niedrożności (często na tle zrostów). Wymaga pilnej interwencji chirurgicznej.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "Wymioty z bólem w nadbrzuszu, potami i bladością u 65-latka z cukrzycą, bez typowego bólu w klatce. Jakie badanie wykonujesz od razu?", "o": ["12-odprowadzeniowe EKG", "Tylko pomiar temperatury", "Badanie per rectum", "Nic, to zatrucie"], "a": 0, "e": "Nudności i wymioty mogą być jedynym objawem OZW, szczególnie zawału ściany dolnej, u diabetyków i osób starszych. EKG wykonujesz od razu.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "Po kilku gwałtownych wymiotach pacjent zwymiotował świeżą krwią, nie ma bólu w klatce. Co jest najbardziej prawdopodobne?", "o": ["Zespół Mallory'ego-Weissa", "Zespół Boerhaavego", "Zapalenie trzustki", "Niedokrwienie krezki"], "a": 0, "e": "Mallory-Weiss to pęknięcie błony śluzowej przy wpuście, które daje krwiste wymioty. Boerhaave to pełnościenne pęknięcie przełyku z silnym bólem w klatce, dusznością i rozedmą podskórną. Jest stanem zagrożenia życia.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "Nieprzytomny pacjent oddycha i wymiotuje. Co robisz od razu?", "o": ["Układasz go w pozycji bocznej (bez przeciwwskazań) i odsysasz treść", "Podajesz płyny doustnie", "Podajesz metoklopramid doustnie", "Kładziesz go na plecach z uniesionymi nogami"], "a": 0, "e": "Najważniejsze jest zapobieganie aspiracji: pozycja boczna, odsysanie i rozważenie zaawansowanego zabezpieczenia dróg oddechowych przy niewydolnych odruchach obronnych. Przy zaburzeniach świadomości nie podajesz nic doustnie.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "U ciężarnej w III trymestrze z wymiotami, bólem głowy, bólem w nadbrzuszu i wysokim ciśnieniem musisz wykluczyć:", "o": ["Stan przedrzucawkowy i zespół HELLP", "Niepowściągliwe wymioty ciężarnych", "Chorobę lokomocyjną", "Nietolerancję laktozy"], "a": 0, "e": "Hyperemesis dotyczy głównie wczesnej ciąży. W późnej ciąży wymioty z bólem głowy, bólem w nadbrzuszu i nadciśnieniem to sygnał stanu przedrzucawkowego lub HELLP.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Wymioty", "q": "Pacjentowi po zatruciu doustnym, przytomnemu, rodzina chce prowokować wymioty. Co mówisz?", "o": ["Nie prowokujemy wymiotów", "Trzeba wywołać wymioty jak najszybciej", "Podać dużo mleka i wywołać wymioty", "Wywołać wymioty tylko po zatruciu żrącym"], "a": 0, "e": "Prowokowanie wymiotów po zatruciu jest przeciwwskazane: grozi aspiracją i ponownym uszkodzeniem przełyku. Postępowanie ustala się z ośrodkiem toksykologicznym.", "g": "mr", "sec": "Medycyna ratunkowa: wymioty"}, {"s": "Pediatria", "q": "Dziecko z gorączką ma na skórze naraz plamki, grudki, pęcherzyki i strupy. Zmiany zaczęły się na tułowiu i owłosionej skórze głowy. Co to jest?", "o": ["Ospa wietrzna", "Odra", "Płonica", "Rumień nagły"], "a": 0, "e": "Ospa wietrzna (VZV) wysypuje się rzutami, więc na skórze widać jednocześnie różne stadia: plamka → grudka → pęcherzyk → krostka → strup. Chory zaraża od 1–2 dni przed wysypką aż do przyschnięcia ostatnich zmian.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Które dziecko z ospą wietrzną wymaga leczenia acyklowirem?", "o": ["Niemowlę lub dziecko z obniżoną odpornością", "Każde zdrowe przedszkolne dziecko z kilkunastoma pęcherzykami", "Dziecko, które ma tylko świąd", "Żadne – ospy nie leczy się przeciwwirusowo"], "a": 0, "e": "U zdrowych dzieci leczenie jest objawowe (lek przeciwgorączkowy, lek przeciwhistaminowy na świąd, higiena skóry). Acyklowir dostają niemowlęta, dzieci z obniżoną odpornością i chorzy z ciężkim przebiegiem lub powikłaniami.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Dziecko z ospą wietrzną ma gorączkę. Którego leku przeciwgorączkowego NIE podajesz?", "o": ["Kwasu acetylosalicylowego", "Paracetamolu", "Ibuprofenu", "Każdy jest bezpieczny"], "a": 0, "e": "Kwas acetylosalicylowy u dzieci z infekcją wirusową (ospa, grypa) grozi zespołem Reye'a. U dzieci przeciwgorączkowo stosuje się paracetamol.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Nastolatek z anginą z szarobiałymi nalotami, powiększonymi węzłami i powiększoną śledzioną dostał amoksycylinę i po 2 dniach ma wysypkę. Co podejrzewasz?", "o": ["Mononukleozę zakaźną (EBV)", "Płonicę", "Alergię na wszystkie antybiotyki", "Ospę wietrzną"], "a": 0, "e": "Wysypka po aminopenicylinie to cecha mononukleozy. Antybiotyk trzeba odstawić. Typowe są gorączka, angina z nalotami, uogólnione powiększenie węzłów chłonnych i hepatosplenomegalia.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Chłopiec przechodzący mononukleozę gra w piłkę i nagle dostaje silnego bólu brzucha, jest blady, HR 140. Co podejrzewasz?", "o": ["Pęknięcie śledziony", "Zapalenie wyrostka", "Kolkę jelitową", "Zapalenie mięśnia sercowego"], "a": 0, "e": "W mononukleozie śledziona jest powiększona i krucha. Dlatego zaleca się ograniczenie wysiłku przez 3–4 tygodnie, a przy dużej śledzionie nawet 6–8. Nagły ból brzucha z cechami wstrząsu to stan nagły.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Roczne dziecko przez 3 dni miało gorączkę 40°C, ale było w dobrym stanie. Gdy gorączka nagle spadła, pojawiła się drobna, nieswędząca wysypka na tułowiu. Rozpoznanie?", "o": ["Rumień nagły (HHV-6)", "Odra", "Płonica", "Różyczka wrodzona"], "a": 0, "e": "Rumień nagły (gorączka trzydniowa) przebiega w dwóch fazach: najpierw wysoka gorączka przy dobrym stanie ogólnym, a po jej spadku wysypka plamisto-grudkowa, która znika w 1–2 dni. Leczenie jest tylko objawowe.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Drgawki gorączkowe rozpoznaje się u dziecka w wieku:", "o": ["od 6 miesięcy do 5 lat, przy gorączce ≥38°C, bez zakażenia OUN", "od urodzenia do 18 lat", "tylko u noworodków", "powyżej 10 lat"], "a": 0, "e": "Drgawki gorączkowe występują u dzieci od 6 miesięcy do 5 lat przy gorączce ≥38°C. Nie może być cech zakażenia OUN, zaburzeń metabolicznych ani wcześniejszej padaczki. Około 70–80% to drgawki proste.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "U 2-latka drgawki gorączkowe trwają już ponad 5 minut. Co robisz?", "o": ["Zabezpieczasz drogi oddechowe i podajesz lek przeciwdrgawkowy (np. benzodiazepinę p.r./i.v./donosowo)", "Wkładasz dziecku coś między zęby", "Czekasz kolejne 15 minut", "Wkładasz dziecko do zimnej wanny"], "a": 0, "e": "Drgawki trwające ponad 5 minut przerywa się benzodiazepiną (diazepam p.r./i.v. albo midazolam według algorytmu i uprawnień). Do tego drożność dróg oddechowych, tlen, glikemia i obniżanie gorączki. Niczego nie wkładasz do ust.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Który objaw jest patognomoniczny dla odry?", "o": ["Plamki Koplika na błonie śluzowej policzków", "Trójkąt Fiłatowa", "Policzki jak po spoliczkowaniu", "Linie Pastii"], "a": 0, "e": "Plamki Koplika (białawe plamki na śluzówce policzków) pojawiają się w okresie prodromalnym odry, przed wysypką. Wysypka zaczyna się za uszami i na twarzy, a potem schodzi na tułów i kończyny.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Podejrzewasz odrę u dziecka z kaszlem, katarem, zapaleniem spojówek i wysoką gorączką. Co jest ważne poza leczeniem objawowym?", "o": ["Izolacja chorego i zgłoszenie do sanepidu (PSSE)", "Antybiotyk dla całej rodziny", "Natychmiastowe szczepienie chorego", "Nic więcej"], "a": 0, "e": "Odra jest skrajnie zakaźna: wirus utrzymuje się w pomieszczeniu do 2 godzin po wyjściu chorego. Każde podejrzenie zgłasza się do PSSE, a chorego izoluje. Ty jako ratownik medyczny dbasz o ochronę własną i zespołu.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Dlaczego różyczka jest szczególnie groźna dla kobiet w I trymestrze ciąży?", "o": ["Grozi zespołem różyczki wrodzonej: wady serca, zaćma, głuchota", "Powoduje tylko łagodną wysypkę u matki", "Wywołuje wyłącznie zapalenie stawów", "Nie przechodzi przez łożysko"], "a": 0, "e": "Zakażenie w I trymestrze niesie do 90% ryzyka ciężkich wad płodu. Triada Gregga to wady serca (np. przetrwały przewód tętniczy), zaćma i głuchota czuciowo-nerwowa. Dlatego chorego izoluje się od ciężarnych.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Dziecko ma intensywnie czerwone policzki („jak po spoliczkowaniu”), a potem siateczkowatą wysypkę na kończynach. Co to jest?", "o": ["Rumień zakaźny (parwowirus B19)", "Odra", "Liszajec zakaźny", "Płonica"], "a": 0, "e": "Rumień zakaźny, czyli piąta choroba, wywołuje parwowirus B19. Jest groźny dla ciężarnych, bo może spowodować uogólniony obrzęk płodu.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Drobnoplamista wysypka omijająca okolicę wokół ust (trójkąt Fiłatowa), linijne wybroczyny w zgięciach i angina u 7-latka. Rozpoznanie?", "o": ["Płonica (szkarlatyna)", "Odra", "Ospa wietrzna", "Rumień nagły"], "a": 0, "e": "Płonicę wywołują erytrogenne szczepy paciorkowca β-hemolizującego grupy A. Wybroczyny w zgięciach to linie Pastii. Leczy się ją antybiotykiem jak anginę paciorkowcową.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Jakie są późne powikłania nieleczonej anginy paciorkowcowej?", "o": ["Gorączka reumatyczna i ostre kłębuszkowe zapalenie nerek", "Ospa wietrzna", "Mononukleoza", "Rumień nagły"], "a": 0, "e": "Gorączka reumatyczna (2–4 tygodnie po anginie) może uszkodzić zastawki serca. Ostre poinfekcyjne KZN (1–3 tygodnie po anginie) daje krwiomocz, obrzęki, skąpomocz i nadciśnienie.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Wysoka gorączka, szczękościsk, jednostronny obrzęk i ślinienie się po przebytej anginie. Co podejrzewasz?", "o": ["Ropień okołomigdałkowy", "Zapalenie ucha", "Krztusiec", "Pokrzywkę"], "a": 0, "e": "Ropień okołomigdałkowy jest zwykle jednostronny. Daje szczękościsk, ból przy połykaniu i asymetrię gardła. Często wymaga nacięcia i hospitalizacji, a jako ratownik medyczny obserwujesz drożność dróg oddechowych.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Niemowlę ma napady gwałtownego kaszlu zakończone świstem wdechowym („pianiem”), sinieje i ma bezdechy. Co podejrzewasz?", "o": ["Krztusiec", "Krup", "Astmę", "Ciało obce w nosie"], "a": 0, "e": "Krztusiec (Bordetella pertussis) jest najgroźniejszy u niemowląt poniżej 6. miesiąca życia: powoduje bezdechy, niedotlenienie i drgawki. Leczy się go makrolidem, a chorego izoluje do 5 dni od rozpoczęcia antybiotyku.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Kolejność, w jakiej pojawiają się choroby alergiczne u dziecka z atopią („marsz alergiczny”), to zwykle:", "o": ["Alergia pokarmowa/AZS → alergiczny nieżyt nosa → astma", "Astma → AZS → alergia pokarmowa", "Anafilaksja → pokrzywka → AZS", "Choroby alergiczne nie mają typowej kolejności"], "a": 0, "e": "U niemowląt alergia zaczyna się zwykle od pokarmów (białko mleka, jajo) i AZS. Z wiekiem słabną, a narasta ryzyko alergicznego nieżytu nosa i astmy.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Dawka adrenaliny i.m. w anafilaksji u dziecka według tego schematu to:", "o": ["0,01 mg/kg (maks. 0,3 mg) w przednio-boczną powierzchnię uda", "1 mg i.v. w bolusie", "0,1 mg/kg i.m.", "300 mg i.m."], "a": 0, "e": "Adrenalina i.m. 0,01 mg/kg, czyli 0,01 ml/kg roztworu 1 mg/ml, maksymalnie 0,3 mg u dzieci. Starsze dzieci i dorośli dostają 0,5 mg. Dawkę można powtórzyć po 5 minutach. Uwaga na jednostki: miligramy, nie gramy ani setki miligramów.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Ile wynosi bolus płynowy przy hipotensji w anafilaksji u dziecka według wykładu?", "o": ["10 ml/kg krystaloidu", "100 ml/kg", "1 ml/kg", "Płynów się nie podaje"], "a": 0, "e": "Przy hipotensji podajesz bolus 10 ml/kg krystaloidu i oceniasz odpowiedź. Najważniejszym lekiem pozostaje adrenalina i.m.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Bąbel pokrzywkowy różni się od innych wykwitów tym, że:", "o": ["Jest swędzący, wyniosły i znika bez śladu zwykle w ciągu 24 godzin", "Utrzymuje się miesiącami", "Zawsze pozostawia bliznę", "Nigdy nie swędzi"], "a": 0, "e": "Bąble pokrzywkowe szybko się pojawiają i znikają bez śladu. U dzieci najczęstszą przyczyną ostrej pokrzywki są infekcje wirusowe. Jeśli pojawi się duszność, obrzęk gardła albo spadek ciśnienia, myśl o anafilaksji.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Odruch Moro u zdrowego niemowlęcia powinien zaniknąć około:", "o": ["6. miesiąca życia", "1. tygodnia życia", "3. roku życia", "Nigdy nie zanika"], "a": 0, "e": "Odruchy noworodkowe zanikają wraz z dojrzewaniem układu nerwowego: Moro około 6. miesiąca, odruch szukania do 3. miesiąca, ATOS do 6. miesiąca. Ich przetrwanie albo asymetria sugeruje patologię neurologiczną.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Kiedy zdrowe niemowlę zwykle potraja masę urodzeniową?", "o": ["Około 12. miesiąca życia", "W 2. tygodniu życia", "Około 4. miesiąca", "W 3. roku życia"], "a": 0, "e": "W pierwszych dniach noworodek traci do 10% masy, a odzyskuje ją do 10–14 doby. Około 4–5 miesiąca masa się podwaja, a około 12 miesiąca potraja.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Ciemiączko przednie zarasta zwykle:", "o": ["Między 9. a 18. miesiącem życia", "W 1. tygodniu życia", "Około 6–8 tygodnia", "Po 5. roku życia"], "a": 0, "e": "Ciemiączko tylne zarasta w 6–8 tygodniu (najpóźniej do 4. miesiąca), a przednie w 9–18 miesiącu. U niemowlęcia uwypuklone ciemiączko może świadczyć o wzroście ciśnienia śródczaszkowego, a zapadnięte o odwodnieniu.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Który objaw rozwojowy jest niepokojący i wymaga diagnostyki?", "o": ["Brak samodzielnego chodu w 18. miesiącu życia", "Samodzielny chód w 13. miesiącu", "Gaworzenie w 8. miesiącu", "Siedzenie z podparciem w 6. miesiącu"], "a": 0, "e": "Sygnały alarmowe to m.in. brak kontroli głowy do 4. miesiąca, brak siedzenia bez podparcia do 9. miesiąca, brak chodu do 18. miesiąca i regres, czyli utratę nabytych umiejętności.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "Przedwczesne dojrzewanie płciowe rozpoznaje się, gdy objawy dojrzewania pojawiają się:", "o": ["Przed 8. rokiem życia u dziewcząt i przed 9. u chłopców", "Przed 12. rokiem u obu płci", "Przed 15. rokiem", "Tylko u chłopców przed 6. rokiem"], "a": 0, "e": "Granice to 8 lat u dziewcząt i 9 lat u chłopców. Opóźnione dojrzewanie rozpoznaje się, gdy objawy nie pojawią się po 13. roku życia u dziewcząt i po 14. u chłopców.", "g": "ped", "sec": "Pediatria"}, {"s": "Pediatria", "q": "W zakażeniu wirusem grypy oseltamiwir ma największy sens, gdy podany zostanie:", "o": ["Do 48 godzin od początku objawów", "Po tygodniu choroby", "Tylko po ustąpieniu gorączki", "Nigdy u dzieci"], "a": 0, "e": "Leczenie przyczynowe grypy najlepiej zacząć w ciągu 48 godzin od początku objawów. U dzieci dawkę liczy się według masy ciała. Kwasu acetylosalicylowego nie podajesz (zespół Reye'a).", "g": "ped", "sec": "Pediatria"}, {"s": "Urazy klatki piersiowej", "q": "Kiedy rozpoznajesz wiotką (cepowatą) klatkę piersiową?", "o": ["Gdy co najmniej 3 sąsiednie żebra są złamane w 2 miejscach każde", "Gdy złamane jest jedno żebro", "Gdy złamany jest obojczyk", "Gdy pacjent ma odmę płaszczową"], "a": 0, "e": "Wiotka klatka to wyłamane „okno” kostne: co najmniej 3 kolejne żebra złamane podwójnie albo oderwane od mostka. Daje oddech opaczny, czyli okno zapada się przy wdechu i uwypukla przy wydechu.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Co oznacza złamanie I lub II żebra u ofiary wypadku?", "o": ["Bardzo dużą siłę urazu, więc szukasz uszkodzenia aorty, dużych naczyń i oskrzeli", "Drobny uraz bez znaczenia", "Typowe złamanie u dzieci", "Wskazanie do opaski elastycznej na żebra"], "a": 0, "e": "Górne żebra osłaniają obojczyk, łopatka i mięśnie, więc ich złamanie wymaga ogromnej energii. Bardzo często towarzyszą mu obrażenia dużych naczyń, łuku aorty i drzewa oskrzelowego.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Pacjent ma złamane żebra X–XII po lewej stronie, jest blady, HR 125. Czego szukasz w pierwszej kolejności?", "o": ["Uszkodzenia śledziony i krwotoku do jamy brzusznej", "Odmy śródpiersia", "Złamania obojczyka", "Stłuczenia serca"], "a": 0, "e": "Dolne żebra osłaniają wątrobę, śledzionę i nerki. Ich złamanie z tachykardią i bladością każe myśleć o krwotoku wewnątrzbrzusznym, czyli o wstrząsie krwotocznym.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Czy przy złamaniu żeber zakładasz ciasną opaskę elastyczną lub plastry wokół klatki?", "o": ["Nie, to błąd: utrudnia oddychanie i sprzyja niedodmie oraz zapaleniu płuc", "Tak, zawsze", "Tak, ale tylko u osób starszych", "Tak, żeby szybciej się zrosły"], "a": 0, "e": "Unieruchamianie klatki opaskami zaburza mechanikę oddychania. Podstawą leczenia jest dobra analgezja i oddychanie bez ograniczeń. Nie podaje się też leków przeciwkaszlowych.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Który zestaw objawów najbardziej pasuje do odmy prężnej?", "o": ["Narastająca duszność, brak szmeru i bębenek po jednej stronie, poszerzone żyły szyjne, hipotensja", "Ból przy oddychaniu i miejscowa tkliwość żebra bez duszności", "Stłumienie opukowe i brak szmeru u stabilnego pacjenta", "Trzeszczenia nad sercem bez duszności"], "a": 0, "e": "W odmie prężnej powietrze dostaje się do opłucnej przez mechanizm zastawkowy i nie ma ujścia. Śródpiersie przesuwa się, napływ krwi do serca spada i rozwija się wstrząs obturacyjny. Przesunięcie tchawicy jest objawem późnym.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Podejrzewasz odmę prężną u pacjenta we wstrząsie. Kiedy ją odbarczasz?", "o": ["Natychmiast, bez czekania na RTG", "Dopiero po RTG w szpitalu", "Po podaniu 2 litrów płynów", "Dopiero gdy dojdzie do NZK"], "a": 0, "e": "Odma prężna jest rozpoznaniem klinicznym. Odbarczasz ją od razu igłą albo przez torakostomię według uprawnień i procedur, bo zwłoka może w kilka minut skończyć się zgonem.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Ile krwi może zmieścić jedna jama opłucnowa przy masywnym krwiaku?", "o": ["Nawet 30–40% objętości krwi krążącej", "Najwyżej 50 ml", "Około 200 ml", "Krwiak opłucnej nie powoduje wstrząsu"], "a": 0, "e": "Krwiak opłucnej to najczęstsza przyczyna hipotensji po urazie klatki piersiowej. Jeden krwiak może pomieścić kilka litrów krwi, a pacjent może się wykrwawić do opłucnej.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Czym różni się w badaniu masywny krwiak opłucnej od odmy prężnej?", "o": ["Krwiak daje stłumienie przy opukiwaniu, odma odgłos bębenkowy", "Krwiak daje bębenek, odma stłumienie", "Niczym się nie różnią", "Krwiak zawsze przesuwa tchawicę na stronę chorą"], "a": 0, "e": "W obu przypadkach szmer oddechowy po stronie urazu jest osłabiony albo zniesiony. Opukiwanie je różni: płyn (krew) daje stłumienie, powietrze bębenek. Żyły szyjne przy krwiaku są zwykle zapadnięte, bo pacjent ma hipowolemię.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Wskazaniem do pilnej torakotomii jest odpływ krwi z drenu:", "o": ["Ponad 1500 ml od razu po założeniu albo ponad 200 ml/h przez kolejne godziny", "50 ml w ciągu doby", "Każda ilość krwi", "Tylko gdy krew jest jasnoczerwona"], "a": 0, "e": "Masywne krwawienie do opłucnej wymaga chirurga. Dlatego takiego pacjenta wieziesz do centrum urazowego z torakochirurgią.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Ofiara wypadku z raną kłutą okolicy przedsercowej: hipotensja, poszerzone żyły szyjne, ściszone tony serca, płuca osłuchowo symetryczne. Co podejrzewasz?", "o": ["Tamponadę serca (triada Becka)", "Odmę prężną", "Krwiak opłucnej", "Stłuczenie płuca"], "a": 0, "e": "Triada Becka to h
