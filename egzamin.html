 "<div class=\"kv\"><span>Dawka (ERC 2025)</span> 10–50 mg i.v. powoli w pozycji leżącej, można powtórzyć (maks. 100 mg)</div><div class=\"kv\"><span>Ważne</span> stan nagły w nadciśnieniu (np. z obrzękiem płuc). Obniżaj ciśnienie o nie więcej niż 20–25% w pierwszej godzinie. W udarze leczy się nadciśnienie dopiero powyżej 220/120 mmHg (lub &gt; 185/110 przed trombolizą)</div>"}, {"c": 5, "x": "Leki w ratownictwie › Leki krążeniowe i stosowane w NZK", "k": "Lek", "f": "kaptopryl 25 mg tabl.", "b": "<div class=\"kv\"><span>Dawka (ERC 2025)</span> 12,5–25 mg s.l. lub p.o.</div><div class=\"kv\"><span>Ważne</span> pilne nadciśnienie bez zagrożenia narządów</div>"}, {"c": 5, "x": "Leki w ratownictwie › Leki krążeniowe i stosowane w NZK", "k": "Lek", "f": "nitrogliceryna aerozol 0,4 mg/dawka, tabl. 0,5 mg", "b": "<div class=\"kv\"><span>Dawka (ERC 2025)</span><strong>0,4 mg s.l.</strong> co 5 min (maks. 3 dawki); wlew i.v. 10–200 µg/min</div><div class=\"kv\"><span>Ważne</span> nie przy SBP &lt; 90 mmHg, zawale prawej komory, po inhibitorach PDE-5 (sildenafil, tadalafil) w ciągu 24–48 h; ból głowy</div>"}, {"c": 5, "x": "Leki w ratownictwie › Leki krążeniowe i stosowane w NZK", "k": "Lek", "f": "furosemid 10 mg/ml (2 ml)", "b": "<div class=\"kv\"><span>Dawka (ERC 2025)</span> 20–40 mg i.v. (u biorących furosemid przewlekle: dawka dobowa i.v.), maks. 4 mg/min</div><div class=\"kv\"><span>Ważne</span> obrzęk płuc z nadciśnieniem lub przewodnieniem; nie przy hipotensji i odwodnieniu</div>"}, {"c": 5, "x": "Leki w ratownictwie › Leki przeciwkrzepliwe i przeciwpłytkowe (OZW)", "k": "Lek", "f": "ASA", "b": "<div class=\"kv\"><span>Dawka</span> 150–300 mg do rozgryzienia (lub i.v. 75–250 mg)</div><div class=\"kv\"><span>Ważne</span> nie przy alergii na ASA, czynnym krwawieniu, podejrzeniu rozwarstwienia aorty</div>"}, {"c": 5, "x": "Leki w ratownictwie › Leki przeciwkrzepliwe i przeciwpłytkowe (OZW)", "k": "Lek", "f": "klopidogrel 75 mg", "b": "<div class=\"kv\"><span>Dawka</span> dawka nasycająca 300–600 mg (600 mg przed PCI)</div><div class=\"kv\"><span>Ważne</span> wg protokołu ośrodka PCI</div>"}, {"c": 5, "x": "Leki w ratownictwie › Leki przeciwkrzepliwe i przeciwpłytkowe (OZW)", "k": "Lek", "f": "tikagrelor 90 mg", "b": "<div class=\"kv\"><span>Dawka</span> 180 mg, potem 90 mg 2×/d</div><div class=\"kv\"><span>Ważne</span> wg protokołu ośrodka PCI; duszność jako działanie niepożądane</div>"}, {"c": 5, "x": "Leki w ratownictwie › Leki przeciwkrzepliwe i przeciwpłytkowe (OZW)", "k": "Lek", "f": "heparyna niefrakcjonowana 5000 j.m./ml", "b": "<div class=\"kv\"><span>Dawka</span> STEMI i PCI: 70–100 j.m./kg i.v. (ok. 5000 j.m.)</div><div class=\"kv\"><span>Ważne</span> krwawienie; odtrutka siarczan protaminy</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "glukoza 20% (200 mg/ml)", "b": "<div class=\"kv\"><span>Dawka</span> hipoglikemia: <strong>0,2 g/kg = 1 ml/kg 20%</strong> i.v.; dzieci 2 ml/kg 10% (0,2 g/kg)</div><div class=\"kv\"><span>Ważne</span> stężone roztwory podawaj do dużej żyły (podrażniają, martwica przy wynaczynieniu)</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "glukagon 1 mg", "b": "<div class=\"kv\"><span>Dawka</span><strong>1 mg</strong> i.m./s.c./i.v. (&lt; 25 kg: 0,5 mg); zatrucie beta-blokerami: 5–10 mg i.v.</div><div class=\"kv\"><span>Ważne</span> Nie działa przy wyczerpanym glikogenie (alkohol, głód)</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "salbutamol", "b": "<div class=\"kv\"><span>Dawka</span> nebulizacja 2,5–5 mg (powtarzać w ciężkim napadzie co 20 min lub w sposób ciągły); MDI 100–200 µg (2–4 dawki) przez komorę inhalacyjną</div><div class=\"kv\"><span>Ważne</span> astma, POChP, skurcz oskrzeli w anafilaksji; tachykardia, drżenie, hipokaliemia</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "budezonid (nebulizacja)", "b": "<div class=\"kv\"><span>Dawka</span> 1–2 mg</div><div class=\"kv\"><span>Ważne</span> zapalenie krtani u dzieci (pseudokrup)</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "hydrokortyzon", "b": "<div class=\"kv\"><span>Dawka</span> 100–200 mg i.v.</div><div class=\"kv\"><span>Ważne</span> astma, anafilaksja (druga linia), <strong>przełom nadnerczowy (100 mg)</strong></div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "deksametazon 4 mg/ml", "b": "<div class=\"kv\"><span>Dawka</span> 4–8 mg i.v.; pseudokrup 0,15–0,6 mg/kg p.o./i.m.</div><div class=\"kv\"><span>Ważne</span> obrzęk mózgu wokół guza, zespół żyły głównej górnej, pseudokrup</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "klemastyna (Tavegil) 1 mg/ml (2 ml)", "b": "<div class=\"kv\"><span>Dawka</span> 2 mg i.v. powoli (rozcieńczona 1:5) lub i.m.; dzieci 25 µg/kg i.m.</div><div class=\"kv\"><span>Ważne</span> lek drugiej linii w reakcjach alergicznych; senność</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "metoklopramid 5 mg/ml (2 ml)", "b": "<div class=\"kv\"><span>Dawka</span> 10 mg i.v. powoli lub i.m.</div><div class=\"kv\"><span>Ważne</span> nudności i wymioty; może wywołać dystonię (skurcze mięśni twarzy i szyi, szczególnie u młodych), nie przy niedrożności jelit</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "drotaweryna (No-Spa) 20 mg/ml (2 ml)", "b": "<div class=\"kv\"><span>Dawka</span> 40–80 mg i.v. powoli (w pozycji leżącej) lub i.m.</div><div class=\"kv\"><span>Ważne</span> kolka nerkowa i żółciowa (rozkurcz mięśni gładkich); hipotensja</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "wodorowęglan sodu 8,4% (1 ml = 1 mmol)", "b": "<div class=\"kv\"><span>Dawka</span> 50 mmol (50 ml) i.v.; wg niedoboru zasad: BE × masa × 0,3</div><div class=\"kv\"><span>Ważne</span> tylko w określonych sytuacjach: hiperkaliemia, zatrucie trójpierścieniowymi lekami przeciwdepresyjnymi (poszerzony QRS), ciężka kwasica; nie rutynowo w NZK; nie mieszać z wapniem i adrenaliną w jednym dostępie</div>"}, {"c": 5, "x": "Leki w ratownictwie › Inne często stosowane", "k": "Lek", "f": "mannitol 15–20%", "b": "<div class=\"kv\"><span>Dawka</span> 0,25–1 g/kg i.v.</div><div class=\"kv\"><span>Ważne</span> obrzęk mózgu z objawami wklinowania (decyzja lekarza)</div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "k": "Lek", "f": "werapamil", "b": "<div class=\"kv\"><span>Dawka</span> 2,5–5 mg i.v. w 2 min, potem 5–10 mg co 15–30 min (maks. 20 mg)</div><div class=\"kv\"><span>Uwagi</span> miarowy częstoskurcz z wąskimi QRS, kontrola rytmu w migotaniu przedsionków; <strong>nie przy szerokich QRS, WPW, niewydolności serca, z beta-blokerem i w hipotensji</strong></div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "k": "Lek", "f": "digoksyna", "b": "<div class=\"kv\"><span>Dawka</span> 0,25–0,5 mg i.v., potem 0,25 mg co 4–6 h (maks. 1,5 mg); z amiodaronem dawka o 50% mniejsza</div><div class=\"kv\"><span>Uwagi</span> wąskie okno terapeutyczne; zatrucie daje nudności, zaburzenia widzenia (żółte widzenie), bradykardię i różne arytmie, zwłaszcza przy hipokaliemii</div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki", "k": "Lek", "f": "chlorek potasu", "b": "<div class=\"kv\"><span>Dawka</span> 10–20 mmol/h i.v. (szybciej tylko przez dostęp centralny); 1 ml 15% KCl = 2 mmol K⁺</div><div class=\"kv\"><span>Uwagi</span><strong>nigdy w bolusie</strong> (zatrzymanie krążenia); wyłącznie rozcieńczony we wlewie</div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki", "k": "Lek", "f": "noradrenalina", "b": "<div class=\"kv\"><span>Dawka</span> 2–20 µg/min (0,05–0,5 µg/kg/min)</div><div class=\"kv\"><span>Uwagi</span><strong>lek pierwszego wyboru we wstrząsie septycznym</strong>; najlepiej przez dużą żyłę (martwica przy wynaczynieniu)</div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "k": "Lek", "f": "ipratropium (Atrovent) / Berodual (fenoterol + ipratropium)", "b": "<div class=\"kv\"><span>Dawka</span> ipratropium 0,25–0,5 mg w nebulizacji, powtarzane co 20 min; Berodual 1 ml = 20 kropli</div><div class=\"kv\"><span>Uwagi</span> razem z salbutamolem w ciężkiej astmie i POChP</div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki", "k": "Lek", "f": "prednizolon", "b": "<div class=\"kv\"><span>Dawka</span> dorośli 25–50 mg i.v.; dzieci 1–2 mg/kg</div><div class=\"kv\"><span>Uwagi</span> astma, alergia</div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki", "k": "Lek", "f": "hioscyna (Buscopan)", "b": "<div class=\"kv\"><span>Dawka</span> 20 mg i.v./i.m., można powtórzyć po 20 min (maks. 100 mg/d)</div><div class=\"kv\"><span>Uwagi</span> kolka nerkowa i żółciowa; tachykardia, suchość w ustach; nie przy jaskrze i zatrzymaniu moczu</div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki", "k": "Lek", "f": "tramadol (Tramal)", "b": "<div class=\"kv\"><span>Dawka</span> 50–100 mg co 4–6 h (maks. 400 mg/d)</div><div class=\"kv\"><span>Uwagi</span> słaby opioid; nudności; obniża próg drgawkowy, ryzyko zespołu serotoninowego z lekami przeciwdepresyjnymi</div>"}, {"c": 5, "x": "Leki w ratownictwie › Dodatkowe leki", "k": "Lek", "f": "hydroksyzyna", "b": "<div class=\"kv\"><span>Dawka</span> 50–100 mg i.m.; dzieci 1 mg/kg</div><div class=\"kv\"><span>Uwagi</span> uspokajająco i przeciwhistaminowo (lęk, świąd)</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na serce – rytm · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "k": "Lek", "f": "werapamil (Isoptin)", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span><strong>bloker kanałów wapniowych</strong>. Wapnia potrzebuje węzeł przedsionkowo-komorowy („bramka” między przedsionkami a komorami), żeby przewodzić impulsy. Werapamil przymyka tę bramkę, więc serce zwalnia, a częstoskurcz nadkomorowy często się przerywa. Dodatkowo słabiej kurczy serce i rozszerza naczynia.</div><div class=\"kv\"><span>Kiedy w karetce</span> częstoskurcz z <strong>wąskimi QRS</strong>, gdy adenozyna nie zadziałała albo jest przeciwwskazana (np. astma); zwolnienie szybkiego migotania przedsionków</div><div class=\"kv\"><span>Uważaj / jak zapamiętać</span><strong>nigdy przy szerokich QRS</strong> (częstoskurcz komorowy → zatrzymanie krążenia) ani przy WPW. Nie przy niskim ciśnieniu i niewydolności serca. <strong>Nie razem z beta-blokerem</strong> (np. metoprolol), bo razem mogą „zatrzymać” serce. Skojarzenie: <strong>„werapamil = wapnia brak, serce zwalnia”</strong></div>"}, {"c": 5, "x": "Leki po ludzku › Leki na serce – rytm", "k": "Lek", "f": "adenozyna", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> działa jak „reset”: na kilka sekund całkowicie blokuje węzeł przedsionkowo-komorowy, przerywając krążący impuls w częstoskurczu nadkomorowym. Działa tylko ok. 10 s, dlatego bardzo szybki bolus i od razu przepłukanie.</div><div class=\"kv\"><span>Kiedy w karetce</span> pierwszy lek w <strong>miarowym częstoskurczu z wąskimi QRS</strong> po manewrach vagalnych</div><div class=\"kv\"><span>Uważaj / jak zapamiętać</span> pacjent czuje „zatrzymanie serca”, ucisk i zaczerwienienie: uprzedź go. Na monitorze chwilowa asystolia. Ostrożnie przy astmie</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na serce – rytm", "k": "Lek", "f": "metoprolol (Betaloc)", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span><strong>beta-bloker</strong>: blokuje receptory beta-1 w sercu, czyli „hamuje” działanie adrenaliny na serce. Serce bije wolniej i słabiej, spada ciśnienie.</div><div class=\"kv\"><span>Kiedy w karetce</span> zwolnienie szybkiego migotania przedsionków lub częstoskurczu u stabilnego pacjenta</div><div class=\"kv\"><span>Uważaj / jak zapamiętać</span> nie przy astmie (beta-blokery mogą wywołać skurcz oskrzeli), niskim ciśnieniu, bradykardii i ostrej niewydolności serca. Końcówka <strong>-olol = beta-bloker</strong></div>"}, {"c": 5, "x": "Leki po ludzku › Leki na serce – rytm", "k": "Lek", "f": "amiodaron (Cordarone)", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> lek przeciwarytmiczny „od wszystkiego”: stabilizuje błony komórek serca i wydłuża czas, zanim mogą ponownie się pobudzić. Dzięki temu gasi chaotyczne pobudzenia.</div><div class=\"kv\"><span>Kiedy w karetce</span><strong>NZK z VF/pVT po 3. wyładowaniu</strong>; częstoskurcz z szerokimi QRS u stabilnego pacjenta; migotanie przedsionków</div><div class=\"kv\"><span>Uważaj / jak zapamiętać</span> rozcieńczaj <strong>tylko w 5% glukozie</strong>; spadek ciśnienia, bradykardia</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na serce – rytm", "k": "Lek", "f": "lidokaina", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> lek miejscowo znieczulający, który w sercu blokuje kanały sodowe i uspokaja „pobudzone” komory</div><div class=\"kv\"><span>Kiedy w karetce</span> NZK z VF, gdy nie ma amiodaronu</div><div class=\"kv\"><span>Uważaj / jak zapamiętać</span> nie łączyć z amiodaronem. Przedawkowanie daje drgawki i zaburzenia rytmu</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na serce – rytm · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "k": "Lek", "f": "digoksyna (Digoxin)", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> glikozyd naparstnicy (roślina). Wzmacnia skurcz serca i zwalnia przewodzenie przez węzeł przedsionkowo-komorowy.</div><div class=\"kv\"><span>Kiedy w karetce</span> zwolnienie migotania przedsionków u pacjenta z <strong>niewydolnością serca</strong> (gdzie beta-bloker i werapamil szkodzą)</div><div class=\"kv\"><span>Uważaj / jak zapamiętać</span><strong>bardzo wąskie okno terapeutyczne</strong>: łatwo o zatrucie, zwłaszcza u starszych, przy chorych nerkach i niskim potasie. Objawy zatrucia: nudności, wymioty, <strong>żółte lub zielone widzenie</strong>, bradykardia, różne arytmie. 🚑 U pacjenta, który bierze digoksynę i ma wymioty oraz wolne tętno, myśl o zatruciu</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na serce – rytm", "k": "Lek", "f": "atropina", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> blokuje nerw błędny (receptory muskarynowe), czyli „hamulec” serca. Serce przyspiesza, wysychają śluzówki i oskrzela, rozszerzają się źrenice.</div><div class=\"kv\"><span>Kiedy w karetce</span><strong>bradykardia z objawami</strong>; zatrucie fosforoorganiczne (środki ochrony roślin)</div><div class=\"kv\"><span>Uważaj / jak zapamiętać</span> w NZK już nie. „Suchy jak pieprz, czerwony jak burak, gorący jak piec” – tak wygląda pacjent po dużej dawce</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na krążenie – ciśnienie i wstrząs", "k": "Lek", "f": "noradrenalina", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span>„obkurcza” naczynia (głównie receptory alfa-1), przez co rośnie ciśnienie. Na serce działa słabiej niż adrenalina.</div><div class=\"kv\"><span>Kiedy</span><strong>wstrząs septyczny</strong> i inne wstrząsy z rozszerzonymi naczyniami, gdy płyny nie wystarczają; po ROSC przy niskim ciśnieniu</div><div class=\"kv\"><span>Uważaj</span> tylko we wlewie z pompy, do dużej żyły. Wynaczynienie powoduje martwicę skóry. Najpierw uzupełnij płyny („nie ściska się pustej rury”)</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na krążenie – ciśnienie i wstrząs", "k": "Lek", "f": "urapidyl (Ebrantil)", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> rozszerza naczynia (blokuje receptory alfa-1) bez przyspieszania tętna</div><div class=\"kv\"><span>Kiedy</span><strong>nagle bardzo wysokie ciśnienie z objawami uszkodzenia narządów</strong> (obrzęk płuc, rozwarstwienie aorty, encefalopatia)</div><div class=\"kv\"><span>Uważaj</span> podawaj powoli, pacjent leży. Nie obniżaj ciśnienia zbyt szybko (maks. 20–25% w pierwszej godzinie)</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na krążenie – ciśnienie i wstrząs", "k": "Lek", "f": "kaptopryl", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span><strong>inhibitor ACE</strong>: blokuje enzym, który wytwarza substancję obkurczającą naczynia (angiotensynę II). Naczynia się rozszerzają, ciśnienie spada.</div><div class=\"kv\"><span>Kiedy</span> wysokie ciśnienie <strong>bez</strong> uszkodzenia narządów (tabletka pod język)</div><div class=\"kv\"><span>Uważaj</span> może wywołać obrzęk naczynioruchowy (puchnące usta i język). Końcówka <strong>-pryl = inhibitor ACE</strong></div>"}, {"c": 5, "x": "Leki po ludzku › Leki na krążenie – ciśnienie i wstrząs", "k": "Lek", "f": "chlorek potasu (KCl)", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> uzupełnia potas, który jest potrzebny do prawidłowej pracy serca i mięśni</div><div class=\"kv\"><span>Kiedy</span> ciężka hipokaliemia (np. po dużych wymiotach lub biegunce, przy lekach moczopędnych) z zaburzeniami rytmu; zwykle w szpitalu</div><div class=\"kv\"><span>Uważaj</span><strong>nigdy w bolusie</strong> (szybkie podanie zatrzymuje serce). Tylko rozcieńczony, w powolnym wlewie</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na krążenie – ciśnienie i wstrząs", "k": "Lek", "f": "furosemid", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> silny lek moczopędny: nerki wydalają więcej wody i soli, a do tego lekko rozszerza żyły</div><div class=\"kv\"><span>Kiedy</span> obrzęk płuc przy przewodnieniu</div><div class=\"kv\"><span>Uważaj</span> nie przy niskim ciśnieniu i odwodnieniu. Obniża potas</div>"}, {"c": 5, "x": "Leki po ludzku › Leki na krążenie – ciśnienie i wstrząs", "k": "Lek", "f": "mannitol", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> cukier, który „wyciąga” wodę z tkanek (osmoza), także z obrzękniętego mózgu</div><div class=\"kv\"><span>Kiedy</span> obrzęk mózgu z objawami wklinowania (decyzja lekarza eki uspokajające, przeciwwymiotne i przeciwhistaminowe", "k": "Lek", "f": "klemastyna (Tavegil)", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> lek przeciwhistaminowy (blokuje H1), zmniejsza świąd, pokrzywkę i obrzęk</div><div class=\"kv\"><span>Kiedy</span> reakcja alergiczna (po adrenalinie w anafilaksji)</div><div class=\"kv\"><span>Uważaj</span> senność; podawaj powoli, rozcieńczoną</div>"}, {"c": 5, "x": "Leki po ludzku › Leki uspokajające, przeciwwymiotne i przeciwhistaminowe", "k": "Lek", "f": "midazolam, diazepam, klonazepam", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span><strong>benzodiazepiny</strong>: wzmacniają działanie GABA, czyli „hamulca” mózgu. Uspokajają, przerywają drgawki, usypiają.</div><div class=\"kv\"><span>Kiedy</span><strong>drgawki</strong>, pobudzenie, sedacja</div><div class=\"kv\"><span>Uważaj</span> depresja oddechu, zwłaszcza z alkoholem i opioidami. Końcówka <strong>-zepam / -zolam = benzodiazepina</strong></div>"}, {"c": 5, "x": "Leki po ludzku › Leki uspokajające, przeciwwymiotne i przeciwhistaminowe", "k": "Lek", "f": "flumazenil", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> odtrutka na benzodiazepiny (wypiera je z receptora)</div><div class=\"kv\"><span>Kiedy</span> wyjątkowo, np. po sedacji w szpitalu</div><div class=\"kv\"><span>Uważaj</span> u osób przewlekle biorących benzodiazepiny i przy zatruciu mieszanym może wywołać drgawki</div>"}, {"c": 5, "x": "Leki po ludzku › Leki uspokajające, przeciwwymiotne i przeciwhistaminowe", "k": "Lek", "f": "metoklopramid", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> blokuje receptory dopaminowe (D2) w ośrodku wymiotnym i przyspiesza opróżnianie żołądka</div><div class=\"kv\"><span>Kiedy</span> nudności i wymioty</div><div class=\"kv\"><span>Uważaj</span> dystonia (skurcze mięśni szyi i twarzy, „oczy uciekają do góry”), zwłaszcza u młodych. Nie przy niedrożności jelit</div>"}, {"c": 5, "x": "Leki po ludzku › Leki uspokajające, przeciwwymiotne i przeciwhistaminowe · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "k": "Lek", "f": "ondansetron", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> blokuje receptory serotoninowe (5-HT3) w ośrodku wymiotnym</div><div class=\"kv\"><span>Kiedy</span> nudności i wymioty (także u dzieci, po chemioterapii)</div><div class=\"kv\"><span>Uważaj</span> wydłuża QT; zaparcia</div>"}, {"c": 5, "x": "Leki po ludzku › Leki przeciwzakrzepowe (OZW)", "k": "Lek", "f": "ASA (aspiryna)", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> hamuje zlepianie się płytek krwi (blokuje enzym COX w płytkach na całe ich życie, ok. 7–10 dni)</div><div class=\"kv\"><span>Kiedy</span> OZW, do rozgryzienia</div><div class=\"kv\"><span>Uważaj</span> alergia na ASA, czynne krwawienie, podejrzenie rozwarstwienia aorty</div>"}, {"c": 5, "x": "Leki po ludzku › Leki przeciwzakrzepowe (OZW)", "k": "Lek", "f": "klopidogrel, tikagrelor, prasugrel", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span><strong>inhibitory P2Y₁₂</strong>: blokują inny receptor na płytkach, przez co działają razem z ASA („podwójna terapia przeciwpłytkowa”)</div><div class=\"kv\"><span>Kiedy</span> OZW, zwykle po konsultacji z ośrodkiem PCI</div><div class=\"kv\"><span>Uważaj</span> krwawienia; tikagrelor może dawać uczucie duszności</div>"}, {"c": 5, "x": "Leki po ludzku › Leki przeciwzakrzepowe (OZW)", "k": "Lek", "f": "heparyna niefrakcjonowana", "b": "<div class=\"kv\"><span>Co to jest i jak działa</span> wzmacnia naturalny hamulec krzepnięcia (antytrombinę), przez co krew wolniej tworzy skrzepy</div><div class=\"kv\"><span>Kiedy</span> STEMI, zatorowość płucna (decyzja lekarza)</div><div class=\"kv\"><span>Uważaj</span> krwawienia; odtrutka siarczan protaminy</div>"}, {"c": 5, "x": "Obliczanie dawek", "k": "Zadanie", "f": "Adrenalina i.v. w NZK u dziecka 15 kg (10 µg/kg), ampułka 1 mg/ml", "b": "<div class=\"kv\"><span>Rozwiązanie</span> dawka = 150 µg. Rozcie dane</span> kilka dni bólu głowy, duszności, bólu w klatce i bólów kostno-stawowych (infekcja); D-dimer 18 500, troponina, uszkodzenie wątroby, małopłytkowość</div><div class=\"kv\"><span>Najbardziej prawdopodobnie</span><strong>masywna zatorowość płucna</strong> albo zapalenie mięśnia sercowego po infekcji</div><div class=\"kv\"><span>Wniosek dla ratownika</span> w PEA szukasz przyczyn 4H i 4T; przy podejrzeniu zatoru rozważ fibrynolizę i resuscytację przez 60–90 min</div>"}, {"c": 15, "x": "Przypadki kliniczne – kardiologia", "k": "Przypadek", "f": "3. Mężczyzna, 33 lata, otyły", "b": "<div class=\"kv\"><span>Najważniejsze dane</span> 20 dni narastającej duszności, od doby spoczynkowej; kilka dni wcześniej bolesny, zaczerwieniony obrzęk prawej nogi; SpO₂ 90%, HR 124</div><div class=\"kv\"><span>Najbardziej prawdopodobnie</span><strong>zakrzepica żył głębokich i zatorowość płucna</strong></div><div class=\"kv\"><span>Wniosek dla ratownika</span> jednostronny obrzęk nogi i duszność to zator, dopóki nie wykaże się inaczej; tlen, transport, nie masuj nogi</div>"}, {"c": 15, "x": "Przypadki kliniczne – kardiologia", "k": "Przypadek", "f": "4. Kobieta, 56 lat, ból w nadbrzuszu i duszność", "b": "<div class=\"kv\"><span>Najważniejsze dane</span> RR 86/65, HR 110, poszerzone żyły szyjne, ciche tony serca, głośny szmer, leukocytoza</div><div class=\"kv\"><span>Najbardziej prawdopodobnie</span><strong>wstrząs kardiogenny w zawale ściany dolnej</strong> z powikłaniem mechanicznym (pęknięcie przegrody lub mięśnia brodawkowatego) albo tamponada</div><div class=\"kv\"><span>Wniosek dla ratownika</span> ból w nadbrzuszu u kobiety w średnim wieku: zawsze EKG; nowy głośny szmer po zawale to stan nagły kardiochirurgiczny</div>"}, {"c": 15, "x": "Przypadki kliniczne – kardiologia", "k": "Przypadek", "f": "5. Mężczyzna, 80 lat, ciężka duszność od 6 h, gorsza na leżąco", "b": "<div class=\"kv\"><span>Najważniejsze dane</span> pienista plwocina, rzężenia do 3/4 wysokości płuc, RR 150/85, HR 110, po NSTEMI z obrzękiem płuc; od tygodnia <strong>ketoprofen</strong>, do tego infekcja</div><div class=\"kv\"><span>Najbardziej prawdopodobnie</span><strong>obrzęk płuc w zaostrzeniu niewydolności serca</strong> wywołanym przez NLPZ i infekcję</div><div class=\"kv\"><span>Wniosek dla ratownika</span> pozycja siedząca, tlen lub CPAP, nitrogliceryna (RR pozwala), furosemid; <strong>u pacjentów z niewydolnością serca nie podawaj NLPZ</strong></div>"}, {"c": 15, "x": "Migotanie przedsionków › Postępowanie w karetce", "k": "Lek", "f": "metoprolol", "b": "<div class=\"kv\"><span>Dawka</span> 2,5–5 mg i.v. co 5 min (maks. 15 mg)</div><div class=\"kv\"><span>Kiedy unikać</span> hipotensja, astma, ostra niewydolność serca</div>"}, {"c": 15, "x": "Migotanie przedsionków › Postępowanie · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "k": "Lek", "f": "diltiazem", "b": "<div class=\"kv\"><span>Dawka</span> 0,25 mg/kg i.v. w 2 min (ok. 20 mg)</div><div class=\"kv\"><span>Kiedy unikać</span> niestabilność, LVEF &lt; 40%, blok AV II–III stopnia, WPW</div>"}, {"c": 15, "x": "Migotanie przedsionków › Postępowanie w karetce", "k": "Lek", "f": "amiodaron", "b": "<div class=\"kv\"><span>Dawka</span> 300 mg i.v. w 10–60 min (w 5% glukozie), potem 900 mg/24 h</div><div class=\"kv\"><span>Kiedy unikać</span> przy niewydolności serca, gdy inne leki nie działają; może przywrócić rytm zatokowy (ryzyko zatorowe)</div>"}, {"c": 15, "x": "Migotanie przedsionków › Postępowanie · ⚠️ lek spoza listy RM – podaje lekarz lub ratownik na zlecenie", "k": "Lek", "f": "digoksyna", "b": "<div class=\"kv\"><span>Dawka</span> 0,5 mg i.v., potem 0,25 mg co 6–8 h (maks. 1 mg/d)</div><div class=\"kv\"><span>Kiedy unikać</span> WPW, bloki AV, zatrucie glikozydami, kardiomiopatia przerostowa</div>"}, {"c": 15, "x": "Migotanie przedsionków › Postępowanie w karetce", "k": "Lek", "f": "magnez", "b": "<div class=\"kv\"><span>Dawka</span> 2 g i.v. w 10 min</div><div class=\"kv\"><span>Kiedy unikać</span> pomocniczo</div>"}, {"c": 17, "x": "Układ krążenia › Układ przewodzący i rytmy zastępcze", "k": "Rozrusznik", "f": "Węzeł zatokowy SA (Keitha-Flacka)", "b": "<div class=\"kv\"><span>Gdzie leży</span> ujście żyły głównej górnej do prawego przedsionka</div><div class=\"kv\"><span>Częstość</span> 60–100/min (izolowany 90–120)</div><div class=\"kv\"><span>Co widać w EKG</span> rytm zatokowy: P przed każdym QRS</div>"}, {"c": 17, "x": "Układ krążenia › Układ przewodzący i rytmy zastępcze", "k": "Rozrusznik", "f": "Węzeł AV (Aschoffa-Tawary)", "b": "<div class=\"kv\"><span>Gdzie leży</span> dno prawego przedsionka, przegroda przy zastawce trójdzielnej</div><div class=\"kv\"><span>Częstość</span> 40–60/min</div><div class=\"kv\"><span>Co widać w EKG</span> wąskie QRS, P odwrócony tuż przed lub po QRS albo brak</div>"}, {"c": 17, "x": "Układ krążenia › Układ przewodzący i rytmy zastępcze", "k": "Rozrusznik", "f": "Komory (włókna Purkinjego)", "b": "<div class=\"kv\"><span>Gdzie leży</span> podwsierdziowo w komorach</div><div class=\"kv\"><span>Częstość</span> 20–40/min</div><div class=\"kv\"><span>Co widać w EKG</span> szerokie QRS, wolny rytm</div>"}, {"c": 17, "x": "Układ krążenia › Potencjał czynnościowy komórki mięśnia serca", "k": "Faza", "f": "0 – depolaryzacja", "b": "<div class=\"kv\"><span>Co się dzieje</span> szybki wzrost do ok. +25 mV, do 2 ms</div><div class=\"kv\"><span>Jony</span> napływ Na⁺</div><div class=\"kv\"><span>Lek, który tu działa</span> klasa I (np. lidokaina)</div>"}, {"c": 17, "x": "Układ krążenia › Potencjał czynnościowy komórki mięśnia serca", "k": "Faza", "f": "1 – wstępna repolaryzacja", "b": "<div class=\"kv\"><span>Co się dzieje</span> krótki spadek</div><div class=\"kv\"><span>Jony</span> wypływ K⁺</div>"}, {"c": 17, "x": "Układ krążenia › Potencjał czynnościowy komórki mięśnia serca", "k": "Faza", "f": "2 – plateau", "b": "<div class=\"kv\"><span>Co się dzieje</span> potencjał ok. 0 mV</div><div class=\"kv\"><span>Jony</sp : "Parametr", "f": "Frakcja wyrzutowa (EF)", "b": "<div class=\"kv\"><span>Norma</span> ok. 65% (miara kurczliwości)</div><div class=\"kv\"><span>Od czego zależy / kiedy spada</span> spada w niewydolności serca, zapaleniu mięśnia sercowego, kardiomiopatii, chorobie wieńcowej</div>"}, {"c": 17, "x": "Układ krążenia › Rzut serca i co na niego wpływa", "k": "Parametr", "f": "Ośrodkowe ciśnienie żylne (OĆŻ, CVP)", "b": "<div class=\"kv\"><span>Norma</span> 4–12 mmHg (miara obciążenia wstępnego)</div><div class=\"kv\"><span>Od czego zależy / kiedy spada</span> spada przy krwotoku, odwodnieniu, wstrząsie anafilaktycznym</div>"}, {"c": 17, "x": "Układ krążenia › Regulacja pracy serca", "k": "Układ", "f": "Współczulny (przyspieszający)", "b": "<div class=\"kv\"><span>Gdzie</span> rogi boczne rdzenia Th1–Th5</div><div class=\"kv\"><span>Przekaźnik</span> noradrenalina</div><div class=\"kv\"><span>Efekt</span>↑ częstość, ↑ siła skurczu</div>"}, {"c": 17, "x": "Układ krążenia › Regulacja pracy serca", "k": "Układ", "f": "Przywspółczulny (zwalniający)", "b": "<div class=\"kv\"><span>Gdzie</span> rdzeń przedłużony, jądro grzbietowe nerwu błędnego (X)</div><div class=\"kv\"><span>Przekaźnik</span> acetylocholina</div><div class=\"kv\"><span>Efekt</span>↓ częstość</div>"}, {"c": 17, "x": "Układ krążenia › Regulacja pracy serca", "k": "Działanie", "f": "Inotropowe", "b": "<div class=\"kv\"><span>Co zmienia</span> siłę skurczu</div><div class=\"kv\"><span>Przykład leku</span> dobutamina (+)</div>"}, {"c": 17, "x": "Układ krążenia › Regulacja pracy serca", "k": "Działanie", "f": "Chronotropowe", "b": "<div class=\"kv\"><span>Co zmienia</span> częstość</div><div class=\"kv\"><span>Przykład leku</span> atropina (+), beta-bloker (−)</div>"}, {"c": 17, "x": "Układ krążenia › Regulacja pracy serca", "k": "Działanie", "f": "Dromotropowe", "b": "<div class=\"kv\"><span>Co zmienia</span> przewodzenie</div><div class=\"kv\"><span>Przykład leku</span> adenozyna (−, blok AV na sekundy)</div>"}, throx)", "b": "zawroty głowy, senność, nudności"}, {"c": 18, "x": "Ocena świadomości", "k": "Ocena świadomości", "f": "AVPU", "b": "<div class=\"kv\"><span>Co oznacza</span> A – przytomny (Alert); V – reaguje na głos (Voice); P – reaguje na ból (Pain); U – nie reaguje (Unresponsive)</div><div class=\"kv\"><span>Zapamiętaj</span> P lub U odpowiada mniej więcej GCS ≤ 8 – zagrożone drogi oddechowe</div>"}, {"c": 18, "x": "Ocena świadomości", "k": "Ocena świadomości", "f": "GCS – otwieranie oczu (E)", "b": "<div class=\"kv\"><span>Punkty</span> 4 spontanicznie; 3 na głos; 2 na ból (ucisk); 1 brak</div>"}, {"c": 18, "x": "Ocena świadomości", "k": "Ocena świadomości", "f": "GCS – odpowiedź słowna (V)", "b": "<div class=\"kv\"><span>Punkty</span> 5 zorientowany; 4 splątany; 3 pojedyncze nieadekwatne słowa; 2 niezrozumiałe dźwięki; 1 brak</div><div class=\"kv\"><span>Uwaga</span> pacjent zaintubowany lub z tracheostomią: zapisz „T”</div>"}, {"c": 18, "x": "Ocena świadomości", "k": "Ocena świadomości", "f": "GCS – odpowiedź ruchowa (M)", "b": "<div class=\"kv\"><span>Punkty</span> 6 spełnia polecenia; 5 lokalizuje ból; 4 cofa kończynę (zgięcie obronne); 3 zgięcie nieprawidłowe (odkorowanie); 2 wyprost (odmóżdżenie); 1 brak</div><div class=\"kv\"><span>Zapamiętaj</span> M ma największą wartość rokowniczą – zawsze zapisuj najlepszą odpowiedź</div>"}, {"c": 18, "x": "Ocena świadomości", "k": "Ocena świadomości", "f": "GCS – interpretacja", "b": "<div class=\"kv\"><span>Punkty</span> 3–15. 13–15 lekkie, 9–12 umiarkowane, ≤ 8 ciężkie zaburzenia świadomości</div><div class=\"kv\"><span>Co robisz</span> GCS ≤ 8 → zabezpiecz drogi oddechowe; spadek o ≥ 2 pkt to pogorszenie – szukaj przyczyny (wklinowanie, hipoglikemia, hipoksja)</div><div class=\"kv\"><span>Zapis</span> podawaj składowe, np. GCS 9 (E2 V3 M4)</div>"}, {"c": 18, "x": "Ocena świadomości", "k": "Ocena świadomości", "f": "GCS u dziecka < 2 lat – odpowiedź słowna", "b": "<div class=\"kv\"><span>Punkty</span> 5 gaworzy, uśmiecha się, wodzi wzrokiem; 4 płacze, ale daje się uspokoić; 3 płacz lub krzyk na ból, nie daje się uspokoić; 2 jęczy, pojękuje na ból; 1 brak</div><div class=\"kv\"><span>Uwaga</span> oczy i ruch ocenia się podobnie jak u dorosłych (6 = ruchy spontaniczne celowe)</div>"}, {"c": 18, "x": "Ocena świadomości", "k": "Ocena świadomości", "f": "Bodziec bólowy do GCS", "b": "<div class=\"kv\"><span>Jak</span> obwodowy: ucisk łożyska paznokcia (do oceny E i ruchu); centralny: ucisk mięśnia czworobocznego lub nadoczodołowy (do oceny lokalizowania)</div><div class=\"kv\"><span>Uwaga</span> nie pocieraj mostka – zostawia siniaki</div>"}, {"c": 18, "x": "Ocena świadomości", "k": "Ocena świadomości", "f": "AEIOU-TIPS – przyczyny zaburzeń świadomości", "b": "<div class=\"kv\"><span>Co oznacza</span> A alkohol; E epilepsja, elektrolity, endokrynologia; I insulina (hipo-/hiperglikemia); O opioidy, przedawkowanie; U uremia; T trauma, temperatura; I infekcja; P psychiatria, porfiria; S stroke (udar), shock (wstrząs)</div><div class=\"kv\"><span>Zapamiętaj</span> u każdego nieprzytomnego zmierz glikemię</div>"}, {"c": 18, "x": "Źrenice", "k": "Źrenice", "f": "Badanie źrenic", "b": "<div class=\"kv\"><span>Co oceniasz</span> wielkość (mm), równość, kształt, reakcję na światło: bezpośrednią i konsensualną (drugie oko też się zwęża)</div><div class=\"kv\"><span>Nerwy</span> światło odbiera n. II (wzrokowy), źrenicę zwęża n. III (okoruchowy)</div>"}, {"c": 18, "x": "Źrenice", "k": "Źrenice", "f": "Anizokoria (nierówne źrenice)", "b": "<div class=\"kv\"><span>Znaczenie</span> u nieprzytomnego po urazie: szersza, niereagująca źrenica zwykle po stronie krwiaka – ucisk n. III przy wklinowaniu</div><div class=\"kv\"><span>Co robisz</span> pilnie do szpitala z neurochirurgią, utrzymuj prawidłową wentylację i ciśnienie</div><div class=\"kv\"><span>Uwaga</span> ok. 20% ludzi ma niewielką fizjologiczną anizokorię (&lt; 1 mm) z prawidłową reakcją</div>"}, {"c": 18, "x": "Źrenice", "k": "Źrenice", "f": "Źrenice szpilkowate (bardzo wąskie)", "b": "<div class=\"kv\"><span>Przyczyny</span> opioidy, związki fosforoorganiczne, krwotok do mostu, leki cholinergiczne</div>"}, {"c": 18, "x": "Źrenice", "k": "Źrenice", "f": "Źrenice szerokie obustronnie", "b": "<div class=\"kv\"><span>Przyczyny</span> niedotlenienie, NZK, sympatykomimetyki (kokaina, amfetamina), leki antycholinergiczne (atropina), strach i ból; szerokie sztywne po NZK – zła prognoza (ale nie decyduje o przerwaniu RKO)</div>"}, {"c": 18, "x": "Objawy oponowe", "k": "Objawy oponowe", "f": "Sztywność karku", "b": "<div class=\"kv\"><span>Jak badać</span> pacjent leży; bierne zgięcie głowy do klatki piersiowej – opór i ból</div><div class=\"kv\"><span>Uwaga</span> nie badaj przy podejrzeniu urazu kręgosłupa szyjnego</div>"}, {"c": 18, "x": "Objawy oponowe", "k": "Objawy oponowe", "f": "Objaw Kerniga", "b": "<div class=\"kv\"><span>Jak badać</span> zgięcie nogi w biodrze i kolanie do 90°, potem próba wyprostu kolana</div><div class=\"kv\"><span>Wynik dodatni</span> opór i ból – nie da się wyprostować kolana</div>"}, {"c": 18, "x": "Objawy oponowe", "k": "Objawy oponowe", "f": "Objaw Brudzińskiego karkowy (górny)", "b": "<div class=\"kv\"><span>Jak badać</span> bierne zgięcie głowy do przodu</div><div class=\"kv\"><span>Wynik dodatni</span> odruchowe zgięcie nóg w biodrach i kolanach</div>"}, {"c": 18, "x": "Objawy oponowe", "k": "Objawy oponowe", "f": "Objaw Brudzińskiego łonowy (dolny)", "b": "<div class=\"kv\"><span>Jak badać</span> ucisk na spojenie łonowe</div><div class=\"kv\"><span>Wynik dodatni</span> zgięcie obu kończyn dolnych</div>"}, {"c": 18, "x": "Objawy oponowe", "k": "Objawy oponowe", "f": "Kiedy objawy oponowe są dodatnie", "b": "<div class=\"kv\"><span>Przyczyny</span> zapalenie opon mózgowo-rdzeniowych, krwotok podpajęczynówkowy (SAH)</div><div class=\"kv\"><span>Uwaga</span> u niemowląt często ich brak – patrz na uwypuklone ciemiączko, drażliwość, gorączkę; wybroczyny niebladnące + gorączka = podejrzenie sepsy meningokokowej</div>"}, {"c": 18, "x": "Udar – szybka ocena", "k": "Udar – szybka ocena", "f": "BE-FAST", "b": "<div class=\"kv\"><span>Co oznacza</span> B Balance – zaburzenia równowagi; E Eyes – nagłe zaburzenia widzenia; F Face – opadnięty kącik ust; A Arm – opadanie ręki; S Speech – zaburzenia mowy; T Time – zapisz godzinę wystąpienia objawów</div><div class=\"kv\"><span>Zapamiętaj</span> B i E wychwytują udar tylnego krążenia, którego klasyczny FAST nie widzi</div>"}, {"c": 18, "x": "Udar – szybka ocena", "k": "Udar – szybka ocena", "f": "Skala Cincinnati", "b": "<div class=\"kv\"><span>Co oceniasz</span> asymetria twarzy (uśmiech), opadanie wyciągniętej ręki (10 s z zamkniętymi oczami), zaburzenia mowy</div><div class=\"kv\"><span>Wynik</span> 1 nieprawidłowy element = ok. 70% szans na udar</div>"}, {"c": 18, "x": "Udar – szybka ocena", "k": "Udar – szybka ocena", "f": "Postępowanie w podejrzeniu udaru", "b": "<div class=\"kv\"><span>Co robisz</span> ustal czas ostatniej normalności (last known well); zmierz glikemię (hipoglikemia udaje udar); nie obniżaj ciśnienia poniżej 220/120 (185/110 przed trombolizą); nie podawaj ASA; zgłoś pacjenta do oddziału udarowego</div><div class=\"kv\"><span>Okna leczenia</span> tromboliza do 4,5 h; trombektomia do 6 h, w wybranych przypadkach do 24 h</div>"}, {"c": 18, "x": "Siła i ruch", "k": "Siła i ruch", "f": "Skala siły mięśniowej (MRC, 0–5)", "b": "<div class=\"kv\"><span>Punkty</span> 0 brak skurczu; 1 widoczny skurcz bez ruchu; 2 ruch bez pokonania grawitacji; 3 pokonuje grawitację; 4 pokonuje częściowy opór; 5 pełna siła</div>"}, {"c": 18, "x": "Siła i ruch", "k": "Siła i ruch", "f": "Próba Mingazziniego / Barré (utrzymania kończyn)", "b": "<div class=\"kv\"><span>Jak badać</span> ręce: wyciągnięte do przodu, dłonie do góry, oczy zamknięte, 10 s; nogi: zgięte w biodrach i kolanach w pozycji leżącej</div><div class=\"kv\"><span>Wynik dodatni</span> opadanie lub nawracanie kończyny po stronie niedo ass=\"kv\"><span>Ruchy oka</span> III, IV, VI – „LR6 SO4, reszta 3”: mięsień prosty boczny – VI, skośny górny – IV, pozostałe – III</div>"}, {"c": 18, "x": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Babińskiego", "b": "<div class=\"kv\"><span>Jak wywołać</span> pocieranie bocznej krawędzi podeszwy od pięty do palców</div><div class=\"kv\"><span>Wynik dodatni</span> grzbietowe zgięcie palucha i wachlarzowate rozstawienie pozostałych palców</div><div class=\"kv\"><span>Znaczenie</span> uszkodzenie drogi piramidowej (neuron górny); u dzieci do ok. 1–2 r.ż. fizjologiczny</div>"}, {"c": 18, "x": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Oppenheima", "b": "<div class=\"kv\"><span>Jak wywołać</span> silne przesunięcie palcami po przyśrodkowej krawędzi piszczeli w dół</div><div class=\"kv\"><span>Wynik dodatni</span> jak w objawie Babińskiego – zgięcie grzbietowe palucha</div>"}, {"c": 18, "x": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Gordona", "b": "<div class=\"kv\"><span>Jak wywołać</span> ucisk mięśni łydki</div><div class=\"kv\"><span>Wynik dodatni</span> zgięcie grzbietowe palucha</div>"}, {"c": 18, "x": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Rossolimo", "b": "<div class=\"kv\"><span>Jak wywołać</span> uderzenie w opuszki palców stopy od strony podeszwy</div><div class=\"kv\"><span>Wynik dodatni</span> zgięcie podeszwowe palców – uszkodzenie drogi piramidowej</div>"}, {"c": 18, "x": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Objaw Hoffmanna", "b": "<div class=\"kv\"><span>Jak wywołać</span> pstryknięcie w paznokieć palca środkowego</div><div class=\"kv\"><span>Wynik dodatni</span> zgięcie kciuka i palca wskazującego – neuron górny (kończyna górna)</div>"}, {"c": 18, "x": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Klonus", "b": "<div class=\"kv\"><span>Jak wywołać</span> gwałtowne zgięcie grzbietowe stopy (klonus stopy) lub przesunięcie rzepki w dół</div><div class=\"kv\"><span>Wynik dodatni</span> rytmiczne, powtarzające się skurcze – wzmożone odruchy przy uszkodzeniu neuronu górnego; także w zespole serotoninowym</div>"}, {"c": 18, "x": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Odruchy deliberacyjne (prymitywne)", "b": "<div class=\"kv\"><span>Przykłady</span> ssania, ryjkowy (wysunięcie ust po uderzeniu w wargę), chwytny dłoniowy, dłoniowo-bródkowy</div><div class=\"kv\"><span>Znaczenie</span> u dorosłego – uszkodzenie płatów czołowych, otępienie, rozlane uszkodzenie mózgu</div>"}, {"c": 18, "x": "Odruchy patologiczne", "k": "Odruchy patologiczne", "f": "Skala odruchów głębokich", "b": "<div class=\"kv\"><span>Punkty</span> 0 brak; 1+ osłabiony; 2+ prawidłowy; 3+ żywy; 4+ wzmożony z klonusem</div><div class=\"kv\"><span>Zapamiętaj</span> ważniejsza od siły odruchu jest asymetria między stronami</div>"}, {"c": 18, "x": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Odruch źreniczny", "b": "<div class=\"kv\"><span>Jak</span> światło do oka – zwężenie źrenic</div><div class=\"kv\"><span>Nerwy</span> II (dośrodkowy), III (odśrodkowy); ośrodek w śródmózgowiu</div>"}, {"c": 18, "x": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Odruch rogówkowy", "b": "<div class=\"kv\"><span>Jak</span> dotknięcie rogówki (np. wacikiem) – mrugnięcie</div><div class=\"kv\"><span>Nerwy</span> V (dośrodkowy), VII (odśrodkowy); ośrodek w moście</div>"}, {"c": 18, "x": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Odruch oczno-głowowy („oczy lalki”)", "b": "<div class=\"kv\"><span>Jak</span> szybki obrót głowy (tylko gdy wykluczysz uraz kręgosłupa) – oczy przesuwają się w przeciwną stronę</div><div class=\"kv\"><span>Znaczenie</span> u nieprzytomnego obecny = pień mózgu działa; brak = uszkodzenie pnia</div>"}, {"c": 18, "x": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Odruch gardłowy i kaszlowy", "b": "<div class=\"kv\"><span>Jak</span> drażnienie tylnej ściany gardła / tchawicy (np. przy odsysaniu)</div><div class=\"kv\"><span>Nerwy</span> IX i X; ośrodek w rdzeniu przedłużonym</div><div class=\"kv\"><span>W praktyce</span> brak odruchu gardłowego = pacjent toleruje rurkę ustno-gardłową, zagrożenie aspiracją</div>"}, {"c": 18, "x": "Odruchy pniowe", "k": "Odruchy pniowe", "f": "Znaczenie odruchów pniowych", "b": "<div class=\"kv\"><span>Zapamiętaj</span> brak wszystkich odruchów pniowych i bezdech – jedno z kryteriów śmierci mózgu (orzeka komisja w szpitalu, nie zespół ZRM)</div>"}, {"c": 18, "x": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch Moro", "b": "<div class=\"kv\"><span>Jak wywołać</span> nagłe opuszczenie główki lub głośny dźwięk</div><div class=\"kv\"><span>Reakcja</span> odrzucenie rąk na boki, rozprostowanie palców, potem objęcie i płacz</div><div class=\"kv\"><span>Zanika</span> ok. 4–6 miesiąca</div><div class=\"kv\"><span>Uwaga</span> asymetria → uraz splotu ramiennego lub złamanie obojczyka przy porodzie</div>"}, {"c": 18, "x": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch ssania i szukania", "b": "<div class=\"kv\"><span>Jak wywołać</span> dotknięcie warg (ssanie) lub kącika ust/policzka (szukanie – zwrot główki)</div><div class=\"kv\"><span>Zanika</span> ok. 3–4 miesiąca (szukanie); ssanie przechodzi w świadome</div>"}, {"c": 18, "x": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch chwytny", "b": "<div class=\"kv\"><span>Dłoniowy</span> ucisk dłoni – zaciśnięcie palców; zanika ok. 3–6 miesiąca</div><div class=\"kv\"><span>Podeszwowy</span> ucisk podeszwy – zgięcie palców stopy; zanika ok. 9–12 miesiąca</div>"}, {"c": 18, "x": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch toniczno-szyjny asymetryczny (pozycja szermierza)", "b": "<div class=\"kv\"><span>Reakcja</span> obrót główki → wyprost kończyn po stronie twarzy, zgięcie po stronie potylicy</div><div class=\"kv\"><span>Zanika</span> ok. 6 miesiąca</div>"}, {"c": 18, "x": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Odruch automatycznego chodu (krokowy)", "b": "<div class=\"kv\"><span>Jak wywołać</span> noworodek trzymany pionowo, stopy dotykają podłoża – „kroki”</div><div class=\"kv\"><span>Zanika</span> ok. 2 miesiąca</div>"}, {"c": 18, "x": "Odruchy noworodkowe", "k": "Odruchy noworodkowe", "f": "Znaczenie odruchów noworodkowych", "b": "<div class=\"kv\"><span>Zapamiętaj</span> nieprawidłowe są: brak odruchu, asymetria lub utrzymywanie się odruchu dłużej niż powinien (uszkodzenie OUN)</div>"}, {"c": 18, "x": "Badanie neurologiczne w karetce", "k": "Badanie neurologiczne w karetce", "f": "Szybkie badanie neurologiczne (schemat)", "b": "<div class=\"kv\"><span>Kolejność</span> 1. AVPU/GCS; 2. źrenice (wielkość, reakcja); 3. glikemia; 4. objawy ogniskowe (BE-FAST, siła 4 kończyn, czucie); 5. objawy oponowe; 6. mowa, orientacja; 7. temperatura; 8. ślady urazu, zapach (alkohol, aceton)</div><div class=\"kv\"><span>Zapamiętaj</span> dokumentuj stan wyjściowy i powtarzaj badanie – liczy się zmiana w czasie</div>"}, {"c": 18, "x": "Badanie neurologiczne w karetce", "k": "Badanie neurologiczne w karetce", "f": "Wywiad neurologiczny", "b": "<div class=\"kv\"><span>Pytaj o</span> początek (nagły czy stopniowy), czas wystąpienia, drgawki, uraz, leki (przeciwkrzepliwe!), cukrzycę, padaczkę, alkohol i używki, ból głowy (najgorszy w życiu → SAH)</div>"}, {"c": 6, "x": "SOR – kolory segregacji", "k": "Kolor na SOR", "f": "Kolor czerwony na SOR", "b": "<div class=\"kv\"><span>Kategoria</span> ESI 1</div><div class=\"kv\"><span>Pierwszy kontakt z lekarzem</span> natychmiastowy kontakt z lekarzem</div><div class=\"kv\"><span>Kto to jest</span> stan zagrożenia życia – potrzebna natychmiastowa interwencja (NZK, anafilaksja, drgawki, hipoglikemia z zaburzeniami świadomości)</div>"}, {"c": 6, "x": "SOR – kolory segregacji", "k": "Kolor na SOR", "f": "Kolor pomarańczowy na SOR", "b": "<div class=\"kv\"><span>Kategoria</span> ESI 2</div><div class=\"kv\"><span>Pierwszy kontakt z lekarzem</span> do 10 minut</div><div class=\"kv\"><span>Kto to jest</span> wysokie ryzyko, nowe splątanie, silny ból NRS ≥ 7 (OZW, udar, sepsa, gorączka u noworodka)</div>"}, {"c": 6, "x": "SOR – kolory segregacji", "k": "Kolor na SOR", "f": "Kolor żółty na SOR", "b": "<div class=\"kv\"><span>Kategoria</span> ESI 3</div><div class=\"kv\"><span>Pierwszy kontakt z lekarzem</span> do 60 minut</div><div class=\"kv\"><span>Kto to jest</span> stabilny, potrzebuje ≥ 2 grup zasobów (np. laboratorium + TK)</div>"}, {"c": 6, "x": "SOR – kolory segregacji", "k": "Kolor na SOR", "f": "Kolor zielony na SOR", "b": "<div class=\"kv\"><span>Kategoria</span> ESI 4</div><div class=\"kv\"><span>Pierwszy kontakt z lekarzem</span> do 120 minut</div><div class=\"kv\"><span>Kto to jest</span> stabilny, 1 grupa zasobów (np. tylko RTG albo szycie rany); może być skierowany do POZ/NiŚOZ</div>"}, {"c": 6, "x": "SOR – kolory segregacji", "k": "Kolor na SOR", "f": "Kolor niebieski na SOR", "b": "<div class=\"kv\"><span>Kategoria</span> ESI 5</div><div class=\"kv\"><span>Pierwszy kontakt z lekarzem</span> do 240 minut</div><div class=\"kv\"><span>Kto to jest</span> stabilny, bez zasobów (np. recepta, ból gardła); może być skierowany do POZ/NiŚOZ</div>"}, {"c": 6, "x": "SOR – kolory segregacji", "k": "Kolor na SOR", "f": "Kolejność kolorów na SOR – od najmniej pilnego", "b": "<div style=\"display:flex;justify-content:space-between;background:#1976d2;color:#fff;border-radius:7px;padding:5px 10px;margin:3px 0;font-weight:700\"><span>NIEBIESKI</span><span style=\"font-weight:500\">do 240 min</span></div><div style=\"display:flex;justify-content:space-between;background:#2e7d32;color:#fff;border-radius:7px;padding:5px 10px;margin:3px 0;font-weight:700\"><span>ZIELONY</span><span style=\"font-weight:500\">do 120 min</span></div><div style=\"display:flex;justify-content:space-between;background:#fbc02d;color:#222;border-radius:7px;padding:5px 10px;margin:3px 0;font-weight:700\"><span>ŻÓŁTY</span><span style=\"font-weight:500\">do 60 min</span></div><div style=\"display:flex;justify-content:space-between;background:#f57c00;color:#fff;border-radius:7px;padding:5px 10px;margin:3px 0;font-weight:700\"><span>POMARAŃCZOWY</span><span style=\"font-weight:500\">do 10 min</span></div><div style=\"display:flex;justify-content:space-between;background:#d32f2f;color:#fff;border-radius:7px;padding:5px 10px;margin:3px 0;font-weight:700\"><span>CZERWONY</span><span style=\"font-weight:500\">natychmiast</span></div><div class=\"mut\" style=\"font-size:12px\">⬆ najmniej pilny … ⬇ najbardziej pilny</div><p>niebieski (ESI 5) → zielony (ESI 4) → żółty (ESI 3) → pomarańczowy (ESI 2) → czerwony (ESI 1)</p>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Triada Becka", "b": "<div class=\"kv\"><span>Objawy</span> hipotensja, poszerzone żyły szyjne, ściszone (ciche) tony serca</div><div class=\"kv\"><span>Co oznacza</span> tamponada serca – krew w osierdziu uciska serce (wystarczy 100–150 ml)</div><div class=\"kv\"><span>Dodatkowo</span> tachykardia, tętno paradoksalne (spadek SBP &gt; 10 mmHg na wdechu), niski woltaż w EKG, PEA; brak reakcji na płyny</div><div class=\"kv\"><span>Co robisz</span> szybki transport do ośrodka z kardiochirurgią; płyny tylko dla utrzymania ciśnienia; odbarczenie (perikardiocenteza) – lekarz/szpital</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Triada Cushinga", "b": "<div class=\"kv\"><span>Objawy</span> nadciśnienie (z dużą amplitudą), bradykardia, nieregularny oddech</div><div class=\"kv\"><span>Co oznacza</span> wzrost ciśnienia śródczaszkowego, wklinowanie – stan bezpośredniego zagrożenia życia</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Śmiertelna triada urazowa", "b": "<div class=\"kv\"><span>Objawy</span> hipotermia, kwasica, koagulopatia (obecnie dodaje się hipokalcemię – „śmiertelny diament”)</div><div class=\"kv\"><span>Co robisz</span> chroń przed wychłodzeniem, tamuj krwotok, ogranicz płyny (SBP 80–90), kwas traneksamowy do 3 h</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Triada opioidowa", "b": "<div class=\"kv\"><span>Objawy</span> śpiączka, szpilkowate źrenice, depresja oddechowa (bradypnoë)</div><div class=\"kv\"><span>Co robisz</span> wentylacja workiem z tlenem, potem nalokson miareczkowany</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Triada Virchowa", "b": "<div class=\"kv\"><span>Objawy</span> zastój krwi, uszkodzenie śródbłonka, nadkrzepliwość</div><div class=\"kv\"><span>Co oznacza</span> czynniki zakrzepicy (ZŻG, zatorowość płucna) – np. unieruchomienie, operacja, ciąża, nowotwór, antykoncepcja</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Triada Charcota", "b": "<div class=\"kv\"><span>Objawy</span> gorączka z dreszczami, żółtaczka, ból w prawym podżebrzu</div><div class=\"kv\"><span>Co oznacza</span> ostre zapalenie dróg żółciowych – ryzyko sepsy</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Triada Hornera", "b": "<div class=\"kv\"><span>Objawy</span> opadnięcie powieki, zwężenie źrenicy, brak potu po tej samej stronie twarzy</div><div class=\"kv\"><span>Co oznacza</span> uszkodzenie drogi współczulnej – np. rozwarstwienie tętnicy szyjnej, guz szczytu płuca</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Pęknięty tętniak aorty brzusznej – triada", "b": "<div class=\"kv\"><span>Objawy</span> nagły ból brzucha/pleców, hipotensja (wstrząs), tętniący opór w brzuchu</div><div class=\"kv\"><span>Co robisz</span> szybki transport do chirurgii naczyniowej, hipotensja permisywna, nie przewracaj pacjenta niepotrzebnie</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Ciąża pozamaciczna – triada", "b": "<div class=\"kv\"><span>Objawy</span> ból podbrzusza, krwawienie z dróg rodnych, zatrzymanie miesiączki</div><div class=\"kv\"><span>Uwaga</span> u każdej kobiety w wieku rozrodczym z bólem brzucha i wstrząsem myśl o pękniętej ciąży pozamacicznej</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Zapalenie opon – triada", "b": "<div class=\"kv\"><span>Objawy</span> gorączka, sztywność karku, zaburzenia świadomości (często też ból głowy, światłowstręt, wybroczyny)</div>"}, {"c": 6, "x": "Triady do zapamiętania", "k": "Triady do zapamiętania", "f": "Triada Whipple’a", "b": "<div class=\"kv\"><span>Objawy</span> objawy hipoglikemii, niska glikemia w pomiarze, ustąpienie objawów po podaniu glukozy</div><div class=\"kv\"><span>Co oznacza</span> potwierdza, że objawy wynikały z hipoglikemii</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "Co to jest „śmiertelna dwunastka”", "b": "<div class=\"kv\"><span>Podział</span> 6 obrażeń natychmiast zagrażających życiu – szukasz i leczysz w badaniu wstępnym (ABC) + 6 obrażeń ukrytych – podejrzewasz z mechanizmu urazu i badania szczegółowego</div><div class=\"kv\"><span>Jak zapamiętać</span>„6 widocznych zabija w minutach, 6 ukrytych w godzinach”</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "1. Niedrożność dróg oddechowych", "b": "<div class=\"kv\"><span>Rozpoznanie</span> chrapanie, stridor, brak przepływu powietrza, uraz twarzy/krtani</div><div class=\"kv\"><span>Postępowanie</span> udrożnienie z ochroną kręgosłupa, odessanie, rurki, SGA/intubacja</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "2. Odma prężna", "b": "<div class=\"kv\"><span>Rozpoznanie</span> duszność, brak szmeru, bębenek, poszerzone żyły szyjne, wstrząs, przesunięcie tchawicy (późno)</div><div class=\"kv\"><span>Postępowanie</span> natychmiastowe odbarczenie igłą: IV–V przestrzeń międzyżebrowa, linia pachowa przednia/środkowa</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "3. Odma otwarta", "b": "<div class=\"kv\"><span>Rozpoznanie</span> rana klatki piersiowej „ssąca” powietrze, pienista krew</div><div class=\"kv\"><span>Postępowanie</span> opatrunek wentylowy (z zastawką), obserwacja w kierunku odmy prężnej</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "4. Wiotka klatka piersiowa", "b": "<div class=\"kv\"><span>Rozpoznanie</span> złamania ≥ 2 sąsiednich żeber w ≥ 2 miejscach, ruch paradoksalny fragmentu</div><div class=\"kv\"><span>Postępowanie</span> tlen, leczenie bólu, wsparcie wentylacji (CPAP/wentylacja dodatnim ciśnieniem); groźne jest stłuczenie płuca pod spodem</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "5. Masywny krwiak opłucnej", "b": "<div class=\"kv\"><span>Rozpoznanie</span> wstrząs + brak szmeru i stłumienie odgłosu opukowego (&gt; 1500 ml krwi w opłucnej)</div><div class=\"kv\"><span>Postępowanie</span> tlen, ograniczone płyny, kwas traneksamowy, szybki transport do torakochirurgii</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "6. Tamponada serca", "b": "<div class=\"kv\"><span>Rozpoznanie</span> triada Becka: hipotensja, poszerzone żyły szyjne, ciche tony serca; PEA</div><div class=\"kv\"><span>Postępowanie</span> szybki transport do kardiochirurgii, płyny dla utrzymania ciśnienia; perikardiocenteza</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "7. Urazowe pęknięcie aorty (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać</span> gwałtowne hamowanie (wypadek przy dużej prędkości, upadek z wysokości), ból między łopatkami, różnica ciśnień na kończynach</div><div class=\"kv\"><span>Postępowanie</span> kontrola ciśnienia (unikaj nadciśnienia), szybki transport</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "8. Uraz tchawicy lub oskrzela (ukryty)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać</span> odma podskórna, krwioplucie, odma nieustępująca po odbarczeniu</div><div class=\"kv\"><span>Postępowanie</span> zabezpieczenie dróg oddechowych, szybki transport</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "9. Stłuczenie serca (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać</span> uderzenie w mostek (kierownica), zaburzenia rytmu, zmiany w EKG</div><div class=\"kv\"><span>Postępowanie</span> monitorowanie EKG, leczenie arytmii</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "10. Pęknięcie przepony (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać</span> uraz brzucha/dołu klatki, częściej po lewej; perystaltyka słyszalna nad klatką</div><div class=\"kv\"><span>Postępowanie</span> tlen, transport; nie zakładaj zgłębnika na siłę</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "11. Pęknięcie przełyku (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać</span> uraz penetrujący, silny ból za mostkiem, odma śródpiersia, odma podskórna</div><div class=\"kv\"><span>Postępowanie</span> nic doustnie, transport</div>"}, {"c": 6, "x": "Śmiertelna dwunastka – urazy klatki piersiowej", "k": "Śmiertelna dwunastka – urazy klatki piersiowej", "f": "12. Stłuczenie płuca (ukryte)", "b": "<div class=\"kv\"><span>Kiedy podejrzewać</span> silny uraz klatki, złamania żeber, narastająca hipoksja (szczyt po kilkunastu godzinach)</div><div class=\"kv\"><span>Postępowanie</span> tlen, ostrożnie z płynami, wsparcie wentylacji</div>"}, {"c": 6, "x": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "4H i 4T – odwracalne przyczyny NZK", "b": "<div class=\"kv\"><span>4H</span> hipoksja, hipowolemia, hipo-/hiperkaliemia i inne zaburzenia metaboliczne, hipotermia/hipertermia</div><div class=\"kv\"><span>4T</span> tamponada, odma prężna (tension), toksyny, zakrzepica (wieńcowa lub płucna – thrombosis)</div><div class=\"kv\"><span>Zapamiętaj</span> szukaj ich w każdym NZK, szczególnie w PEA i asystolii – leczysz przyczynę, nie tylko rytm</div>"}, {"c": 6, "x": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "DOPE – nagłe pogorszenie u zaintubowanego", "b": "<div class=\"kv\"><span>Co sprawdzasz</span> D – przemieszczenie rurki (Displacement); O – niedrożność (Obstruction: wydzielina, zagięcie); P – odma (Pneumothorax); E – sprzęt (Equipment: tlen, respirator, worek)</div><div class=\"kv\"><span>Co robisz</span> odłącz respirator, wentyluj workiem, sprawdź kapnografię i osłuchaj klatkę</div>"}, {"c": 6, "x": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "NEXUS – kiedy stabilizować kręgosłup szyjny", "b": "<div class=\"kv\"><span>Stabilizuj, jeśli jest choć jedno</span> tkliwość w linii środkowej karku, zaburzenia świadomości, intoksykacja (alkohol, leki), deficyt neurologiczny, bolesny uraz odwracający uwagę</div><div class=\"kv\"><span>Uwaga</span> starsi (&gt; 65 lat) i mechanizm wysokoenergetyczny – niski próg stabilizacji</div>"}, {"c": 6, "x": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "Skala Apgar (noworodek, 1. i 5. minuta)", "b": "<div class=\"kv\"><span>A – wygląd (kolor skóry)</span> 0 sinica/bladość całego ciała · 1 sinica rąk i stóp · 2 różowy</div><div class=\"kv\"><span>P – tętno</span> 0 brak · 1 &lt; 100/min · 2 &gt; 100/min</div><div class=\"kv\"><span>G – grymas (reakcja na bodźce)</span> 0 brak · 1 grymas · 2 płacz, kichanie</div><div class=\"kv\"><span>A – napięcie mięśni</span> 0 wiotki · 1 słabe zgięcie kończyn · 2 ruchy czynne</div><div class=\"kv\"><span>R – oddech</span> 0 brak · 1 słaby, nieregularny · 2 dobry, głośny płacz</div><div class=\"kv\"><span>Wynik</span> 8–10 dobry · 4–7 średni · 0–3 ciężki; resuscytacji nie opóźniasz do oceny Apgar</div>"}, {"c": 6, "x": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "Klasy wstrząsu krwotocznego (ATLS)", "b": "<div class=\"kv\"><span>I – utrata &lt; 15% (&lt; 750 ml)</span> HR &lt; 100, ciśnienie prawidłowe, pacjent lekko niespokojny</div><div class=\"kv\"><span>II – 15–30% (750–1500 ml)</span> HR 100–120, ciśnienie skurczowe prawidłowe, mała amplituda, niepokój</div><div class=\"kv\"><span>III – 30–40% (1500–2000 ml)</span> HR 120–140, spadek ciśnienia, splątanie, skąpomocz – potrzebna krew</div><div class=\"kv\"><span>IV – &gt; 40% (&gt; 2000 ml)</span> HR &gt; 140, bardzo niskie ciśnienie, letarg – bezpośrednie zagrożenie życia</div>"}, {"c": 6, "x": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "5 P – ostre niedokrwienie kończyny", "b": "<div class=\"kv\"><span>Objawy</span> Pain – ból · Pallor – bladość · Pulselessness – brak tętna · Paresthesia – zaburzenia czucia · Paralysis – porażenie (+ Poikilothermia – zimna kończyna)</div><div class=\"kv\"><span>Co oznacza</span> zator lub uraz tętnicy, zespół ciasnoty przedziałów – pilnie do chirurgii naczyniowej</div>"}, {"c": 6, "x": "Mnemotechniki i skale", "k": "Mnemotechniki i skale", "f": "Rodzaje wstrząsu – 4 typy", "b": "<div class=\"kv\"><span>Hipowolemiczny</span> utrata krwi lub płynów – zapadnięte żyły szyjne, zimna skóra</div><div class=\"kv\"><span>Dystrybucyjny</span> sepsa, anafilaksja, wstrząs neurogenny – często ciepła skóra</div><div class=\"kv\"><span>Kardiogenny</span> zawał, arytmia – zastój w płucach, poszerzone żyły szyjne</div><div class=\"kv\"><span>Obturacyjny</span> odma prężna, tamponada, zatorowość płucna – poszerzone żyły szyjne, przyczyna mechaniczna do usunięcia</div>"}, {"c": 6, "x": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Co to jest eFAST", "b": "<div class=\"kv\"><span>Nazwa</span> extended Focused Assessment with Sonography for Trauma – szybkie przyłóżkowe USG u pacjenta urazowego</div><div class=\"kv\"><span>Czego szukasz</span> 1) wolnego płynu (krwi) w jamie brzusznej, 2) płynu w osierdziu (tamponada), 3) krwi w opłucnej, 4) odmy opłucnowej</div><div class=\"kv\"><span>Zapamiętaj</span> krew i płyn w USG są CZARNE (bezechowe); badanie trwa 2–3 min i nie może opóźniać transportu</div>"}, {"c": 6, "x": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okno 1 – prawe podżebrze (zachyłek Morisona)", "b": "<div class=\"kv\"><span>Gdzie głowica</span> prawa linia pachowa środkowa/tylna, ok. VIII–XI przestrzeń międzyżebrowa</div><div class=\"kv\"><span>Co oglądasz</span> przestrzeń między wątrobą a prawą nerką</div><div class=\"kv\"><span>Zapamiętaj</span> najczulsze miejsce – krew w brzuchu zbiera się tu najwcześniej (pacjent na plecach); przesuń głowicę wyżej nad przeponę → krew w prawej opłucnej</div>"}, {"c": 6, "x": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okno 2 – lewe podżebrze (śledziona–nerka)", "b": "<div class=\"kv\"><span>Gdzie głowica</span> lewa linia pachowa tylna, wyżej i bardziej z tyłu niż po prawej („knuckles to the bed” – kłykcie przy łóżku)</div><div class=\"kv\"><span>Co oglądasz</span> przestrzeń między śledzioną a lewą nerką i pod przeponą</div><div class=\"kv\"><span>Zapamiętaj</span> nad przeponą sprawdź lewą opłucną</div>"}, {"c": 6, "x": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okno 3 – nad spojeniem łonowym (miednica)", "b": "<div class=\"kv\"><span>Gdzie głowica</span> tuż nad spojeniem łonowym, przekrój poprzeczny i podłużny</div><div class=\"kv\"><span>Co oglądasz</span> za pęcherzem moczowym: zagłębienie odbytniczo-maciczne (Douglasa) u kobiet, odbytniczo-pęcherzowe u mężczyzn</div><div class=\"kv\"><span>Zapamiętaj</span> najlepiej przy pełnym pęcherzu – nie cewnikuj przed badaniem</div>"}, {"c": 6, "x": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okno 4 – podmostkowe (serce)", "b": "<div class=\"kv\"><span>Gdzie głowica</span> pod wyrostkiem mieczykowatym, skierowana do lewego barku</div><div class=\"kv\"><span>Co oglądasz</span> osierdzie – czarny pasek płynu wokół serca</div><div class=\"kv\"><span>Znaczenie</span> płyn + wstrząs + poszerzone żyły szyjne = tamponada (triada Becka) – pilnie do kardiochirurgii; gdy okno podmostkowe niedostępne – okno przymostkowe</div>"}, {"c": 6, "x": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Okna 5–6 – przód klatki piersiowej (odma)", "b": "<div class=\"kv\"><span>Gdzie głowica</span> obustronnie II–III przestrzeń międzyżebrowa w linii środkowo-obojczykowej (najwyższy punkt u leżącego)</div><div class=\"kv\"><span>Prawidłowo</span>„ślizganie płuca” (lung sliding) – opłucna przesuwa się z oddechem; w M-mode „brzeg morza” (seashore sign); linie B</div><div class=\"kv\"><span>Odma</span> brak ślizgania i brak linii B; w M-mode „kod kreskowy” (barcode/stratosphere sign); „punkt płucny” (lung point) potwierdza odmę</div>"}, {"c": 6, "x": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Interpretacja eFAST i decyzje", "b": "<div class=\"kv\"><span>Niestabilny + płyn w brzuchu</span> krwotok do jamy brzusznej → najszybciej na blok operacyjny / do centrum urazowego</div><div class=\"kv\"><span>Płyn w osierdziu + wstrząs</span> tamponada → kardiochirurgia</div><div class=\"kv\"><span>Brak ślizgania + wstrząs</span> odma prężna → odbarczenie</div><div class=\"kv\"><span>Ograniczenia</span> ujemny wynik NIE wyklucza krwawienia (przestrzeń zaotrzewnowa, miednica, mała ilość krwi – wykrywa zwykle od ok. 200 ml w brzuchu); zależy od doświadczenia badającego; powtarzaj badanie przy pogorszeniu</div>"}, {"c": 6, "x": "eFAST – USG w urazie", "k": "eFAST – USG w urazie", "f": "Sprzęt i ułożenie", "b": "<div class=\"kv\"><span>Głowica</span> convex (brzuszna, 2–5 MHz) do brzucha i serca; liniowa (wysokiej częstotliwości) lub convex do opłucnej</div><div class=\"kv\"><span>Ułożenie</span> pacjent na plecach; lekki Trendelenburg zwiększa czułość w zachyłku Morisona, anty-Trendelenburg – w miednicy</div><div class=\"kv\"><span>W karetce</span> POCUS/eFAST wykonują głównie zespoły S i LPR; wynik przekaż szpitalowi przy zgłoszeniu pacjenta</div>"}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Anizokoria", "b": "nierówne źrenice – jedna szersza od drugiej. U nieprzytomnego po urazie głowy szersza, niereagująca źrenica zwykle jest po stronie krwiaka (ucisk nerwu III) – objaw wklinowania. Małą anizokorię (&lt; 1 mm) z prawidłową reakcją ma ok. 20% zdrowych ludzi."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Źrenice szpilkowate", "b": "bardzo wąskie źrenice – typowe po opioidach, w zatruciu związkami fosforoorganicznymi, przy krwotoku do mostu."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Stridor", "b": "świszczący, „piejący” dźwięk przy WDECHU – zwężenie górnych dróg oddechowych (krtań, tchawica): obrzęk, krup, ciało obce. Stan pilny."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Świsty", "b": "gwiżdżący dźwięk przy WYDECHU – zwężenie oskrzeli (astma, POChP, anafilaksja)."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Rzężenia", "b": "trzeszczące, bulgoczące dźwięki nad płucami – płyn w pęcherzykach (obrzęk płuc, zapalenie płuc)."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Cicha klatka piersiowa", "b": "w ciężkiej astmie brak świstów i prawie brak szmeru – powietrze prawie nie przepływa. Objaw zagrożenia życia, nie poprawy."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Odgłos bębenkowy", "b": "przy opukiwaniu klatki dźwięk głośny i „pusty” jak bęben – powietrze w opłucnej (odma). Stłumienie = płyn lub krew."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Odma podskórna", "b": "powietrze pod skórą – przy dotyku trzeszczy jak śnieg. Po urazie klatki: złamane żebra, odma, uraz tchawicy/oskrzela."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Poszerzone żyły szyjne", "b": "nabrzmiałe żyły na szyi u siedzącego/półsiedzącego pacjenta – krew „nie może” wrócić do serca: odma prężna, tamponada, niewydolność prawej komory, zatorowość płucna."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Nawrót kapilarny", "b": "po uciśnięciu paznokcia lub mostka przez 5 s mierzysz, ile trwa powrót koloru. Norma &lt; 2 s; dłużej = słabe krążenie obwodowe (wstrząs, wychłodzenie)."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Tętno paradoksalne", "b": "spadek ciśnienia skurczowego o &gt; 10 mmHg przy wdechu (tętno słabnie na wdechu) – tamponada, ciężka astma."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Ruch paradoksalny klatki", "b": "fragment klatki zapada się przy wdechu i uwypukla przy wydechu – wiotka klatka piersiowa (złamania żeber w kilku miejscach)."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Sinica", "b": "niebieskie zabarwienie skóry i warg – za mało tlenu we krwi. Centralna (usta, język) = poważna hipoksja."}, {"c": 6, "x": "Słowniczek – Objawy i badanie", "k": "Pojęcie", "f": "Niepamięć wsteczna", "b": "pacjent nie pamięta zdarzenia lub chwil przed nim – objaw urazu mózgu (wstrząśnienie, krwiak)."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Tamponada serca", "b": "krew lub płyn w worku osierdziowym uciska serce, które nie może się wypełnić – spada ciśnienie. Objawy: triada Becka (hipotensja, poszerzone żyły szyjne, ciche tony serca). Leczenie: odbarczenie osierdzia w szpitalu."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Odma prężna", "b": "powietrze wchodzi do opłucnej i nie może wyjść, ciśnienie rośnie, płuco się zapada, śródpiersie przesuwa się i zgina żyły – wstrząs. Leczenie: natychmiastowe odbarczenie igłą."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Wklinowanie", "b": "mózg (przez obrzęk lub krwiak) przemieszcza się i uciska pień mózgu. Objawy: spadek GCS, anizokoria, triada Cushinga. Stan bezpośredniego zagrożenia życia."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Krwiak śródczaszkowy", "b": "krew zbierająca się w czaszce po urazie (nadtwardówkowy, podtwardówkowy) – uciska mózg. Większe ryzyko u osób na lekach przeciwkrzepliwych i starszych."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Wstrząs", "b": "niewydolność krążenia – narządy dostają za mało krwi i tlenu. Rodzaje: hipowolemiczny (utrata krwi/płynów), dystrybucyjny (sepsa, anafilaksja), kardiogenny (serce), obturacyjny (odma, tamponada, zator)."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Wstrząs obturacyjny", "b": "krążenie zablokowane mechanicznie: odma prężna, tamponada, zatorowość płucna. Płyny pomagają mało – trzeba usunąć przeszkodę."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Stan padaczkowy", "b": "drgawki trwające ≥ 5 min albo kolejne napady bez odzyskania przytomności. Leczysz od razu (midazolam)."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Depresja oddechowa", "b": "za rzadki lub za płytki oddech (np. &lt; 8/min) – po opioidach, benzodiazepinach, w urazie głowy. Leczenie: wentylacja, odtrutka."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Atonia macicy", "b": "macica po porodzie się nie obkurcza (jest miękka) i krwawi – najczęstsza przyczyna krwotoku poporodowego. Masaż macicy, TXA, transport."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Reakcja dwufazowa", "b": "w anafilaksji objawy wracają po kilku godzinach od poprawy – dlatego pacjent zostaje na obserwacji w szpitalu."}, {"c": 6, "x": "Słowniczek – Stany", "k": "Pojęcie", "f": "Zespół odstawienny", "b": "objawy po nagłym odstawieniu lub odwróceniu leku (np. po naloksonie u uzależnionego): pobudzenie, agresja, wymioty, poty."}, {"c": 6, "x": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "NZK", "b": "nagłe zatrzymanie krążenia – brak tętna i oddechu. Rytmy: do defibrylacji (VF, pVT) i niedefibrylacyjne (asystolia, PEA)."}, {"c": 6, "x": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "VF – migotanie komór", "b": "chaotyczna aktywność elektryczna komór, serce nie pompuje krwi. Na monitorze nieregularna „zygzakowata” linia. Leczenie: defibrylacja."}, {"c": 6, "x": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "VT / pVT – częstoskurcz komorowy", "b": "szybki rytm z szerokimi zespołami QRS. Z tętnem: stabilny (leki) lub niestabilny (kardiowersja). Bez tętna (pVT): jak VF – defibrylacja."}, {"c": 6, "x": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "PEA – aktywność elektryczna bez tętna", "b": "na monitorze jest rytm (np. zatokowy), ale nie ma tętna – serce nie pompuje skutecznie. Szukaj przyczyn 4H i 4T (np. tamponada, odma, krwotok)."}, {"c": 6, "x": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "Asystolia", "b": "brak aktywności elektrycznej serca – płaska linia. Sprawdź elektrody i wzmocnienie; adrenalina jak najszybciej."}, {"c": 6, "x": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "ROSC", "b": "powrót spontanicznego krążenia po resuscytacji – jest tętno i ciśnienie. Potem opieka poresuscytacyjna (ABCDE, EKG, SpO₂ 94–98%)."}, {"c": 6, "x": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "SVT – częstoskurcz nadkomorowy", "b": "szybki (często 180–220/min), miarowy rytm z wąskimi QRS, zwykle u młodych. Leczenie: manewr Valsalvy, adenozyna."}, {"c": 6, "x": "Słowniczek – Rytmy serca", "k": "Pojęcie", "f": "WPW (preekscytacja)", "b": "dodatkowa droga przewodzenia w sercu; w EKG krótkie PQ i fala delta. Przy migotaniu przedsionków z WPW nie podaje się adenozyny ani leków blokujących węzeł AV."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Defibrylacja", "b": "wyładowanie elektryczne NIEsynchronizowane – w NZK (VF, pVT). Natychmiast, bez sedacji."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Kardiowersja", "b": "wyładowanie elektryczne ZSYNCHRONIZOWANE z zespołem QRS – u pacjenta z tętnem, ale niestabilnego (częstoskurcz ze wstrząsem). Wymaga sedacji."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Manewr Valsalvy (zmodyfikowany)", "b": "pacjent mocno pręży (np. dmucha w strzykawkę 10 ml przez 15 s), potem od razu kładzie się z uniesionymi nogami. Pobudza nerw błędny i może przerwać SVT."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Odbarczenie odmy igłą", "b": "wkłucie grubej kaniuli (14G, 5–8 cm) w IV–V przestrzeni międzyżebrowej w linii pachowej przedniej/środkowej, żeby wypuścić powietrze z opłucnej."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Perikardiocenteza", "b": "nakłucie worka osierdziowego, żeby usunąć krew/płyn przy tamponadzie – w szpitalu (lekarz)."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Hipotensja permisywna", "b": "w krwotoku (bez urazu głowy) nie podnosisz ciśnienia do normy – celujesz w SBP 80–90 mmHg, żeby nie rozpuścić skrzepu i nie rozcieńczyć krwi."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Miareczkowanie", "b": "podawanie leku małymi dawkami i ocena efektu po każdej (np. nalokson, morfina), aż do uzyskania celu – zamiast jednej dużej dawki."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Bolus / wlew", "b": "bolus – szybkie podanie dawki naraz; wlew – powolne podawanie przez pompę lub kroplówkę w określonym czasie."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "Dostęp doszpikowy (i.o.)", "b": "igła wkłuta w kość (np. piszczel, ramię), gdy nie da się założyć wkłucia dożylnego. Podajesz te same leki i płyny co dożylnie."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "SGA", "b": "nadgłośniowe urządzenie do udrażniania dróg oddechowych (np. i-gel) – zakładane „na ślepo” do gardła, alternatywa dla intubacji."}, {"c": 6, "x": "Słowniczek – Procedury", "k": "Pojęcie", "f": "EtCO₂ (kapnografia)", "b": "stężenie CO₂ w wydychanym powietrzu; norma 35–45 mmHg. Potwierdza położenie rurki, ocenia jakość RKO i powrót krążenia (nagły wzrost)."}, {"c": 6, "x": "Słowniczek – Leki i przekazanie", "k": "Pojęcie", "f": "NOAC / apiksaban", "b": "nowe doustne leki przeciwkrzepliwe (apiksaban, rywaroksaban, dabigatran). U pacjenta po urazie głowy = wysokie ryzyko krwawienia do mózgu."}, {"c": 6, "x": "Słowniczek – Leki i przekazanie", "k": "Pojęcie", "f": "Pochodne sulfonylomocznika", "b": "doustne leki na cukrzycę (np. glimepiryd, gliklazyd) – mogą dawać długą, nawracającą hipoglikemię."}, {"c": 6, "x": "Słowniczek – Leki i przekazanie", "k": "Pojęcie", "f": "TXA – kwas traneksamowy", "b": "lek hamujący rozpuszczanie skrzepu; w urazie 1 g i.v. do 3 h od zdarzenia."}, {"c": 6, "x": "Słowniczek – Leki i przekazanie", "k": "Pojęcie", "f": "ATMIST / SBAR", "b": "schematy przekazania pacjenta: ATMIST w urazie (wiek, czas, mechanizm, obrażenia, objawy, leczenie), SBAR w chorobie (sytuacja, tło, ocena, rekomendacja)."}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Cullena", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> sine zasinienie skóry WOKÓŁ PĘPKA</div><div class=\"kv\"><span>Co oznacza</span> krew w jamie brzusznej lub za otrzewną: ciężkie (krwotoczne) zapalenie trzustki, pęknięta ciąża pozamaciczna, uraz. Pojawia się po 24–48 h</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Greya Turnera", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> sine zasinienie BOKÓW brzucha / okolic lędźwiowych</div><div class=\"kv\"><span>Co oznacza</span> krwawienie zaotrzewnowe: ciężkie zapalenie trzustki, pęknięty tętniak aorty brzusznej, uraz nerki</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw pasa bezpieczeństwa", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> pręga/otarcie w miejscu pasa na brzuchu lub klatce po wypadku</div><div class=\"kv\"><span>Co oznacza</span> duża siła urazu – podejrzewaj uszkodzenie jelit, krezki, trzustki, złamanie kręgosłupa lędźwiowego; nawet jeśli pacjent czuje się dobrze → szpital</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Obrona mięśniowa („deska brzuszna”)", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> brzuch twardy jak deska, pacjent napina mięśnie przy dotyku</div><div class=\"kv\"><span>Co oznacza</span> zapalenie otrzewnej (perforacja wrzodu, pęknięty wyrostek) – stan chirurgiczny</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Blumberga", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> powoli uciskasz brzuch i NAGLE odrywasz rękę – ból silniejszy przy oderwaniu</div><div class=\"kv\"><span>Co oznacza</span> podrażnienie otrzewnej (najczęściej zapalenie wyrostka)</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Punkt McBurneya", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> ból przy ucisku w 1/3 odległości od kolca biodrowego przedniego górnego do pępka (prawy dół biodrowy)</div><div class=\"kv\"><span>Co oznacza</span> zapalenie wyrostka robaczkowego</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Rovsinga", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> ucisk LEWEGO dołu biodrowego wywołuje ból w PRAWYM</div><div class=\"kv\"><span>Co oznacza</span> zapalenie wyrostka robaczkowego</div>"}, {"c": 6, "x": "Objawy z nazwiskami – Brzuch", "k": "Objaw", "f": "Objaw Jaworskiego / lędźwiowy (psoas)", "b": "<div class=\"kv\"><span>Jak wygląda / jak badać</span> ból w prawym dole biodrowym przy unoszeniu wyprostowanej prawej nogi przeciw oporowi (lub przy jej opu
