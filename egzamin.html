ipotensja, poszerzone żyły szyjne i ściszone tony serca. Do tego hipotensja, która nie odpowiada na płyny, i niski woltaż w EKG. Już 100–150 ml krwi w worku osierdziowym daje tamponadę. Leczy się ją przez odbarczenie (perikardiocentezę albo torakotomię).", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Gdzie najczęściej pęka aorta w urazie deceleracyjnym (np. zderzenie czołowe)?", "o": ["W cieśni aorty, tuż za odejściem lewej tętnicy podobojczykowej", "W opuszce aorty", "W aorcie brzusznej poniżej tętnic nerkowych", "W tętnicy szyjnej"], "a": 0, "e": "Około 90% urazowych uszkodzeń aorty piersiowej dotyczy cieśni, przy więzadle tętniczym. 85% takich ofiar ginie na miejscu, a przeżywają ci, których szybko operuje się w ośrodku kardiochirurgicznym.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Po wypadku pacjent ma inne ciśnienie na rękach niż na nogach (wyższe na kończynach górnych), ból między łopatkami i duszność. Co podejrzewasz?", "o": ["Urazowe uszkodzenie aorty piersiowej", "Złamanie obojczyka", "Odmę płaszczową", "Stłuczenie mostka bez powikłań"], "a": 0, "e": "Różnica ciśnień między kończynami, ból międzyłopatkowy, szmer nad sercem albo w dole nadobojczykowym i osłabione tętno na udowych sugerują uszkodzenie aorty. Zwykle nie występują wszystkie objawy naraz.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Uderzenie klatką w kierownicę: ból przedsercowy, który nie ustępuje po nitroglicerynie i nie zależy od oddechu, a w EKG pojawiają się nowe arytmie. Co podejrzewasz?", "o": ["Stłuczenie serca", "Zawał bez związku z urazem", "Złamanie łopatki", "Odmę śródpiersia"], "a": 0, "e": "Stłuczenie serca daje zaburzenia rytmu i przewodzenia, zmiany ST-T i wzrost troponiny. Taki pacjent wymaga monitorowania EKG w transporcie.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Rozległa rozedma podskórna na szyi, chrypka, krwioplucie i odma, która nie znika mimo prawidłowo założonego drenu. Co podejrzewasz?", "o": ["Uszkodzenie tchawicy lub dużego oskrzela", "Stłuczenie płuca", "Złamanie żebra", "Tamponadę"], "a": 0, "e": "Przeciek powietrza, którego drenaż nie opanowuje, jest typowy dla rozerwania tchawicy albo oskrzela. Rozpoznaje się je w bronchofiberoskopii i leczy torakochirurgicznie.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Kiedy stan pacjenta ze stłuczeniem płuca najczęściej się pogarsza?", "o": ["Między 2. a 3. dobą od urazu", "W pierwszej minucie", "Po miesiącu", "Nigdy się nie pogarsza"], "a": 0, "e": "Stłuczenie płuca narasta w czasie: obrzęk i wylewy pogarszają wymianę gazową. Pacjent z prawidłową saturacją na miejscu zdarzenia może się później dekompensować. W leczeniu ogranicza się nadmiar płynów.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Po urazie brzucha i klatki piersiowej słyszysz nad lewą połową klatki szmery perystaltyki, a szmer oddechowy jest tam osłabiony. Co podejrzewasz?", "o": ["Urazowe rozerwanie przepony z przemieszczeniem jelit do klatki", "Odmę prężną", "Krwiak opłucnej", "Złamanie mostka"], "a": 0, "e": "Przepona częściej pęka po lewej stronie. Narządy jamy brzusznej przemieszczają się do klatki piersiowej, co powoduje niewydolność oddechową i przesunięcie śródpiersia. Leczenie jest operacyjne.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Złamanie mostka w wypadku samochodowym (pasy) jest ważne, ponieważ:", "o": ["Świadczy o dużej energii urazu i może mu towarzyszyć stłuczenie serca", "Zawsze jest izolowanym, niegroźnym urazem", "Wymaga natychmiastowego nastawienia na miejscu zdarzenia", "Występuje tylko u dzieci"], "a": 0, "e": "Około 20% złamań mostka przebiega ze stłuczeniem serca. Mogą też towarzyszyć krwiak zamostkowy i uszkodzenia dużych naczyń, dlatego takiego pacjenta monitorujesz w EKG.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Tylne zwichnięcie w stawie mostkowo-obojczykowym jest groźne, ponieważ:", "o": ["Koniec obojczyka może uciskać tchawicę i duże żyły", "Zawsze kończy się złamaniem żeber", "Nie daje żadnych objawów", "Wymaga tylko temblaka"], "a": 0, "e": "Przednie zwichnięcie leczy się zachowawczo. Tylne zwichnięcie może ucisnąć tchawicę albo naczynia ramienno-głowowe i wymaga pilnej interwencji. Obserwuj u takiego pacjenta oddech i krążenie.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Złamany obojczyk u motocyklisty. Co oceniasz poza samym złamaniem?", "o": ["Osłuchujesz obie strony klatki, badasz tętno na tętnicy promieniowej i czucie w palcach", "Nic, to drobny uraz", "Tylko robisz zdjęcie telefonem", "Od razu nastawiasz złamanie"], "a": 0, "e": "Złamanie obojczyka może się powikłać odmą, krwiakiem opłucnej oraz uszkodzeniem splotu ramiennego albo naczyń podobojczykowych. Dlatego sprawdzasz oddech, tętno, ruch i czucie na obwodzie.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Urazy klatki piersiowej", "q": "Ile pękniętych żeber jest według wykładu wskazaniem do leczenia w ośrodku z torakochirurgią?", "o": ["Trzy lub więcej", "Jedno", "Tylko przy wiotkiej klatce", "Nigdy"], "a": 0, "e": "Złamanie 3 lub więcej żeber zwiększa ryzyko uszkodzenia narządów klatki piersiowej. U osób starszych i chorujących na płuca groźne może być nawet jedno złamane żebro, bo przez ból hipowentylują, a to prowadzi do niedodmy i zapalenia płuc.", "g": "klp", "sec": "Urazy klatki piersiowej"}, {"s": "Krwotok", "q": "Czym różni się krwotok od krwawienia?", "o": ["Krwotok to duża, szybka utrata krwi zagrażająca krążeniu, krwawienie to mniejszy, wolniejszy wypływ", "Krwotok dotyczy tylko tętnic, krwawienie tylko żył", "Krwotok jest zawsze zewnętrzny, krwawienie zawsze wewnętrzne", "To synonimy, nie ma różnicy"], "a": 0, "e": "O krwotoku decyduje ilość i tempo utraty krwi, które grożą wstrząsem. Krwotok może być zewnętrzny albo wewnętrzny, tętniczy, żylny lub miąższowy.", "g": "pat", "sec": "Choroby wewnętrzne: Krwotok"}, {"s": "Krwotok", "q": "Pacjent po urazie uda ma pulsujący, jasnoczerwony wypływ krwi. Co robisz najpierw?", "o": ["Bezpośredni ucisk rany, a gdy nie wystarcza – opaska uciskowa powyżej rany", "Najpierw zakładasz dostęp dożylny i podajesz płyny", "Unosisz kończynę i czekasz na zatrzymanie krwawienia", "Podajesz kwas traneksamowy i obserwujesz"], "a": 0, "e": "Masywny krwotok zewnętrzny tamujesz przed wszystkim innym (schemat cABCDE: krwotok przed drogami oddechowymi). Kwas traneksamowy i płyny są dodatkiem, nie zamiast ucisku.", "g": "pat", "sec": "Choroby wewnętrzne: Krwotok"}, {"s": "Przekrwienie", "q": "Czym jest przekrwienie bierne (żylne)?", "o": ["Zastój krwi w narządzie z powodu utrudnionego odpływu żylnego", "Zwiększony napływ krwi tętniczej, np. w zapaleniu", "Wypływ krwi poza naczynia", "Zamknięcie światła tętnicy przez skrzeplinę"], "a": 0, "e": "Przekrwienie czynne to większy napływ krwi tętniczej (zaczerwienienie, ciepło). Bierne to zastój żylny, np. płuca w niewydolności lewokomorowej albo wątroba w prawokomorowej.", "g": "pat", "sec": "Choroby wewnętrzne: Przekrwienie"}, {"s": "Przekrwienie", "q": "Niewydolność prawej komory serca daje przewlekłe przekrwienie bierne. Który narząd typowo jest wtedy powiększony i bolesny?", "o": ["Wątroba", "Płuca", "Nerka lewa", "Śledziona jako jedyny narząd"], "a": 0, "e": "Zastój w żyle głównej dolnej powiększa wątrobę (tzw. wątroba muszkatołowa), daje obrzęki kończyn dolnych i poszerzenie żył szyjnych.", "g": "pat", "sec": "Choroby wewnętrzne: Przekrwienie"}, {"s": "Zakrzepica", "q": "Triada Virchowa opisuje czynniki zakrzepicy. Co do niej należy?", "o": ["Zwolnienie przepływu krwi, uszkodzenie śródbłonka, nadkrzepliwość", "Nadciśnienie, cukrzyca, palenie tytoniu", "Gorączka, tachykardia, hipotensja", "Anemia, małopłytkowość, hipokaliemia"], "a": 0, "e": "Zastój (unieruchomienie, lot), uszkodzenie ściany naczynia (uraz, operacja) i nadkrzepliwość (ciąża, nowotwór, antykoncepcja) – to trzy elementy triady Virchowa.", "g": "pat", "sec": "Choroby wewnętrzne: Zakrzepica"}, {"s": "Zakrzepica", "q": "Kobieta po długim locie ma obrzęk i ból łydki, a nagle dostaje duszności i tachykardii. Co podejrzewasz?", "o": ["Zatorowość płucną jako powikłanie zakrzepicy żył głębokich", "Atak astmy", "Zawał prawej komory bez związku z łydką", "Odmę samoistną"], "a": 0, "e": "Zakrzepica żył głębokich kończyny dolnej + nagła duszność, tachykardia, często ból opłucnowy = zatorowość płucna. Tlen, monitorowanie, pilny transport.", "g": "pat", "sec": "Choroby wewnętrzne: Zakrzepica"}, {"s": "Miażdżyca", "q": "Co jest podstawą zmian miażdżycowych w tętnicy?", "o": ["Blaszka z lipidów i komórek zapalnych pod śródbłonkiem, zwężająca światło naczynia", "Pęknięcie ściany żyły", "Zapalenie bakteryjne zastawek serca", "Odkładanie się wapnia wyłącznie w żyłach"], "a": 0, "e": "Miażdżyca to przewlekły proces zapalny: cholesterol LDL i makrofagi tworzą blaszkę. Pęknięcie blaszki i skrzeplina na niej dają zawał lub udar.", "g": "pat", "sec": "Choroby wewnętrzne: Miażdżyca"}, {"s": "Miażdżyca", "q": "Który zestaw to modyfikowalne czynniki ryzyka miażdżycy?", "o": ["Palenie, nadciśnienie, cukrzyca, wysoki cholesterol LDL, otyłość", "Wiek, płeć męska, obciążenie rodzinne", "Grupa krwi i wzrost", "Niskie ciśnienie i niski cholesterol"], "a": 0, "e": "Wiek, płeć i geny to czynniki niemodyfikowalne. Na pozostałe pacjent ma wpływ i to one są celem profilaktyki.", "g": "pat", "sec": "Choroby wewnętrzne: Miażdżyca"}, {"s": "Choroba niedokrwienna serca", "q": "Jak opisujesz typowy ból w stabilnej dławicy piersiowej?", "o": ["Zamostkowy ucisk przy wysiłku, ustępuje w spoczynku lub po nitroglicerynie w kilka minut", "Kłujący ból nasilający się przy ucisku klatki palcem", "Ból trwający stale od kilku dni, niezależny od wysiłku", "Ból zmieniający się przy każdym oddechu"], "a": 0, "e": "Dławica stabilna: wysiłek wywołuje, odpoczynek lub nitrogliceryna znosi, zwykle w 2–5 minut. Ból w spoczynku lub dłuższy niż 20 minut to ostry zespół wieńcowy.", "g": "pat", "sec": "Choroby wewnętrzne: Choroba niedokrwienna serca"}, {"s": "Choroba niedokrwienna serca", "q": "Pacjent z chorobą wieńcową ma ból zamostkowy w spoczynku od 30 minut. Jak to traktujesz?", "o": ["Jak ostry zespół wieńcowy: EKG 12-odprowadzeniowe w ciągu 10 minut i postępowanie OZW", "Jak zaostrzenie dławicy stabilnej, wystarczy odpoczynek", "Jak nerwobóle międzyżebrowe", "Jak refluks, podajesz lek osłonowy"], "a": 0, "e": "Ból spoczynkowy lub przedłużony u chorego wieńcowego = OZW, dopóki nie wykluczysz inaczej. EKG, teletransmisja, kwas acetylosalicylowy, jeśli nie ma przeciwwskazań.", "g": "pat", "sec": "Choroby wewnętrzne: Choroba niedokrwienna serca"}, {"s": "Zawał serca", "q": "Co oznacza zawał serca?", "o": ["Martwicę mięśnia sercowego z powodu niedokrwienia", "Zapalenie osierdzia", "Przejściowe zaburzenie rytmu bez uszkodzenia", "Zwiększenie masy lewej komory"], "a": 0, "e": "Zawał to martwica komórek mięśnia sercowego wywołana niedokrwieniem, zwykle przez skrzeplinę na pękniętej blaszce miażdżycowej. Potwierdza ją wzrost troponiny.", "g": "pat", "sec": "Choroby wewnętrzne: Zawał serca"}, {"s": "Zawał serca", "q": "EKG pokazuje uniesienie ST w II, III i aVF. Pacjent ma ciśnienie 85/50 mmHg. Czego unikasz?", "o": ["Nitrogliceryny – grozi głębokim spadkiem ciśnienia, zwłaszcza przy zawale prawej komory", "Tlenu przy SpO₂ 88%", "Kwasu acetylosalicylowego", "Odprowadzeń prawokomorowych V4R"], "a": 0, "e": "Zawał ściany dolnej często obejmuje prawą komorę. Przy hipotensji nitraty są przeciwwskazane. Wykonaj V4R, a transport kieruj do pracowni hemodynamiki.", "g": "pat", "sec": "Choroby wewnętrzne: Zawał serca"}, {"s": "Niewydolność serca", "q": "Jakie objawy wskazują na ostrą niewydolność lewokomorową (obrzęk płuc)?", "o": ["Duszność w pozycji leżącej, rzężenia nad płucami, pienista plwocina, const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function cardQ(c){
 const same=DATA.cards.filter(x=>x!==c&&x.c===c.c&&x.k===c.k&&x.f!==c.f&&strip(x.b)!==strip(c.b));
 const near=same.filter(x=>x.x===c.x);
 let dis=shuffle(near.slice()).slice(0,3);
 if(dis.length<3)dis=dis.concat(shuffle(same.filter(x=>!dis.includes(x))).slice(0,3-dis.length));
 if(dis.length<3)return null;
 const re=new RegExp(c.f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
 const b=c.b.replace(re,'<span class="hl">___</span>');
 const opts=shuffle([c,...dis].map(x=>({t:esc(x.f),ok:x===c})));
 return {sec:DATA.ch[c.c],ctx:c.x,html:`<div class="qtext">Co pasuje do opisu? <span style="color:var(--mute);font-weight:400">(${esc(c.k)})</span></div><div class="back">${b}</div>`,opts,expl:`<b>Poprawnie: ${esc(c.f)}</b><div class="back">${c.b}</div>`};
}
function mcqQ(m){
 const opts=shuffle(m.o.map((t,i)=>({t:esc(t),ok:i===m.a})));
 return {sec:m.sec,ctx:m.s,html:`<div class="qtext">${esc(m.q)}</div>`,opts,expl:`<b>Poprawnie: ${esc(m.o[m.a])}</b><div>${esc(m.e)}</div>`};
}
function scQ(s){
 const opts=shuffle(s.o.map((t,i)=>({t:esc(t),ok:i===s.a})));
 return {sec:'Przypadki kliniczne',ctx:s.t+' · '+s.g,html:(s.ctx?`<div class="scene">${esc(s.ctx)}</div>`:'')+`<div class="qtext">${esc(s.q)}</div>`,opts,expl:`<b>Poprawnie: ${esc(s.o[s.a])}</b><div>${esc(s.e)}</div>`};
}
let st=null,tick=null;
function build(m){
 let qs=[];
 if(['mr','ped','klp','pat'].includes(m.id)){return shuffle(DATA.mcq.filter(x=>x.g===m.id)).slice(0,m.n).map(mcqQ)}
 const nSc=m.id==='cases'?m.n:m.id==='full'?12:4;
 for(const s of shuffle(DATA.sc.slice()).slice(0,nSc))qs.push(scQ(s));
 const nM=m.id==='full'?15:m.id==='short'?5:0;
 for(const x of shuffle(DATA.mcq.slice()).slice(0,nM))qs.push(mcqQ(x));
 if(m.id!=='cases'){
  // równy podział między działy
  const secs=Object.keys(DATA.ch);const per=Math.ceil((m.n-qs.length)/secs.length);
  const pools=secs.map(k=>shuffle(DATA.cards.filter(c=>String(c.c)===k)));
  for(let r=0;qs.length<m.n&&r<400;r++){const p=pools.at(r%pools.length);const c=p.pop();if(!c)continue;const q=cardQ(c);if(q)qs.push(q)}
 }
 return shuffle(qs).slice(0,m.n);
}

 const g=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
 g('pv',()=>{st.i--;q()});g('nx',()=>{st.i++;q()});
 const ask=()=>{const left=st.qs.length-Object.keys(st.ans).length;if(left&&!document.getElementById('cf')){const p=document.createElement('p');p.id='cf';p.className='note';p.innerHTML=`Bez odpowiedzi: <b>${left}</b> pyt. <button class="btn red" id="cfy">Tak, zakończ</button>`;app.appendChild(p);document.getElementById('cfy').onclick=finish;p.scrollIntoView({behavior:'smooth'})}else if(!left)finish()};
 g('fin',ask);g('fin2',ask);
}
function finish(){
 clearInterval(tick);
 const res=st.qs.map((Q,k)=>({Q,a:st.ans[k],ok:st.ans[k]!==undefined&&Q.opts.at(st.ans[k]).ok}));
 const good=res.filter(r=>r.ok).length,pc=Math.round(100*good/res.length),pass=pc>=PASS;
 const by={};res.forEach(r=>{by[r.Q.sec]=by[r.Q.sec]||{n:0,g:0};by[r.Q.sec].n++;if(r.ok)by[r.Q.sec].g++});
 try{const h=JSON.parse(localStorage.getItem('rm_exam_hist')||'[]');h.push({d:new Date().toLocaleDateString('pl-PL'),m:st.m.name,pc});localStorage.setItem('rm_exam_hist',JSON.stringify(h.slice(-30)))}catch(e){}
 const col=p=>p>=80?'var(--ok)':p>=PASS?'var(--warn)':'var(--bad)';
 const wrong=res.map((r,k)=>({...r,k})).filter(r=>!r.ok);
 app.innerHTML=`<h1>Wynik: ${esc(st.m.name)}</h1>
 <div class="card"><div class="big ${pass?'pass':'fail'}">${pc}%</div><p style="font-size:18px;margin:8px 0 0"><b>${good} / ${res.length}</b> poprawnych · ${pass?'✅ zaliczony (próg '+PASS+'%)':'❌ niezaliczony (próg '+PASS+'%)'}</p></div>
 <div class="card"><b>Wynik według działów</b>
 <div class="legend" style="margin:6px 0 4px"><span><i style="background:var(--bad)"></i>poniżej ${PASS}%</span><span><i style="background:var(--warn)"></i>${PASS}–79%</span><span><i style="background:var(--ok)"></i>80% i więcej</span></div>
 ${Object.entries(by).sort((a,b)=>a[1].g/a[1].n-b[1].g/b[1].n).map(([s,v])=>{const p=Math.round(100*v.g/v.n);return `<div class="row"><span class="lbl">${esc(s)} (${v.g}/${v.n})</span><span class="meter"><i style="width:${p}%;background:${col(p)}"></i></span><span class="pc">${p}%</span></div>`}).join('')}
 <p style="color:var(--mute);font-size:14px;margin:8px 0 0">Działy od najsłabszego. Od nich zacznij powtórkę w aplikacji <a href="index.html#narzedzia">Wszystkie działy</a>.</p></div>
 <div class="nav2" style="margin-bottom:16px"><button class="btn red" id="again">↻ Nowy test</button><button class="btn ghost" id="hm">Wybierz inny tryb</button></div>
 <h2>Omówienie błędów (${wrong.length})</h2>
 ${wrong.length?wrong.map(r=>`<div class="card"><div class="ctx">Pytanie ${r.k+1} · ${esc(r.Q.sec)} · ${esc(r.Q.ctx)}</div>${r.Q.html}${r.Q.opts.map((o,j)=>`<div class="opt ${o.ok?'ok':j===r.a?'no':''}" style="cursor:default">${String.fromCharCode(65+j)}. ${o.t}${o.ok?' ✓':j===r.a?' ✗ Twoja odpowiedź':''}</div>`).join('')}${r.a===undefined?'<p class="fail"><b>Brak odpowiedzi</b></p>':''}<div class="expl">${r.Q.expl}</div></div>`).join(''):'<div class="card">Bez błędów. Gratulacje! 💪</div>'}`;
 document.getElementById('again').onclick=()=>start(st.m);document.getElementById('hm').onclick=home;
 window.scrollTo(0,0);
}
home();
}
</script>
<script>window.addEventListener("load",()=>{if(location.hash==="#szybki"){const b=document.querySelector('[data-m="short"]');if(b)b.click()}})</script>
</body>
</html>
